behavior_profiles:
  short_interactive:
    duration_seconds: [20, 180]
    attempts: [1, 2]
    transfer_bytes: [0, 65536]
    auth_outcomes: [success, success, success, transient_failure]
  medium_interactive:
    duration_seconds: [180, 1200]
    attempts: [1, 3]
    transfer_bytes: [0, 524288]
    auth_outcomes: [success, success, success, transient_failure]
  long_interactive:
    duration_seconds: [1200, 7200]
    attempts: [1, 2]
    transfer_bytes: [0, 2097152]
    auth_outcomes: [success, success, success]
  small_transfer:
    duration_seconds: [30, 900]
    attempts: [1, 2]
    transfer_bytes: [16384, 524288]
    auth_outcomes: [success, success, transient_failure]
  bulk_transfer:
    duration_seconds: [300, 7200]
    attempts: [1, 2]
    transfer_bytes: [524288, 8388608]
    auth_outcomes: [success, success, success]
  maintenance_fanout:
    duration_seconds: [30, 1800]
    attempts: [2, 6]
    transfer_bytes: [0, 1048576]
    auth_outcomes: [success, success, transient_failure]
  reconnect:
    duration_seconds: [20, 600]
    attempts: [2, 5]
    transfer_bytes: [0, 262144]
    auth_outcomes: [success, transient_failure, success]
  forwarding_session:
    duration_seconds: [45, 1800]
    attempts: [1, 3]
    transfer_bytes: [0, 262144]
    auth_outcomes: [success, success, transient_failure]

# These profiles are deliberately label-agnostic. Both benign and suspicious
# campaign classes draw from the same observable profile pool. Intent and
# relationship history are ground truth context, never direct wire controls.
protocol_profile_pool:
  ssh: [short_interactive, medium_interactive, long_interactive, small_transfer, bulk_transfer, maintenance_fanout, reconnect, forwarding_session]
  smb: [short_interactive, medium_interactive, small_transfer, bulk_transfer, maintenance_fanout, reconnect]
  rdp: [short_interactive, medium_interactive, long_interactive, maintenance_fanout, reconnect]
  vnc: [short_interactive, medium_interactive, long_interactive, reconnect]
  winrm: [short_interactive, medium_interactive, maintenance_fanout, reconnect]
