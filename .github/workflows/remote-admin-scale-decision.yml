name: Remote Admin Anomaly V1 Scale Decision

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.scale-decision-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      allow_scale: ${{ steps.decide.outputs.allow_scale }}
      next_sessions: ${{ steps.decide.outputs.next_sessions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
          fetch-depth: 0
      - name: Require verified research evidence
        run: |
          test -s remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json
          test -s remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.md
      - name: Decide from automatic gate, manual flags and grouped learning curve
        id: decide
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json')
          d=json.loads(p.read_text())
          decision=d['research_decision']
          curve=d['learning_curve']
          auto=bool(decision.get('automatic_gate_pass')) and not decision.get('automatic_failures')
          flags=list(decision.get('manual_review_flags') or [])
          delta=curve.get('last_delta_pr_auc')
          recommendation=str(curve.get('scale_recommendation',''))
          allow=bool(auto and not flags and delta is not None and float(delta)>0.005 and recommendation=='expand')
          if not auto:
              reason='blocked_automatic_quality_gate'
          elif flags:
              reason='blocked_manual_review_flags'
          elif delta is None:
              reason='blocked_learning_curve_missing_delta'
          elif float(delta)<=0.005:
              reason='blocked_learning_curve_saturated'
          elif recommendation!='expand':
              reason='blocked_learning_curve_recommendation'
          else:
              reason='allow_next_scale_stage'
          next_sessions=4000 if allow else 0
          report={
              'allow_scale':allow,
              'next_sessions':next_sessions,
              'reason':reason,
              'automatic_gate_pass':auto,
              'automatic_failures':decision.get('automatic_failures',[]),
              'manual_review_flags':flags,
              'last_delta_pr_auc':delta,
              'scale_recommendation':recommendation,
              'policy':'never jump directly to 20k/40k/201k; after a 1k gate the next permitted stage is 4x1k diverse shards, then recompute global holdouts and learning curve',
          }
          Path('remote-admin-anomaly-lab/SCALE_DECISION.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          lines=[
              '# Remote Admin Anomaly V1 — Scale Decision','',
              f'- Allow scale: **{allow}**',
              f'- Reason: `{reason}`',
              f'- Automatic research gate: **{auto}**',
              f'- Manual review flags: `{flags}`',
              f'- Last grouped learning-curve ΔPR-AUC: `{delta}`',
              f'- Learning-curve recommendation: `{recommendation}`',
              f'- Next permitted sessions: **{next_sessions}**','',
              'Policy: no direct 20k/40k/201k launch. If allowed, the next stage is four independent 1k real-wire shards with different seeds/stage profiles; only their combined global split/evaluation can authorize further scale.',''
          ]
          Path('remote-admin-anomaly-lab/SCALE_DECISION.md').write_text('\n'.join(lines))
          with open('/tmp/decision.env','w') as f:
              f.write(f"allow_scale={'true' if allow else 'false'}\n")
              f.write(f"next_sessions={next_sessions}\n")
          print(json.dumps(report,sort_keys=True))
          PY
          cat /tmp/decision.env >> "$GITHUB_OUTPUT"
      - name: Commit scale decision evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/SCALE_DECISION.md remote-admin-anomaly-lab/SCALE_DECISION.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(remote-admin): record evidence-driven scale decision'
            git push origin HEAD:remote-admin-anomaly-lab-v1
          fi
