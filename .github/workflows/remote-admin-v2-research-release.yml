name: Remote Admin Anomaly V2 Research Release

on:
  workflow_dispatch:
  push:
    branches: [remote-admin-anomaly-lab-v2]
    paths:
      - '.github/workflows/remote-admin-v2-research-release.yml'
      - 'remote-admin-anomaly-lab/scripts/finalize_v2_research.py'
      - 'remote-admin-anomaly-lab/scripts/build_v2_release_manifest.py'
      - 'remote-admin-anomaly-lab/scripts/train_v2_models.py'
      - 'remote-admin-anomaly-lab/scripts/evaluate_v2_external.py'
      - 'remote-admin-anomaly-lab/src/adminlab/v2_gate.py'
      - 'remote-admin-anomaly-lab/configs/v2_research.yaml'

permissions:
  contents: read
  actions: read

concurrency:
  group: remote-admin-v2-research-release-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARD: V2-1k
  SEED: '2026081402'

jobs:
  windows-native:
    name: Windows native external holdout
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture bounded native Windows remote-administration probes
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'remote-admin-v2-windows'
          & .\remote-admin-anomaly-lab\windows\capture_native.ps1 -OutputDir $out
      - name: Normalize pktmon wire evidence
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'remote-admin-v2-windows'
          python .\remote-admin-anomaly-lab\windows\mark_wire.py (Join-Path $out 'windows_fidelity.json') (Join-Path $out 'capture.txt')
      - name: Validate fail-closed native fidelity claims
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'remote-admin-v2-windows'
          python .\remote-admin-anomaly-lab\windows\validate_native.py (Join-Path $out 'windows_fidelity.json') --out (Join-Path $out 'windows_fidelity_validation.json')
          $report = Get-Content (Join-Path $out 'windows_fidelity.json') -Raw | ConvertFrom-Json
          if ($report.validated_protocols.Count -lt 1) { throw 'No native Windows protocol passed wire+session validation' }
          if (-not (Test-Path (Join-Path $out 'capture.pcapng'))) { throw 'Windows PCAPNG missing' }
          Write-Host ($report | ConvertTo-Json -Depth 8)
      - name: Retain same-run Windows holdout
        uses: actions/upload-artifact@v4
        with:
          name: v2-release-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/remote-admin-v2-windows
          retention-days: 90
          compression-level: 0

  lanl-reference:
    name: LANL independent external reference
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install reference runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Build bounded LANL reference through documented mirror
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          mkdir -p /tmp/remote-admin-v2-lanl/lanl-2017
          python scripts/build_lanl_reference.py \
            --config configs/v2_research.yaml \
            --out /tmp/remote-admin-v2-lanl/lanl-2017 \
            --netflow-rows 5000 \
            --wls-rows 5000 \
            --max-download-mb 384
      - name: Verify external-only provenance
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/remote-admin-v2-lanl/lanl-2017')
          q=json.loads((root/'reference_quality.json').read_text())
          m=json.loads((root/'source_manifest.json').read_text())
          assert q['status']=='PASS',q
          assert q['external_only'] is True and q['threshold_tuning_allowed'] is False,q
          assert m['origin']=='Los Alamos National Laboratory',m
          assert m['transport']=='rocketgraph_xgt_mirror',m
          assert m['used_for_training'] is False,m
          net=pd.read_parquet(root/'remote_admin_flows.parquet')
          wls=pd.read_parquet(root/'network_logons.parquet')
          assert len(net)==5000,(len(net),q)
          assert len(wls)==5000,(len(wls),q)
          assert 'label_binary' not in net.columns and 'label_binary' not in wls.columns
          print(json.dumps({'quality':q,'source':m},sort_keys=True))
          PY
      - name: Retain same-run LANL reference
        uses: actions/upload-artifact@v4
        with:
          name: v2-release-lanl-${{ github.run_id }}
          path: /tmp/remote-admin-v2-lanl/lanl-2017
          retention-days: 90
          compression-level: 0

  linux-v2-release:
    name: Linux V2 1k corpus, Gold, models and research decision
    needs: [windows-native, lanl-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      ROOT_OUT: /tmp/remote-admin-v2-release
      RELEASE_ROOT: /tmp/remote-admin-v2-release/release
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install complete V2 runtime
        working-directory: remote-admin-anomaly-lab
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          tshark --version | head -n 1
          pytest -q tests
      - name: Audit exact 1k semantic plan before wire generation
        working-directory: remote-admin-anomaly-lab
        run: |
          mkdir -p "$RELEASE_ROOT/quality/$SHARD"
          python scripts/v2_planner_audit.py \
            --count 1000 \
            --seed "$SEED" \
            --counterfactual-fraction 0.30 \
            --out "$RELEASE_ROOT/quality/$SHARD/V2_PLANNER_AUDIT.json"
      - name: Capture exactly 1000 V2 semantic sessions on real Linux wire
        working-directory: remote-admin-anomaly-lab
        env:
          ADMINLAB_V2_SEMANTIC: '1'
          ADMINLAB_V2_COUNTERFACTUAL_FRACTION: '0.30'
        run: |
          py="$(command -v python)"
          sudo -E env \
            ADMINLAB_PYTHON="$py" \
            ADMINLAB_OUTPUT_UID="$(id -u)" \
            ADMINLAB_OUTPUT_GID="$(id -g)" \
            ADMINLAB_V2_SEMANTIC=1 \
            ADMINLAB_V2_COUNTERFACTUAL_FRACTION=0.30 \
            bash scripts/capture_shard_extended_v4.sh \
              H "$SHARD" 1000 "$SEED" "$ROOT_OUT"
      - name: Verify captured V2 corpus semantics and Bronze
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from adminlab.manifest import SessionRecord
          from adminlab.quality import validate_bronze_tree
          from adminlab.v2_scenarios import summarize_v2_plan
          root=Path('/tmp/remote-admin-v2-release/release')
          shard='V2-1k'
          bronze=root/'bronze'/shard
          report=validate_bronze_tree(bronze,verify_checksums=True)
          assert report['ok'],report
          rows=[SessionRecord.from_dict(json.loads(line)) for line in (bronze/'manifests/sessions.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows)==1000,len(rows)
          assert all(row.status=='success' for row in rows)
          assert Counter(row.protocol for row in rows)==Counter({'ssh':250,'smb':250,'rdp':250,'vnc':250})
          labels=Counter(int(row.label_binary) for row in rows)
          assert labels==Counter({0:500,1:500}),labels
          semantic=summarize_v2_plan(rows)
          assert semantic['counterfactual_pair_fraction']>=0.30,semantic
          assert not semantic['invalid_counterfactual_pairs'],semantic
          assert min(semantic['timeline_days_by_protocol'].values())>=30,semantic
          evidence={'bronze':report,'semantic':semantic,'protocol_counts':dict(Counter(row.protocol for row in rows)),'label_counts':dict(labels)}
          (root/'quality'/shard/'V2_CAPTURE_CONTRACT.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY
      - name: Build Suricata and Zeek Silver plus flow Gold
        working-directory: remote-admin-anomaly-lab
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh "$RELEASE_ROOT" "$SHARD"
          bash scripts/build_rule_baseline.sh "$RELEASE_ROOT" "$SHARD"
          python scripts/build_gold.py \
            --release "$RELEASE_ROOT" --shard "$SHARD" \
            --feature-contract configs/feature_contract.yaml --split-seed 20260814
          python scripts/build_flow_gold_v2.py \
            --release "$RELEASE_ROOT" --shard "$SHARD" \
            --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Build causal session and campaign Gold
        working-directory: remote-admin-anomaly-lab
        run: |
          python scripts/build_hierarchical_gold.py \
            --release "$RELEASE_ROOT" --shard "$SHARD" \
            --contract configs/v2_feature_contract.yaml
      - name: Train flow, session and campaign views with shortcut audit
        working-directory: remote-admin-anomaly-lab
        run: |
          GOLD="$RELEASE_ROOT/gold/$SHARD"
          python scripts/train_v2_models.py \
            --flow "$GOLD/production_model_matrix.parquet" \
            --session "$GOLD/session_model_matrix.parquet" \
            --campaign "$GOLD/campaign_model_matrix.parquet" \
            --config configs/v2_research.yaml \
            --out "$GOLD/models" \
            --seed "$SEED"
      - name: Evaluate hard benign and grouped learning curve
        working-directory: remote-admin-anomaly-lab
        run: |
          GOLD="$RELEASE_ROOT/gold/$SHARD"
          QUALITY="$RELEASE_ROOT/quality/$SHARD"
          python scripts/evaluate_hard_benign.py \
            --model "$GOLD/models/session-primary.joblib" \
            --metrics "$GOLD/models/session-primary.metrics.json" \
            --model-matrix "$GOLD/session_model_matrix.parquet" \
            --labels "$GOLD/session_labels.parquet" \
            --out "$QUALITY/hard_benign_session.json"
          python scripts/learning_curve_grouped.py \
            --model-matrix "$GOLD/session_model_matrix.parquet" \
            --labels "$GOLD/session_labels.parquet" \
            --out "$QUALITY/session_learning_curve.json" \
            --seed "$SEED"
      - name: Download same-run Windows native holdout
        uses: actions/download-artifact@v4
        with:
          name: v2-release-windows-${{ github.run_id }}
          path: /tmp/v2-external/windows
      - name: Download same-run LANL reference
        uses: actions/download-artifact@v4
        with:
          name: v2-release-lanl-${{ github.run_id }}
          path: /tmp/v2-external/lanl
      - name: Score independent external holdouts without fitting or threshold tuning
        working-directory: remote-admin-anomaly-lab
        run: |
          find /tmp/v2-external -maxdepth 3 -type f -printf '%p %s bytes\n' | sort
          GOLD="$RELEASE_ROOT/gold/$SHARD"
          QUALITY="$RELEASE_ROOT/quality/$SHARD"
          python scripts/evaluate_v2_external.py \
            --model "$GOLD/models/session-primary.joblib" \
            --metrics "$GOLD/models/session-primary.metrics.json" \
            --lanl-root /tmp/v2-external/lanl \
            --windows-root /tmp/v2-external/windows \
            --out "$QUALITY/v2_external_evaluation.json"
          mkdir -p "$QUALITY/external/windows" "$QUALITY/external/lanl"
          cp -a /tmp/v2-external/windows/. "$QUALITY/external/windows/"
          cp -a /tmp/v2-external/lanl/. "$QUALITY/external/lanl/"
      - name: Finalize fail-closed V2 research decision
        working-directory: remote-admin-anomaly-lab
        run: |
          GOLD="$RELEASE_ROOT/gold/$SHARD"
          QUALITY="$RELEASE_ROOT/quality/$SHARD"
          python scripts/finalize_v2_research.py \
            --config configs/v2_research.yaml \
            --session-metrics "$GOLD/models/session-primary.metrics.json" \
            --shortcut "$GOLD/models/shortcut-audit.json" \
            --hard-benign "$QUALITY/hard_benign_session.json" \
            --external "$QUALITY/v2_external_evaluation.json" \
            --learning-curve "$QUALITY/session_learning_curve.json" \
            --planner-audit "$QUALITY/V2_PLANNER_AUDIT.json" \
            --production-quality "$QUALITY/production_flow_gold.json" \
            --hierarchical-quality "$GOLD/hierarchical_gold_quality.json" \
            --out "$QUALITY/V2_RESEARCH_DECISION.json"
      - name: Persist complete candidate or negative research release to Hugging Face
        working-directory: remote-admin-anomaly-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          QUALITY="$RELEASE_ROOT/quality/$SHARD"
          status="$(python -c "import json; print(json.load(open('$QUALITY/V2_RESEARCH_DECISION.json'))['research_status'])")"
          if [[ "$status" == "PASS" ]]; then
            remote="v2/candidates/run-${GITHUB_RUN_ID}"
          else
            remote="v2/quarantine/run-${GITHUB_RUN_ID}"
          fi
          python scripts/upload_hf.py \
            --release "$RELEASE_ROOT" \
            --shard "$SHARD" \
            --repo Maksim123321/remote-admin-anomaly-v1 \
            --remote-path "$remote" \
            --status "$QUALITY/hf_upload_status.json"
      - name: Build full checksum/provenance manifest
        working-directory: remote-admin-anomaly-lab
        run: |
          QUALITY="$RELEASE_ROOT/quality/$SHARD"
          python scripts/build_v2_release_manifest.py \
            --release "$RELEASE_ROOT" \
            --shard "$SHARD" \
            --decision "$QUALITY/V2_RESEARCH_DECISION.json" \
            --out "$QUALITY/V2_RELEASE_MANIFEST.json"
      - name: Verify final technical V2 release
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/remote-admin-v2-release/release')
          shard='V2-1k'
          gold=root/'gold'/shard
          quality=root/'quality'/shard
          decision=json.loads((quality/'V2_RESEARCH_DECISION.json').read_text())
          manifest=json.loads((quality/'V2_RELEASE_MANIFEST.json').read_text())
          assert decision['dataset_release_status']=='READY',decision
          assert decision['research_status'] in {'PASS','FAIL'},decision
          assert decision['scale_decision'] in {'ALLOW_4K','STOP_AT_1K'},decision
          assert manifest['dataset_release_status']=='READY',manifest
          assert manifest['file_count']>20,manifest
          assert manifest['total_bytes']>0,manifest
          assert len(list((root/'bronze'/shard/'captures').glob('*.pcap.zst')))==1
          assert (gold/'models/session-primary.joblib').stat().st_size>0
          assert (quality/'external/windows/capture.pcapng').stat().st_size>0
          assert (quality/'external/lanl/remote_admin_flows.parquet').stat().st_size>0
          session=pd.read_parquet(gold/'session_labels.parquet')
          assert len(session)>=950,len(session)
          assert set(session['environment_id'])=={'linux_v2'}
          print(json.dumps({
            'dataset_release_status':decision['dataset_release_status'],
            'research_status':decision['research_status'],
            'scale_decision':decision['scale_decision'],
            'automatic_failures':decision['research_decision']['automatic_failures'],
            'metrics':decision['research_decision']['metrics'],
            'file_count':manifest['file_count'],
            'total_bytes':manifest['total_bytes'],
          },indent=2,sort_keys=True))
          PY
      - name: Retain complete V2 research release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v2-research-release-${{ github.run_id }}
          path: /tmp/remote-admin-v2-release/release
          retention-days: 90
          compression-level: 0
