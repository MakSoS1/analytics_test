name: proxyport-cleanup

on:
  push:
    paths:
      - ".github/workflows/proxyport_cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Remove temporary proxyport CTF artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f --ignore-unmatch \
            .github/workflows/proxyport_encrypted_probe.yml \
            .github/workflows/proxyport_solver_a.yml \
            .github/workflows/proxyport_solver_full.yml \
            .github/workflows/proxyport_solver_timing.yml \
            .github/workflows/proxyport_halfclose_probe.yml \
            .github/workflows/proxyport_final_solver.yml \
            .github/workflows/proxyport_flag_only.yml \
            .github/workflows/proxyport_cleanup.yml

          git rm -rf --ignore-unmatch \
            proxyport_encrypted \
            proxyport_solution_a \
            proxyport_solution_full \
            proxyport_timing_result \
            proxyport_halfclose_result \
            proxyport_final_result \
            proxyport_flag_result

          git commit -m "Remove temporary proxyport CTF artifacts" || exit 0
          git push
