name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Textainer report viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,html
          from bs4 import BeautifulSoup
          base='https://tex.textainer.com'
          u=base+'/Equipment/StatusAndSpecificationsInquiry.aspx?DelFileTypes=CS-EX'
          s=requests.Session(); h={'User-Agent':'Mozilla/5.0'}
          r=s.get(u,headers=h,timeout=20); soup=BeautifulSoup(r.text,'html.parser')
          data={t.get('name'):t.get('value','') for t in soup.find_all('input') if t.get('name') and t.get('type')=='hidden'}
          data['ctl00$bodyContent$ucEqpIds$txtEqpId']='SEGU9639460'
          data['ctl00$bodyContent$btnSubmit']='Preview'
          pr=s.post(u,data=data,headers={**h,'Referer':u},timeout=30,allow_redirects=True)
          print('FINAL',pr.url,'LEN',len(pr.text),'COOKIES',[(c.name,c.value[:80]) for c in s.cookies])
          out=BeautifulSoup(pr.text,'html.parser')
          print('FORMS')
          for f in out.find_all('form'): print(str(f)[:5000])
          print('URL_ATTRS_BEGIN')
          for tag in out.find_all(True):
              for attr in ['src','href','action','url']:
                  v=tag.get(attr)
                  if v and any(x in v.lower() for x in ['report','viewer','axd','session','control']): print(tag.name,attr,html.unescape(v)[:3000])
          print('URL_ATTRS_END')
          print('SCRIPT_SNIPS_BEGIN')
          for m in re.finditer(r'.{0,250}(?:ReportViewer|Reserved\.ReportViewer|Session|ControlID|Viewer)[^\n]{0,1200}',pr.text,re.I):
              print(html.unescape(m.group(0))[:1600])
          print('SCRIPT_SNIPS_END')
          print('HIDDENS_BEGIN')
          for t in out.find_all('input'):
              if t.get('type')=='hidden': print(t.get('name'),t.get('value','')[:4000])
          print('HIDDENS_END')
          PY
