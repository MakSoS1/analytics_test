name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Try alternate public fetch proxies for exact public Seaco OData query
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,urllib.parse,json,re
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,application/xml,text/plain,*/*'}
          target="https://newseaweb.seacoglobal.com/sap/opu/odata/sap/ZNW_SEACO_PUBLIC_UE_PGW_SRV/Equipment_Status?$filter=IUnitNo%20eq%20'SEGU9639460'%20and%20IUnitNo1%20eq%20''&$format=json"
          enc=urllib.parse.quote(target,safe='')
          urls=[
              'https://api.allorigins.win/raw?url='+enc,
              'https://api.codetabs.com/v1/proxy?quest='+enc,
              'https://corsproxy.io/?url='+enc,
              'https://thingproxy.freeboard.io/fetch/'+target,
              'https://newseaweb-seacoglobal-com.translate.goog/sap/opu/odata/sap/ZNW_SEACO_PUBLIC_UE_PGW_SRV/Equipment_Status?%24filter='+urllib.parse.quote("IUnitNo eq 'SEGU9639460' and IUnitNo1 eq ''",safe="'()")+'&%24format=json&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en',
          ]
          for u in urls:
              try:
                  r=requests.get(u,headers=H,timeout=70,allow_redirects=True)
                  print('\n=== PROXY ==='); print('REQ',u[:500]); print('RES',r.status_code,r.url,r.headers.get('Content-Type'),len(r.content)); print(r.text[:60000])
              except Exception as e: print('\nPROXY_ERR',u[:250],repr(e))
          PY
