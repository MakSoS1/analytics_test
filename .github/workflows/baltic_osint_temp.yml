name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch public FTS Telegram media originals
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36'
          curl -L --compressed -A "$UA" 'https://t.me/s/customs_rf/9371' -o /tmp/tg.html
          python3 - <<'PY'
          import html,re
          p=html.unescape(open('/tmp/tg.html','r',errors='ignore').read()).replace('\\/','/')
          # Restrict to media URLs close to the relevant post range 9372..9378 where the album lives.
          urls=[]
          for m in re.finditer(r'https://cdn\d+\.telesco\.pe/file/[^\"\'<> )]+', p):
              u=m.group(0)
              if u not in urls: urls.append(u)
          print('CDN_URLS_BEGIN')
          for i,u in enumerate(urls): print(i,u)
          print('CDN_URLS_END')
          open('/tmp/urls.txt','w').write('\n'.join(urls))
          PY
          mkdir -p /tmp/media
          n=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            ext=.jpg
            case "$u" in *.mp4*) ext=.mp4;; *.webp*) ext=.webp;; esac
            curl -L --fail --compressed -A "$UA" "$u" -o "/tmp/media/m_${n}${ext}" || true
            n=$((n+1))
          done </tmp/urls.txt
          file /tmp/media/* || true
          ls -lh /tmp/media || true
      - uses: actions/upload-artifact@v4
        with:
          name: fts-telegram-media
          path: /tmp/media/*
          retention-days: 1
