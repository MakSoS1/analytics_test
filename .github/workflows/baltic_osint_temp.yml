name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query ATO certified reefer rows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup

          U='https://www.reefertransport.nl/Certified.aspx'
          H={'User-Agent':'Mozilla/5.0'}
          queries=[('SEGU','963946'),('SEGU','972002'),('RJCU','201919')]

          def hidden(sp):
              return {x.get('name'):x.get('value','') for x in sp.find_all('input')
                      if x.get('name') and (x.get('type') or '').lower()=='hidden'}

          def search(prefix,number):
              s=requests.Session()
              first=s.get(U,headers=H,timeout=30)
              soup=BeautifulSoup(first.text,'html.parser')
              pfx='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$prefixComboBox'
              num='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$numberTextBox'
              d=hidden(soup)
              d[pfx]=prefix; d[num]=number
              d['__EVENTTARGET']='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$searchButton'
              d['__EVENTARGUMENT']=''
              d['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_prefixComboBox_ClientState']=json.dumps({'logEntries':[],'value':prefix,'text':prefix,'enabled':True,'checkedIndices':[],'checkedItemsTextOverflows':False},separators=(',',':'))
              d['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_numberTextBox_ClientState']=json.dumps({'enabled':True,'emptyMessage':'number','validationText':number,'valueAsString':number,'lastSetTextBoxValue':number},separators=(',',':'))
              r=s.post(U,data=d,headers={**H,'Referer':U},timeout=30)
              ss=BeautifulSoup(r.text,'html.parser')
              rows=[]
              for tr in ss.find_all('tr'):
                  cells=[' '.join(td.stripped_strings) for td in tr.find_all(['td','th'])]
                  joined=' | '.join(cells)
                  if cells and (prefix.lower() in joined.lower() or number in joined):
                      rows.append(cells)
              return {'query':prefix+number,'status':r.status_code,'rows':rows[:10]}

          out=[]
          for p,n in queries:
              try: out.append(search(p,n))
              except Exception as e: out.append({'query':p+n,'error':type(e).__name__+': '+str(e)[:160]})
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
