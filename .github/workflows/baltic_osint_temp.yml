name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download ERR original and extract full-rate door sequence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          URL='https://vod.err.ee/file/uudised/649008ff0277d6873f8e91b37a661cc6.mp4'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$URL" -o /tmp/baltic.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,bit_rate -show_entries format=duration,size,bit_rate -of json /tmp/baltic.mp4
          mkdir -p /tmp/frames /tmp/crops
          # Full 25 fps around the clearest approach to the target reefer door.
          ffmpeg -hide_banner -loglevel error -ss 90 -to 101 -i /tmp/baltic.mp4 -vsync 0 -q:v 1 /tmp/frames/f_%04d.jpg
          # Broad crop of the right-hand reefer door, retaining all approval labels/plate zones.
          for f in /tmp/frames/*.jpg; do
            b=$(basename "$f")
            ffmpeg -hide_banner -loglevel error -i "$f" -vf 'crop=760:650:520:40,scale=1520:1300:flags=lanczos' -frames:v 1 "/tmp/crops/$b"
          done
          tar -C /tmp -czf /tmp/door_frames_25fps.tar.gz frames crops
          echo "FRAME_COUNT $(find /tmp/frames -type f | wc -l)"
          ls -lh /tmp/baltic.mp4 /tmp/door_frames_25fps.tar.gz
      - name: Upload door sequence
        uses: actions/upload-artifact@v4
        with:
          name: baltic-door-25fps
          path: /tmp/door_frames_25fps.tar.gz
          retention-days: 1
