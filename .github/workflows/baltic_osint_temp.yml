name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query public reefer unit specifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,json,html

          units=['TTNU8845830','RJCU2019190','SEGU9720021','SEGU9639460','SEKU9169910','SEKU9154037']
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36'}
          out=[]
          for unit in units:
              url='https://tools.tritoncontainer.com/tritoncontainer/unitSpecs/show/'+unit
              rec={'unit':unit,'url':url}
              try:
                  r=requests.get(url,headers=H,timeout=40,allow_redirects=True)
                  rec.update(status=r.status_code,final=r.url,length=len(r.content))
                  text=re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',r.text)
                  text=re.sub(r'(?i)<br\s*/?>|</(?:div|p|tr|td|th|li|h[1-6]|dt|dd)>','\n',text)
                  text=html.unescape(re.sub(r'(?s)<[^>]+>',' ',text))
                  text='\n'.join(re.sub(r'[ \t]+',' ',x).strip() for x in text.splitlines() if x.strip())
                  fields={
                    'manufacturer':r'Manufacturer\s*\n\s*([^\n]{2,120})',
                    'manufacture_date':r'Manufacture Date\s*\n\s*([^\n]{2,40})',
                    'iso':r'ISO Code\s*\n\s*([^\n]{2,40})',
                    'csc':r'CSC\s*\n\s*([^\n]{2,80})',
                    'tir':r'TIR\s*\n\s*([^\n]{2,80})',
                    'box_builder':r'Box builder:\s*\n?\s*([^\n]{2,80})',
                    'max_gross':r'Max gross weight:\s*\n?\s*([^\n]{2,60})',
                    'tare':r'Tare weight:\s*\n?\s*([^\n]{2,60})',
                    'payload':r'Max payload:\s*\n?\s*([^\n]{2,60})',
                    'cube':r'Cubic capacity:\s*\n?\s*([^\n]{2,60})',
                  }
                  for key,p in fields.items():
                      m=re.search(p,text,re.I)
                      if m: rec[key]=m.group(1).strip()
              except Exception as e:
                  rec['error']=type(e).__name__+': '+str(e)[:160]
              out.append(rec)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
