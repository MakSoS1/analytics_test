name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate original Baltic Spirit YouTube footage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q -U yt-dlp
          python3 - <<'PY'
          import subprocess,json,re
          urls=[
            'https://www.youtube.com/@TomasstbergJacobsen/videos',
            'https://www.youtube.com/@TomasstbergJacobsen/shorts',
          ]
          for u in urls:
              print('CHANNEL',u)
              p=subprocess.run(['yt-dlp','--flat-playlist','--playlist-end','80','-J',u],capture_output=True,text=True,timeout=180)
              print('RC',p.returncode)
              if p.returncode:
                  print('ERR',p.stderr[-1200:]); continue
              try: d=json.loads(p.stdout)
              except Exception as e: print('JSONERR',type(e).__name__); continue
              for x in d.get('entries') or []:
                  title=x.get('title') or ''
                  desc=x.get('description') or ''
                  date=x.get('upload_date') or x.get('release_date') or ''
                  if any(k in (title+' '+desc).lower() for k in ['baltic','estonia','eston','ship','container','kommando','police','spirit','muuga']) or str(date).startswith('202602'):
                      print(json.dumps({k:x.get(k) for k in ['id','title','url','upload_date','timestamp','duration','view_count']},ensure_ascii=False))
          # Also ask yt-dlp search for the distinctive ship name and channel name.
          for q in ['ytsearch20:Baltic Spirit Estonia','ytsearch20:Baltic Spirit TomasstbergJacobsen','ytsearch20:Estonia K-Commando Baltic Spirit']:
              print('SEARCH',q)
              p=subprocess.run(['yt-dlp','--flat-playlist','--playlist-end','20','-J',q],capture_output=True,text=True,timeout=180)
              if p.returncode: print('ERR',p.stderr[-800:]); continue
              try: d=json.loads(p.stdout)
              except: continue
              for x in d.get('entries') or []:
                  print(json.dumps({k:x.get(k) for k in ['id','title','url','channel','channel_id','upload_date','duration']},ensure_ascii=False))
          PY
