name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public Textainer Unit Inquiry for SEGU9639460
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,html
          from bs4 import BeautifulSoup
          u='https://tex.textainer.com/Equipment/StatusAndSpecificationsInquiry.aspx?DelFileTypes=CS-EX'
          s=requests.Session(); h={'User-Agent':'Mozilla/5.0'}
          r=s.get(u,timeout=20,headers=h); soup=BeautifulSoup(r.text,'html.parser')
          print('FIELDS_BEGIN')
          for tag in soup.find_all(['input','textarea','select']):
              print(tag.name, tag.get('name'), tag.get('id'), tag.get('type'), tag.get('value'))
          print('FIELDS_END')
          data={}
          for tag in soup.find_all('input'):
              n=tag.get('name')
              if n and tag.get('type')=='hidden': data[n]=tag.get('value','')
          tas=soup.find_all('textarea')
          if not tas: raise SystemExit('no textarea')
          eqname=tas[0].get('name'); print('EQNAME',eqname)
          data[eqname]='SEGU9639460'
          data['ctl00$bodyContent$btnSubmit']='Preview'
          pr=s.post(u,data=data,headers={**h,'Referer':u},timeout=30,allow_redirects=True)
          print('POST',pr.status_code,'URL',pr.url,'LEN',len(pr.text))
          out=BeautifulSoup(pr.text,'html.parser')
          text='\n'.join(x.strip() for x in out.stripped_strings)
          # Print only lines/segments around the queried unit and equipment spec labels.
          keys=['SEGU963946','Equipment','Manufactur','Tare','Gross','Payload','Type','Status','Year','Date','Reefer','45R1','CSC','Approval','TIR','Singamas']
          lines=text.splitlines()
          print('RESULT_BEGIN')
          for i,line in enumerate(lines):
              if any(k.lower() in line.lower() for k in keys):
                  a=max(0,i-2); b=min(len(lines),i+4)
                  print(' | '.join(lines[a:b])[:3000])
          print('RESULT_END')
          # show tables in compact form
          print('TABLES_BEGIN')
          for ti,t in enumerate(out.find_all('table')):
              rows=[]
              for tr in t.find_all('tr'):
                  vals=[' '.join(c.stripped_strings) for c in tr.find_all(['th','td'])]
                  if vals: rows.append(' || '.join(vals))
              blob='\n'.join(rows)
              if 'SEGU963946' in blob or any(k.lower() in blob.lower() for k in ['manufacturer','tare','equipment type']):
                  print('TABLE',ti); print(blob[:10000])
          print('TABLES_END')
          PY
