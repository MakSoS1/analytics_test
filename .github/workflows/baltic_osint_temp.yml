name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch exact ERR video block and resolve media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,html,urllib.parse,json
          U='https://news.err.ee/media/videoBlock/649008ff0277d6873f8e91b37a661cc6?photoId=3178979&contentId=1609932407&contentTitle=Watch%3A%20Estonia%27s%20special%20forces%20detain%20a%20suspected%20smugglers%20ship'
          P='https://news.err.ee/1609932407/watch-estonia-s-special-forces-detain-a-suspected-smugglers-ship'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36','Referer':P,'Accept':'text/html,application/json,*/*'}
          s=requests.Session(); r=s.get(U,headers=H,timeout=40,allow_redirects=True)
          print('BLOCK',r.status_code,r.url,r.headers.get('Content-Type'),len(r.content))
          raw=html.unescape(r.text).replace('\\/','/')
          print('BLOCK_RAW_BEGIN'); print(raw[:80000]); print('BLOCK_RAW_END')
          print('EXTRACT_BEGIN')
          vals=[]
          for pat in [r'https?://[^\"\'<> ]+',r'(?<=[\"\'])(/[^\"\']+)(?=[\"\'])']:
            for m in re.finditer(pat,raw,re.I):
              z=m.group(0) if not m.groups() else m.group(1)
              if any(k in z.lower() for k in ['m3u8','mp4','video','media','stream','player','api','manifest','playlist']):
                if z not in vals: vals.append(z)
          for z in vals: print('VAL',z[:3000])
          print('EXTRACT_END')
          for z in vals:
            if z.startswith('/'): z=urllib.parse.urljoin(r.url,z)
            if not z.startswith('http'): continue
            try:
              rr=s.get(z,headers=H,timeout=35,allow_redirects=True)
              print('\nFETCH',rr.status_code,rr.url,rr.headers.get('Content-Type'),len(rr.content))
              ct=(rr.headers.get('Content-Type') or '').lower()
              if 'text' in ct or 'json' in ct or 'mpegurl' in ct: print(rr.text[:30000])
              else: print(rr.content[:80].hex())
            except Exception as e: print('ERR',z[:500],repr(e))
          PY
