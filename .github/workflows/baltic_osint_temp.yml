name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Fontanka image resize variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          mkdir -p /tmp/probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36'
          BASE='https://n1s1.hsmedia.ru/f0/9b/5f/f09b5f164ff1c9662b6d675a01eeb142/'
          TAIL='dd1cf474d3e32dc9e31c8bad795d810c%40957x1280_0xN6eWt5zy_4107125146580789640.jpg.webp'
          for pref in '600x600_21_' '957x1280_21_' '957x1280_0_' '1200x1600_21_' '1200x1600_0_' '1920x2560_21_' '1920x2560_0_' ''; do
            safe=$(printf '%s' "$pref" | tr '/ ' '__')
            [ -n "$safe" ] || safe=none
            u="${BASE}${pref}${TAIL}"
            echo "TRY $pref"
            if curl -L --fail --compressed -A "$UA" -H 'Referer: https://www.fontanka.ru/' "$u" -o "/tmp/probe/${safe}.webp"; then
              identify "/tmp/probe/${safe}.webp" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fontanka-dimension-probe
          path: /tmp/probe/*
          retention-days: 1
