name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve public ERR media metadata
        shell: bash
        run: |
          set -euo pipefail
          URL='https://news.err.ee/1609932407/watch-estonia-s-special-forces-detain-a-suspected-smugglers-ship'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36'
          curl -L --compressed -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' "$URL" -o /tmp/page.html
          python3 - <<'PY'
          import html,re
          p=html.unescape(open('/tmp/page.html','r',errors='ignore').read())
          for term in ['iframe','<video','video-player','videoPlayer','mediaId','media-id','stream','3178979','Videos released','click the photo above','content-video','data-video']:
              print('\n===',term,'===')
              for m in list(re.finditer(re.escape(term),p,re.I))[:20]:
                  a=max(0,m.start()-900); b=min(len(p),m.end()+1600)
                  print(p[a:b].replace('\n',' ')[:2600])
          print('\n=== TAGS ===')
          for pat in [r'<iframe[^>]*>',r'<video[^>]*>',r'<source[^>]*>',r'<[^>]+(?:video|media)[^>]*>']:
              for m in re.finditer(pat,p,re.I): print(m.group(0)[:3000])
          PY
