name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export public Textainer report for SEGU9639460
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,html,urllib.parse
          from bs4 import BeautifulSoup
          base='https://tex.textainer.com'
          u=base+'/Equipment/StatusAndSpecificationsInquiry.aspx?DelFileTypes=CS-EX'
          s=requests.Session(); h={'User-Agent':'Mozilla/5.0'}
          r=s.get(u,headers=h,timeout=20); soup=BeautifulSoup(r.text,'html.parser')
          data={t.get('name'):t.get('value','') for t in soup.find_all('input') if t.get('name') and t.get('type')=='hidden'}
          data['ctl00$bodyContent$ucEqpIds$txtEqpId']='SEGU9639460'
          data['ctl00$bodyContent$btnSubmit']='Preview'
          pr=s.post(u,data=data,headers={**h,'Referer':u},timeout=30,allow_redirects=True)
          txt=html.unescape(pr.text).replace('\\/','/')
          m=re.search(r'm_exportUrlBase\s*=\s*["\']([^"\']+Format=)["\']',txt)
          if not m:
              # constructor contains export URL as positional quoted argument
              ms=re.findall(r'["\'](/Reserved\.ReportViewerWebControl\.axd\?[^"\']+OpType=Export[^"\']+Format=)["\']',txt)
              if not ms: raise SystemExit('export base not found')
              exp=ms[0]
          else: exp=m.group(1)
          exp=html.unescape(exp)
          print('EXPORT_BASE',exp)
          for fmt in ['CSV','XML','PDF','Excel']:
              url=urllib.parse.urljoin(base,exp+urllib.parse.quote(fmt))
              rr=s.get(url,headers={**h,'Referer':pr.url},timeout=40)
              print('\n===',fmt,'STATUS',rr.status_code,'TYPE',rr.headers.get('Content-Type'),'LEN',len(rr.content),'===')
              if fmt in ('CSV','XML') or 'text' in rr.headers.get('Content-Type','').lower():
                  print(rr.text[:30000])
              else:
                  print(rr.content[:24].hex())
          PY
