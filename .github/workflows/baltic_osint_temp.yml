name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit exact ATO certificate image button
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,html,urllib.parse
          from bs4 import BeautifulSoup
          U='https://www.reefertransport.nl/Certified.aspx'; H={'User-Agent':'Mozilla/5.0'}
          s=requests.Session(); soup=BeautifulSoup(s.get(U,headers=H,timeout=30).text,'html.parser')
          def hidd(sp): return {x.get('name'):x.get('value','') for x in sp.find_all('input') if x.get('name') and (x.get('type') or '').lower()=='hidden'}
          pfx='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$prefixComboBox'; num='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$numberTextBox'
          d=hidd(soup); d[pfx]='SEGU'; d[num]='963946'; d['__EVENTTARGET']='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$searchButton'; d['__EVENTARGUMENT']=''
          d['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_prefixComboBox_ClientState']='{"logEntries":[],"value":"SEGU","text":"SEGU","enabled":true,"checkedIndices":[],"checkedItemsTextOverflows":false}'
          d['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_numberTextBox_ClientState']='{"enabled":true,"emptyMessage":"number","validationText":"963946","valueAsString":"963946","lastSetTextBoxValue":"963946"}'
          sr=s.post(U,data=d,headers={**H,'Referer':U},timeout=30); ss=BeautifulSoup(sr.text,'html.parser')
          img=ss.find('input',{'type':'image','title':'Open Certificate'})
          if not img: raise SystemExit('certificate image input not found')
          name=img.get('name'); print('IMAGE_NAME',name)
          d2=hidd(ss); d2[pfx]='SEGU'; d2[num]='963946'; d2['__EVENTTARGET']=''; d2['__EVENTARGUMENT']=''
          for k in ['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_prefixComboBox_ClientState','ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_numberTextBox_ClientState']:
              n=ss.find('input',{'name':k}); d2[k]=n.get('value','') if n else ''
          d2[name+'.x']='6'; d2[name+'.y']='6'
          cr=s.post(U,data=d2,headers={**H,'Referer':U},timeout=30,allow_redirects=True)
          print('CERT_POST',cr.status_code,len(cr.content),cr.url)
          cs=BeautifulSoup(cr.text,'html.parser')
          print('TEXT_BEGIN')
          lines=[re.sub(r'\s+',' ',x).strip() for x in cs.get_text('\n',strip=True).splitlines() if x.strip()]
          for i,x in enumerate(lines):
              if any(k in x.lower() for k in ['19164','segu','963852','certificate','manufacturer','owner','commission','machinery','model','serial','classification','society','bureau','abs','ccs','rina','lloyd','test date','container type','carrier','daikin','thermo','star cool']):
                  print('CTX',' || '.join(lines[max(0,i-5):min(len(lines),i+16)]))
          print('TEXT_END')
          print('SCRIPTS_BEGIN')
          for sc in cs.find_all('script'):
              z=sc.get_text(' ',strip=True)
              if any(k in z.lower() for k in ['certificate','19164','radwindow','radopen','window.open','seturl','pdf','report']): print(z[:16000])
          print('SCRIPTS_END')
          print('URLS_BEGIN')
          # print any page-like/PDF URLs in response source
          raw=html.unescape(cr.text).replace('\\/','/')
          for m in re.finditer(r'(?:(?:https?:)?//[^\"\'<> ]+|[A-Za-z0-9_./?=&%-]+\.(?:aspx|pdf)(?:\?[^\"\'<> ]*)?)',raw,re.I):
              z=m.group(0)
              if any(k in z.lower() for k in ['cert','report','pdf','download','19164']): print(z[:1000])
          print('URLS_END')
          # Print onclick/onload elements that might open popup.
          for t in cs.find_all(True):
              attrs=' '.join(str(v) for v in t.attrs.values())
              if any(k in attrs.lower() for k in ['openradwindow','radopen','window.open','certificate','19164','.pdf']): print('TAG',str(t)[:5000])
          PY
