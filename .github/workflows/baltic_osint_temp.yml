name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Textainer Unit Inquiry form fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,html
          u='https://tex.textainer.com/Equipment/StatusAndSpecificationsInquiry.aspx'
          s=requests.Session()
          r=s.get(u,timeout=20,headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS',r.status_code,'LEN',len(r.text),'URL',r.url)
          p=r.text
          print('FORM', re.findall(r'<form[^>]+>',p,re.I)[:3])
          for tag in re.findall(r'<(?:input|textarea|button|select)[^>]*>',p,re.I):
              t=html.unescape(tag)
              if any(x in t.lower() for x in ['equipment','preview','viewstate','eventvalidation','eventtarget','submit']):
                  print(t[:1200])
          for line in p.splitlines():
              if 'Equipment' in line or 'Preview' in line:
                  print('LINE',html.unescape(line.strip())[:2000])
          PY
