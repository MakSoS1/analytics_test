name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query official ATO certified reefer database
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          U='https://www.reefertransport.nl/Certified.aspx'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36'}
          s=requests.Session()
          r=s.get(U,headers=H,timeout=30)
          print('GET',r.status_code,len(r.content),r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          print('FORM',[(f.get('id'),f.get('action'),f.get('method')) for f in soup.find_all('form')])
          print('INPUTS_BEGIN')
          for x in soup.find_all(['input','select','button']):
              print(x.name,'name=',repr(x.get('name')),'id=',repr(x.get('id')),'type=',repr(x.get('type')),'value=',repr(x.get('value')),'text=',repr(x.get_text(' ',strip=True)[:80]))
          print('INPUTS_END')
          data={x.get('name'):x.get('value','') for x in soup.find_all('input') if x.get('name') and x.get('type') in (None,'hidden')}
          # identify likely text/search input and search button from actual markup
          texts=[x for x in soup.find_all('input') if x.get('name') and (x.get('type') or '').lower() in ('text','search','')]
          buttons=[x for x in soup.find_all(['input','button']) if x.get('name') and ((x.get('type') or '').lower() in ('submit','button') or 'search' in (x.get('value') or x.get_text()).lower())]
          print('TEXT_CANDIDATES',[(x.get('name'),x.get('id')) for x in texts])
          print('BUTTON_CANDIDATES',[(x.get('name'),x.get('value'),x.get('id')) for x in buttons])
          target=None
          for x in texts:
              key=((x.get('name') or '')+' '+(x.get('id') or '')).lower()
              if 'container' in key or 'search' in key or 'number' in key: target=x; break
          if target is None and texts: target=texts[0]
          if not target: raise SystemExit('no text input found')
          data[target.get('name')]='SEGU9639460'
          if buttons:
              b=buttons[0]; data[b.get('name')]=b.get('value') or 'Search'
          # ASP.NET postback needs all relevant hidden state; preserve cookies/referer.
          pr=s.post(U,data=data,headers={**H,'Referer':U},timeout=30,allow_redirects=True)
          print('POST',pr.status_code,len(pr.content),pr.url)
          ps=BeautifulSoup(pr.text,'html.parser')
          txt=ps.get_text('\n',strip=True)
          print('RESULT_TEXT_BEGIN')
          # only print lines near target / certificate/specification vocabulary
          lines=[re.sub(r'\s+',' ',z).strip() for z in txt.splitlines() if z.strip()]
          hits=[]
          keys=['SEGU','963946','certificate','certified','manufacturer','machinery','container','commission','classification','date','serial','owner','type','model','ato','ABS','Bureau','Lloyd','RINA','CCS']
          for i,line in enumerate(lines):
              if any(k.lower() in line.lower() for k in keys):
                  for j in range(max(0,i-3),min(len(lines),i+8)):
                      if lines[j] not in hits: hits.append(lines[j])
          for z in hits[:300]: print(z)
          print('RESULT_TEXT_END')
          print('LINKS_BEGIN')
          for a in ps.find_all('a',href=True):
              h=a['href']; t=a.get_text(' ',strip=True)
              if any(k in (h+' '+t).lower() for k in ['cert','pdf','963946','segu']): print(repr(t),repr(h))
          print('LINKS_END')
          PY
