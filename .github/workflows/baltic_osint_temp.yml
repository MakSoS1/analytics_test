name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ctf-baltic-osint-temp
      - name: OCR contact sheets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          for f in osint_frames/contact_*.jpg; do
            echo "=== $f ==="
            for psm in 11 6; do
              echo "--- PSM $psm ---"
              tesseract "$f" stdout --psm "$psm" 2>/dev/null | grep -Eai 'TIR|[A-Z]{3,5}[^A-Z0-9]{0,4}[0-9]{5,8}|[A-Z0-9]{1,8}[[:space:]]*/[[:space:]]*[A-Z0-9-]{1,12}' || true
            done
          done
