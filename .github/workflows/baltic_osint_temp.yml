name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect public Triton unit specifications search API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,html,urllib.parse,json
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36'}
          base='https://tools.tritoncontainer.com'
          u=base+'/tritoncontainer/unitSpecs/list'
          s=requests.Session(); r=s.get(u,headers=H,timeout=30)
          print('LIST',r.status_code,r.url,len(r.content))
          txt=html.unescape(r.text)
          for line in txt.splitlines():
              low=line.lower()
              if any(k in low for k in ['unitspec','datatable','ajax','unitnumber','search','script src']):
                  print('HTML',line[:3000])
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[]
          for sc in soup.find_all('script'):
              src=sc.get('src')
              if src:
                  scripts.append(urllib.parse.urljoin(r.url,src))
          print('SCRIPTS',json.dumps(scripts,indent=2))
          for su in scripts:
              try:
                  rr=s.get(su,headers={**H,'Referer':u},timeout=30)
                  body=rr.text
                  hits=[]
                  for m in re.finditer(r'.{0,250}(?:unitSpecs|DataTable|ajax|unitNumber|serverSide|search).{0,500}',body,re.I|re.S):
                      z=' '.join(m.group(0).split())
                      if z not in hits: hits.append(z)
                  if hits:
                      print('\nSCRIPT',su,rr.status_code,len(rr.content))
                      for z in hits[:30]: print('HIT',z[:2000])
              except Exception as e: print('SCRIPT_ERR',su,repr(e))
          # Try common endpoint candidates safely with a known public unit and our target.
          candidates=[
              '/tritoncontainer/unitSpecs/search',
              '/tritoncontainer/unitSpecs/list.json',
              '/tritoncontainer/unitSpecs/data',
              '/tritoncontainer/unitSpecs/find',
          ]
          for path in candidates:
              for method in ['get','post']:
                  try:
                      fn=getattr(s,method)
                      kwargs={'headers':{**H,'Referer':u},'timeout':20,'allow_redirects':True}
                      if method=='get': kwargs['params']={'unitNumbers':'TTNU8845830\nSEGU9639460','unitNumber':'TTNU8845830'}
                      else: kwargs['data']={'unitNumbers':'TTNU8845830\nSEGU9639460','unitNumber':'TTNU8845830'}
                      q=fn(base+path,**kwargs)
                      print('PROBE',method.upper(),path,q.status_code,q.url,q.headers.get('Content-Type'),len(q.content),q.text[:800].replace('\n',' '))
                  except Exception as e: print('PROBE_ERR',method,path,repr(e))
          PY
