name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe archived Seaco Unit Enquiry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,json,urllib.parse,html
          H={'User-Agent':'Mozilla/5.0'}
          roots=[
            'https://newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17/index.html',
            'https://newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17/manifest.json',
            'https://newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17/Component.js',
          ]
          print('CDX_EXACT_BEGIN')
          captures=[]
          for u in roots:
              try:
                  r=requests.get('https://web.archive.org/cdx/search/cdx',params={'url':u,'output':'json','filter':'statuscode:200','filter':'mimetype:text/html|application/json|application/javascript','fl':'timestamp,original,statuscode,mimetype,digest','collapse':'digest'},headers=H,timeout=45)
                  print('CDX',u,r.status_code,len(r.content),r.text[:1500].replace('\n',' '))
                  try:
                      arr=r.json()
                      for row in arr[1:]: captures.append((row[0],row[1]))
                  except Exception: pass
              except Exception as e: print('CDX_ERR',u,repr(e))
          print('CDX_EXACT_END')
          # wildcard through alternate CDX index format
          target='newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17/*'
          try:
              r=requests.get('https://web.archive.org/cdx/search/cdx',params={'url':target,'output':'json','filter':'statuscode:200','fl':'timestamp,original,statuscode,mimetype','collapse':'urlkey','limit':'500'},headers=H,timeout=60)
              print('WILDCARD',r.status_code,len(r.content))
              print(r.text[:30000])
              try:
                  arr=r.json()
                  for row in arr[1:]: captures.append((row[0],row[1]))
              except Exception: pass
          except Exception as e: print('WILDCARD_ERR',repr(e))
          print('FETCH_CAPTURES_BEGIN')
          seen=set()
          for ts,u in captures:
              key=(ts,u)
              if key in seen: continue
              seen.add(key)
              au='https://web.archive.org/web/'+ts+'id_/'+u
              try:
                  rr=requests.get(au,headers=H,timeout=45,allow_redirects=True)
                  print('\nCAP',ts,u,'=>',rr.status_code,rr.url,rr.headers.get('Content-Type'),len(rr.content))
                  text=rr.text if len(rr.content)<1000000 else rr.text[:1000000]
                  # Print service/OData related lines only.
                  for line in text.splitlines():
                      l=line.lower()
                      if any(k in l for k in ['odata','datasource','serviceurl','serviceuri','sap/opu','unit','equipment','tir','csc','certificate','approval','model']):
                          print(line[:5000])
              except Exception as e: print('CAP_ERR',au,repr(e))
          print('FETCH_CAPTURES_END')
          # Memento availability API can work when CDX is blocked.
          for u in roots:
              try:
                  rr=requests.get('https://archive.org/wayback/available',params={'url':u,'timestamp':'20200101'},headers=H,timeout=30)
                  print('AVAILABLE',u,rr.status_code,rr.text[:3000])
              except Exception as e: print('AVAILABLE_ERR',repr(e))
          PY
