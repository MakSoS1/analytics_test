name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query Seaco Equipment Status exactly as legacy client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,urllib.parse,re,json
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json,application/xml,text/plain,*/*'}
          filt="IUnitNo eq 'SEGU9639460' and IUnitNo1 eq ''"
          for host in ['https://seaweb.seacoglobal.com','https://newseaweb.seacoglobal.com']:
            base=host+'/sap/opu/odata/sap/ZNW_SEACO_PUBLIC_UE_PGW_SRV'
            urls=[
              base+'/$metadata?saml2=disabled',
              base+'/Equipment_Status?$filter='+urllib.parse.quote(filt,safe="'()")+'&saml2=disabled&$format=json',
              base+'/Equipment_Status?$filter='+urllib.parse.quote(filt,safe="'()")+'&$format=json&saml2=disabled',
            ]
            for u in urls:
              try:
                s=requests.Session(); r=s.get(u,headers=H,timeout=50,allow_redirects=True)
                print('\nREQ',u); print('RES',r.status_code,r.url,r.headers.get('Content-Type'),len(r.content));
                txt=r.text
                if '963946' in txt or re.search(r'"Tir"|<d:Tir>|TIR',txt,re.I):
                  for pat in [r'.{0,600}963946.{0,2500}',r'.{0,500}["<]Tir[">:].{0,1500}',r'.{0,500}TIR.{0,1500}']:
                    for m in re.finditer(pat,txt,re.I|re.S): print('HIT',m.group(0)[:5000].replace('\n',' '))
                else: print(txt[:3000].replace('\n',' '))
              except Exception as e: print('ERR',repr(e))
          PY
