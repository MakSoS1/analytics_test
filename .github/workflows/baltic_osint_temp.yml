name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public SEACO 45R1 reference photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref
          curl -L --fail --compressed -A 'Mozilla/5.0' 'https://s0.rbk.ru/v6_top_pics/media/img/4/06/347582654694064.jpeg' -o /tmp/ref/segu9720021.jpeg
          curl -L --fail --compressed -A 'Mozilla/5.0' 'https://www.primexcontainers.com.br/images/jch-optimize/ng/images_2024_04_08_home-2.webp' -o /tmp/ref/segu9566394.webp || true
          file /tmp/ref/*
          ls -lh /tmp/ref
      - uses: actions/upload-artifact@v4
        with:
          name: seaco-45r1-reference-photos
          path: /tmp/ref/*
          retention-days: 1
