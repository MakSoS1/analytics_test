name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public Seaco reference units in Textainer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,html,urllib.parse,csv,io
          from bs4 import BeautifulSoup
          base='https://tex.textainer.com'; u=base+'/Equipment/StatusAndSpecificationsInquiry.aspx?DelFileTypes=CS-EX'
          units=['SEGU9639460','SEGU9720021','SEGU9566394']
          s=requests.Session(); h={'User-Agent':'Mozilla/5.0'}
          r=s.get(u,headers=h,timeout=20); soup=BeautifulSoup(r.text,'html.parser')
          data={t.get('name'):t.get('value','') for t in soup.find_all('input') if t.get('name') and t.get('type')=='hidden'}
          data['ctl00$bodyContent$ucEqpIds$txtEqpId']='\r\n'.join(units); data['ctl00$bodyContent$btnSubmit']='Preview'
          pr=s.post(u,data=data,headers={**h,'Referer':u},timeout=30,allow_redirects=True)
          txt=html.unescape(pr.text).replace('\\/','/'); ms=re.findall(r'["\'](/Reserved\.ReportViewerWebControl\.axd\?[^"\']+OpType=Export[^"\']+Format=)["\']',txt)
          if not ms: raise SystemExit('export base not found')
          rr=s.get(urllib.parse.urljoin(base,html.unescape(ms[0])+'CSV'),headers={**h,'Referer':pr.url},timeout=40)
          for row in csv.DictReader(io.StringIO(rr.content.decode('utf-8-sig','replace'))):
              print('UNIT',row.get('txtEqpId'))
              for k in ['txtEqpDesc','txtManufacture4','txtManufacture5','txtRate2','txtRate4','txtMaterial2','txtMaterial4','txtMaterial6','txtApproval2','txtApproval4']:
                  print(k,repr(row.get(k)))
              print('---')
          PY
