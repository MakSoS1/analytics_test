name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query close 2018 Fuwa reefer approval records
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/139 Safari/537.36'}
          base='https://tools.tritoncontainer.com/tritoncontainer/unitSpecs/show/'
          units=['RJCU2019190','TTNU8845830','SEGU9639460']
          for unit in units:
              r=requests.get(base+unit,headers=H,timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              text='\n'.join(x.strip() for x in soup.stripped_strings)
              print('\nUNIT',unit,'STATUS',r.status_code,'URL',r.url,'LEN',len(r.content))
              # Print only compact specification labels; no page instructions or unrelated text.
              lines=[x.strip() for x in soup.stripped_strings]
              for i,x in enumerate(lines):
                  if x in ['Manufacturer','Manufacture Date','ISO Code','CSC','TIR','Box builder:']:
                      print(x, '=>', lines[i+1] if i+1 < len(lines) else '')
              for pat in [r'F/BV/\d+/\d+',r'GB/C\s+\d+\s+BV/\d{4}',r'LB4026THD[-\s]\d+']:
                  vals=sorted(set(re.findall(pat,text,re.I)))
                  if vals: print('MATCH',pat,vals)
          # Use the actual public search form as a fallback for RJCU and target.
          s=requests.Session(); listurl='https://tools.tritoncontainer.com/tritoncontainer/unitSpecs/list'
          s.get(listurl,headers=H,timeout=30)
          for val in ['RJCU2019190','SEGU9639460']:
              q=s.post('https://tools.tritoncontainer.com/tritoncontainer/unitSpecs/refreshTable',data={'unitNumberText':val},headers={**H,'Referer':listurl,'X-Requested-With':'XMLHttpRequest'},timeout=30)
              print('\nREFRESH',val,q.status_code,q.headers.get('Content-Type'),len(q.content))
              body=q.text
              for pat in [r'[A-Z]{4}\d{7}',r'F/BV/\d+/\d+',r'GB/C\s+\d+\s+BV/\d{4}',r'LB4026THD[-\s]\d+']:
                  vals=sorted(set(re.findall(pat,body,re.I)))
                  if vals: print('R',pat,vals[:30])
          PY
