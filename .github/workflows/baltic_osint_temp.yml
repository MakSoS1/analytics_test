name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover pre-migration Seaco Unit Enquiry endpoints from archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,json,re,urllib.parse
          H={'User-Agent':'Mozilla/5.0'}
          queries=[
            'newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17/*',
            'newseaweb.seacoglobal.com/sap/opu/odata/sap/ZNW_SEACO_PUBLIC_UE_PGW_SRV*',
            'seaweb.seacoglobal.com/*Unit*Enquiry*',
            'seaweb.seacoglobal.com/*',
            'www.seacoglobal.com/*unit*enquiry*',
          ]
          for q in queries:
            u='https://web.archive.org/cdx/search/cdx?url='+urllib.parse.quote(q,safe='*/:$')+'&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&from=2017&to=20260630&collapse=urlkey&limit=500'
            print('\n### CDX',q)
            try:
              r=requests.get(u,headers=H,timeout=60); print('STATUS',r.status_code,'LEN',len(r.content)); print(r.text[:120000])
            except Exception as e: print('ERR',repr(e))
          # Also ask Common Crawl index for the SAP service/app URLs.
          for idx in ['CC-MAIN-2026-26','CC-MAIN-2026-21','CC-MAIN-2026-12','CC-MAIN-2025-47']:
            for q in ['newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17/*','newseaweb.seacoglobal.com/sap/opu/odata/sap/ZNW_SEACO_PUBLIC_UE_PGW_SRV*']:
              u=f'https://index.commoncrawl.org/{idx}-index?url='+urllib.parse.quote(q,safe='*/:$')+'&output=json&filter=status:200'
              try:
                r=requests.get(u,headers=H,timeout=45); print('\n### CC',idx,q,r.status_code,len(r.content)); print(r.text[:50000])
              except Exception as e: print('CCERR',repr(e))
          PY
