name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public retired Seaco UI5 app metadata
        shell: bash
        run: |
          set -u
          B='https://newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36'
          for p in index.html manifest.json Component.js controller/App.controller.js controller/View1.controller.js controller/Home.controller.js; do
            echo "===== $p ====="
            rm -f /tmp/h /tmp/b
            curl -k -L --connect-timeout 8 --max-time 20 -A "$UA" -sS -D /tmp/h "$B/$p" -o /tmp/b || true
            head -20 /tmp/h 2>/dev/null || true
            wc -c /tmp/b 2>/dev/null || true
            grep -Ei 'odata|serviceUrl|datasource|TIR|unit|equipment|zseaco|sap/opu' /tmp/b 2>/dev/null | head -100 || true
            head -c 6000 /tmp/b 2>/dev/null | tr '\n' ' '; echo
          done
