name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract ATO certificate popup URL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q beautifulsoup4
          python3 - <<'PY'
          import requests,re,difflib,html
          from bs4 import BeautifulSoup
          U='https://www.reefertransport.nl/Certified.aspx'; H={'User-Agent':'Mozilla/5.0'}
          s=requests.Session(); r=s.get(U,headers=H,timeout=30); soup=BeautifulSoup(r.text,'html.parser')
          def hidd(sp): return {x.get('name'):x.get('value','') for x in sp.find_all('input') if x.get('name') and (x.get('type') or '').lower()=='hidden'}
          pfx='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$prefixComboBox'; num='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$numberTextBox'
          d=hidd(soup); d[pfx]='SEGU'; d[num]='963946'; d['__EVENTTARGET']='ctl00$ctl00$ContentPlaceHolder$ContentPlaceHolder$searchButton'; d['__EVENTARGUMENT']=''
          d['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_prefixComboBox_ClientState']='{"logEntries":[],"value":"SEGU","text":"SEGU","enabled":true,"checkedIndices":[],"checkedItemsTextOverflows":false}'
          d['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_numberTextBox_ClientState']='{"enabled":true,"emptyMessage":"number","validationText":"963946","valueAsString":"963946","lastSetTextBoxValue":"963946"}'
          sr=s.post(U,data=d,headers={**H,'Referer':U},timeout=30); ss=BeautifulSoup(sr.text,'html.parser')
          a=next(a for a in ss.find_all('a',href=True) if a.get_text(' ',strip=True).lower()=='certified')
          tgt=re.search(r"__doPostBack\('([^']+)'",a['href']).group(1); print('TARGET',tgt)
          d2=hidd(ss); d2[pfx]='SEGU'; d2[num]='963946'; d2['__EVENTTARGET']=tgt; d2['__EVENTARGUMENT']=''
          for k in ['ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_prefixComboBox_ClientState','ctl00_ctl00_ContentPlaceHolder_ContentPlaceHolder_numberTextBox_ClientState']:
              n=ss.find('input',{'name':k}); d2[k]=n.get('value','') if n else ''
          dr=s.post(U,data=d2,headers={**H,'Referer':U},timeout=30)
          print('LENS',len(sr.text),len(dr.text))
          # Extract scripts and snippets around popup/certificate/report identifiers.
          print('SCRIPTS_BEGIN')
          ds=BeautifulSoup(dr.text,'html.parser')
          for sc in ds.find_all('script'):
              z=sc.get_text(' ',strip=True)
              if any(k in z.lower() for k in ['19164','certificate','certif','radwindow','window.open','radopen','pdf','report','963852','963951']): print(z[:12000])
          print('SCRIPTS_END')
          print('SNIPPETS_BEGIN')
          low=dr.text.lower()
          for key in ['19164','certificate','certif','radwindow','radopen','window.open','.pdf','963852','963951','download']:
              pos=0; count=0
              while True:
                  i=low.find(key.lower(),pos)
                  if i<0 or count>=12: break
                  print('\nKEY',key,'AT',i,'::',html.unescape(dr.text[max(0,i-700):i+1800]).replace('\n',' ')[:2600])
                  pos=i+len(key); count+=1
          print('SNIPPETS_END')
          print('DIFF_BEGIN')
          # Only changed lines containing likely navigation/script semantics.
          A=sr.text.splitlines(); B=dr.text.splitlines()
          for line in difflib.unified_diff(A,B,n=1):
              l=line.lower()
              if any(k in l for k in ['script','window','cert','19164','963852','963951','pdf','dataGrid'.lower(),'rad']): print(line[:5000])
          print('DIFF_END')
          PY
