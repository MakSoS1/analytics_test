name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ctf-baltic-osint-temp
      - uses: actions/upload-artifact@v4
        with:
          name: baltic-contact-sheets
          path: osint_frames/contact_*.jpg
          retention-days: 1
