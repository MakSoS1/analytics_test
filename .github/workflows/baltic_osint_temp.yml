name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch high-resolution Baltic Spirit reposts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q -U yt-dlp
          mkdir -p videos
          for id in 3VtMul7deY8 l7lQQBoQZYg Qxv26O4naKU; do
            echo "FORMATS $id"
            yt-dlp --no-warnings -F "https://www.youtube.com/watch?v=$id" | tail -n 35 || true
            yt-dlp --no-warnings --merge-output-format mp4 -f "bv*[height<=2160]+ba/b[height<=2160]" -o "videos/${id}.%(ext)s" "https://www.youtube.com/watch?v=$id" || true
          done
          echo "FILES"
          ls -lh videos
          for f in videos/*; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration -of default=nw=1 "$f" || true
          done
      - name: Upload video sources
        uses: actions/upload-artifact@v4
        with:
          name: baltic-spirit-hq-reposts
          path: videos/
          retention-days: 1
