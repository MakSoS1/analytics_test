name: temporary baltic spirit osint probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public retired Seaco UI5 app metadata
        shell: bash
        run: |
          set -u
          B='https://newseaweb.seacoglobal.com/sap/bc/ui5_ui5/sap/zseaco_ue17'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139.0 Safari/537.36'
          for p in index.html manifest.json Component.js controller/App.controller.js controller/View1.controller.js; do
            echo "===== $p ====="
            curl -k -L --connect-timeout 8 --max-time 20 -A "$UA" -sS -D /tmp/h "$B/$p" -o /tmp/b || true
            head -20 /tmp/h || true
            wc -c /tmp/b || true
            grep -Eo '(/sap/opu/odata[^"'"' ]+|serviceUrl[^,}]+|uri[^,}]+|TIR|Unit[^"'"' ]{0,40})' /tmp/b | head -80 || true
            head -c 3000 /tmp/b | tr '\n' ' '; echo
          done
