name: Remote Admin Anomaly V3 Contract Tests

on:
  push:
    branches: [remote-admin-anomaly-lab-v3]
    paths:
      - 'remote-admin-anomaly-lab/configs/**'
      - 'remote-admin-anomaly-lab/src/**'
      - 'remote-admin-anomaly-lab/scripts/**'
      - 'remote-admin-anomaly-lab/tests/**'
      - 'remote-admin-anomaly-lab/windows/**'
      - 'remote-admin-anomaly-lab/requirements.txt'
      - '.github/workflows/remote-admin-v3-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-v3-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install full test runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Run full V1/V2/V3 regression suite
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -o pipefail
          pytest -q tests 2>&1 | tee /tmp/remote-admin-v3-pytest.log
      - name: Retain pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v3-pytest-${{ github.run_id }}
          path: /tmp/remote-admin-v3-pytest.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
