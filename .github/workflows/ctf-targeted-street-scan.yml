name: Temporary targeted historical street scan

on:
  pull_request:
    branches: [ctf-geolocate-20260731]
    paths:
      - 'ctf/targeted-scan/**'
      - '.github/workflows/ctf-targeted-street-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ctf-geolocate-20260731

      - name: Install dependencies
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet streetview pillow py360convert numpy requests torch torchvision 'transformers==4.44.2'

      - name: Scan focused candidate areas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/contact
          python3 - <<'PY'
          import io, json, math, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import numpy as np
          import py360convert
          import requests
          import torch
          from PIL import Image, ImageDraw, ImageFont
          from streetview import search_panoramas
          from transformers import CLIPModel, CLIPProcessor

          # Fine GeoCLIP maxima and compact surroundings. The Armidale point lies west of the earlier scan.
          areas = {
              'Armidale_west': (-30.4800, 151.6160, 0.026, 0.030),
              'Goulburn_west': (-34.7390, 149.6581, 0.026, 0.032),
              'Canberra_peak': (-35.3175, 149.1346, 0.018, 0.022),
          }

          def haversine(a,b,c,d):
              p1,p2=map(math.radians,(a,c)); dp=math.radians(c-a); dl=math.radians(d-b)
              x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 12742000*math.asin(math.sqrt(x))

          raw={}; errors=[]
          for area,(clat,clon,lat_span,lon_span) in areas.items():
              lats=np.arange(clat-lat_span/2,clat+lat_span/2+0.0001,0.0020)
              lons=np.arange(clon-lon_span/2,clon+lon_span/2+0.0001,0.0022)
              for qi,(lat,lon) in enumerate((float(a),float(b)) for a in lats for b in lons):
                  try:
                      panos=search_panoramas(lat=lat,lon=lon)
                  except Exception as exc:
                      errors.append({'area':area,'lat':lat,'lon':lon,'error':repr(exc)})
                      continue
                  for p in panos:
                      distance=haversine(lat,lon,float(p.lat),float(p.lon))
                      if distance > 420: continue
                      row={
                          'area':area,'pano_id':p.pano_id,'lat':float(p.lat),'lon':float(p.lon),
                          'date':p.date,'heading_meta':float(p.heading),'query_distance_m':distance,
                      }
                      old=raw.get(p.pano_id)
                      if old is None or distance < old['query_distance_m']:
                          raw[p.pano_id]=row
                  if qi % 30 == 0:
                      print(area, qi, 'unique', len(raw), flush=True)
                  time.sleep(0.05)

          # Per capture position retain earliest, one leafless-season image, and latest control.
          groups={}
          for row in raw.values():
              key=(row['area'],round(row['lat'],5),round(row['lon'],5))
              groups.setdefault(key,[]).append(row)
          selected=[]
          for rows in groups.values():
              rows.sort(key=lambda r:((int(r['date'][:4]) if r['date'] else 9999),r['date'] or ''))
              picks=[rows[0],rows[-1]]
              winter=[r for r in rows if r['date'] and len(r['date'].split('-'))>1 and int(r['date'].split('-')[1]) in (5,6,7,8)]
              if winter: picks.append(winter[0])
              seen=set()
              for r in picks:
                  if r['pano_id'] not in seen:
                      selected.append(r); seen.add(r['pano_id'])
          selected.sort(key=lambda r:(r['area'],int(r['date'][:4]) if r['date'] else 9999,r['lat'],r['lon']))
          # Keep the run bounded while retaining all three areas.
          bounded=[]
          for area in areas:
              subset=[r for r in selected if r['area']==area]
              bounded.extend(subset[:260])
          selected=bounded
          Path('results/search_errors.json').write_text(json.dumps(errors,indent=2))
          Path('results/candidates.json').write_text(json.dumps(selected,indent=2))
          print('raw',len(raw),'groups',len(groups),'selected',len(selected),flush=True)

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://www.google.com/maps/'})
          def fetch(row):
              pano=Image.new('RGB',(1024,512)); pid=row['pano_id']
              for x in range(2):
                  resp=session.get('https://streetviewpixels-pa.googleapis.com/v1/tile',params={
                      'cb_client':'maps_sv.tactile','panoid':pid,'x':x,'y':0,'zoom':1,'nbt':1,'fover':2,
                  },timeout=25)
                  if resp.status_code != 200 or not resp.content.startswith(b'\xff\xd8'):
                      raise RuntimeError(f'tile status={resp.status_code}, type={resp.headers.get("content-type")}')
                  pano.paste(Image.open(io.BytesIO(resp.content)).convert('RGB'),(x*512,0))
              return row,pano

          downloaded=[]; failures=[]
          with ThreadPoolExecutor(max_workers=7) as executor:
              futures={executor.submit(fetch,r):r for r in selected}
              for i,future in enumerate(as_completed(futures)):
                  try: downloaded.append(future.result())
                  except Exception as exc: failures.append({**futures[future],'error':repr(exc)})
                  if i % 75 == 0:
                      print('download',i,'ok',len(downloaded),'failed',len(failures),flush=True)
          Path('results/failures.json').write_text(json.dumps(failures,indent=2))

          images=[]; metadata=[]
          for meta,pano in downloaded:
              equi=np.asarray(pano)
              for heading in range(0,360,36):
                  for pitch in (0,-8):
                      arr=py360convert.e2p(equi,fov_deg=(80,60),u_deg=heading,v_deg=pitch,out_hw=(252,336),mode='bilinear')
                      images.append(Image.fromarray(np.uint8(np.clip(arr,0,255))))
                      metadata.append({**meta,'view_heading':heading,'view_pitch':pitch})
          print('downloaded',len(downloaded),'views',len(images),flush=True)

          target=Image.open('ctf/geolocate/input-small.jpg').convert('RGB')
          model=CLIPModel.from_pretrained('openai/clip-vit-base-patch32'); model.eval()
          processor=CLIPProcessor.from_pretrained('openai/clip-vit-base-patch32')
          with torch.no_grad():
              target_feature=model.get_image_features(**processor(images=[target],return_tensors='pt'))
              target_feature=target_feature/target_feature.norm(dim=-1,keepdim=True)
          scores=[]
          for start in range(0,len(images),48):
              with torch.no_grad():
                  feature=model.get_image_features(**processor(images=images[start:start+48],return_tensors='pt'))
                  feature=feature/feature.norm(dim=-1,keepdim=True)
              scores.extend((feature@target_feature.T).squeeze(1).tolist())
              if start % 960 == 0: print('embed',start,'/',len(images),flush=True)
          rows=[{**metadata[i],'clip_score':float(scores[i]),'image_index':i} for i in range(len(images))]
          rows.sort(key=lambda r:r['clip_score'],reverse=True)
          Path('results/ranking.json').write_text(json.dumps(rows,indent=2))

          # One best heading per panorama, then balanced sheets per area and global ranking.
          diverse=[]; seen=set()
          for row in rows:
              if row['pano_id'] in seen: continue
              seen.add(row['pano_id']); diverse.append(row)
          Path('results/diverse_ranking.json').write_text(json.dumps(diverse,indent=2))

          font=ImageFont.load_default()
          def make_sheets(name, ranked, limit=200):
              ranked=ranked[:limit]
              for page in range((len(ranked)+19)//20):
                  sheet=Image.new('RGB',(1800,1200),'white'); draw=ImageDraw.Draw(sheet)
                  for j,row in enumerate(ranked[page*20:(page+1)*20]):
                      image=images[row['image_index']].copy(); image.thumbnail((350,245))
                      x=(j%5)*360; y=(j//5)*300; sheet.paste(image,(x,y))
                      text=(f"#{page*20+j+1} {row['area']} {row['date'] or '?'}\n"
                            f"{row['lat']:.5f},{row['lon']:.5f} h={row['view_heading']} p={row['view_pitch']}\n"
                            f"CLIP={row['clip_score']:.4f}")
                      draw.multiline_text((x+2,y+248),text,fill='black',font=font,spacing=2)
                  sheet.save(f'results/contact/{name}_{page+1:02d}.jpg',quality=91)
          make_sheets('global',diverse,240)
          for area in areas:
              make_sheets(area,[r for r in diverse if r['area']==area],160)
          print('TOP',json.dumps(diverse[:40]),flush=True)
          PY

      - name: Upload shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-street-scan
          path: |
            results/*.json
            results/contact/
          retention-days: 1
          if-no-files-found: error
