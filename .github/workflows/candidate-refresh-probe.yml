name: Probe competitor forecast refresh

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe refresh variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p refresh-probe
          python - <<'PY'
          import concurrent.futures, json, time, requests
          from pathlib import Path
          ids=['2021331','1444663','2052971','2175231','2341290']
          variants=[{}, {'fallback':'1'}, {'refresh':'1'}, {'force':'1'}, {'recalc':'1'}]
          def one(item):
              app,params=item
              q={'app':app, **params, '_t':str(int(time.time()*1000))}
              r=requests.get('https://www.postupashkin.ru/priem-2026/forecast',params=q,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json','Cache-Control':'no-cache'},timeout=60)
              try:d=r.json()
              except:d={'raw':r.text}
              name='default' if not params else next(iter(params))
              Path(f'refresh-probe/{app}-{name}.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n','utf-8')
              return app,name,r.status_code,d.get('pending'),d.get('poll_file'),d.get('data_ts'),len(d.get('positions') or [])
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for x in ex.map(one,[(a,v) for a in ids for v in variants]): print(x)
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-refresh-probe
          path: refresh-probe
          retention-days: 1
