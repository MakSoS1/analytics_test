name: launchlet-part3-postoracle-small
on:
  push:
    branches: [agent/launchlet-part3-postoracle-small-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe high-signal POST handlers with invalid JSON
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          paths=[
            '/api/actions/invoke','/api/receipts/redeem',
            '/api/app/build','/api/app/generate','/api/app/preview','/api/app/deploy','/api/app/publish','/api/app/release','/api/app/promote','/api/app/inspect','/api/app/export','/api/app/handoff','/api/app/launch','/api/app/finalize','/api/app/approve','/api/app/submit',
            '/api/apps/build','/api/apps/preview','/api/apps/deploy','/api/apps/publish','/api/apps/release',
            '/api/builder/build','/api/builder/preview','/api/builder/deploy','/api/builder/publish','/api/builder/release',
            '/api/prototype/build','/api/prototype/preview','/api/prototype/deploy','/api/prototype/publish','/api/prototype/release',
            '/api/preview/create','/api/preview/open','/api/preview/deploy','/api/preview/publish','/api/preview/export','/api/preview/inspect','/api/preview/promote','/api/preview/release',
            '/api/deploy/create','/api/deploy/open','/api/deploy/inspect','/api/deploy/export','/api/deploy/publish','/api/deploy/promote','/api/deploy/release','/api/deploy/finalize','/api/deploy/approve','/api/deploy/redeem','/api/deploy/resolve',
            '/api/deployments/create','/api/deployments/open','/api/deployments/inspect','/api/deployments/export','/api/deployments/publish','/api/deployments/promote','/api/deployments/release','/api/deployments/finalize','/api/deployments/approve','/api/deployments/redeem','/api/deployments/resolve',
            '/api/publish','/api/publish/deploy','/api/publish/preview','/api/publish/release',
            '/api/release/create','/api/release/open','/api/release/inspect','/api/release/export','/api/release/publish','/api/release/promote','/api/release/finalize','/api/release/approve',
            '/api/inspector/open','/api/inspector/inspect','/api/inspector/export','/api/inspector/unlock','/api/deploy-inspector/open','/api/deploy-inspector/inspect','/api/deploy-inspector/export','/api/deploy-inspector/unlock',
            '/api/internal/deploy','/api/internal/export','/api/internal/release','/api/internal/publish','/api/internal/inspect',
            '/api/enterprise/deploy','/api/production/deploy','/api/corporate/release'
          ]
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board'}
          def one(p):
            try:r=requests.post(base+p,headers=h,data=b'{',timeout=5,allow_redirects=False)
            except Exception:return None
            if r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n'):return None
            return {'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for x in ex.map(one,paths):
              if x:hits.append(x)
          (out/'summary.json').write_text(json.dumps({'tested':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-postoracle-small-encrypted
          path: artifact/
          retention-days: 1
