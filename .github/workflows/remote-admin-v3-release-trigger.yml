name: Remote Admin Anomaly V3 Release Trigger

on:
  push:
    branches: [remote-admin-anomaly-lab-v3]
    paths:
      - 'remote-admin-anomaly-lab/V3_RELEASE_TRIGGER'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-v3-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch exactly one V3 research release on the verified branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/remote-admin-v3-release.yml/dispatches" \
            -d '{"ref":"remote-admin-anomaly-lab-v3"}'
          echo 'V3 release dispatch accepted.'
