name: ExamClips Free Browser Preview (GitHub Pages)
on:
  push:
    branches: [feat/examclips-mvp-ui-deploy-20261016]
    paths:
      - 'examclips-local/**'
      - '.github/workflows/examclips-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: examclips-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-only dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test all logic without cloud APIs
        run: npm test
      - name: Build privacy-first static preview
        env:
          EXAMCLIPS_BASE: /analytics_test/
        run: npm run build
      - name: Check bundle references respect Pages subdirectory
        run: |
          grep -q '/analytics_test/assets/' dist/index.html
          echo 'STATIC_BUNDLE_READY'
      - name: Upload static build
        uses: actions/upload-pages-artifact@v4
        with:
          path: examclips-local/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy free public static preview
        id: deployment
        uses: actions/deploy-pages@v4
