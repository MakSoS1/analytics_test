name: Cover Channel Lab Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'cover-channel-lab-bootstrap/**'
      - '.github/workflows/cover-channel-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize cover-channel lab
        shell: bash
        run: |
          cat cover-channel-lab-bootstrap/part-* | base64 -d > "$RUNNER_TEMP/coverlab.tar.gz"
          echo 'e12464284ee73096d8a2914ecae5fc3800a9b717e009b34c55245ae6460b5c0c  '"$RUNNER_TEMP/coverlab.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/coverlab.tar.gz"
          rm -rf cover-channel-lab-bootstrap
          rm -f .github/workflows/cover-channel-lab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[coverlab-materialize] materialize cover channel lab sources'
          git push origin HEAD:main
