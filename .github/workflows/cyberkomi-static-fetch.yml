name: cyberkomi-static-fetch

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
    paths: ['.github/workflows/cyberkomi-static-fetch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch current WebGL build metadata and data file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BASE='https://cyberkomi.caplag.ru'
          curl -fsSL --connect-timeout 10 --max-time 60 "$BASE/" -o out/index.html
          python3 - <<'PY'
          import re, pathlib, urllib.parse, subprocess, json
          base='https://cyberkomi.caplag.ru/'
          html=pathlib.Path('out/index.html').read_text(errors='ignore')
          urls=[]
          for pat in [r'<script[^>]+src=["\']([^"\']+)', r'<link[^>]+href=["\']([^"\']+)']:
              urls += re.findall(pat, html, re.I)
          meta={'html_urls':urls}
          pathlib.Path('out/urls.json').write_text(json.dumps(meta,indent=2))
          loader=None
          for u in urls:
              if 'loader' in u.lower() and u.lower().endswith('.js'):
                  loader=urllib.parse.urljoin(base,u); break
          if not loader:
              m=re.search(r'loaderUrl\s*=\s*["\']([^"\']+)',html)
              if m: loader=urllib.parse.urljoin(base,m.group(1))
          if loader:
              subprocess.run(['curl','-fsSL','--connect-timeout','10','--max-time','60',loader,'-o','out/loader.js'],check=True)
          # Extract build asset URLs from HTML, then loader if any.
          text=html+'\n'+(pathlib.Path('out/loader.js').read_text(errors='ignore') if pathlib.Path('out/loader.js').exists() else '')
          candidates=[]
          for ext in ['data','data.unityweb','wasm','wasm.unityweb','framework.js','framework.js.unityweb']:
              for m in re.finditer(r'["\']([^"\']*'+re.escape(ext)+r')["\']',text,re.I):
                  candidates.append(m.group(1))
          # Parse common Unity config expressions directly from HTML.
          buildm=re.search(r'buildUrl\s*=\s*["\']([^"\']+)',html)
          build=buildm.group(1) if buildm else 'Build'
          for key in ['dataUrl','frameworkUrl','codeUrl']:
              m=re.search(key+r'\s*:\s*buildUrl\s*\+\s*["\']([^"\']+)',html)
              if m: candidates.append(build+m.group(1))
              m=re.search(key+r'\s*:\s*["\']([^"\']+)',html)
              if m: candidates.append(m.group(1))
          resolved=[]
          for c in candidates:
              u=urllib.parse.urljoin(base,c)
              if u not in resolved: resolved.append(u)
          pathlib.Path('out/build_urls.txt').write_text('\n'.join(resolved))
          # HEAD first; download only the data asset, which contains serialized scene objects.
          heads=[]
          for u in resolved:
              cp=subprocess.run(['curl','-sSIL','--connect-timeout','10','--max-time','60',u],capture_output=True,text=True)
              heads.append('URL '+u+'\n'+cp.stdout+'\n')
              if re.search(r'\.data(?:\.unityweb)?(?:\?|$)',u,re.I):
                  subprocess.run(['curl','-fsSL','--connect-timeout','10','--max-time','180',u,'-o','out/game.data'],check=True)
          pathlib.Path('out/heads.txt').write_text('\n'.join(heads))
          PY
          ls -lah out > out/listing.txt
      - name: Upload static build slice
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-static-build
          path: out
          retention-days: 1
