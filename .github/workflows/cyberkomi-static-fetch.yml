name: cyberkomi-static-fetch

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
    paths: ['.github/workflows/cyberkomi-static-fetch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Extract serialized Unity scene files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/extracted
          URL='https://cyberkomi.caplag.ru/Build/build.data.br'
          # curl decodes Content-Encoding: br when --compressed is enabled.
          curl -fsSL --compressed --connect-timeout 10 --max-time 240 "$URL" -o /tmp/build.data
          python3 - <<'PY'
          import pathlib,struct,json,re,hashlib
          p=pathlib.Path('/tmp/build.data')
          b=p.read_bytes()
          meta={'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'prefix_hex':b[:64].hex(),'prefix_ascii':b[:64].decode('latin1','replace')}
          entries=[]
          magic=b'UnityWebData1.0\x00'
          if not b.startswith(magic):
              pathlib.Path('out/meta.json').write_text(json.dumps(meta,indent=2))
              raise SystemExit('unexpected data magic')
          pos=len(magic)
          header_len=struct.unpack_from('<I',b,pos)[0]; pos+=4
          meta['header_len']=header_len
          while pos < header_len:
              off,length,path_len=struct.unpack_from('<III',b,pos); pos+=12
              path=b[pos:pos+path_len].decode('utf-8','replace'); pos+=path_len
              entries.append({'path':path,'offset':off,'length':length})
          meta['entries']=len(entries)
          pathlib.Path('out/meta.json').write_text(json.dumps(meta,indent=2))
          pathlib.Path('out/file_table.json').write_text(json.dumps(entries,indent=2,ensure_ascii=False))
          lines=[]
          for e in entries:
              lines.append(f"{e['offset']:12d} {e['length']:12d} {e['path']}")
              name=e['path'].split('/')[-1]
              if (re.fullmatch(r'level\d+',name,re.I) or
                  'globalgamemanagers' in name.lower() or
                  'sharedassets' in name.lower() or
                  name.lower().endswith('.assets')):
                  out=pathlib.Path('out/extracted')/name
                  out.write_bytes(b[e['offset']:e['offset']+e['length']])
          pathlib.Path('out/file_table.txt').write_text('\n'.join(lines))
          PY
          ls -lah out/extracted > out/listing.txt
          du -sh out/extracted >> out/listing.txt
      - name: Upload scene slice
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-scene-files
          path: out
          retention-days: 1
