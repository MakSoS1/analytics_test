name: cyberkomi-library-screen-export

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
    paths: ['.github/workflows/cyberkomi-static-fetch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export chapter 2 terminal screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/images
          curl -fsSL --compressed --connect-timeout 10 --max-time 240 'https://cyberkomi.caplag.ru/Build/build.data.br' -o /tmp/build.data
          python3 - <<'PY'
          import pathlib,struct
          b=pathlib.Path('/tmp/build.data').read_bytes(); magic=b'UnityWebData1.0\x00'; assert b.startswith(magic)
          pos=len(magic); end=struct.unpack_from('<I',b,pos)[0]; pos+=4
          while pos<end:
              off,n,pl=struct.unpack_from('<III',b,pos); pos+=12
              path=b[pos:pos+pl].decode(); pos+=pl
              if path=='data.unity3d': pathlib.Path('/tmp/data.unity3d').write_bytes(b[off:off+n]); break
          PY
          python3 -m pip -q install 'UnityPy>=1.20.0' pillow
          python3 - <<'PY'
          import UnityPy,pathlib,json,re
          env=UnityPy.load('/tmp/data.unity3d')
          wanted={'bg_login','bg_lib','bg_answer','bg_terminal','bg_menu','bg_complete','bg_gg','bg_AI'}
          exported=[]; objrows=[]
          for obj in env.objects:
              af=getattr(getattr(obj,'assets_file',None),'name','')
              typ=obj.type.name
              if typ=='Texture2D':
                  try:
                      d=obj.read(); name=getattr(d,'m_Name','')
                      if name in wanted:
                          # distinguish duplicate texture names using source serialized file
                          safe=re.sub(r'[^A-Za-z0-9_.-]+','_',af or 'unknown')
                          fn=f'{safe}__{obj.path_id}__{name}.png'
                          d.image.save('out/images/'+fn)
                          exported.append({'file':af,'path_id':obj.path_id,'name':name,'png':fn,'w':d.m_Width,'h':d.m_Height})
                  except Exception as e:
                      exported.append({'file':af,'path_id':obj.path_id,'error':repr(e)})
              elif typ=='GameObject':
                  try:
                      d=obj.read(); n=getattr(d,'m_Name','')
                      if re.search(r'Panel \(lib\)|Panel \(login\)|Panel \(menu\)|complete|answer|terminal|ChapterTitle',n,re.I):
                          objrows.append({'file':af,'path_id':obj.path_id,'name':n})
                  except Exception: pass
          pathlib.Path('out/exported.json').write_text(json.dumps(exported,ensure_ascii=False,indent=2))
          pathlib.Path('out/relevant_gameobjects.json').write_text(json.dumps(objrows,ensure_ascii=False,indent=2))
          PY
          ls -lah out/images > out/listing.txt
      - name: Upload library screens
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-library-screens
          path: out
          retention-days: 1
