name: Remote Admin Anomaly V3 Causal Release Trigger

on:
  workflow_run:
    workflows: ["Remote Admin Anomaly V3 Causal NGFW Smoke"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-corrected-v3:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'remote-admin-anomaly-lab-v3'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch corrected V3 1k causal NGFW release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "smoke_run_id=$SMOKE_RUN_ID tested_sha=$TESTED_SHA"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/remote-admin-v3-causal-release.yml/dispatches" \
            -d '{"ref":"remote-admin-anomaly-lab-v3"}'
