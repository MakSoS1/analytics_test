name: Postupashkin public-page probe

on:
  pull_request:
    paths:
      - '.github/workflows/postupashkin_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public applicant teasers
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup

          BASE = 'https://www.postupashkin.ru'
          URL = BASE + '/priem-2026/moi-shansy'
          CODES = [
              '2021331','1289499','967331','1441782','2318977','1795612',
              '2052971','1760018','2175231','1444663','1421079','1586063',
              '2341290','1263789','1252789','1826110','1952637','1072404','1609688'
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'ru-RU,ru;q=0.9,en;q=0.8',
          })

          # Discover only public endpoints referenced by the delivered page.
          base = session.get(URL, timeout=30)
          print('BASE', base.status_code, len(base.text))
          scripts = '\n'.join(tag.get_text('\n', strip=False) for tag in BeautifulSoup(base.text, 'html.parser').find_all('script'))
          patterns = [
              r"fetch\(\s*['\"]([^'\"]+)",
              r"['\"](/[^'\"]*(?:chance|shans|moi-shansy|applicant|entrant)[^'\"]*)['\"]",
          ]
          endpoints = []
          for pattern in patterns:
              endpoints.extend(re.findall(pattern, scripts, flags=re.I))
          print('PUBLIC_ENDPOINT_REFERENCES', json.dumps(sorted(set(endpoints)), ensure_ascii=False))

          for code in CODES:
              response = session.get(URL, params={'app': code}, timeout=30, allow_redirects=True)
              soup = BeautifulSoup(response.text, 'html.parser')
              text = ' '.join(soup.get_text(' ', strip=True).split())
              print('\n=== APPLICANT', code, '===')
              print('STATUS', response.status_code, 'URL', response.url, 'LEN', len(response.text), 'CODE_PRESENT', code in response.text)
              print('TITLE', soup.title.get_text(' ', strip=True) if soup.title else '')

              # Print concise visible fragments around the applicant code and admission terminology.
              positions = []
              low = text.lower()
              for needle in [code, 'ваши заявления', 'согласие', 'приоритет', 'шанс', 'вуз', 'бюджет']:
                  start = 0
                  while True:
                      pos = low.find(needle.lower(), start)
                      if pos < 0:
                          break
                      positions.append(pos)
                      start = pos + max(1, len(needle))
              merged = []
              for pos in sorted(set(positions)):
                  a, b = max(0, pos - 250), min(len(text), pos + 1000)
                  if merged and a <= merged[-1][1] + 100:
                      merged[-1] = (merged[-1][0], max(merged[-1][1], b))
                  else:
                      merged.append((a, b))
              for idx, (a, b) in enumerate(merged[:8]):
                  print('VISIBLE_FRAGMENT', idx, text[a:b])

              # Extract public bootstrap/config objects embedded into the response without using access keys.
              for marker in ['PAID_BOOTSTRAP', 'FREE_BOOTSTRAP', 'BOOTSTRAP', 'chanceData', 'CHANCE_DATA']:
                  for match in re.finditer(r'\b' + re.escape(marker) + r'\s*=\s*([^;]+);', response.text):
                      value = match.group(1).strip()
                      print('EMBEDDED', marker, value[:12000])

              # Show all lines containing this code or public API paths, capped for log size.
              relevant = []
              for line in response.text.splitlines():
                  stripped = line.strip()
                  if code in stripped or re.search(r'fetch\(|/priem-2026/[^"\']+|above_committed|above_leaving|place_consent', stripped, re.I):
                      relevant.append(stripped)
              for idx, line in enumerate(relevant[:80]):
                  print('HTML_LINE', idx, line[:5000])
          PY
