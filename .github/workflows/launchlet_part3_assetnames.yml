name: launchlet-part3-assetnames

on:
  push:
    branches: [agent/launchlet-part3-assetnames-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe semantic asset filenames and encrypt hits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'; out=pathlib.Path('package/out')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          stems=['deploy','deployment','deployments','preview-deploy','preview-deployment','deploy-preview','release','release-pulse','enterprise-rollout','production-readiness','deploy-inspector','production','enterprise','corporate-release','final-review','release-review','deployment-data','deploy-data','preview-data','release-data','artifact','artifacts','deploy-artifact','deployment-artifact','preview-artifact','deploy-output','deployment-output','build-output','release-output','server-references','server-reference-map','action-map','actions','server-actions','runtime','runtime-config','deploy-config','deployment-config','release-config','preview-config','environment','env','deploy-env','deployment-env','release-env','preview-env','metadata','deploy-metadata','deployment-metadata','release-metadata','preview-metadata','deploy-receipt','deployment-receipt','release-receipt','preview-receipt','deploy-reference','deployment-reference','release-reference','preview-reference','production-manifest','enterprise-manifest','release-manifest','deployment-manifest','deploy-manifest','preview-manifest','artifact-manifest','output-manifest','runtime-manifest','action-manifest','server-action-manifest','deploy-context','preview-context','release-context','production-context','enterprise-context','8b11c','preview-8b11c','2026.05.16-rc3','rc3']
          exts=['.json','.js','.txt','.map','']
          prefixes=['/assets/','/static/']
          res=[]
          for pre in prefixes:
            for stem in stems:
              for ext in exts:
                path=pre+stem+ext
                try:r=s.get(base.rstrip('/')+path,headers={'X-Launchlet-Preview':'launchlet-demo-board'},timeout=8,allow_redirects=False)
                except Exception as e:res.append({'path':path,'error':repr(e)});continue
                if not (r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n')):
                  # Exclude already-known app.js/styles/mock client by exact path, none of which are in this list except possible names.
                  res.append({'path':path,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                  if re.search(r'caplag\{[^}]+\}',r.text):(out/'FOUND.txt').write_text(r.text)
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-assetnames-encrypted
          path: artifact/
          retention-days: 1
