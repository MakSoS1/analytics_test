name: Remote Admin Anomaly V2 Planner Audit

on:
  workflow_dispatch:
  push:
    branches: [remote-admin-anomaly-lab-v2]
    paths:
      - 'remote-admin-anomaly-lab/src/adminlab/v2_scenarios.py'
      - 'remote-admin-anomaly-lab/scripts/v2_planner_audit.py'
      - 'remote-admin-anomaly-lab/scripts/run_scenarios_extended_v2.py'
      - 'remote-admin-anomaly-lab/src/adminlab/digital_twin.py'
      - 'remote-admin-anomaly-lab/src/adminlab/campaign_sequences.py'
      - 'remote-admin-anomaly-lab/src/adminlab/implementation_variants.py'
      - 'remote-admin-anomaly-lab/src/adminlab/wire_controls.py'
      - 'remote-admin-anomaly-lab/configs/**'
      - '.github/workflows/remote-admin-v2-planner-audit.yml'

permissions:
  contents: read

concurrency:
  group: remote-admin-v2-planner-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install planner runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Audit exact V2 1k semantic plan without wire capture
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          mkdir -p /tmp/remote-admin-v2-planner
          python scripts/v2_planner_audit.py \
            --count 1000 \
            --seed 2026081402 \
            --counterfactual-fraction 0.30 \
            --out /tmp/remote-admin-v2-planner/V2_PLANNER_AUDIT.json
      - name: Retain planner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v2-planner-${{ github.run_id }}
          path: /tmp/remote-admin-v2-planner
          retention-days: 90
          compression-level: 0
