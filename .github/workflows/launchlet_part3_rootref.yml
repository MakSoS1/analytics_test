name: launchlet-part3-rootref

on:
  push:
    branches: [agent/launchlet-part3-rootref-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe root/ref routing and encrypt differences
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          baseline=s.get(base,timeout=10,allow_redirects=False)
          keys=['deployRef','ref','preview','previewRef','deployment','deploymentRef','deploy','artifact','artifactRef','release','releaseRef','id','build','context','capability']
          vals=['preview-8b11c','8b11c','2026.05.16-rc3','lrec_preview_demo_2026']
          results=[]
          for k in keys:
            for v in vals:
              u=base+'?'+urllib.parse.urlencode({k:v})
              r=s.get(u,headers={'X-Launchlet-Preview':'launchlet-demo-board'},timeout=10,allow_redirects=False)
              if r.status_code!=baseline.status_code or r.text!=baseline.text or dict(r.headers)!=dict(baseline.headers):
                results.append({'url':u,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                if re.search(r'caplag\{[^}]+\}',r.text):(out/'FOUND.txt').write_text(r.text)
          # duplicate first/last query value variants
          for k in keys:
            for a,b in [('preview-8b11c','launchlet-demo-board'),('deploy','preview'),('release','preview')]:
              q=urllib.parse.urlencode([(k,a),(k,b)])
              r=s.get(base+'?'+q,headers={'X-Launchlet-Preview':'launchlet-demo-board'},timeout=10,allow_redirects=False)
              if r.status_code!=baseline.status_code or r.text!=baseline.text:
                results.append({'query':q,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                if re.search(r'caplag\{[^}]+\}',r.text):(out/'FOUND.txt').write_text(r.text)
          (out/'summary.json').write_text(json.dumps(results,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-rootref-encrypted
          path: artifact/
          retention-days: 1
