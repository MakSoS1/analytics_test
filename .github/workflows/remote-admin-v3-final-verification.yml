name: Remote Admin Anomaly V3 Final Verification

on:
  push:
    branches: [remote-admin-anomaly-lab-v3]
    paths:
      - '.github/workflows/remote-admin-v3-final-verification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-final-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: Maksim123321/remote-admin-anomaly-v1
      FINAL_PREFIX: v3/final/run-31885392045
      FINAL_RUN_ID: '31885392045'
      FINAL_ARTIFACT_ID: '9247494536'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Run complete V3 regression suite
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: pytest -q tests
      - name: Verify committed final status and cleanup evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('remote-admin-anomaly-lab/FINAL_STATUS_V3.json').read_text())
          decision=d['decision']; verified=d['verified']; cleanup=d['cleanup']; post=d['post_cleanup']
          assert decision['dataset_release_status']=='READY',decision
          assert decision['technical_status']=='READY',decision
          assert decision['scale_decision']=='STOP_AT_1K',decision
          assert verified['hf_verified'] is True,verified
          assert verified['github_artifact_verified'] is True,verified
          assert int(verified['github_final_run_id'])==int(os.environ['FINAL_RUN_ID']),verified
          assert int(verified['github_final_artifact_id'])==int(os.environ['FINAL_ARTIFACT_ID']),verified
          assert verified['hf_final_path']==os.environ['FINAL_PREFIX'],verified
          assert cleanup['status']=='PASS' and cleanup['policy']=='B',cleanup
          assert cleanup['github_deleted_run_count'] > 0,cleanup
          assert cleanup['hf_deleted_file_count'] > 0,cleanup
          assert not cleanup['hf_residual_superseded_paths'],cleanup
          assert post['status']=='PASS',post
          assert int(post['retained_artifact_id'])==int(os.environ['FINAL_ARTIFACT_ID']),post
          assert post['retained_prefix']==os.environ['FINAL_PREFIX'],post
          print(json.dumps({'dataset':decision['dataset_release_status'],'research':decision['research_status'],'scale':decision['scale_decision'],'deleted_runs':cleanup['github_deleted_run_count'],'deleted_hf_files':cleanup['hf_deleted_file_count'],'hf_payload_files':post['hf_payload_files']},sort_keys=True))
          PY
      - name: Verify authoritative GitHub artifact still exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          aid=os.environ['FINAL_ARTIFACT_ID']
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{aid}",headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: d=json.loads(r.read())
          assert int(d['id'])==int(aid),d
          assert d['expired'] is False,d
          assert d['name']=='remote-admin-v3-release-31885392045',d
          assert d['digest']=='sha256:57ed634654d69965bc7e4d1ffa0836dcb8ebdee3e97f6c18f7d2f9425a526731',d
          print(json.dumps({'artifact_id':d['id'],'name':d['name'],'bytes':d['size_in_bytes'],'digest':d['digest'],'expired':d['expired']},sort_keys=True))
          PY
      - name: Verify HF contains only final V3 payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ.get('HF_TOKEN','').strip(); assert token,'HF_TOKEN missing'
          api=HfApi(token=token)
          files=api.list_repo_files(os.environ['HF_REPO'],repo_type='dataset',token=token)
          prefix=os.environ['FINAL_PREFIX']
          payload=[p for p in files if p not in {'README.md','.gitattributes'}]
          assert payload,files
          bad=[p for p in payload if not (p==prefix or p.startswith(prefix+'/'))]
          assert not bad,bad[:20]
          assert len(payload)==1563,(len(payload),payload[:10])
          print(f'PASS final HF payload objects={len(payload)} prefix={prefix}')
          PY
