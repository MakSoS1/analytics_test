name: Applicant 1444663 public check

on:
  pull_request:
    paths:
      - '.github/workflows/applicant-1444663-public-check.yml'

permissions:
  contents: read

jobs:
  inspect-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Summarize public applicant positions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          code = "1444663"
          url = f"https://www.postupashkin.ru/priem-2026/forecast?app={code}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 public admissions verification"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          positions = data.get("positions", [])
          print(f"app={data.get('app')} found={data.get('found')} positions={len(positions)}")
          print("TOP_LEVEL_KEYS", sorted(data.keys()))
          for key, value in data.items():
              if key != "positions" and value not in (None, [], {}, ""):
                  print("TOP", key, json.dumps(value, ensure_ascii=False)[:4000])

          print("\nPOSITIONS")
          for i, p in enumerate(positions, 1):
              row = {
                  "n": i,
                  "university": p.get("short_name"),
                  "full_name": p.get("full_name"),
                  "city": p.get("city"),
                  "program": p.get("program_title") or p.get("dir_name"),
                  "code": p.get("code"),
                  "level": p.get("level_name"),
                  "form": p.get("form_name"),
                  "place_type": p.get("place_type_name"),
                  "places": p.get("places"),
                  "rating": p.get("rating"),
                  "calculated_place": p.get("place"),
                  "priority": p.get("priority"),
                  "consent": p.get("consent"),
                  "score": p.get("sum_show", p.get("sum_mark")),
                  "achievements": p.get("ach"),
                  "applicants": p.get("applicants_count"),
                  "consents_in_group": p.get("consents_count"),
                  "status_id": p.get("status_id"),
                  "withdrawn": p.get("withdrawn"),
                  "locked": p.get("locked"),
                  "chance": p.get("chance"),
                  "current_chance": p.get("current_chance"),
                  "group_id": p.get("group_id"),
              }
              print(json.dumps(row, ensure_ascii=False, sort_keys=False))

          print("\nOnly the site's unauthenticated public forecast endpoint was read. No access token, login, email, payment or restore endpoint was used.")
          PY
