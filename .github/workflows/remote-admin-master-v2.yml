name: Remote Admin Anomaly V1 Master V2

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths: ['remote-admin-anomaly-lab/.master-v2-trigger']
  workflow_dispatch:

permissions: {actions: read, contents: read}
env:
  HF_DATASET_REPO: Maksim123321/remote-admin-anomaly-v1
  RELEASE_ID: gh-${{ github.run_id }}-a${{ github.run_attempt }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install and contract gate
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests
      - name: Generate 1000-session gate shard
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" bash scripts/capture_shard_extended.sh A A-master-gate 1000 2026081460 /tmp/adminlab
          ADMINLAB_PYTHON="$py" bash scripts/build_silver.sh /tmp/adminlab/release A-master-gate
          bash scripts/build_rule_baseline.sh /tmp/adminlab/release A-master-gate
          PYTHONPATH=src python scripts/build_gold.py --release /tmp/adminlab/release --shard A-master-gate --feature-contract configs/feature_contract.yaml --split-seed 20260814
          PYTHONPATH=src python scripts/build_flow_gold_v2.py --release /tmp/adminlab/release --shard A-master-gate --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Gate quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path('/tmp/adminlab/release/quality/A-master-gate');cap=json.loads((q/'capture_health.json').read_text());prod=json.loads((q/'production_flow_gold.json').read_text());leak=json.loads((q/'leakage_checks.json').read_text())
          assert all(cap['protocol_counts'].get(p,0)>0 for p in ('ssh','smb','rdp','vnc')),cap
          assert cap['dcerpc_train_included'] is False
          assert prod['session_mapping_coverage']>=.95 and prod['conn_mapping_coverage']>=.90 and prod['uid_alignment_coverage']==1.0,prod
          assert leak['ok'] is True
          print(json.dumps({'capture':cap,'production':prod},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'remote-admin-master-full-A-master-gate-${{ github.run_id }}', path: '/tmp/adminlab/release', retention-days: 90, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with:
          name: remote-admin-master-gold-A-master-gate-${{ github.run_id }}
          path: |
            /tmp/adminlab/release/gold/A-master-gate
            /tmp/adminlab/release/bronze/A-master-gate/manifests/sessions.parquet
            /tmp/adminlab/release/quality/A-master-gate
          retention-days: 90
          compression-level: 0
      - name: HF after artifact
        working-directory: remote-admin-anomaly-lab
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: python scripts/upload_hf.py --repo "$HF_DATASET_REPO" --release /tmp/adminlab/release --shard A-master-gate --remote-path "releases/$RELEASE_ID" --status /tmp/adminlab/hf.json

  shards:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {stage: B, shard: B-master-00, seed: 2026081461}
          - {stage: B, shard: B-master-01, seed: 2026081462}
          - {stage: C, shard: C-master-00, seed: 2026081463}
          - {stage: D, shard: D-master-00, seed: 2026081464}
          - {stage: E, shard: E-master-00, seed: 2026081465}
          - {stage: F, shard: F-master-00, seed: 2026081466}
          - {stage: G, shard: G-master-00, seed: 2026081467}
          - {stage: H, shard: H-master-00, seed: 2026081468}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install wire runtime
        working-directory: remote-admin-anomaly-lab
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
      - name: Generate and derive full shard
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" bash scripts/capture_shard_extended.sh "${{ matrix.stage }}" "${{ matrix.shard }}" 1000 "${{ matrix.seed }}" /tmp/adminlab
          ADMINLAB_PYTHON="$py" bash scripts/build_silver.sh /tmp/adminlab/release "${{ matrix.shard }}"
          bash scripts/build_rule_baseline.sh /tmp/adminlab/release "${{ matrix.shard }}"
          PYTHONPATH=src python scripts/build_gold.py --release /tmp/adminlab/release --shard "${{ matrix.shard }}" --feature-contract configs/feature_contract.yaml --split-seed 20260814
          PYTHONPATH=src python scripts/build_flow_gold_v2.py --release /tmp/adminlab/release --shard "${{ matrix.shard }}" --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - uses: actions/upload-artifact@v4
        with: {name: 'remote-admin-master-full-${{ matrix.shard }}-${{ github.run_id }}', path: '/tmp/adminlab/release', retention-days: 90, compression-level: 0}
      - uses: actions/upload-artifact@v4
        with:
          name: remote-admin-master-gold-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            /tmp/adminlab/release/gold/${{ matrix.shard }}
            /tmp/adminlab/release/bronze/${{ matrix.shard }}/manifests/sessions.parquet
            /tmp/adminlab/release/quality/${{ matrix.shard }}
          retention-days: 90
          compression-level: 0
      - name: HF after artifact
        working-directory: remote-admin-anomaly-lab
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: python scripts/upload_hf.py --repo "$HF_DATASET_REPO" --release /tmp/adminlab/release --shard "${{ matrix.shard }}" --remote-path "releases/$RELEASE_ID" --status /tmp/adminlab/hf.json

  merge-train-promote:
    needs: [gate, shards]
    if: needs.gate.result == 'success' && needs.shards.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install model runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: 'remote-admin-master-gold-*-${{ github.run_id }}', path: /tmp/master-gold, merge-multiple: true}
      - name: Global production-flow merge and challenge policy
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: python scripts/merge_production_flow_gold.py --root /tmp/master-gold --out /tmp/master-promoted --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Promoted M0 M1 M2 and curve
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          mkdir -p /tmp/master-promoted/models
          python scripts/train_models.py --model-matrix /tmp/master-promoted/gold/production_model_matrix.parquet --out /tmp/master-promoted/models --seed 20260814
          python scripts/learning_curve.py --model-matrix /tmp/master-promoted/gold/production_model_matrix.parquet --out /tmp/master-promoted/models/learning_curve.json --seed 20260814
      - name: Final release gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/master-promoted');merge=json.loads((r/'quality/production_merge.json').read_text());leak=json.loads((r/'quality/production_leakage.json').read_text());models=json.loads((r/'models/summary.json').read_text());curve=json.loads((r/'models/learning_curve.json').read_text())
          assert merge['behavioral_sessions']==9000,merge
          assert merge['flow_join_coverage']>=.999 and merge['forced_challenge_groups']>0 and merge['leakage_ok'] is True,merge
          assert leak['ok'] is True,leak
          report={'release_id':'${{ env.RELEASE_ID }}','behavioral_sessions':merge['behavioral_sessions'],'production_flows':merge['production_flows'],'split_counts':merge['split_counts'],'models':models['models'],'learning_curve':curve}
          (r/'FINAL_V1_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n');print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'remote-admin-master-promoted-${{ github.run_id }}', path: /tmp/master-promoted, retention-days: 90, compression-level: 0}
      - name: Persist promoted Gold/models to HF
        working-directory: remote-admin-anomaly-lab
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: python scripts/upload_analysis_hf.py --repo "$HF_DATASET_REPO" --folder /tmp/master-promoted --remote-path "releases/$RELEASE_ID/production-promoted" --status /tmp/master-promoted/hf-status.json
