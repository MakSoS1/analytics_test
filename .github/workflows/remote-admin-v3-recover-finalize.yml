name: Remote Admin Anomaly V3 Recover Finalize

on:
  push:
    branches: [remote-admin-anomaly-lab-v3]
    paths:
      - '.github/workflows/remote-admin-v3-recover-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: remote-admin-v3-recover-finalize
  cancel-in-progress: true

env:
  DATA_RUN_ID: '31885392045'
  DATA_ARTIFACT_ID: '9247494536'
  DATA_ARTIFACT_NAME: remote-admin-v3-release-31885392045
  SHARD: V3-1k
  HF_REPO: Maksim123321/remote-admin-anomaly-v1
  REMOTE_PREFIX: v3/final/run-31885392045

jobs:
  recover-verify-persist-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: '1'
      PYTHONPATH: ${{ github.workspace }}/remote-admin-anomaly-lab/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install and verify final V3 code
        working-directory: remote-admin-anomaly-lab
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          pytest -q tests
      - name: Download authoritative V3 1k artifact from data run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DATA_ARTIFACT_NAME }}
          path: /tmp/v3-final
          run-id: ${{ env.DATA_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify authoritative artifact against immutable manifest before persistence
        working-directory: remote-admin-anomaly-lab
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/v3-final'); q=root/'quality'/os.environ['SHARD']
          manifest=json.loads((q/'V3_RELEASE_MANIFEST.json').read_text())
          decision=json.loads((q/'V3_RESEARCH_DECISION.json').read_text())
          assert decision['dataset_release_status']=='READY',decision
          assert decision['scale_decision']=='STOP_AT_1K',decision
          failures=[]; verified=0; total=0
          for row in manifest['files']:
              p=root/row['path']
              if not p.is_file(): failures.append((row['path'],'missing')); continue
              size=p.stat().st_size
              if size != int(row['bytes']): failures.append((row['path'],'size',size,row['bytes'])); continue
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              if h.hexdigest()!=row['sha256']: failures.append((row['path'],'sha256')); continue
              verified+=1; total+=size
          assert not failures,failures[:20]
          assert verified==int(manifest['file_count']),(verified,manifest['file_count'])
          evidence={'status':'PASS','data_run_id':int(os.environ['DATA_RUN_ID']),'artifact_id':int(os.environ['DATA_ARTIFACT_ID']),'verified_files':verified,'verified_bytes':total}
          (q/'GITHUB_ARTIFACT_VERIFICATION.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY
      - name: Upload authoritative V3 release to final HF prefix with lossless transport
        working-directory: remote-admin-anomaly-lab
        run: |
          set -euo pipefail
          Q=/tmp/v3-final/quality/$SHARD
          python scripts/upload_hf.py \
            --release /tmp/v3-final --shard "$SHARD" \
            --repo "$HF_REPO" --remote-path "$REMOTE_PREFIX" \
            --status "$Q/hf_upload_status.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=Path('/tmp/v3-final/quality')/os.environ['SHARD']
          d=json.loads((q/'hf_upload_status.json').read_text())
          assert d['status']=='uploaded',d
          transformed={x['original_path'] for x in d.get('transport_transforms',[])}
          assert 'external/windows/v3-extra.txt' in transformed,transformed
          print(json.dumps({'status':d['status'],'transforms':sorted(transformed)},sort_keys=True))
          PY
      - name: Full-download verify every expected HF V3 object
        working-directory: remote-admin-anomaly-lab
        run: |
          set -euo pipefail
          Q=/tmp/v3-final/quality/$SHARD
          python scripts/verify_v3_hf.py \
            --manifest "$Q/V3_RELEASE_MANIFEST.json" \
            --upload-status "$Q/hf_upload_status.json" \
            --repo "$HF_REPO" --shard "$SHARD" \
            --remote-prefix "$REMOTE_PREFIX" \
            --out "$Q/HF_REMOTE_VERIFICATION.json"
      - name: Create cleanup-authorizing verified V3 status
        working-directory: remote-admin-anomaly-lab
        run: |
          set -euo pipefail
          Q=/tmp/v3-final/quality/$SHARD
          python scripts/finalize_v3_persistence.py \
            --decision "$Q/V3_RESEARCH_DECISION.json" \
            --hf-verification "$Q/HF_REMOTE_VERIFICATION.json" \
            --github-final-run-id "$DATA_RUN_ID" \
            --github-final-artifact-id "$DATA_ARTIFACT_ID" \
            --github-artifact-verified \
            --out "$Q/V3_VERIFIED_STATUS.json"
      - name: Delete superseded Remote Admin V1 V2 and intermediate V3 storage
        working-directory: remote-admin-anomaly-lab
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/cleanup_v3_superseded.py \
            --status /tmp/v3-final/quality/$SHARD/V3_VERIFIED_STATUS.json \
            --hf-repo "$HF_REPO" \
            --out /tmp/v3-final/quality/$SHARD/V3_CLEANUP_REPORT.json
      - name: Verify cleanup retained only final HF V3 payload and authoritative GitHub data run
        working-directory: remote-admin-anomaly-lab
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          from huggingface_hub import HfApi
          q=Path('/tmp/v3-final/quality')/os.environ['SHARD']
          cleanup=json.loads((q/'V3_CLEANUP_REPORT.json').read_text())
          assert cleanup['status']=='PASS',cleanup
          assert not cleanup['hf_residual_superseded_paths'],cleanup
          token=os.environ['HF_TOKEN']; api=HfApi(token=token)
          files=api.list_repo_files(os.environ['HF_REPO'],repo_type='dataset',token=token)
          prefix=os.environ['REMOTE_PREFIX']
          payload=[p for p in files if p not in {'README.md','.gitattributes'}]
          assert payload and all(p==prefix or p.startswith(prefix+'/') for p in payload),payload[:20]
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{os.environ['DATA_ARTIFACT_ID']}",headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=60) as r: artifact=json.loads(r.read())
          assert artifact['expired'] is False and int(artifact['id'])==int(os.environ['DATA_ARTIFACT_ID']),artifact
          report={'status':'PASS','hf_payload_files':len(payload),'retained_prefix':prefix,'retained_artifact_id':int(artifact['id']),'retained_artifact_name':artifact['name']}
          (q/'V3_POST_CLEANUP_VERIFICATION.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Commit final V3 status and retire superseded Remote Admin workflows
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          q=Path('/tmp/v3-final/quality')/os.environ['SHARD']
          decision=json.loads((q/'V3_RESEARCH_DECISION.json').read_text())
          verified=json.loads((q/'V3_VERIFIED_STATUS.json').read_text())
          cleanup=json.loads((q/'V3_CLEANUP_REPORT.json').read_text())
          post=json.loads((q/'V3_POST_CLEANUP_VERIFICATION.json').read_text())
          models=json.loads(Path('/tmp/v3-final/gold/V3-1k/models/V3_MODEL_SUMMARY.json').read_text())
          bronze=json.loads((q/'v3_bronze_quality.json').read_text())
          mapping=json.loads((q/'production_flow_gold.json').read_text())
          lines=[
            '# Remote Admin Anomaly V3 — Final Status','',
            f"- Dataset release: **{decision['dataset_release_status']}**",
            f"- Research status: **{decision['research_status']}**",
            f"- Scale decision: **{decision['scale_decision']}**",
            f"- HF verified: **{verified['hf_verified']}** at `{verified['hf_final_path']}`",
            f"- GitHub artifact verified: **{verified['github_artifact_verified']}**, artifact ID `{verified['github_final_artifact_id']}`",
            f"- Cleanup policy B: **{cleanup['status']}**; deleted Remote Admin runs `{cleanup['github_deleted_run_count']}`, deleted HF objects `{cleanup['hf_deleted_file_count']}`.",
            f"- Post-cleanup verification: **{post['status']}**; retained HF payload files `{post['hf_payload_files']}`.",'',
            '## V3 corpus','',
            '- 1000 real-wire sessions; 500 benign / 500 suspicious; 250 each SSH/SMB/RDP/VNC.',
            '- 200 exact current-session counterfactual pairs with time matching; discriminative signal is prior history/graph/sequence.',
            f"- Session PCAP coverage: `{bronze['session_pcap_coverage']}`; campaign PCAP coverage: `{bronze['campaign_pcap_coverage']}`.",
            '- Bronze is browsable: per-session PCAPs, per-campaign PCAPs, full raw chunks and pcap_index; no persisted merged giant PCAP.',
            f"- Session mapping coverage: `{mapping['session_mapping_coverage']}`; per protocol: `{mapping.get('session_mapping_coverage_by_protocol')}`.",'',
            '## Model evidence','',
            f"```json\n{json.dumps(models,indent=2,sort_keys=True)}\n```",'',
            'Dataset technical completeness is independent of scientific promotion. This V3 remains STOP_AT_1K unless the committed research decision says ALLOW_4K.',''
          ]
          Path('remote-admin-anomaly-lab/docs/IMPLEMENTATION_STATUS_V3.md').write_text('\n'.join(lines),encoding='utf-8')
          Path('remote-admin-anomaly-lab/FINAL_STATUS_V3.json').write_text(json.dumps({'decision':decision,'verified':verified,'cleanup':cleanup,'post_cleanup':post},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          find .github/workflows -maxdepth 1 -type f -name 'remote-admin*.yml' ! -name 'remote-admin-v3-*.yml' -print -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/docs/IMPLEMENTATION_STATUS_V3.md remote-admin-anomaly-lab/FINAL_STATUS_V3.json .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'docs(remote-admin): finalize verified V3 and remove superseded lineage'
            git push origin HEAD:remote-admin-anomaly-lab-v3
          fi
      - name: Retain compact V3 verification cleanup evidence
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v3-recovery-verified-${{ github.run_id }}
          path: |
            /tmp/v3-final/quality/V3-1k/V3_VERIFIED_STATUS.json
            /tmp/v3-final/quality/V3-1k/V3_CLEANUP_REPORT.json
            /tmp/v3-final/quality/V3-1k/V3_POST_CLEANUP_VERIFICATION.json
            /tmp/v3-final/quality/V3-1k/GITHUB_ARTIFACT_VERIFICATION.json
            /tmp/v3-final/quality/V3-1k/HF_REMOTE_VERIFICATION.json
            /tmp/v3-final/quality/V3-1k/V3_RESEARCH_DECISION.json
            /tmp/v3-final/quality/V3-1k/hf_upload_status.json
          retention-days: 90
          compression-level: 0
