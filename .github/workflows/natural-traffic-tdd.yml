name: natural-traffic-tdd

on:
  push:
    branches:
      - natural-traffic-generator-v2-2026-10-06
    paths:
      - 'cover-channel-lab/research-transfer/code/natural_traffic/**'
      - 'cover-channel-lab/research-transfer/code/tests/test_natural_*.py'
      - 'cover-channel-lab/research-transfer/datasets/office-cover-20261006/**'
      - '.github/workflows/natural-traffic-tdd.yml'
      - '.github/workflows/natural-office-traffic-v2.yml'
  pull_request:
    paths:
      - 'cover-channel-lab/research-transfer/code/natural_traffic/**'
      - 'cover-channel-lab/research-transfer/code/tests/test_natural_*.py'

permissions:
  contents: read

jobs:
  natural-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy scikit-learn pyyaml
      - name: Inspect reference grouping candidates
        working-directory: cover-channel-lab/research-transfer
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('datasets/office-cover-20261006')
          df=pd.read_parquet(root/'pipeline_office_full.parquet')
          dictionary=json.loads((root/'pipeline_column_dictionary.json').read_text())
          features={r['column'] for r in dictionary if r.get('kind')=='feature'}
          meta=[c for c in df.columns if c not in features]
          print('OFFICE_META_COLUMNS', meta)
          for col in meta:
              try:
                  print('GROUP_CANDIDATE', col, 'nunique=', int(df[col].nunique(dropna=True)), 'nulls=', int(df[col].isna().sum()))
              except Exception as exc:
                  print('GROUP_CANDIDATE', col, 'ERROR', type(exc).__name__)
          PY
      - name: Run natural traffic tests
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
        run: python -m unittest discover -s code/tests -p 'test_natural_*.py' -v
      - name: Run research-transfer regression suite
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
        run: python -m unittest discover -s code/tests -v

  real-capture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump
          python -m pip install --disable-pip-version-check pandas pyarrow numpy scikit-learn pyyaml
      - name: Probe runner packet capture independently
        run: |
          set -euxo pipefail
          id
          tcpdump --version
          sudo timeout 10 tcpdump -i lo -n -c 2 -w /tmp/runner-probe.pcap icmp &
          cap_pid=$!
          sleep 1
          ping -c 2 127.0.0.1
          wait $cap_pid
          test -s /tmp/runner-probe.pcap
          stat -c '%s bytes' /tmp/runner-probe.pcap
          sudo tcpdump -nn -r /tmp/runner-probe.pcap -c 2
      - name: Run real Linux TLS capture smoke
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_TRAFFIC_REAL_CAPTURE: '1'
        run: python -m unittest discover -s code/tests -p 'test_natural_capture.py' -v
      - name: Run full production extractor smoke
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_TRAFFIC_FULL_PIPELINE: '1'
        run: python -m unittest discover -s code/tests -p 'test_natural_composition.py' -v