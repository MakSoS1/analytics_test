name: natural-traffic-tdd

on:
  push:
    branches:
      - natural-traffic-generator-v2-2026-10-06
    paths:
      - 'cover-channel-lab/research-transfer/code/natural_traffic/**'
      - 'cover-channel-lab/research-transfer/code/cover_runtime/Dockerfile'
      - 'cover-channel-lab/research-transfer/code/cover_runtime/*.py'
      - 'cover-channel-lab/research-transfer/code/tests/test_natural_*.py'
      - 'cover-channel-lab/research-transfer/datasets/office-cover-20261006/**'
      - '.github/workflows/natural-traffic-tdd.yml'
      - '.github/workflows/natural-office-traffic-v2.yml'
  pull_request:
    paths:
      - 'cover-channel-lab/research-transfer/code/natural_traffic/**'
      - 'cover-channel-lab/research-transfer/code/cover_runtime/Dockerfile'
      - 'cover-channel-lab/research-transfer/code/cover_runtime/*.py'
      - 'cover-channel-lab/research-transfer/code/tests/test_natural_*.py'

permissions:
  contents: read

jobs:
  natural-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy scikit-learn pyyaml
      - name: Inspect reference grouping candidates
        working-directory: cover-channel-lab/research-transfer
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path('datasets/office-cover-20261006')
          df=pd.read_parquet(root/'pipeline_office_full.parquet')
          dictionary=json.loads((root/'pipeline_column_dictionary.json').read_text())
          features={r['column'] for r in dictionary if r.get('kind')=='feature'}
          meta=[c for c in df.columns if c not in features]
          print('OFFICE_META_COLUMNS', meta)
          for col in meta:
              try:
                  print('GROUP_CANDIDATE', col, 'nunique=', int(df[col].nunique(dropna=True)), 'nulls=', int(df[col].isna().sum()))
              except Exception as exc:
                  print('GROUP_CANDIDATE', col, 'ERROR', type(exc).__name__)
          PY
      - name: Run natural traffic tests
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
        run: python -m unittest discover -s code/tests -p 'test_natural_*.py' -v
      - name: Run research-transfer regression suite
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
        run: python -m unittest discover -s code/tests -v

  real-capture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump
          python -m pip install --disable-pip-version-check pandas pyarrow numpy scikit-learn pyyaml
      - name: Probe runner packet capture independently
        run: |
          set -euxo pipefail
          id
          tcpdump --version
          sudo timeout 10 tcpdump -i lo -n -c 2 -w /tmp/runner-probe.pcap icmp &
          cap_pid=$!
          sleep 1
          ping -c 2 127.0.0.1
          wait $cap_pid
          test -s /tmp/runner-probe.pcap
          stat -c '%s bytes' /tmp/runner-probe.pcap
          sudo tcpdump -nn -r /tmp/runner-probe.pcap -c 2
      - name: Run real Linux TLS capture smoke
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_TRAFFIC_REAL_CAPTURE: '1'
        run: python -m unittest discover -s code/tests -p 'test_natural_capture.py' -v
      - name: Run full production extractor smoke
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_TRAFFIC_FULL_PIPELINE: '1'
        run: python -m unittest discover -s code/tests -p 'test_natural_composition.py' -v

  generated-benign-e2e:
    needs: [natural-unit, real-capture-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy scipy scikit-learn pyyaml
      - name: Guard runner disk before image build
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
        run: python -c "from pathlib import Path; from natural_traffic.capture import ensure_resource_budget; ensure_resource_budget(Path('.'), min_free_gib=15)"
      - name: Prepare frozen office-path control registry
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_REGISTRY: ${{ runner.temp }}/natural-controls-registry.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from demo.prepare_research_registry import prepare
          from office_injection.cover_registry import digest

          base = json.loads(Path('code/cover_runtime/registry.json').read_text())
          prepared = prepare(base, seed=20261004, path_profile='office_path_v1')
          target_entries = {
              'M-CLOUD-API',
              'M-HTTPS-BEACON',
              'M-HTTPS-FRAG',
              'M-HTTPS-FRONT',
              'M-HTTPS-LOWENT',
              'M-RMM-SHAPE',
          }
          selected = []
          for entry in prepared['entries']:
              if entry.get('entry_id') not in target_entries:
                  continue
              item = dict(entry)
              item['profiles'] = [dict(profile) for profile in entry.get('profiles', [])]
              if not item['profiles']:
                  raise SystemExit(f"selected entry has no profiles: {entry.get('entry_id')}")
              selected.append(item)
          found = {entry['entry_id'] for entry in selected}
          if found != target_entries:
              raise SystemExit(f'missing Stage-M entries: {sorted(target_entries-found)}')
          profile_count = sum(len(entry['profiles']) for entry in selected)
          if profile_count != 64:
              raise SystemExit(f'expected exactly 64 Stage-M stack profiles, got {profile_count}')
          body = {k:v for k,v in prepared.items() if k != 'sha256'}
          body['entries'] = selected
          body['research_policy'] += '; e2e benign-only Stage-M real-stack matrix; office-train temporal profile'
          body['sha256'] = digest(body)
          out = Path(os.environ['NATURAL_REGISTRY'])
          out.write_text(json.dumps(body, indent=2) + '\n')
          print('SELECTED_STAGE_M_ENTRIES', sorted(found))
          print('SELECTED_STACK_PROFILES', profile_count)
          print('REGISTRY_SHA256', body['sha256'])
          print('PATH_PROFILE', body['path_profile'])
          PY
      - name: Build pinned Cover runtime image
        working-directory: cover-channel-lab/research-transfer
        run: docker build -t cover-natural-e2e:ci code/cover_runtime
      - name: Generate 64 benign control captures only
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_REGISTRY: ${{ runner.temp }}/natural-controls-registry.json
          NATURAL_RUN: ${{ runner.temp }}/natural-control-run
        run: |
          python code/cover_runtime/run_batch.py \
            --image cover-natural-e2e:ci \
            --registry "$NATURAL_REGISTRY" \
            --all \
            --arm control \
            --timing native \
            --seed 20261004 \
            --out "$NATURAL_RUN"
      - name: Extract controls, freeze benign profile, confirm against held-out office web sessions
        working-directory: cover-channel-lab/research-transfer
        env:
          PYTHONPATH: code
          NATURAL_RUN: ${{ runner.temp }}/natural-control-run
          NATURAL_OUT: ${{ runner.temp }}/natural-e2e
        run: |
          python - <<'PY'
          import json, os
          from dataclasses import replace
          from pathlib import Path
          import pandas as pd

          from natural_traffic.calibration import (
              assign_temporal_starts,
              calibrate_profiles,
              derive_temporal_environment,
              validate_group_disjointness,
          )
          from natural_traffic.composition import extract_pipeline_capture, retime_capture_bundle
          from natural_traffic.contracts import FrozenProfileManifest
          from natural_traffic.corpus import discover_cover_captures, aggregate_extracted_tables
          from natural_traffic.evaluation import confirm_naturalness
          from natural_traffic.profiles import ProfileRegistry
          from natural_traffic.reference import load_reference
          from natural_traffic.reporting import write_report

          run = Path(os.environ['NATURAL_RUN'])
          out = Path(os.environ['NATURAL_OUT'])
          out.mkdir(parents=True, exist_ok=True)
          captures = discover_cover_captures(
              run, high_level_profile_id=None, role='control'
          )
          if len(captures) != 64:
              raise SystemExit(f'expected exactly 64 captured controls, got {len(captures)}')

          ref = load_reference(Path('datasets/office-cover-20261006'), verify_hashes=True)
          office = ref.pipeline_office.copy()
          tcp = pd.to_numeric(office['ip_protocol'], errors='coerce').eq(6)
          dport = pd.to_numeric(office['destination_port'], errors='coerce')
          office = office[tcp & dport.isin([443, 8443, 9443])].copy()
          if office['host_key'].nunique() < 60:
              office = ref.pipeline_office[
                  pd.to_numeric(ref.pipeline_office['ip_protocol'], errors='coerce').eq(6)
              ].copy()
          hosts = sorted(office['host_key'].astype(str).unique())
          if len(hosts) < 60:
              raise SystemExit(f'office comparison requires >=60 host groups, got {len(hosts)}')
          train_hosts = set(hosts[::2])
          confirm_hosts = set(hosts[1::2])
          validate_group_disjointness(train_hosts, confirm_hosts)
          office_train = office[office['host_key'].astype(str).isin(train_hosts)].copy()
          office_confirm = office[office['host_key'].astype(str).isin(confirm_hosts)].copy()

          temporal_environment = derive_temporal_environment(office_train)
          temporal_manifest = FrozenProfileManifest(
              seed=20261004,
              profile_weights=(('linux-protocol-native', 1.0),),
              reference_id='temporal:office-train-only',
              environment_json=json.dumps(
                  temporal_environment, sort_keys=True, separators=(',', ':')
              ),
          )
          (out / 'temporal_environment_manifest.json').write_text(
              temporal_manifest.to_json() + '\n'
          )
          starts = assign_temporal_starts(
              temporal_manifest, [capture.ancestor_id for capture in captures]
          )

          extracted = []
          for i, capture in enumerate(captures):
              retimed_bundle = retime_capture_bundle(
                  capture.bundle,
                  target_start_epoch=starts[capture.ancestor_id],
                  out_dir=out / 'retimed' / f'{i:03d}',
              )
              retimed_capture = replace(capture, bundle=retimed_bundle)
              result = extract_pipeline_capture(
                  retimed_bundle,
                  out / 'extract' / f'{i:03d}',
                  run_id=f'natural-control-{i:03d}',
                  min_free_gib=15,
              )
              extracted.append((retimed_capture, result.parquet_path))

          controls_path = out / 'controls.parquet'
          corpus_report = aggregate_extracted_tables(
              extracted, controls_path, benign_only=True
          )
          controls = pd.read_parquet(controls_path)
          group_meta = (
              controls[['capture_group', 'profile_id']]
              .drop_duplicates()
              .sort_values(['profile_id', 'capture_group'])
          )
          if len(group_meta) != 64:
              raise SystemExit(f'expected 64 independent control groups, got {len(group_meta)}')
          train_control_groups, confirm_control_groups = set(), set()
          for _, frame in group_meta.groupby('profile_id', sort=True):
              ids = frame['capture_group'].astype(str).tolist()
              train_control_groups.update(ids[::2])
              confirm_control_groups.update(ids[1::2])
          validate_group_disjointness(train_control_groups, confirm_control_groups)
          if len(train_control_groups) < 30 or len(confirm_control_groups) < 30:
              raise SystemExit(
                  f'stratified split too small: train={len(train_control_groups)} '
                  f'confirm={len(confirm_control_groups)}'
              )
          control_train = controls[
              controls['capture_group'].astype(str).isin(train_control_groups)
          ].copy()
          control_confirm = controls[
              controls['capture_group'].astype(str).isin(confirm_control_groups)
          ].copy()

          groups_train = {
              'office': office_train['host_key'].astype(str).tolist(),
              'controls': control_train['capture_group'].astype(str).tolist(),
          }
          registry = ProfileRegistry.default()
          manifest = calibrate_profiles(
              office_train,
              control_train,
              groups_train,
              registry,
              20261004,
              feature_columns=ref.feature_columns,
          )
          if manifest.environment != temporal_environment:
              raise SystemExit('calibration manifest temporal environment drifted')
          manifest_path = out / 'frozen_profile_manifest.json'
          manifest_path.write_text(manifest.to_json() + '\n')
          (out / 'frozen_profile_manifest.sha256').write_text(manifest.sha256 + '\n')

          dictionary = json.loads(
              Path('datasets/office-cover-20261006/pipeline_column_dictionary.json').read_text()
          )
          families = {}
          for row in dictionary:
              if row.get('kind') != 'feature':
                  continue
              families.setdefault(row.get('group_key') or 'other', []).append(row['column'])

          confirm_groups = {
              'office': office_confirm['host_key'].astype(str).tolist(),
              'controls': control_confirm['capture_group'].astype(str).tolist(),
          }
          report = confirm_naturalness(
              manifest,
              office_confirm,
              control_confirm,
              confirm_groups,
              expected_manifest_sha=manifest.sha256,
              feature_columns=ref.feature_columns,
              feature_families=families,
              bootstrap_reps=200,
              random_state=20261004,
          )
          write_report(
              out / 'naturalness.json',
              kind='naturalness',
              status=report.status,
              support=report.support,
              payload={
                  **report.as_dict(),
                  'corpus': corpus_report,
                  'calibration_control_groups': len(train_control_groups),
                  'confirmation_control_groups': len(confirm_control_groups),
                  'calibration_office_groups': len(train_hosts),
                  'confirmation_office_groups': len(confirm_hosts),
                  'office_scope': 'tcp web comparison slice; destination 443/8443/9443 when >=60 host groups, otherwise all TCP',
                  'profile_weights': list(manifest.profile_weights),
                  'temporal_environment_manifest_sha256': temporal_manifest.sha256,
                  'production_ready': False,
              },
          )
          print('NATURALNESS_STATUS', report.status)
          print('MAX_AUC', report.max_auc)
          print('PROFILE_WEIGHTS', json.dumps(list(manifest.profile_weights)))
          print('SUPPORT', json.dumps(report.support, sort_keys=True))
          print('FAILED_FAMILIES', json.dumps(report.distribution.get('failed_families', [])))
          PY
      - name: Summarize generated naturalness report
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/natural-e2e/naturalness.json" ]]; then
            cat "$RUNNER_TEMP/natural-e2e/naturalness.json"
          fi
      - name: Upload generated benign E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-generated-benign-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/natural-e2e
            ${{ runner.temp }}/natural-control-run/results.json
            ${{ runner.temp }}/natural-control-run/runtime_manifest.json
            ${{ runner.temp }}/natural-control-run/jobs.json
            ${{ runner.temp }}/natural-control-run/runtime.log
            ${{ runner.temp }}/natural-control-run/*/job.json
            ${{ runner.temp }}/natural-control-run/*/result.json
            ${{ runner.temp }}/natural-control-run/*/client.log
            ${{ runner.temp }}/natural-control-run/*/tcpdump.log
            ${{ runner.temp }}/natural-control-run/*/path_environment.json
            ${{ runner.temp }}/natural-control-run/*/dispatch.json
            ${{ runner.temp }}/natural-control-run/*/capture.pcap
          retention-days: 30