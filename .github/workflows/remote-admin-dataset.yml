name: Remote Admin Anomaly V1 Full Dataset

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.dataset-trigger'
  workflow_dispatch:
    inputs:
      run_full:
        description: 'After Stage A passes, generate the full 200k B-H corpus'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  HF_DATASET_REPO: Maksim123321/remote-admin-anomaly-v1
  PYTHONUNBUFFERED: '1'

concurrency:
  group: remote-admin-dataset-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.mode.outputs.run_full }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - id: release
        run: echo "release_id=gh-${{ github.run_id }}-a${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - id: mode
        run: |
          full=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_full }}" == "true" ]]; then
            full=true
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            full=true
          fi
          echo "run_full=$full" >> "$GITHUB_OUTPUT"
      - name: Install contract runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Re-run all code and leakage contracts before generation
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: pytest -q tests
      - name: Dataset plan
        run: |
          echo "release=${{ steps.release.outputs.release_id }}"
          echo "full=${{ steps.mode.outputs.run_full }}"
          echo "target_sessions=201000 stage_A=1000 stage_B=60000 stage_C=40000 stage_D=30000 stage_E=30000 stage_F=20000 stage_G=10000 stage_H=10000"

  stage-a:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install runtime and real protocol stack
        working-directory: remote-admin-anomaly-lab
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_runner.sh
      - name: Generate Stage A Bronze/Silver/Gold
        working-directory: remote-admin-anomaly-lab
        run: |
          python_bin="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$python_bin" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard.sh A A-parser-00 1000 2026081401 /tmp/adminlab-dataset
          ADMINLAB_PYTHON="$python_bin" bash scripts/build_silver.sh /tmp/adminlab-dataset/release A-parser-00
          python scripts/build_gold.py --release /tmp/adminlab-dataset/release --shard A-parser-00 --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Stage A quality gate
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/adminlab-dataset/release/quality/A-parser-00')
          mapping=json.loads((root/'mapping_health.json').read_text())
          leakage=json.loads((root/'leakage_checks.json').read_text())
          parser=json.loads((root/'parser_health.json').read_text())
          assert mapping['session_mapping_coverage'] >= 0.95, mapping
          assert leakage['ok'] is True, leakage
          assert parser['suricata_flow_events'] > 0 and parser['zeek_conn_lines'] > 0, parser
          print(json.dumps({'mapping':mapping,'leakage':leakage,'parser':parser},sort_keys=True))
          PY
      - name: Retain Stage A before HF
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-${{ needs.preflight.outputs.release_id }}-A-parser-00
          path: /tmp/adminlab-dataset/release
          retention-days: 90
          compression-level: 0
      - name: Persist Stage A to private HF when configured
        working-directory: remote-admin-anomaly-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_hf.py --repo "$HF_DATASET_REPO" --release /tmp/adminlab-dataset/release --shard A-parser-00 \
            --remote-path "releases/${{ needs.preflight.outputs.release_id }}" --status /tmp/hf-stage-a.json
          cat /tmp/hf-stage-a.json

  corpus:
    needs: [preflight, stage-a]
    if: needs.preflight.outputs.run_full == 'true' && needs.stage-a.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {stage: B, shard: B-benign-00, count: 6000, seed: 2026081500}
          - {stage: B, shard: B-benign-01, count: 6000, seed: 2026081501}
          - {stage: B, shard: B-benign-02, count: 6000, seed: 2026081502}
          - {stage: B, shard: B-benign-03, count: 6000, seed: 2026081503}
          - {stage: B, shard: B-benign-04, count: 6000, seed: 2026081504}
          - {stage: B, shard: B-benign-05, count: 6000, seed: 2026081505}
          - {stage: B, shard: B-benign-06, count: 6000, seed: 2026081506}
          - {stage: B, shard: B-benign-07, count: 6000, seed: 2026081507}
          - {stage: B, shard: B-benign-08, count: 6000, seed: 2026081508}
          - {stage: B, shard: B-benign-09, count: 6000, seed: 2026081509}
          - {stage: C, shard: C-hard-benign-00, count: 5000, seed: 2026081600}
          - {stage: C, shard: C-hard-benign-01, count: 5000, seed: 2026081601}
          - {stage: C, shard: C-hard-benign-02, count: 5000, seed: 2026081602}
          - {stage: C, shard: C-hard-benign-03, count: 5000, seed: 2026081603}
          - {stage: C, shard: C-hard-benign-04, count: 5000, seed: 2026081604}
          - {stage: C, shard: C-hard-benign-05, count: 5000, seed: 2026081605}
          - {stage: C, shard: C-hard-benign-06, count: 5000, seed: 2026081606}
          - {stage: C, shard: C-hard-benign-07, count: 5000, seed: 2026081607}
          - {stage: D, shard: D-suspicious-00, count: 5000, seed: 2026081700}
          - {stage: D, shard: D-suspicious-01, count: 5000, seed: 2026081701}
          - {stage: D, shard: D-suspicious-02, count: 5000, seed: 2026081702}
          - {stage: D, shard: D-suspicious-03, count: 5000, seed: 2026081703}
          - {stage: D, shard: D-suspicious-04, count: 5000, seed: 2026081704}
          - {stage: D, shard: D-suspicious-05, count: 5000, seed: 2026081705}
          - {stage: E, shard: E-hard-suspicious-00, count: 5000, seed: 2026081800}
          - {stage: E, shard: E-hard-suspicious-01, count: 5000, seed: 2026081801}
          - {stage: E, shard: E-hard-suspicious-02, count: 5000, seed: 2026081802}
          - {stage: E, shard: E-hard-suspicious-03, count: 5000, seed: 2026081803}
          - {stage: E, shard: E-hard-suspicious-04, count: 5000, seed: 2026081804}
          - {stage: E, shard: E-hard-suspicious-05, count: 5000, seed: 2026081805}
          - {stage: F, shard: F-counterfactual-00, count: 5000, seed: 2026081900}
          - {stage: F, shard: F-counterfactual-01, count: 5000, seed: 2026081901}
          - {stage: F, shard: F-counterfactual-02, count: 5000, seed: 2026081902}
          - {stage: F, shard: F-counterfactual-03, count: 5000, seed: 2026081903}
          - {stage: G, shard: G-sequence-00, count: 5000, seed: 2026082000}
          - {stage: G, shard: G-sequence-01, count: 5000, seed: 2026082001}
          - {stage: H, shard: H-challenge-00, count: 5000, seed: 2026082100}
          - {stage: H, shard: H-challenge-01, count: 5000, seed: 2026082101}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install runtime and real protocol stack
        working-directory: remote-admin-anomaly-lab
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_runner.sh
      - name: Generate shard Bronze/Silver/Gold
        working-directory: remote-admin-anomaly-lab
        run: |
          python_bin="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$python_bin" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard.sh "${{ matrix.stage }}" "${{ matrix.shard }}" "${{ matrix.count }}" "${{ matrix.seed }}" /tmp/adminlab-dataset
          ADMINLAB_PYTHON="$python_bin" bash scripts/build_silver.sh /tmp/adminlab-dataset/release "${{ matrix.shard }}"
          python scripts/build_gold.py --release /tmp/adminlab-dataset/release --shard "${{ matrix.shard }}" --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Retain complete shard before HF
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-${{ needs.preflight.outputs.release_id }}-${{ matrix.shard }}
          path: /tmp/adminlab-dataset/release
          retention-days: 90
          compression-level: 0
      - name: Persist complete shard to private HF when configured
        working-directory: remote-admin-anomaly-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_hf.py --repo "$HF_DATASET_REPO" --release /tmp/adminlab-dataset/release --shard "${{ matrix.shard }}" \
            --remote-path "releases/${{ needs.preflight.outputs.release_id }}" --status /tmp/hf-status.json
          cat /tmp/hf-status.json
