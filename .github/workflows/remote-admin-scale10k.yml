name: Remote Admin Anomaly V1 Scale 10K

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.scale10k-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: remote-admin-scale10k
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      allow_scale: ${{ steps.gate.outputs.allow_scale }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
      - id: gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('remote-admin-anomaly-lab/SCALE4K_AUTOGENERATED.json')
          if not p.exists():
              allow=False; reason='4k_result_missing'
          else:
              d=json.loads(p.read_text()); allow=bool(d.get('allow_next_scale')) and int(d.get('next_stage_sessions',0))==10000; reason='allowed_by_4k' if allow else 'blocked_by_4k'
          Path('/tmp/gate.json').write_text(json.dumps({'allow_scale':allow,'reason':reason},indent=2)+'\n')
          with open('/tmp/out','w') as f: f.write(f"allow_scale={'true' if allow else 'false'}\n")
          print(Path('/tmp/gate.json').read_text())
          PY
          cat /tmp/out >> "$GITHUB_OUTPUT"

  blocked:
    needs: prepare
    if: ${{ needs.prepare.outputs.allow_scale != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo '10k stage skipped because 4k global evaluation did not authorize further scale.'

  fanout:
    needs: prepare
    if: ${{ needs.prepare.outputs.allow_scale == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {shard: H-scale10k-01, seed: 2026082901}
          - {shard: H-scale10k-02, seed: 2026082902}
          - {shard: H-scale10k-03, seed: 2026082903}
          - {shard: H-scale10k-04, seed: 2026082904}
          - {shard: H-scale10k-05, seed: 2026082905}
          - {shard: H-scale10k-06, seed: 2026082906}
          - {shard: H-scale10k-07, seed: 2026082907}
          - {shard: H-scale10k-08, seed: 2026082908}
          - {shard: H-scale10k-09, seed: 2026082909}
          - {shard: H-scale10k-10, seed: 2026082910}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install real-wire runtime
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests/test_train_serve_parity.py tests/test_implementation_holdout.py tests/test_scenario_quality.py tests/test_persona_holdout.py
      - name: Capture 1000-session shard
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard_extended_v4.sh H "${{ matrix.shard }}" 1000 "${{ matrix.seed }}" "/tmp/adminlab-scale/${{ matrix.shard }}"
      - name: Validate immutable Bronze
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from adminlab.quality import validate_bronze_tree
          shard='${{ matrix.shard }}'; root=Path('/tmp/adminlab-scale')/shard/'release'; b=root/'bronze'/shard
          r=validate_bronze_tree(b,verify_checksums=True); assert r['ok'],r
          s=pd.read_parquet(b/'manifests/sessions.parquet'); assert len(s)==1000 and s['status'].eq('success').all(); assert set(s['protocol'])=={'ssh','smb','rdp','vnc'}; assert len(set(s['implementation_id']))>=6
          PY
      - name: Build raw Silver and rule baseline
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          release="/tmp/adminlab-scale/${{ matrix.shard }}/release"
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh "$release" "${{ matrix.shard }}"
          bash scripts/build_rule_baseline.sh "$release" "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: remote-admin-scale10k-${{ matrix.shard }}-${{ github.run_id }}
          path: /tmp/adminlab-scale/${{ matrix.shard }}/release
          retention-days: 90
          compression-level: 0

  aggregate:
    needs: [prepare, fanout]
    if: ${{ needs.prepare.outputs.allow_scale == 'true' && needs.fanout.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-admin-scale10k-*-${{ github.run_id }}
          path: /tmp/scale-download
          merge-multiple: false
      - name: Rebuild one global production Gold from all ten raw Silver shards
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          mkdir -p /tmp/scale10k-global/models /tmp/scale10k-global/evaluation
          python scripts/build_global_suricata_gold.py --input-root /tmp/scale-download --out /tmp/scale10k-global/gold --feature-contract configs/feature_contract.yaml --split-seed 20260829
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/scale10k-global/gold/GLOBAL_GOLD.json').read_text())
          assert d['behavioral_sessions']==10000 and d['shard_count']==10,d
          assert d['global_splits_recomputed'] and not d['local_shard_splits_reused'] and d['leakage_ok'],d
          for r in ('unseen_persona','unseen_host_pair','temporal_future','unseen_client_implementation'): assert d['challenge_reason_counts'].get(r,0)>0,(r,d)
          PY
      - name: Train and evaluate 10k global model
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          python scripts/train_models.py --model-matrix /tmp/scale10k-global/gold/production_model_matrix.parquet --out /tmp/scale10k-global/models --seed 20260829
          python scripts/evaluate_model_slices.py --model /tmp/scale10k-global/models/M1-lightgbm.joblib --metrics /tmp/scale10k-global/models/M1-lightgbm.metrics.json --model-matrix /tmp/scale10k-global/gold/production_model_matrix.parquet --labels /tmp/scale10k-global/gold/production_flow_labels.parquet --out /tmp/scale10k-global/evaluation/M1-slices.json --bootstrap 1000 --seed 20260829
          python scripts/evaluate_hard_benign.py --model /tmp/scale10k-global/models/M1-lightgbm.joblib --metrics /tmp/scale10k-global/models/M1-lightgbm.metrics.json --model-matrix /tmp/scale10k-global/gold/production_model_matrix.parquet --labels /tmp/scale10k-global/gold/production_flow_labels.parquet --out /tmp/scale10k-global/evaluation/M1-hard-benign.json
          python scripts/learning_curve_grouped.py --model-matrix /tmp/scale10k-global/gold/production_model_matrix.parquet --labels /tmp/scale10k-global/gold/production_flow_labels.parquet --out /tmp/scale10k-global/evaluation/M1-learning-curve.json --seed 20260829
          python scripts/validate_reference.py --generated /tmp/scale10k-global/gold/production_flow_features.parquet --out /tmp/scale10k-global/evaluation/reference-validation.json --bootstrap 1000 --seed 20260829
      - name: 10k scale decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('/tmp/scale10k-global'); m=json.loads((r/'models/M1-lightgbm.metrics.json').read_text()); s=json.loads((r/'models/shortcut-audit.json').read_text()); e=json.loads((r/'evaluation/M1-slices.json').read_text()); h=json.loads((r/'evaluation/M1-hard-benign.json').read_text()); c=json.loads((r/'evaluation/M1-learning-curve.json').read_text()); g=json.loads((r/'gold/GLOBAL_GOLD.json').read_text()); v=m['splits']['validation']; reasons=e.get('splits',{}).get('challenge',{}).get('per_challenge_reason',{}); flags=[]
          if s['shortcut_risk']: flags.append('shortcut_risk')
          if float(v.get('pr_auc',0))>=0.98: flags.append('suspiciously_high_validation_pr_auc')
          if h.get('status')=='ok' and float(h.get('fpr',0))>0.10: flags.append('hard_benign_fpr_above_10pct')
          for name in ('unseen_persona','unseen_host_pair','temporal_future','unseen_client_implementation'):
              if name not in reasons: flags.append('missing_challenge_slice:'+name)
          delta=c.get('last_delta_pr_auc'); allow=bool(not flags and delta is not None and float(delta)>0.005 and c.get('scale_recommendation')=='expand')
          d={'automatic_gate_pass':not s['shortcut_risk'] and float(v['fpr'])<=0.0100001,'review_flags':flags,'allow_next_scale':allow,'next_stage_sessions':20000 if allow else 0,'validation_pr_auc':v.get('pr_auc'),'validation_roc_auc':v.get('roc_auc'),'validation_fpr':v.get('fpr'),'hard_benign':h,'learning_curve':c,'shortcut_audit':s,'challenge_reasons':sorted(reasons),'global_gold':g,'policy':'20k is allowed only after a clean 10k gate; 40k/201k remain prohibited until another learning-curve decision'}
          (r/'SCALE10K_DECISION.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remote-admin-scale10k-global-${{ github.run_id }}
          path: /tmp/scale10k-global
          retention-days: 90
          compression-level: 0
      - name: Optional HF persistence after artifact retention
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        working-directory: remote-admin-anomaly-lab
        run: |
          if [[ -z "${HF_TOKEN:-}" ]]; then echo 'HF_TOKEN absent; retained Actions artifacts are the recovery source.'; exit 0; fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          a=HfApi(token=os.environ['HF_TOKEN']); repo='Maksim123321/remote-admin-anomaly-v1'; a.create_repo(repo_id=repo,repo_type='dataset',private=True,exist_ok=True)
          a.upload_folder(repo_id=repo,repo_type='dataset',folder_path='/tmp/scale-download',path_in_repo=f"releases/{os.environ['RUN_ID']}/shards",commit_message='remote-admin 10k Bronze Silver')
          a.upload_folder(repo_id=repo,repo_type='dataset',folder_path='/tmp/scale10k-global',path_in_repo=f"releases/{os.environ['RUN_ID']}/global",commit_message='remote-admin 10k global Gold models')
          PY
      - name: Commit exact 10k result
        run: |
          cp /tmp/scale10k-global/SCALE10K_DECISION.json remote-admin-anomaly-lab/SCALE10K_AUTOGENERATED.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('remote-admin-anomaly-lab/SCALE10K_AUTOGENERATED.json').read_text()); c=d['learning_curve']; g=d['global_gold']
          Path('remote-admin-anomaly-lab/SCALE10K_AUTOGENERATED.md').write_text('\n'.join(['# Remote Admin Anomaly V1 — 10K Scale Result','',f'- Global sessions: **{g["behavioral_sessions"]}**',f'- Production flow rows: **{g["production_flow_rows"]}**',f'- Validation PR-AUC: **{d["validation_pr_auc"]}**',f'- Validation ROC-AUC: **{d["validation_roc_auc"]}**',f'- Validation FPR: **{d["validation_fpr"]}**',f'- Shortcut risk: **{d["shortcut_audit"]["shortcut_risk"]}**',f'- Review flags: `{d["review_flags"]}`',f'- Last grouped ΔPR-AUC: **{c.get("last_delta_pr_auc")}**',f'- Allow next scale: **{d["allow_next_scale"]}**',f'- Next stage sessions: **{d["next_stage_sessions"]}**','']))
          PY
          git fetch origin remote-admin-anomaly-lab-v1
          git reset --soft origin/remote-admin-anomaly-lab-v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/SCALE10K_AUTOGENERATED.*
          if ! git diff --cached --quiet; then git commit -m 'docs(remote-admin): persist 10k global scale evaluation'; git push origin HEAD:remote-admin-anomaly-lab-v1; fi
