name: caplag-clean-sensitive-run

on:
  push:
    branches: [ctf-caplag-submit83-20260808]
    paths: ['.github/workflows/caplag-clean-sensitive-run.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete diagnostic run containing account identifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/MakSoS1/analytics_test/actions/runs/31256897176')
          echo "delete_http=$code"
          test "$code" = 204
