name: Remote Admin Anomaly V1 V4 Final

# Evidence rerun: Suricata flow.start + eligible direct-flow mapping.
on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-v4-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-v4-final
  cancel-in-progress: true

jobs:
  v4-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install final runtime and run complete contract suite
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests
      - name: Capture balanced final V4 wire corpus
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env \
            ADMINLAB_PYTHON="$py" \
            ADMINLAB_OUTPUT_UID="$(id -u)" \
            ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard_extended_v4.sh \
              A A-v4-final 40 2026082701 /tmp/adminlab-v4-final
      - name: Build Silver deterministic rules and production Gold
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh /tmp/adminlab-v4-final/release A-v4-final
          bash scripts/build_rule_baseline.sh /tmp/adminlab-v4-final/release A-v4-final
          python scripts/build_flow_gold_v2.py \
            --release /tmp/adminlab-v4-final/release \
            --shard A-v4-final \
            --feature-contract configs/feature_contract.yaml \
            --split-seed 20260827
      - name: Final V4 quality gate
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from adminlab.quality import validate_bronze_tree, validate_silver_tree

          root=Path('/tmp/adminlab-v4-final/release'); shard='A-v4-final'; q=root/'quality'/shard
          bronze=validate_bronze_tree(root/'bronze'/shard,verify_checksums=True); assert bronze['ok'],bronze
          silver=validate_silver_tree(root/'silver'/shard); assert silver['ok'],silver
          cap=json.loads((q/'capture_health.json').read_text()); parser=json.loads((q/'parser_health.json').read_text()); prod=json.loads((q/'production_flow_gold.json').read_text()); leak=json.loads((q/'production_leakage.json').read_text()); rules=json.loads((q/'rule_health.json').read_text())
          sessions=pd.read_parquet(root/'bronze'/shard/'manifests/sessions.parquet')
          assert len(sessions)==40 and sessions['status'].eq('success').all()
          assert sessions['protocol'].value_counts().to_dict()=={'ssh':10,'smb':10,'rdp':10,'vnc':10},sessions['protocol'].value_counts().to_dict()
          assert set(sessions['client_stack'].astype(str))=={'openssh','smbclient','freerdp','rfb-python'}
          expected_impl={'ssh:openssh->openssh-server','smb:smbclient->samba','rdp:freerdp->xrdp','vnc:rfb-python->tigervnc'}
          assert set(sessions['implementation_id'].astype(str))==expected_impl,sessions['implementation_id'].value_counts().to_dict()
          assert sessions['server_stack'].fillna('').astype(str).str.len().gt(0).all()
          assert cap['dcerpc_train_included'] is False and cap['partial_winrm_included'] is False
          assert parser['suricata_flow_events']>0 and parser['zeek_conn_lines']>0,parser
          assert rules['ok'] is True and rules['ground_truth_source'] is False,rules
          assert prod['production_source']=='suricata_eve_flow',prod
          assert prod['train_serve_feature_code']=='adminlab.online_features.EveFeatureState',prod
          assert prod['session_mapping_coverage']>=.95 and prod['flow_mapping_coverage']>=.90 and prod['uid_alignment_coverage']==1.0,prod
          assert all(float(v)>=.90 for v in prod['session_mapping_coverage_by_protocol'].values()),prod
          assert prod['zeek_features_in_primary_model'] is False,prod
          assert leak['ok'] is True,leak
          matrix=pd.read_parquet(root/'gold'/shard/'production_model_matrix.parquet')
          forbidden={'scenario_id','campaign_id','session_id','pair_id','persona_id','task_id','client_stack','server_stack','implementation_id','src_ip','dst_ip','netem_profile','wire_attempts','wire_transfer_bytes'}
          assert not (set(matrix.columns)&forbidden),sorted(set(matrix.columns)&forbidden)
          report={'bronze':bronze,'silver':silver,'capture':cap,'parser':parser,'rules':rules,'production':prod,'leakage':leak,'model_rows':len(matrix),'model_columns':list(matrix.columns),'implementation_counts':sessions['implementation_id'].value_counts().to_dict()}
          Path('/tmp/adminlab-v4-final/V4_FINAL_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-admin-v4-final-${{ github.run_id }}
          path: /tmp/adminlab-v4-final
          retention-days: 90
          compression-level: 0
