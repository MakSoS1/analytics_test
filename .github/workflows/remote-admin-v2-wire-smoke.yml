name: Remote Admin Anomaly V2 Hierarchical Wire Smoke

on:
  workflow_dispatch:
  push:
    branches: [remote-admin-anomaly-lab-v2]
    paths:
      - 'remote-admin-anomaly-lab/src/adminlab/v2_scenarios.py'
      - 'remote-admin-anomaly-lab/src/adminlab/session_gold.py'
      - 'remote-admin-anomaly-lab/src/adminlab/campaign_gold.py'
      - 'remote-admin-anomaly-lab/src/adminlab/splits.py'
      - 'remote-admin-anomaly-lab/src/adminlab/v2_modeling.py'
      - 'remote-admin-anomaly-lab/scripts/run_scenarios_extended_v2.py'
      - 'remote-admin-anomaly-lab/scripts/capture_shard_extended_v4.sh'
      - 'remote-admin-anomaly-lab/scripts/build_hierarchical_gold.py'
      - 'remote-admin-anomaly-lab/configs/**'
      - '.github/workflows/remote-admin-v2-wire-smoke.yml'

permissions:
  contents: read

concurrency:
  group: remote-admin-v2-wire-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-wire-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROOT_OUT: /tmp/remote-admin-v2-smoke
      RELEASE_ROOT: /tmp/remote-admin-v2-smoke/release
      SHARD: V2-smoke-80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install V2 wire and parser runtime
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests
      - name: Capture 80 V2 semantic sessions on real wire
        working-directory: remote-admin-anomaly-lab
        env:
          ADMINLAB_V2_SEMANTIC: '1'
          ADMINLAB_V2_COUNTERFACTUAL_FRACTION: '0.30'
        run: |
          py="$(command -v python)"
          sudo -E env \
            ADMINLAB_PYTHON="$py" \
            ADMINLAB_OUTPUT_UID="$(id -u)" \
            ADMINLAB_OUTPUT_GID="$(id -g)" \
            ADMINLAB_V2_SEMANTIC=1 \
            ADMINLAB_V2_COUNTERFACTUAL_FRACTION=0.30 \
            bash scripts/capture_shard_extended_v4.sh \
              H "$SHARD" 80 2026081402 "$ROOT_OUT"
      - name: Verify Bronze and captured V2 semantic contract
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from adminlab.quality import validate_bronze_tree
          from adminlab.manifest import SessionRecord
          from adminlab.v2_scenarios import summarize_v2_plan

          release=Path('/tmp/remote-admin-v2-smoke/release')
          shard='V2-smoke-80'
          bronze=release/'bronze'/shard
          report=validate_bronze_tree(bronze,verify_checksums=True)
          assert report['ok'],report
          rows=[]
          for raw in (bronze/'manifests/sessions.jsonl').read_text().splitlines():
              if raw.strip(): rows.append(SessionRecord.from_dict(json.loads(raw)))
          assert len(rows)==80,len(rows)
          assert all(r.status=='success' for r in rows)
          semantic=summarize_v2_plan(rows)
          assert semantic['counterfactual_pair_fraction']>=0.30,semantic
          assert not semantic['invalid_counterfactual_pairs'],semantic
          counts=pd.Series([r.protocol for r in rows]).value_counts().to_dict()
          assert counts=={'ssh':20,'smb':20,'rdp':20,'vnc':20},counts
          labels=pd.Series([int(r.label_binary) for r in rows]).value_counts().to_dict()
          assert abs(labels.get(0,0)-labels.get(1,0))<=2,labels
          evidence={'bronze':report,'semantic':semantic,'protocol_counts':counts,'label_counts':labels}
          (release/'quality'/shard/'v2_smoke_semantic.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY
      - name: Build Silver and production flow Gold
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh "$RELEASE_ROOT" "$SHARD"
          bash scripts/build_rule_baseline.sh "$RELEASE_ROOT" "$SHARD"
          python scripts/build_gold.py \
            --release "$RELEASE_ROOT" --shard "$SHARD" \
            --feature-contract configs/feature_contract.yaml --split-seed 20260814
          python scripts/build_flow_gold_v2.py \
            --release "$RELEASE_ROOT" --shard "$SHARD" \
            --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Build causal session and campaign Gold
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_hierarchical_gold.py \
            --release "$RELEASE_ROOT" --shard "$SHARD" \
            --contract configs/v2_feature_contract.yaml
      - name: Verify mapping splits causality and hierarchical schemas
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('/tmp/remote-admin-v2-smoke/release')
          shard='V2-smoke-80'
          gold=root/'gold'/shard
          quality=root/'quality'/shard
          prod=json.loads((quality/'production_flow_gold.json').read_text())
          leak=json.loads((quality/'production_leakage.json').read_text())
          hierarchical=json.loads((gold/'hierarchical_gold_quality.json').read_text())
          assert prod['session_mapping_coverage']>=0.95,prod
          assert prod['flow_mapping_coverage']>=0.90,prod
          assert leak['ok'] is True,leak
          sf=pd.read_parquet(gold/'session_features.parquet')
          sl=pd.read_parquet(gold/'session_labels.parquet')
          cf=pd.read_parquet(gold/'campaign_features.parquet')
          cl=pd.read_parquet(gold/'campaign_labels.parquet')
          sm=pd.read_parquet(gold/'session_model_matrix.parquet')
          cm=pd.read_parquet(gold/'campaign_model_matrix.parquet')
          assert len(sf)==len(sl)>0
          assert len(cf)==len(cl)>0
          assert len(sm)==len(sf)
          assert len(cm)==len(cf)
          assert set(sl['environment_id'])=={'linux_v2'}
          assert set(cl['environment_id'])=={'linux_v2'}
          for forbidden in ('campaign_type','behavior_profile','intent_profile','environment_id','src_host_id','dst_host_id','implementation_id'):
              assert forbidden not in sm.columns,forbidden
              assert forbidden not in cm.columns,forbidden
          pair_splits=(sl[sl.get('pair_id','').astype(str)!=''].groupby('pair_id')['split'].nunique() if 'pair_id' in sl.columns else pd.Series(dtype=int))
          assert pair_splits.empty or int(pair_splits.max())==1,pair_splits[pair_splits>1].to_dict()
          evidence={
            'production_flow_gold':prod,
            'leakage':leak,
            'hierarchical':hierarchical,
            'session_rows':len(sf),
            'campaign_rows':len(cf),
            'session_split_counts':sl['split'].value_counts().to_dict(),
            'campaign_split_counts':cl['split'].value_counts().to_dict(),
          }
          (quality/'V2_WIRE_SMOKE.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True,default=str))
          PY
      - name: Retain complete V2 smoke release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v2-wire-smoke-${{ github.run_id }}
          path: /tmp/remote-admin-v2-smoke
          retention-days: 90
          compression-level: 0
