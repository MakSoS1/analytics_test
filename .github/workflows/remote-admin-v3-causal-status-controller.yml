name: Remote Admin Anomaly V3 Causal Status Controller

# Manual helper only. Code pushes are verified directly by the final workflow.
# Keeping this off push avoids races where a status-only commit advances the
# branch between dispatch and run resolution.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-current-head:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch V3 final for current branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run remote-admin-v3-causal-final.yml --repo "$REPO" --ref remote-admin-anomaly-lab-v3
