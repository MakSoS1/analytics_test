name: Remote Admin Anomaly V1 Fidelity Probe

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.fidelity-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-fidelity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lab and extended protocol tooling
        working-directory: remote-admin-anomaly-lab
        run: bash scripts/install_runner.sh
      - name: Build isolated topology and core Samba endpoint
        working-directory: remote-admin-anomaly-lab
        run: |
          sudo -E bash scripts/setup_topology.sh up configs/topology.yaml
          sudo -E bash scripts/start_services.sh start /tmp/adminlab-fidelity-services
      - name: Start full bridge capture
        run: |
          sudo bash -c 'mkdir -p /tmp/adminlab-fidelity && setsid tcpdump -i br-adminlab -U -s 0 -n -w /tmp/adminlab-fidelity/fidelity.pcap >/tmp/adminlab-fidelity/tcpdump.log 2>&1 & echo $! >/tmp/adminlab-fidelity/tcpdump.pgid'
          sleep 1
          pgid="$(sudo cat /tmp/adminlab-fidelity/tcpdump.pgid)"
          sudo kill -0 -- "-$pgid"
      - name: Probe RDP VNC DCE-RPC and partial WinRM fidelity
        working-directory: remote-admin-anomaly-lab
        run: sudo -E python scripts/probe_fidelity.py --out /tmp/adminlab-fidelity/results
      - name: Stop capture and validate evidence
        if: always()
        run: |
          pgid="$(sudo cat /tmp/adminlab-fidelity/tcpdump.pgid 2>/dev/null || true)"
          if [[ "$pgid" =~ ^[0-9]+$ ]]; then
            sudo kill -INT -- "-$pgid" 2>/dev/null || true
            sleep 1
            sudo kill -TERM -- "-$pgid" 2>/dev/null || true
          fi
          sudo chown -R "$(id -u):$(id -g)" /tmp/adminlab-fidelity
          test -s /tmp/adminlab-fidelity/fidelity.pcap
          tcpdump -nn -r /tmp/adminlab-fidelity/fidelity.pcap -c 1 >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/adminlab-fidelity/results/fidelity-results.json')
          d=json.loads(p.read_text())
          assert d['external_targets_allowed'] is False
          assert d['payload_execution_allowed'] is False
          assert d['c2_frameworks_enabled'] is False
          rows={r['protocol']:r for r in d['results']}
          assert set(rows)=={'rdp','vnc','dcerpc','winrm'}
          assert rows['winrm']['status'] in {'partial','unavailable'}
          assert rows['dcerpc']['semantic_fidelity']=='partial_dcom'
          assert rows['rdp']['semantic_fidelity']=='partial_windows'
          assert rows['vnc']['wire_fidelity']=='real_rfb'
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
      - name: Stop endpoint services and topology
        if: always()
        working-directory: remote-admin-anomaly-lab
        run: |
          sudo -E bash scripts/start_services.sh stop /tmp/adminlab-fidelity-services || true
          sudo -E bash scripts/setup_topology.sh down configs/topology.yaml || true
      - name: Retain fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-fidelity-${{ github.run_id }}
          path: /tmp/adminlab-fidelity
          retention-days: 90
          compression-level: 0
