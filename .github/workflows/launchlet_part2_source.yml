name: launchlet-part2-source-probe

on:
  push:
    branches: [agent/launchlet-part2-source-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployRef-derived virtual hosts and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import socket,ssl,requests,pathlib,json,urllib.parse
          basehost='task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'
          ref='preview-8b11c'; out=pathlib.Path('package/out')
          hosts=[
            f'{ref}.{basehost}',
            f'{ref}.caplag-task.ru',
            f'{ref}-task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru',
            f'task-launchlet-web-medium-18cf6be4db586bb6-{ref}.caplag-task.ru',
            f'{ref}.task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru',
            f'launchlet-demo-board.{basehost}',
            f'preview.{basehost}',
          ]
          res=[]
          for h in hosts:
            item={'host':h}
            try:item['dns']=sorted(set(x[4][0] for x in socket.getaddrinfo(h,443,type=socket.SOCK_STREAM)))
            except Exception as e:item['dns_error']=repr(e)
            if item.get('dns'):
              for scheme in ['https','http']:
                try:
                  r=requests.get(f'{scheme}://{h}/',timeout=10,allow_redirects=False,verify=True)
                  item[scheme]={'status':r.status_code,'headers':dict(r.headers),'body':r.text[:20000]}
                except Exception as e:item[scheme+'_error']=repr(e)
            res.append(item)
          # Also route to the known task IP/TLS endpoint while varying Host only.
          try: ips=sorted(set(x[4][0] for x in socket.getaddrinfo(basehost,443,type=socket.SOCK_STREAM)))
          except Exception: ips=[]
          ctx=ssl.create_default_context(); vhosts=[]
          for vh in [ref,f'{ref}.{basehost}',f'{ref}.caplag-task.ru',f'launchlet-demo-board.{basehost}',f'preview.{basehost}']:
            try:
              with socket.create_connection((basehost,443),timeout=10) as raw:
                with ctx.wrap_socket(raw,server_hostname=basehost) as ss:
                  ss.sendall((f'GET / HTTP/1.1\r\nHost: {vh}\r\nUser-Agent: Mozilla/5.0\r\nConnection: close\r\n\r\n').encode())
                  data=b''
                  while True:
                    c=ss.recv(65536)
                    if not c:break
                    data+=c
              head,_,body=data.partition(b'\r\n\r\n'); first=head.split(b'\r\n',1)[0].decode('latin1','replace')
              vhosts.append({'host_header':vh,'status_line':first,'headers':head.decode('latin1','replace'),'body':body.decode('utf-8','replace')[:20000]})
            except Exception as e:vhosts.append({'host_header':vh,'error':repr(e)})
          (out/'summary.json').write_text(json.dumps({'hosts':res,'known_ips':ips,'vhosts':vhosts},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-vhost-encrypted
          path: artifact/
          retention-days: 1
