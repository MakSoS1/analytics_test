name: Temporary current admissions checker

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query raw public forecasts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import requests
          ids=['1289499','967331','1795612','2052971','1760018','1444663','1263789','1252789','1826110','1421079','1609688']
          h={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Cache-Control':'no-cache'}
          def one(app):
              s=requests.Session(); s.headers.update(h)
              s.get('https://www.postupashkin.ru/priem-2026/moi-shansy?app='+app,timeout=20)
              r=s.get('https://www.postupashkin.ru/priem-2026/forecast?app='+app,timeout=70)
              try: data=r.json()
              except Exception: data={'raw':r.text[:10000]}
              return {'status':r.status_code,'url':r.url,'data':data,'cookies':s.cookies.get_dict()}
          out={}
          with ThreadPoolExecutor(max_workers=11) as ex:
              fs={ex.submit(one,i):i for i in ids}
              for f in as_completed(fs):
                  i=fs[f]
                  try: out[i]=f.result()
                  except Exception as e: out[i]={'error':repr(e)}
                  print(i, json.dumps(out[i],ensure_ascii=False)[:3000])
          Path('out/raw-forecasts.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbi-current-raw-forecasts
          path: out/
          retention-days: 1
