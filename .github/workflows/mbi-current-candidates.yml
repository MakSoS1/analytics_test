name: Temporary current admissions checker

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect public admissions endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out = Path('out')
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9'})
          base='https://www.postupashkin.ru/priem-2026/moi-shansy'
          r=s.get(base,timeout=30)
          print('PAGE',r.status_code,len(r.content),r.url)
          out.joinpath('page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser')
          assets=[]
          for tag in soup.find_all(['script','link']):
              u=tag.get('src') or tag.get('href')
              if u:
                  u=urljoin(r.url,u)
                  if 'postupashkin.ru' in u and u not in assets:
                      assets.append(u)
          print('ASSETS',len(assets))
          findings=[]
          pats=[r'/api/[^\"\'\s<]+',r'moi-shansy',r'entrant',r'applicant',r'abitur',r'candidate',r'code',r'fetch\(',r'axios',r'XMLHttpRequest']
          for i,u in enumerate(assets[:100]):
              try:
                  q=s.get(u,timeout=30)
                  txt=q.text
                  out.joinpath(f'asset_{i:03d}.txt').write_text(txt,encoding='utf-8',errors='ignore')
                  for pat in pats:
                      for m in re.finditer(pat,txt,re.I):
                          findings.append({'asset':u,'pattern':pat,'context':txt[max(0,m.start()-220):m.end()+420]})
              except Exception as e:
                  findings.append({'asset':u,'error':repr(e)})
          out.joinpath('findings.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(findings[:120],ensure_ascii=False,indent=2))

          ids=['1289499','967331','1795612','2052971','1760018','1444663','1263789','1252789','1826110','1421079','1609688']
          patterns=[
              base+'?code={}',base+'?applicant={}',base+'?entrant={}',base+'?number={}',base+'/{}',
              'https://www.postupashkin.ru/priem-2026/entrant/{}',
              'https://www.postupashkin.ru/api/priem-2026/chances/{}',
              'https://www.postupashkin.ru/api/admission-2026/chances/{}',
          ]
          probes=[]
          for ident in ids:
              for p in patterns:
                  u=p.format(ident)
                  try:
                      q=s.get(u,timeout=20,allow_redirects=True)
                      probes.append({'id':ident,'url':u,'status':q.status_code,'final':q.url,'length':len(q.content),'contains':ident in q.text,'title':BeautifulSoup(q.text,'html.parser').title.get_text(' ',strip=True) if 'html' in q.headers.get('content-type','') and BeautifulSoup(q.text,'html.parser').title else ''})
                  except Exception as e:
                      probes.append({'id':ident,'url':u,'error':repr(e)})
          out.joinpath('probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PROBES')
          print(json.dumps(probes,ensure_ascii=False,indent=2))
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbi-current-inspection
          path: out/
          retention-days: 1
