name: Temporary current admissions checker

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect public admissions endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          out = Path('out')
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9'}
          def get(u, timeout=12):
              return requests.get(u,headers=headers,timeout=timeout,allow_redirects=True)

          base='https://www.postupashkin.ru/priem-2026/moi-shansy'
          r=get(base,20)
          print('PAGE',r.status_code,len(r.content),r.url)
          out.joinpath('page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'html.parser')
          print('FORMS')
          for form in soup.find_all('form'):
              print({'action':form.get('action'),'method':form.get('method'),'html':str(form)[:3000]})
          assets=[]
          for tag in soup.find_all(['script','link']):
              u=tag.get('src') or tag.get('href')
              if u:
                  u=urljoin(r.url,u)
                  if 'postupashkin.ru' in u and u not in assets:
                      assets.append(u)
          print('ASSETS',len(assets),assets)
          findings=[]
          pats=[r'/api/[^\"\'\s<]+',r'moi-shansy',r'entrant',r'applicant',r'abitur',r'candidate',r'code',r'fetch\(',r'axios',r'XMLHttpRequest',r'action=',r'csrf',r'payment']
          def fetch_asset(item):
              i,u=item
              q=get(u,15)
              return i,u,q.status_code,q.text
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(fetch_asset,x) for x in enumerate(assets[:100])]
              for fut in as_completed(futs):
                  try:
                      i,u,status,txt=fut.result()
                      out.joinpath(f'asset_{i:03d}.txt').write_text(txt,encoding='utf-8',errors='ignore')
                      for pat in pats:
                          for m in re.finditer(pat,txt,re.I):
                              findings.append({'asset':u,'status':status,'pattern':pat,'context':txt[max(0,m.start()-260):m.end()+520]})
                  except Exception as e:
                      findings.append({'error':repr(e)})
          out.joinpath('findings.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINDINGS')
          print(json.dumps(findings[:300],ensure_ascii=False,indent=2))

          ids=['1289499','967331','1795612','2052971','1760018','1444663','1263789','1252789','1826110','1421079','1609688']
          patterns=[base+'?code={}',base+'?applicant={}',base+'?entrant={}',base+'?number={}']
          jobs=[(ident,p.format(ident)) for ident in ids for p in patterns]
          def probe(x):
              ident,u=x
              q=get(u,10)
              return {'id':ident,'url':u,'status':q.status_code,'final':q.url,'length':len(q.content),'contains':ident in q.text,'sample':q.text[:300]}
          probes=[]
          with ThreadPoolExecutor(max_workers=20) as ex:
              futs=[ex.submit(probe,x) for x in jobs]
              for fut in as_completed(futs):
                  try: probes.append(fut.result())
                  except Exception as e: probes.append({'error':repr(e)})
          out.joinpath('probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PROBES')
          print(json.dumps(probes,ensure_ascii=False,indent=2))
          PY
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbi-current-inspection
          path: out/
          retention-days: 1
