name: Remote Admin Anomaly V2 LANL Reference

on:
  workflow_dispatch:
  push:
    branches: [remote-admin-anomaly-lab-v2]
    paths:
      - 'remote-admin-anomaly-lab/src/adminlab/lanl_reference.py'
      - 'remote-admin-anomaly-lab/scripts/build_lanl_reference.py'
      - 'remote-admin-anomaly-lab/configs/v2_research.yaml'
      - '.github/workflows/remote-admin-v2-reference.yml'

permissions:
  contents: read

concurrency:
  group: remote-admin-v2-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanl-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install reference parser runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Stream bounded LANL 2017 independent reference through documented public mirror
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          mkdir -p /tmp/remote-admin-v2-reference/lanl-2017
          python scripts/build_lanl_reference.py \
            --config configs/v2_research.yaml \
            --out /tmp/remote-admin-v2-reference/lanl-2017 \
            --netflow-rows 5000 \
            --wls-rows 5000 \
            --max-download-mb 384
      - name: Verify external-only reference contract
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/remote-admin-v2-reference/lanl-2017')
          q=json.loads((root/'reference_quality.json').read_text())
          m=json.loads((root/'source_manifest.json').read_text())
          assert q['status']=='PASS',q
          assert q['external_only'] is True,q
          assert q['threshold_tuning_allowed'] is False,q
          assert m['origin']=='Los Alamos National Laboratory',m
          assert m['transport']=='rocketgraph_xgt_mirror',m
          assert m['used_for_training'] is False,m
          net=pd.read_parquet(root/'remote_admin_flows.parquet')
          wls=pd.read_parquet(root/'network_logons.parquet')
          assert len(net)>0 and len(wls)>0
          assert 'label_binary' not in net.columns and 'label_binary' not in wls.columns
          print(json.dumps({'quality':q,'source':m},sort_keys=True))
          PY
      - name: Retain LANL external reference artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v2-lanl-reference-${{ github.run_id }}
          path: /tmp/remote-admin-v2-reference
          retention-days: 90
          compression-level: 0
