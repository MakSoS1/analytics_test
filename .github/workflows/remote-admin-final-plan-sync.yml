name: Remote Admin Anomaly V1 Final Plan Sync

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-final-plan-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
          fetch-depth: 0
      - name: Refresh branch and build evidence-derived status
        run: |
          git fetch origin remote-admin-anomaly-lab-v1
          git reset --hard origin/remote-admin-anomaly-lab-v1
          test -s remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('remote-admin-anomaly-lab')
          research=json.loads((root/'RESULTS_AUTOGENERATED.json').read_text())
          scale=json.loads((root/'SCALE_DECISION.json').read_text()) if (root/'SCALE_DECISION.json').exists() else None
          s4=json.loads((root/'SCALE4K_AUTOGENERATED.json').read_text()) if (root/'SCALE4K_AUTOGENERATED.json').exists() else None
          s10=json.loads((root/'SCALE10K_AUTOGENERATED.json').read_text()) if (root/'SCALE10K_AUTOGENERATED.json').exists() else None
          decision=research['research_decision']; gold=research['production_gold']; hf=research['hf_persistence']; ref=research['reference_validation']; run=research['research_run_id']; artifact=research['artifact_name']
          scale_lines=[]
          if scale:
              scale_lines.append(f"- Evidence scale decision after 1k: allow={scale.get('allow_scale')}, reason=`{scale.get('reason')}`, last ΔPR-AUC={scale.get('last_delta_pr_auc')}.")
          if s4:
              scale_lines.append(f"- 4k global stage: sessions={s4['global_gold']['behavioral_sessions']}, validation PR-AUC={s4.get('validation_pr_auc')}, flags=`{s4.get('review_flags')}`, allow next={s4.get('allow_next_scale')}.")
          if s10:
              scale_lines.append(f"- 10k global stage: sessions={s10['global_gold']['behavioral_sessions']}, validation PR-AUC={s10.get('validation_pr_auc')}, flags=`{s10.get('review_flags')}`, allow next={s10.get('allow_next_scale')}.")
          if not scale_lines:
              scale_lines=['- Scale stages: no evidence-derived promotion beyond the verified 1k gate.']
          block=f'''<!-- FINAL-EVIDENCE-START -->
## Final evidence-driven status

This block is generated from committed verifier outputs, not handwritten success claims.

### Validated

- [x] Namespace isolation and no external routing.
- [x] Real OpenSSH/Samba baseline and immutable Bronze PCAP rollback source.
- [x] Suricata + pinned Zeek Silver with raw compressed logs.
- [x] Balanced SSH/SMB/RDP/VNC final wire gate.
- [x] Actual alternate SSH clients OpenSSH/Paramiko and SMB clients smbclient/smbprotocol for implementation holdout.
- [x] Digital Twin: 58 personas, task/calendar model, 45-day simulated timeline, hard benign/hard suspicious overlap, strict counterfactual pairs.
- [x] Multi-session/multi-protocol campaign grouping retained only as label/evaluation metadata.
- [x] Production Gold built from Suricata `event_type=flow` using the exact online `EveFeatureState` implementation.
- [x] Split-isolated 1m/5m/15m/1h/24h/7d/30d state; raw IPs only state keys and never model features.
- [x] Grouped holdouts: campaign, counterfactual pair, source host, persona, host pair, temporal future and real client implementation.
- [x] M0 deterministic rules, M1 LightGBM, M2 benign-only Isolation Forest, low-FPR metrics, shortcut audit, hard-benign FPR, campaign recall/TTD, bootstrap CI and grouped learning curve.
- [x] Verified 1k Research Gate V2 run `{run}`, artifact `{artifact}`, automatic gate={decision.get('automatic_gate_pass')}, manual flags=`{decision.get('manual_review_flags')}`.
- [x] Full recovery tree is retained before any optional HF upload; PCAPs are never GitHub Release assets.

### Evidence-driven scale

{chr(10).join(scale_lines)}

### Implemented but externally blocked / intentionally out of scope

- [ ] Native Windows semantic-fidelity challenge: harness exists for Windows `ADMIN$`, PowerShell Remoting/WinRM and DCOM CIM plus pktmon capture, but requires the isolated self-hosted Windows client/target pair. Automated Linux/xrdp/Samba approximations are not relabeled as native Windows.
- [ ] Full interactive native Windows RDP desktop lifecycle: intentionally requires an interactive Windows challenge capture; headless runner evidence is insufficient.
- [ ] Statistical validation against external/reference traffic: implementation exists; current reference status=`{ref.get('status')}`, reference_available={ref.get('reference_available')}. No reference statistics are fabricated.
- [ ] Permanent HF persistence if current-run status is not uploaded: `{hf.get('status')}`. GitHub secrets cannot be read/copied from `Ansible_lab`; `analytics_test` must contain its own write-capable `HF_TOKEN`.
- [ ] T1021.007/.008 cloud corpus: intentionally separate from the network-PCAP T1021.001-.006 corpus because cloud audit/identity telemetry is a different source model.
- [ ] Sliver/RMM/C2: intentionally deferred to V2 unseen-tool challenge after native/generalization gates, so the malicious label cannot collapse to a framework fingerprint.

Exact research metrics: `RESULTS_AUTOGENERATED.md`. Scale evidence: `SCALE_DECISION.md`, `SCALE4K_AUTOGENERATED.md`, `SCALE10K_AUTOGENERATED.md` when those stages were scientifically authorized and completed.
<!-- FINAL-EVIDENCE-END -->'''
          plan=root/'PLAN.md'; text=plan.read_text(); pattern=r'<!-- FINAL-EVIDENCE-START -->.*?<!-- FINAL-EVIDENCE-END -->'
          if re.search(pattern,text,re.S): text=re.sub(pattern,block,text,flags=re.S)
          else: text=text.rstrip()+'\n\n'+block+'\n'
          plan.write_text(text)
          PY
      - name: Commit living plan update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs(remote-admin): finalize living plan from verified evidence'
            git push origin HEAD:remote-admin-anomaly-lab-v1
          fi
