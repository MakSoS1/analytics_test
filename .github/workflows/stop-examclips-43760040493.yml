name: Stop the superseded ExamClips runtime-mismatch audit
'on':
  push:
    branches:
      - qa/examclips-stop-43760040493-2147
    paths:
      - .github/workflows/stop-examclips-43760040493.yml
permissions:
  contents: read
  actions: write
jobs:
  stop-known-audit:
    if: github.repository == 'MakSoS1/analytics_test' && github.ref == 'refs/heads/qa/examclips-stop-43760040493-2147'
    concurrency:
      group: examclips-stand45-refs/heads/qa/examclips-stand45-2026-11-15-enl03
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and cancel only the superseded audit run
        env:
          AUDIT_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          target = "43760040493"
          expected_branch = "qa/examclips-stand45-2026-11-15"
          expected_head = "cc70bf5d26cd585ec0e32715472bf151e5fc6a37"
          expected_path = ".github/workflows/examclips-stand45.yml"
          assert os.environ["GITHUB_REPOSITORY"] == "MakSoS1/analytics_test"
          assert os.environ["GITHUB_RUN_ID"] != target
          url = "https://api.github.com/repos/MakSoS1/analytics_test/actions/runs/" + target
          headers = {
              "Authorization": "Bearer " + os.environ["AUDIT_ACTIONS_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get():
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return json.load(response)
          data = get()
          assert str(data["id"]) == target
          assert data["head_branch"] == expected_branch
          assert data["head_sha"] == expected_head
          assert data["path"] == expected_path
          if data["status"] == "completed":
              print(json.dumps({"targetRun": target, "status": data["status"], "conclusion": data.get("conclusion"), "action": "already_finished"}))
          else:
              request = urllib.request.Request(url + "/cancel", data=b"", headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(json.dumps({"targetRun": target, "action": "ordinary_cancellation_requested", "httpStatus": response.status}))
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise SystemExit("Cancellation request failed with HTTP " + str(error.code))
                  latest = get()
                  if latest["status"] != "completed":
                      raise SystemExit("Cancellation conflicted and target remains unfinished")
                  print(json.dumps({"targetRun": target, "action": "finished_before_cancellation", "status": latest["status"], "conclusion": latest.get("conclusion")}))
          PY
