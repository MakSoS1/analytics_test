name: ExamClips authorized live audit

'on':
  push:
    branches:
      - qa/examclips-audit-2026-11-11
    paths:
      - .github/workflows/examclips-live-audit.yml
      - tools/examclips-audit/**

permissions:
  contents: write

jobs:
  live-audit:
    if: github.repository == 'MakSoS1/analytics_test' && github.ref == 'refs/heads/qa/examclips-audit-2026-11-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Initialize runner-private audit paths
        run: |
          python3 - <<'PY'
          import os, pathlib
          base = pathlib.Path(os.environ["RUNNER_TEMP"])
          paths = {
              "AUDIT_ROOT": base / "examclips-live-audit",
              "AUDIT_OUT": base / "examclips-live-evidence",
              "AUDIT_ARTIFACT": base / "examclips-encrypted-artifact",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, path in paths.items():
                  env_file.write(f"{name}={path}\n")
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate encryption and required public key
        run: |
          node --test tools/examclips-audit/crypto.test.mjs
          openssl pkey -pubin -in tools/examclips-audit/evidence-recipient.pub.pem -noout
      - name: Install Playwright and prepare verified browser and media tools
        run: |
          npm --prefix tools/examclips-audit install --ignore-scripts --no-audit --no-fund
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, subprocess, tarfile, urllib.request
          binaries = {
              "Chrome": shutil.which("google-chrome") or shutil.which("google-chrome-stable"),
              "FFmpeg": shutil.which("ffmpeg"),
              "FFprobe": shutil.which("ffprobe"),
          }
          if not binaries["Chrome"]:
              raise SystemExit("The runner's preinstalled official Chrome is missing. No apt or browser installation was attempted.")
          executable_names = {"FFmpeg": "ffmpeg", "FFprobe": "ffprobe"}
          missing = [name for name in executable_names if not binaries[name]]
          if missing:
              media_dir = pathlib.Path(os.environ["AUDIT_ROOT"]) / "media-tools"
              media_dir.mkdir(parents=True, mode=0o700, exist_ok=True)
              url = "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-11-12-39/ffmpeg-n9.0.2-49-gc179411bbb-linux64-gpl-9.0.tar.xz"
              expected_bytes = 152720464
              expected_sha256 = "ca1107e3a14a9de4c4712f9405bb720a47dac41426cf2a1da09acb4811805758"
              archive = media_dir / "verified-ffmpeg.tar.xz"
              digest, received = hashlib.sha256(), 0
              request = urllib.request.Request(url, headers={"User-Agent": "ExamClips-authorized-audit"})
              with urllib.request.urlopen(request, timeout=60) as response, archive.open("wb") as destination:
                  while block := response.read(1024 * 1024):
                      received += len(block)
                      if received > expected_bytes:
                          raise SystemExit("FFmpeg archive exceeds the verified release size")
                      digest.update(block)
                      destination.write(block)
              if received != expected_bytes or digest.hexdigest() != expected_sha256:
                  raise SystemExit("Pinned FFmpeg release archive integrity mismatch")
              bin_dir = media_dir / "bin"
              bin_dir.mkdir(mode=0o700, exist_ok=True)
              found = set()
              with tarfile.open(archive, "r|xz") as bundle:
                  for member in bundle:
                      if not member.isfile():
                          continue
                      parts = pathlib.PurePosixPath(member.name).parts
                      for name in missing:
                          executable = executable_names[name]
                          if tuple(parts[-2:]) != ("bin", executable):
                              continue
                          if name in found or member.size > 1024 * 1024 * 1024:
                              raise SystemExit("Unexpected executable entry in verified FFmpeg archive")
                          target = bin_dir / executable
                          with bundle.extractfile(member) as source, target.open("wb") as destination:
                              shutil.copyfileobj(source, destination, 1024 * 1024)
                          target.chmod(0o755)
                          binaries[name] = str(target)
                          found.add(name)
                      if parts and parts[-1].lower() in {"license.txt", "readme.txt", "readme.md", "copying.gplv3"} and member.size <= 1024 * 1024:
                          with bundle.extractfile(member) as source, (media_dir / parts[-1]).open("wb") as destination:
                              shutil.copyfileobj(source, destination)
              archive.unlink()
              if found != set(missing):
                  raise SystemExit("Verified FFmpeg archive is missing a required executable")
              with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
                  path_file.write(str(bin_dir) + "\n")
              print("Provisioned missing media tools from FFmpeg-Builds autobuild-2026-11-11-12-39; archive SHA-256 and size verified before extraction.")
          for name, path in binaries.items():
              flag = "--version" if name == "Chrome" else "-version"
              result = subprocess.run([path, flag], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=15)
              print(name + ": " + result.stdout.splitlines()[0])
          PY
      - id: handoff
        name: Publish ephemeral key and wait for encrypted real-site login
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/examclips-audit/handoff.mjs
      - name: Run sequential full-source live browser audit
        env:
          AUDIT_CREDENTIALS_FILE: ${{ steps.handoff.outputs.credentials_path }}
        run: node tools/examclips-audit/run.mjs
      - name: Encrypt audit evidence with the recipient public key
        if: always()
        run: node tools/examclips-audit/package-evidence.mjs
      - name: Upload encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examclips-live-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/examclips-encrypted-artifact/
          if-no-files-found: warn
          retention-days: 3
      - name: Remove runner-private authentication and original media
        if: always()
        env:
          PRIVATE_DIR: ${{ steps.handoff.outputs.private_dir }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          base = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          paths = [os.environ.get("PRIVATE_DIR"), os.environ.get("AUDIT_ROOT"), os.environ.get("AUDIT_OUT")]
          for value in paths:
              if not value:
                  continue
              path = pathlib.Path(value).resolve()
              if path != base and base in path.parents:
                  shutil.rmtree(path, ignore_errors=True)
          PY
