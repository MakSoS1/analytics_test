name: Password CTF encrypted probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Query challenge service
        run: python3 ctf_password/probe.py

      - name: Encrypt transcript before upload
        shell: bash
        run: |
          set -euo pipefail
          key_hex="$(openssl rand -hex 32)"
          iv_hex="$(openssl rand -hex 16)"
          printf '%s' "$key_hex" | xxd -r -p > ctf_password/key.bin
          printf '%s' "$iv_hex" > ctf_password/iv.hex
          openssl enc -aes-256-cbc \
            -K "$key_hex" -iv "$iv_hex" \
            -in ctf_password/transcript.json \
            -out ctf_password/transcript.enc
          openssl pkeyutl -encrypt -pubin \
            -inkey ctf_password/public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -in ctf_password/key.bin \
            -out ctf_password/key.enc
          rm -f ctf_password/key.bin ctf_password/transcript.json

      - name: Upload encrypted transcript for one day
        uses: actions/upload-artifact@v4
        with:
          name: password-transcript-encrypted
          path: |
            ctf_password/key.enc
            ctf_password/iv.hex
            ctf_password/transcript.enc
          retention-days: 1
          if-no-files-found: error
