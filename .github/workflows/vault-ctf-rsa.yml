name: Vault CTF encrypted probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Query challenge service
        id: probe
        continue-on-error: true
        run: python3 .github/ctf/vault_probe.py

      - name: Encrypt result before artifact upload
        if: always()
        run: |
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey .github/ctf/vault_public.pem \
            -in vault-result.txt \
            -out vault-result.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f vault-result.txt

      - name: Upload encrypted result for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-result-encrypted
          path: vault-result.bin
          if-no-files-found: error
          retention-days: 1

      - name: Preserve probe status
        if: steps.probe.outcome != 'success'
        run: exit 1
