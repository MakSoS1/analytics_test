name: prism-scheduled-encrypted-probe

on:
  push:
    branches: [main]
    paths:
      - "prism_trigger/**"
  pull_request:
    branches: [main]
    paths:
      - "prism_trigger/**"
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Capture untrusted service banner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prism_scheduled_result
          mkdir -p prism_scheduled_result/raw
          python3 - <<'PY'
          import socket, ssl, time
          host='rwp2xfbj6nbit7iujybvt5ubdpu.cloud.d3c.tf'
          out=bytearray()
          raw=socket.create_connection((host,443), timeout=12)
          ctx=ssl.create_default_context()
          s=ctx.wrap_socket(raw, server_hostname=host)
          s.settimeout(1.0)
          deadline=time.time()+5
          while time.time()<deadline:
              try:
                  b=s.recv(65536)
                  if not b: break
                  out += b
              except socket.timeout:
                  pass
          try: s.sendall(b'\n')
          except Exception as e: out += ('\n[SEND_ERROR %r]\n' % (e,)).encode()
          deadline=time.time()+4
          while time.time()<deadline:
              try:
                  b=s.recv(65536)
                  if not b: break
                  out += b
              except socket.timeout:
                  pass
          try: s.close()
          except Exception: pass
          open('prism_scheduled_result/raw/banner.bin','wb').write(out)
          PY

      - name: Encrypt transcript before commit
        shell: bash
        run: |
          set -euo pipefail
          cat > prism_scheduled_result/public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtJ+YjwzF2hhM3IszVeea
          HhtKRvHBzrZ+tfji3qRnpGQOOj/wLEP0OoiLjwg9KtJZumqGvgj63/eym/1NoLWk
          3LShUkvoITy+rk5C7Vdb3IQVyZfJHFBiMgFLvEJC9/yuoPuArARsDRP34vPcmS6x
          gaEgWK/NPBsAqEviQnq6H3aMuhT2CvD9KSJflrTAJxiWN0x8sbW1URNRyNR8ZSSm
          6HuQ6U1McCsfIFUSqk5Dpa43c/Z7i5DncRSHyYRkPq4QV/Pk6HNnjoq7PEmrj/NW
          rmyMnB/0GVZbQe3aG9Ym0Ke6PjPQnsHmmVIUf+YQ0l4+l038s6WLlIhllTYip2qa
          zfChJS/bDVjNYvSHydX8q9KpCQsc+H8qan7Jd7JL+jJtwLKOO1UeQt7Glphjzd6Q
          oUrhWkUzl+yC0sU0O6odWAdF0wJ4bLu2uc+aZujQ4ZYVQ8x8Zo06y1yZMvu4PJWW
          uplZCEiJ+25c7q+r+sy2CamuPA7pifg1y7LQSt0PG72RAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C prism_scheduled_result/raw -czf prism_scheduled_result/transcript.tar.gz .
          openssl rand -out prism_scheduled_result/key.bin 32
          openssl rand -out prism_scheduled_result/iv.bin 16
          KEY_HEX="$(xxd -p -c 256 prism_scheduled_result/key.bin)"
          IV_HEX="$(xxd -p -c 256 prism_scheduled_result/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in prism_scheduled_result/transcript.tar.gz -out prism_scheduled_result/transcript.enc
          cat prism_scheduled_result/key.bin prism_scheduled_result/iv.bin > prism_scheduled_result/keyiv.bin
          openssl pkeyutl -encrypt -pubin -inkey prism_scheduled_result/public.pem -pkeyopt rsa_padding_mode:oaep -in prism_scheduled_result/keyiv.bin -out prism_scheduled_result/keyiv.enc
          base64 -w0 prism_scheduled_result/transcript.enc > prism_scheduled_result/transcript.enc.b64
          base64 -w0 prism_scheduled_result/keyiv.enc > prism_scheduled_result/keyiv.enc.b64
          rm -rf prism_scheduled_result/raw prism_scheduled_result/public.pem prism_scheduled_result/transcript.tar.gz prism_scheduled_result/transcript.enc prism_scheduled_result/key.bin prism_scheduled_result/iv.bin prism_scheduled_result/keyiv.bin prism_scheduled_result/keyiv.enc

      - name: Commit encrypted output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prism_scheduled_result/transcript.enc.b64 prism_scheduled_result/keyiv.enc.b64
          git commit -m "Add encrypted scheduled PRISM transcript" || exit 0
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
