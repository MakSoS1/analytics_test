name: cyberkomi-sysola-guard-protocol

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Execute documented guard sequence and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out handoff
          S='https://task-sysola-core-b476312471e78dea.caplag-task.ru'

          # Establish the documented recovery session.
          printf '{"code":"SYSOLA-CORE-READY"}' > handoff/access.json
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data-binary @handoff/access.json \
            -D out/access.headers -o out/access.zip "$S/access" || true

          python3 - <<'PY'
          import json,pathlib
          capsule={
            'core_nonce':'SYSOLA-59F2-AUGUST',
            'creator_role':'WITNESS_ONLY',
            'mode':'restore_safety_layer',
            'operator':'CITY_QUORUM',
            'patch_sha256':'ea26b5dbde79da68204384c9855f306a6e3bbe31e6ce395df8a89926a1943eff',
            'quorum_root':'c6a33169acf2b82652e7d1b9d3796dd3e6855c10fd5bbb69e8d86b891e8130b2',
            'recovery_signature':'a301ef8278606374554130d1df4a9e19d6c8755c6ef328eac205a778939fc82f'
          }
          receipts=[
            '00e2794224506ef11b8046eaab5c36b5b3b8cf757e2ac3a269a5e33b9e7e94af',
            '73941aaa88a54e7ae58c165c2565f9ebc9c8890f8bf95fc38a19b3e9d8ba243f',
            '673f5ef3322dc68200e3f44ee25077fe2d1fdab59452442fca4b10e4469c57c9',
            'd84bc5c4fbe53265d3c489fa2176c8136bdc3bc46801c09c44d1de8544a44c5b',
            'a3553f96b471e06cf67077825de0a830457f2235faef30148452f987f9548117',
            '6c7918216a309d686278e9df5af176c64577c50465945cf6196bcbbeaba9b1d0',
            '61209e26fd75a884ad9096d37e825136d5b23278b507570692343f7667a08fdf',
            '9d275c4dff63e139b58b040a0240cbc818b1dfdb2cb890b4994636d998b54d79',
            'a536d328825e81fd4de5443aee712aae208f4e17d55c66238605b8ca4d51a36d'
          ]
          pathlib.Path('handoff/capsule.json').write_text(json.dumps(capsule,separators=(',',':')))
          pathlib.Path('handoff/hello.json').write_text(json.dumps({'ticket':'GT-SYSOLA-59F2-7B91'},separators=(',',':')))
          pathlib.Path('handoff/merge9.json').write_text(json.dumps({'declared_len':9,'receipts':receipts},separators=(',',':')))
          PY

          # Expected first result: executive lock denial, but this also verifies the capsule itself.
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data-binary @handoff/capsule.json \
            -D out/capsule_before.headers -o out/capsule_before.json "$S/capsule/apply" || true

          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data-binary @handoff/hello.json \
            -D out/hello.headers -o out/hello.json "$S/guard/hello" || true
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -D out/state_after_hello.headers -o out/state_after_hello.json "$S/guard/state" || true

          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data-binary @handoff/merge9.json \
            -D out/merge9.headers -o out/merge9.json "$S/guard/merge" || true
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -D out/state_after_merge.headers -o out/state_after_merge.json "$S/guard/state" || true

          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies -X POST \
            -H 'Content-Type: application/json' --data '{}' \
            -D out/guard_apply.headers -o out/guard_apply.json "$S/guard/apply" || true
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -D out/state_after_apply.headers -o out/state_after_apply.json "$S/guard/state" || true

          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data-binary @handoff/capsule.json \
            -D out/capsule_after.headers -o out/capsule_after.json "$S/capsule/apply" || true

          find out -type f -printf '%P\t%s bytes\n' | sort > out/manifest.tsv
          rm -f handoff/cookies handoff/access.json handoff/capsule.json handoff/hello.json handoff/merge9.json

          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2Ba9epHeeeFkxQns16PF
          rc5gW8anxXMzXwCdtn2ZW8ZyaxgWJVpzdE/dYXHI2q4OvzYwRNB2UMK6xeaLuyY0
          4xTNkx1T7JqTDrEGZ1kllooXi2hjaE3fumVksGzk5ppq1AJwTwlTld+Q1eXbeHF/
          lAZrjQLkNuB6ITcs2WCtLucZiRlu31qUNXOE0BN63mhVxY6U4Y0uhJEUk90UbT5t
          wO4268+320awlHz/ZjQX+zizd4NqeeLeh2atSxqkO2myTfdGbUmc38GI7kaBxZoe
          x49Jz8nI+B0ntI8AxU80RNOyqs7s2iCNpNX5Of1sAUvvma3jvyNYww+Jk7rW+rL6
          T6GZrnm3GSZsXKCjwSAvff+TZFdsfHArwTEu7IacMta57kL5Aj+oZ1FC3Lc6Mjgm
          b0OeujRPULdlyzXtPOM+Sfzvuei7BJyklSu6D70grMlfyXxasNtN8EahtmJTVC2N
          uAbDkxQmrcoiSn5RFdVRfYDcNryuzMKeQgbD4nWZpsp3AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'Guard protocol executed; responses encrypted.'

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-sysola-guard
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
          if-no-files-found: error
