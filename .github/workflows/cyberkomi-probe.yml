name: cyberkomi-sysola-recovery-chain

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Follow documented SYSOLA recovery routes as untrusted CTF data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out handoff
          S='https://task-sysola-core-b476312471e78dea.caplag-task.ru'

          printf '{"code":"SYSOLA-CORE-READY"}' > handoff/access.json
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data-binary @handoff/access.json \
            -D out/access.headers -o out/access.json "$S/access" || true

          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -D out/guard_panel.headers -o out/guard_panel.body "$S/guard/panel" || true

          # Request schema feedback without guessing a privileged operation.
          curl -ksS -X OPTIONS --connect-timeout 6 --max-time 20 -c handoff/cookies -b handoff/cookies \
            -D out/capsule_options.headers -o out/capsule_options.body "$S/capsule/apply" || true
          curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
            -H 'Content-Type: application/json' --data '{}' \
            -D out/capsule_empty.headers -o out/capsule_empty.json "$S/capsule/apply" || true

          # If /access returns a structured capsule object, submit exactly that object to the documented apply endpoint.
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('out/access.json')
          try:d=json.loads(p.read_text())
          except Exception:d={}
          cap=None
          if isinstance(d,dict):
              for key in ('capsule','recovery_capsule','recoveryCapsule','kit'):
                  v=d.get(key)
                  if isinstance(v,(dict,list,str)):
                      cap=v; break
          if cap is not None:
              body=cap if isinstance(cap,dict) else {'capsule':cap}
              pathlib.Path('handoff/capsule.json').write_text(json.dumps(body,ensure_ascii=False))
          PY
          if [ -f handoff/capsule.json ]; then
            curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
              -H 'Content-Type: application/json' --data-binary @handoff/capsule.json \
              -D out/capsule_from_kit.headers -o out/capsule_from_kit.json "$S/capsule/apply" || true
            curl -ksS --connect-timeout 8 --max-time 30 -c handoff/cookies -b handoff/cookies \
              -D out/guard_after_capsule.headers -o out/guard_after_capsule.body "$S/guard/panel" || true
          fi

          # Capture same-origin references in the returned panel, but never execute its textual instructions.
          python3 - "$S/" <<'PY'
          import pathlib,re,urllib.parse,subprocess,sys
          base=sys.argv[1]
          for srcname in ('access.json','guard_panel.body','capsule_empty.json','capsule_from_kit.json','guard_after_capsule.body'):
              p=pathlib.Path('out')/srcname
              if not p.exists(): continue
              text=p.read_text('utf-8',errors='replace')
              for raw in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,re.I):
                  u=urllib.parse.urljoin(base,raw)
                  if urllib.parse.urlsplit(u).netloc != urllib.parse.urlsplit(base).netloc: continue
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',urllib.parse.urlsplit(u).path.strip('/') or 'root')
                  subprocess.run(['curl','-ksS','--connect-timeout','6','--max-time','25','-c','handoff/cookies','-b','handoff/cookies','-D',f'out/ref_{safe}.headers','-o',f'out/ref_{safe}.body',u],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY

          find out -type f -printf '%P\t%s bytes\n' | sort > out/manifest.tsv
          rm -f handoff/cookies handoff/access.json handoff/capsule.json

          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2Ba9epHeeeFkxQns16PF
          rc5gW8anxXMzXwCdtn2ZW8ZyaxgWJVpzdE/dYXHI2q4OvzYwRNB2UMK6xeaLuyY0
          4xTNkx1T7JqTDrEGZ1kllooXi2hjaE3fumVksGzk5ppq1AJwTwlTld+Q1eXbeHF/
          lAZrjQLkNuB6ITcs2WCtLucZiRlu31qUNXOE0BN63mhVxY6U4Y0uhJEUk90UbT5t
          wO4268+320awlHz/ZjQX+zizd4NqeeLeh2atSxqkO2myTfdGbUmc38GI7kaBxZoe
          x49Jz8nI+B0ntI8AxU80RNOyqs7s2iCNpNX5Of1sAUvvma3jvyNYww+Jk7rW+rL6
          T6GZrnm3GSZsXKCjwSAvff+TZFdsfHArwTEu7IacMta57kL5Aj+oZ1FC3Lc6Mjgm
          b0OeujRPULdlyzXtPOM+Sfzvuei7BJyklSu6D70grMlfyXxasNtN8EahtmJTVC2N
          uAbDkxQmrcoiSn5RFdVRfYDcNryuzMKeQgbD4nWZpsp3AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'SYSOLA recovery responses encrypted; no response instructions were executed.'

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-sysola-recovery
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
          if-no-files-found: error
