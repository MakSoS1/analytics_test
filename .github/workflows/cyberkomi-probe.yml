name: cyberkomi-offline-packs-and-scene-strings

on:
  push:
    branches:
      - ctf-cyberkomi-probe-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download public task packs and dump Unity scene strings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/packs out/scene work

          # Public challenge artifacts only; no player token is used here.
          declare -A urls=(
            [task03.webm]='https://game-file.caplag.ru/d/task03_kalancha/old_eye_feed_23.webm'
            [task04.zip]='https://game-file.caplag.ru/d/task04_gallery/gallery_case_04.zip'
            [task07.zip]='https://game-file.caplag.ru/d/task07_heatline/heatline_pack.zip'
            [task08.zip]='https://game-file.caplag.ru/d/task08_kontur/parma9_audit_pack.zip'
            [task09.zip]='https://game-file.caplag.ru/d/task09_omeba/omeba_archive_pack.zip'
          )
          for name in "${!urls[@]}"; do
            curl -fsSL --connect-timeout 10 --max-time 180 -o "out/packs/$name" "${urls[$name]}"
          done

          for z in out/packs/*.zip; do
            d="${z%.zip}.unpacked"
            mkdir -p "$d"
            unzip -o "$z" -d "$d" >/dev/null
          done
          find out/packs -type f -printf '%P\t%s bytes\n' | sort > out/packs_manifest.tsv

          curl -fsS --compressed --connect-timeout 10 --max-time 300 \
            -o work/build.data \
            'https://cyberkomi.caplag.ru/Build/build.data.br'

          python3 - <<'PY'
          from pathlib import Path
          import struct
          src=Path('work/build.data').read_bytes()
          magic=b'UnityWebData1.0\x00'
          assert src.startswith(magic)
          p=len(magic); header=struct.unpack_from('<I',src,p)[0]; p+=4
          while p<header:
              off,size,nlen=struct.unpack_from('<III',src,p); p+=12
              name=src[p:p+nlen].decode('utf-8','replace'); p+=nlen
              if name=='data.unity3d':
                  Path('work/data.unity3d').write_bytes(src[off:off+size])
                  break
          else: raise SystemExit('data.unity3d missing')
          PY

          python3 -m pip -q install 'UnityPy>=1.10.18'
          python3 - <<'PY'
          import UnityPy, re, struct, json
          from pathlib import Path
          env=UnityPy.load('work/data.unity3d')
          rows=[]
          def strings(raw):
              vals=[]; seen=set()
              # Unity length-prefixed UTF-8 strings.
              for i in range(max(0,len(raw)-8)):
                  n=struct.unpack_from('<I',raw,i)[0]
                  if not (1<=n<=8192) or i+4+n>len(raw): continue
                  b=raw[i+4:i+4+n]
                  try: s=b.decode('utf-8')
                  except UnicodeDecodeError: continue
                  if any(ord(c)<9 or (13<ord(c)<32) for c in s): continue
                  if sum(c.isprintable() for c in s)/len(s) < .97: continue
                  if s in seen: continue
                  seen.add(s); vals.append((i,s))
              return vals
          for o in env.objects:
              if o.type.name!='MonoBehaviour': continue
              try: raw=bytes(o.get_raw_data())
              except Exception: continue
              ss=strings(raw)
              if ss:
                  rows.append({'path_id':o.path_id,'size':len(raw),'strings':ss})
          Path('out/scene/monobehaviour_strings.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          with Path('out/scene/monobehaviour_strings.txt').open('w',encoding='utf-8') as f:
              for r in rows:
                  f.write(f"PATH {r['path_id']} SIZE {r['size']}\n")
                  for off,s in r['strings']:
                      f.write(f"  +{off}: {s}\n")
                  f.write('\n')
          print(f'Dumped strings from {len(rows)} MonoBehaviours.')
          PY

          # Never print challenge file contents to public logs.
          printf 'Prepared offline packs and scene-string report.\n'

      - name: Upload offline analysis
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-offline-analysis
          path: out/
          retention-days: 1
          if-no-files-found: error
