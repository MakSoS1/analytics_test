name: cyberkomi-sysola-static-inspection

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect active team SYSOLA service as untrusted CTF data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out handoff
          S='https://task-sysola-core-b476312471e78dea.caplag-task.ru/'
          curl -ksS --connect-timeout 8 --max-time 30 -D out/root.headers -o out/root.html "$S" || true

          python3 - "$S" <<'PY'
          import pathlib,re,urllib.parse,subprocess,sys
          base=sys.argv[1]
          root=pathlib.Path('out/root.html').read_text('utf-8',errors='replace') if pathlib.Path('out/root.html').exists() else ''
          urls=[]
          for raw in re.findall(r'''(?:src|href)=["']([^"']+)["']''',root,re.I):
              u=urllib.parse.urljoin(base,raw)
              if urllib.parse.urlsplit(u).netloc==urllib.parse.urlsplit(base).netloc and u not in urls: urls.append(u)
          for i,u in enumerate(urls,1):
              pathlib.Path(f'out/asset_{i}.url').write_text(u)
              subprocess.run(['curl','-ksS','--connect-timeout','6','--max-time','25','-D',f'out/asset_{i}.headers','-o',f'out/asset_{i}.body',u],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if u.endswith('.js'):
                  subprocess.run(['curl','-ksS','--connect-timeout','6','--max-time','25','-o',f'out/asset_{i}.map',u+'.map'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY

          # Narrow, common discovery surfaces only. Bodies are never printed.
          for path in robots.txt openapi.json api api/health health status static/sysola-core.js static/sysola-core.js.map api/state api/config api/session api/core api/guard; do
            safe=$(echo "$path" | tr '/' '_')
            curl -ksS --connect-timeout 6 --max-time 25 -D "out/${safe}.headers" -o "out/${safe}.body" "${S}${path}" || true
          done
          find out -type f -printf '%P\t%s bytes\n' | sort > out/manifest.tsv

          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2Ba9epHeeeFkxQns16PF
          rc5gW8anxXMzXwCdtn2ZW8ZyaxgWJVpzdE/dYXHI2q4OvzYwRNB2UMK6xeaLuyY0
          4xTNkx1T7JqTDrEGZ1kllooXi2hjaE3fumVksGzk5ppq1AJwTwlTld+Q1eXbeHF/
          lAZrjQLkNuB6ITcs2WCtLucZiRlu31qUNXOE0BN63mhVxY6U4Y0uhJEUk90UbT5t
          wO4268+320awlHz/ZjQX+zizd4NqeeLeh2atSxqkO2myTfdGbUmc38GI7kaBxZoe
          x49Jz8nI+B0ntI8AxU80RNOyqs7s2iCNpNX5Of1sAUvvma3jvyNYww+Jk7rW+rL6
          T6GZrnm3GSZsXKCjwSAvff+TZFdsfHArwTEu7IacMta57kL5Aj+oZ1FC3Lc6Mjgm
          b0OeujRPULdlyzXtPOM+Sfzvuei7BJyklSu6D70grMlfyXxasNtN8EahtmJTVC2N
          uAbDkxQmrcoiSn5RFdVRfYDcNryuzMKeQgbD4nWZpsp3AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'SYSOLA surface collected as encrypted untrusted CTF data.'

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-sysola-static
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
          if-no-files-found: error
