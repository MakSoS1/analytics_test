name: cyberkomi-private-auth-and-validation

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate one-time handoff key
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p handoff out
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out handoff/private.pem >/dev/null 2>&1
          openssl pkey -in handoff/private.pem -pubout -out handoff/public.pem >/dev/null 2>&1
      - name: Publish public handoff key
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-auth2-public-key
          path: handoff/public.pem
          retention-days: 1
      - name: Decrypt token and run scoped checks
        shell: bash
        env:
          RAW_HANDOFF: https://raw.githubusercontent.com/MakSoS1/analytics_test/ctf-cyberkomi-probe-20260808/handoff/token-auth2.enc.b64
        run: |
          set -euo pipefail; umask 077
          for i in $(seq 1 240); do
            if curl -fsSL --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' "${RAW_HANDOFF}?n=${GITHUB_RUN_ID}-${i}" -o handoff/token.b64 2>/dev/null; then break; fi
            sleep 2
          done
          test -s handoff/token.b64
          base64 -d handoff/token.b64 > handoff/token.enc
          openssl pkeyutl -decrypt -inkey handoff/private.pem -in handoff/token.enc -out handoff/token.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          TOKEN=$(cat handoff/token.txt); echo "::add-mask::$TOKEN"; test -n "$TOKEN"

          python3 - "$TOKEN" <<'PY'
          import json, pathlib, sys
          token=sys.argv[1]
          checks=[
            ('ch02.library.ticket','167'),
            ('ch03.kalancha.entrance','LIB-167-KALANCHA'),
            ('ch03.kalancha.final','EYE-23-GALLERY'),
            ('ch04.gallery.final','PARMA-04-23'),
            ('ch07.heatline.entrance','GOV-06-HEATLINE'),
            ('ch07.heatline.localkey','HEAT-42-AUGUST-VENT'),
            ('ch08.kontur.entrance','HEAT-07-KONTUR'),
            ('ch08.kontur.investigation','KONTUR-08-OMEBAKEY'),
            ('ch09.omeba.final','OMEBA-09-CORESEED'),
            ('ch09.omeba.final','SYSOLA-CORE-READY'),
          ]
          pathlib.Path('handoff/checks.json').write_text(json.dumps([{'step':s,'code':c,'ctfd_token':token} for s,c in checks]))
          PY
          python3 - <<'PY'
          import json, pathlib, subprocess
          reqs=json.loads(pathlib.Path('handoff/checks.json').read_text())
          results=[]
          for idx,r in enumerate(reqs):
              p=pathlib.Path(f'handoff/r{idx}.json'); p.write_text(json.dumps(r))
              cp=subprocess.run(['curl','-sS','--connect-timeout','8','--max-time','30','-H','Content-Type: application/json','-H','X-API-Key: caplag-local-dev-keyjdi2odk2j1ljkd12od1jdia','--data-binary',f'@{p}','-w','\n__HTTP__%{http_code}','https://game-check.caplag.ru/check'],capture_output=True,text=True)
              body=cp.stdout; status='000'
              if '\n__HTTP__' in body: body,status=body.rsplit('\n__HTTP__',1)
              results.append({'step':r['step'],'candidate':r['code'],'http':status,'body':body})
          pathlib.Path('out/check_results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          PY

          python3 - "$TOKEN" <<'PY'
          import json,pathlib,sys
          pathlib.Path('handoff/login.json').write_text(json.dumps({'token':sys.argv[1]}))
          PY
          # Same-origin browser-like emergency login; keep error body.
          curl -sS --connect-timeout 8 --max-time 30 -c handoff/cookies.txt -b handoff/cookies.txt \
            -H 'Content-Type: application/json' -H 'Origin: https://platform.caplag.ru' \
            -H 'Referer: https://platform.caplag.ru/microserv/task/web/parma-line/1' \
            --data-binary @handoff/login.json -w '\n__HTTP__%{http_code}\n' \
            'https://platform.caplag.ru/microserv/auth/emergency/login' > out/emergency_login.txt || true

          for scheme in bearer token; do
            if [ "$scheme" = bearer ]; then AUTH="Bearer $TOKEN"; else AUTH="Token $TOKEN"; fi
            curl -sS --connect-timeout 8 --max-time 30 -H "Authorization: $AUTH" -w '\n__HTTP__%{http_code}\n' \
              'https://platform.caplag.ru/microserv/auth/ctfd/validate' > "out/validate_${scheme}.txt" || true
            curl -sS --connect-timeout 8 --max-time 30 -H "Authorization: $AUTH" -w '\n__HTTP__%{http_code}\n' \
              'https://platform.caplag.ru/microserv/task/web/parma-line/1/state' > "out/state_${scheme}.txt" || true
          done
          curl -sS --connect-timeout 8 --max-time 30 -b handoff/cookies.txt -w '\n__HTTP__%{http_code}\n' \
            'https://platform.caplag.ru/microserv/auth/ctfd/validate' > out/validate_cookie.txt || true
          curl -sS --connect-timeout 8 --max-time 30 -b handoff/cookies.txt -w '\n__HTTP__%{http_code}\n' \
            'https://platform.caplag.ru/microserv/task/web/parma-line/1/state' > out/state_cookie.txt || true

          rm -f handoff/token.txt handoff/token.enc handoff/token.b64 handoff/login.json handoff/checks.json handoff/r*.json handoff/cookies.txt handoff/private.pem
          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqvptF4aTPzGzR6fNOtz3
          p/Ds9uFcANf/SCwSCWZEqbNmMGqmMYOexJISES2kjQJqiPoovpFrr4bawgr9zw7y
          sSxNcsP9lbuOdMKEU+tVS+2TebLPXMv4Ue8yX5ZhWdK3c9uz3RZHW8oWLTWgUBlC
          N7NDHSJDqeFJm4NFxBUYfVwYzxU2uD6m8r1B3FZrz/YGmMsMQFV5gWqTdiAmtosu
          uSxUJ1891V9Qd4URX4TGbkGGAE+aSSNF1WTykdECOSZmrspbu5C48489D94iaDyU
          4y+NlouCIV6/DGoJvd6VSp3SwZTTNShPQ2YKhnvRN75g7Sm++9RYeipo7xmrOBIZ
          bbyjuSC9Nd6Vy99R40e38UMAFzDUXKq5GjCBNMdA3VxrMSvs+LFeKQ77rB6h7EkX
          xVHeZPvwwV6lYUQ1i7DnLRLlz4mVqVGVa2hifx9VY2PM/M2c5/iA0uHEWQkxZ9F1
          YSb2e96Ws1+dS0tHu4hzArM8lZQEaHveFLsIu67isD0/AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'Scoped private checks completed; encrypted output only.'
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-auth2-result-encrypted
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
