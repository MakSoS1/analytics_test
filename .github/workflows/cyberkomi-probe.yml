name: cyberkomi-public-microservices-and-wasm

on:
  push:
    branches:
      - ctf-cyberkomi-probe-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch public microservice pages without player credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/web out/wasm out/font work

          i=0
          for url in \
            'https://platform.caplag.ru/microserv/task/web/parma-line/1' \
            'https://platform.caplag.ru/microserv/task/web/gov-relay/1' \
            'https://platform.caplag.ru/microserv/task/web/sysola-core/1' \
            'https://parma-line.syk-ctf.local/' \
            'https://gov-relay.syk-ctf.local/' \
            'https://sysola-core.syk-ctf.local/' \
            'https://heatline.syk-ctf.local/' \
            'https://kontur-update.syk-ctf.local/' \
            'https://omeba-archive.syk-ctf.local/'; do
            i=$((i+1))
            code=$(curl -ksSL --connect-timeout 8 --max-time 45 \
              -D "out/web/${i}.headers" \
              -o "out/web/${i}.body" \
              -w '%{http_code}' "$url" || true)
            printf '%s\t%s\n' "$i" "$url" >> out/web/map.tsv
            printf '%s\t%s\n' "$i" "${code:-ERR}" >> out/web/status.tsv
          done

          # Probe game-check interface without a token or answer; bodies remain in the artifact.
          for ep in init check; do
            curl -ksS --connect-timeout 8 --max-time 30 \
              -D "out/web/gamecheck_${ep}_get.headers" \
              -o "out/web/gamecheck_${ep}_get.body" \
              "https://game-check.caplag.ru/${ep}" || true
            curl -ksS -X OPTIONS --connect-timeout 8 --max-time 30 \
              -D "out/web/gamecheck_${ep}_options.headers" \
              -o "out/web/gamecheck_${ep}_options.body" \
              "https://game-check.caplag.ru/${ep}" || true
          done

          # Task 07: download public pack and decompile the WebAssembly firmware.
          curl -fsSL --connect-timeout 10 --max-time 90 \
            -o work/task07.zip \
            'https://game-file.caplag.ru/d/task07_heatline/heatline_pack.zip'
          unzip -q work/task07.zip -d work/task07
          sudo apt-get update -qq
          sudo apt-get install -y -qq wabt >/dev/null
          wasm2wat --generate-names --fold-exprs \
            work/task07/heatline_controller.wasm \
            -o out/wasm/heatline_controller.wat
          cp work/task07/heatline_panel.js out/wasm/
          cp work/task07/heatline_state.bin out/wasm/

          # Render the historical Anttikoski Abur font as an image for offline glyph matching.
          # The font file itself is deliberately deleted and never uploaded.
          curl -fsSL --connect-timeout 10 --max-time 45 \
            -o work/Abur.ttf \
            'https://db.onlinewebfonts.com/t/b485c0b24f979d6d5430ee17e038cb9c.ttf'
          python3 -m pip -q install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          font=ImageFont.truetype('work/Abur.ttf',72)
          keys=['Q','W','E','R','T','Y','U','I','O','й','A','S','D','F','G','H','J','K','L','Z','X','C','V','B','N','M']
          names=['AN','BUR','GAJ','DOJ','E','ZHOJ','DZHOJ','ZATA',"DZ'ITA",'I','KOKE','LEJ','MENO','NENO','VOJ','PEJ','REJ','SIJ','TAJ','U(V)','VER','CHERY','SHOJ','YRY','JAT','O']
          cellw,cellh=180,120
          out=Image.new('RGB',(5*cellw,6*cellh),'white'); d=ImageDraw.Draw(out)
          small=ImageFont.load_default()
          for idx,(k,nm) in enumerate(zip(keys,names)):
              x=(idx%5)*cellw; y=(idx//5)*cellh
              d.text((x+10,y+5),f'{k}  {nm}',font=small,fill='black')
              d.text((x+50,y+28),k,font=font,fill='black')
          out.save('out/font/abur_anttikoski_chart.png')
          PY
          rm -f work/Abur.ttf

          # Metadata only in public Actions stdout.
          find out -type f -printf '%P\t%s bytes\n' | sort > out/manifest.tsv
          printf 'Public-only inspection complete. No player token was used.\n'

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-public-inspection
          path: out/
          retention-days: 1
          if-no-files-found: error
