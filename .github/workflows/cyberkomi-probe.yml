name: cyberkomi-task01-public-asset

on:
  push:
    branches:
      - ctf-cyberkomi-probe-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch task 01 redirected archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/unpacked

          curl -fsSL --connect-timeout 10 --max-time 90 \
            -D out/task01.headers \
            -o out/board_anbur_phrase.zip \
            'https://game-file.caplag.ru/d/task01_nevrovozal/board_anbur_phrase.png'

          file out/board_anbur_phrase.zip > out/file.txt
          sha256sum out/board_anbur_phrase.zip > out/sha256.txt
          unzip -l out/board_anbur_phrase.zip > out/archive_list.txt
          unzip -o out/board_anbur_phrase.zip -d out/unpacked >/dev/null
          find out/unpacked -type f -printf '%P\t%s bytes\n' | sort > out/unpacked_manifest.tsv
          printf 'Task 01 redirected archive fetched.\n'

      - name: Upload task 01
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-task01
          path: out/
          retention-days: 1
          if-no-files-found: error
