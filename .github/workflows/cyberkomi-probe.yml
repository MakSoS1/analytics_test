name: cyberkomi-public-probe

on:
  push:
    branches:
      - ctf-cyberkomi-probe-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch public Unity shell and build metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/common out/build
          base='https://cyberkomi.caplag.ru/'

          curl -fsS --connect-timeout 10 --max-time 30 \
            -D out/root.headers \
            -o out/index.html \
            "$base"

          for path in robots.txt manifest.json site.webmanifest sw.js service-worker.js favicon.ico; do
            safe=$(printf '%s' "$path" | tr '/.' '__')
            code=$(curl -sS --connect-timeout 10 --max-time 20 \
              -D "out/common/${safe}.headers" \
              -o "out/common/${safe}.body" \
              -w '%{http_code}' \
              "${base}${path}" || true)
            printf '%s\t%s\n' "$path" "$code" >> out/common/status.tsv
          done

          : > out/build/status.tsv
          for path in \
            Build/build.loader.js \
            Build/build.framework.js.br \
            Build/build.data.br \
            Build/build.wasm.br; do
            safe=$(printf '%s' "$path" | tr '/.' '__')
            curl -sS -I --connect-timeout 10 --max-time 30 \
              "${base}${path}" > "out/build/${safe}.head" || true
            code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' "out/build/${safe}.head")
            length=$(awk 'BEGIN{IGNORECASE=1} /^Content-Length:/ {gsub("\\r",""); v=$2} END{print v}' "out/build/${safe}.head")
            encoding=$(awk 'BEGIN{IGNORECASE=1} /^Content-Encoding:/ {gsub("\\r",""); v=$2} END{print v}' "out/build/${safe}.head")
            printf '%s\t%s\t%s\t%s\n' "$path" "${code:-NA}" "${length:-NA}" "${encoding:-NA}" >> out/build/status.tsv
          done

          curl -fsS --connect-timeout 10 --max-time 30 \
            -D out/build/loader.headers \
            -o out/build/build.loader.js \
            "${base}Build/build.loader.js"

          # The framework is modest; ask curl to decode Brotli if nginx marks it encoded.
          curl -fsS --compressed --connect-timeout 10 --max-time 60 \
            -D out/build/framework.headers \
            -o out/build/build.framework.js \
            "${base}Build/build.framework.js.br" || true

          # Probe common StreamingAssets index/config names without logging bodies.
          : > out/build/streaming-status.tsv
          for path in \
            StreamingAssets/aa/catalog.json \
            StreamingAssets/catalog.json \
            StreamingAssets/config.json \
            StreamingAssets/settings.json \
            StreamingAssets/version.json; do
            safe=$(printf '%s' "$path" | tr '/.' '__')
            code=$(curl -sS --connect-timeout 10 --max-time 20 \
              -D "out/build/${safe}.headers" \
              -o "out/build/${safe}.body" \
              -w '%{http_code}' \
              "${base}${path}" || true)
            printf '%s\t%s\n' "$path" "$code" >> out/build/streaming-status.tsv
          done

          printf 'Public Unity metadata fetched.\n'
          find out -type f -printf '%P\t%s bytes\n' | sort > out/file_manifest.tsv

      - name: Upload probe bundle
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-public-probe
          path: out/
          retention-days: 1
          if-no-files-found: error
