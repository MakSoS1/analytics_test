name: cyberkomi-private-services

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Generate one-time handoff key
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p handoff out/services
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out handoff/private.pem >/dev/null 2>&1
          openssl pkey -in handoff/private.pem -pubout -out handoff/public.pem >/dev/null 2>&1
      - name: Publish public handoff key
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-auth3-public-key
          path: handoff/public.pem
          retention-days: 1
      - name: Provision scoped services and collect public task surfaces
        shell: bash
        env:
          RAW_HANDOFF: https://raw.githubusercontent.com/MakSoS1/analytics_test/ctf-cyberkomi-probe-20260808/handoff/token-auth3.enc.b64
        run: |
          set -euo pipefail; umask 077
          for i in $(seq 1 240); do
            if curl -fsSL --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' "${RAW_HANDOFF}?n=${GITHUB_RUN_ID}-${i}" -o handoff/token.b64 2>/dev/null; then break; fi
            sleep 2
          done
          test -s handoff/token.b64
          base64 -d handoff/token.b64 > handoff/token.enc
          openssl pkeyutl -decrypt -inkey handoff/private.pem -in handoff/token.enc -out handoff/token.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          TOKEN=$(cat handoff/token.txt); echo "::add-mask::$TOKEN"; test -n "$TOKEN"

          for task in parma-line gov-relay sysola-core; do
            mkdir -p "out/services/$task"
            base="https://platform.caplag.ru/microserv/task/web/${task}/1"
            curl -sS --connect-timeout 8 --max-time 30 -H "Authorization: Token $TOKEN" \
              -D "out/services/$task/state_before.headers" -o "out/services/$task/state_before.json" "$base/state"
            status=$(python3 - "$task" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(f'out/services/{sys.argv[1]}/state_before.json').read_text())
          print(d.get('status',''))
          PY
            )
            if [ "$status" != active ] && [ "$status" != provisioning ]; then
              curl -sS -X POST --connect-timeout 8 --max-time 45 -H "Authorization: Token $TOKEN" -H 'Content-Type: application/json' --data '{}' \
                -D "out/services/$task/up.headers" -o "out/services/$task/up.json" "$base/up"
            fi
            for n in $(seq 1 40); do
              curl -sS --connect-timeout 8 --max-time 30 -H "Authorization: Token $TOKEN" -o "out/services/$task/state_final.json" "$base/state"
              ready=$(python3 - "$task" <<'PY'
          import json,pathlib,sys
          try:d=json.loads(pathlib.Path(f'out/services/{sys.argv[1]}/state_final.json').read_text())
          except:d={}
          print('1' if d.get('status')=='active' else '0')
          PY
              )
              [ "$ready" = 1 ] && break
              sleep 3
            done
          done

          python3 - <<'PY'
          import json,pathlib,re,urllib.parse,subprocess,html.parser
          root=pathlib.Path('out/services')
          targets=[]
          for task in ('parma-line','gov-relay','sysola-core'):
              try:d=json.loads((root/task/'state_final.json').read_text())
              except Exception:continue
              creds=d.get('credentials') or {}
              for e in d.get('endpoints') or []:
                  urls=[]
                  if isinstance(e,str):
                      m=re.findall(r'https?://[^\s,;]+',e); urls+=m
                      if not m and re.fullmatch(r'[A-Za-z0-9._-]+:\d+',e.strip()): urls.append('http://'+e.strip())
                  elif isinstance(e,dict):
                      for k in ('url','uri','endpoint','address'):
                          v=e.get(k)
                          if isinstance(v,str) and v.startswith(('http://','https://')): urls.append(v)
                      host=e.get('host') or e.get('hostname'); port=e.get('port'); proto=e.get('protocol') or e.get('scheme') or 'http'
                      if host and port: urls.append(f'{proto}://{host}:{port}/')
                  for u in urls:
                      targets.append({'task':task,'url':u.rstrip(').]'),'login':creds.get('login'),'password':creds.get('password')})
          pathlib.Path('out/targets.json').write_text(json.dumps(targets,ensure_ascii=False,indent=2))

          class P(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.u=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for k in ('src','href'):
                      if d.get(k): self.u.append(d[k])

          for idx,t in enumerate(targets,1):
              p=urllib.parse.urlsplit(t['url']); base=f'{p.scheme}://{p.netloc}/'
              dest=root/f"{idx}_{t['task']}_endpoint"; dest.mkdir(parents=True,exist_ok=True)
              (dest/'url.txt').write_text(t['url'])
              auth=[]
              if t.get('login') and t.get('password'): auth=['-u',f"{t['login']}:{t['password']}"]
              def fetch(url,name,timeout='20'):
                  subprocess.run(['curl','-ksS','--connect-timeout','6','--max-time',timeout,'-D',str(dest/(name+'.headers')),'-o',str(dest/(name+'.body')),*auth,url],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              fetch(base,'root','30')
              for path in ('robots.txt','openapi.json','swagger.json','health','api'):
                  fetch(urllib.parse.urljoin(base,path),path.replace('/','_'))
              try:text=(dest/'root.body').read_text(errors='replace')
              except Exception:text=''
              pa=P(); pa.feed(text)
              seen=[]
              for raw in pa.u:
                  u=urllib.parse.urljoin(base,raw); q=urllib.parse.urlsplit(u)
                  if q.scheme in ('http','https') and q.netloc==p.netloc and u not in seen: seen.append(u)
              for j,u in enumerate(seen[:20],1): fetch(u,f'asset_{j}','20'); (dest/f'asset_{j}.url').write_text(u)
          PY

          rm -f handoff/token.txt handoff/token.enc handoff/token.b64 handoff/private.pem
          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqvptF4aTPzGzR6fNOtz3
          p/Ds9uFcANf/SCwSCWZEqbNmMGqmMYOexJISES2kjQJqiPoovpFrr4bawgr9zw7y
          sSxNcsP9lbuOdMKEU+tVS+2TebLPXMv4Ue8yX5ZhWdK3c9uz3RZHW8oWLTWgUBlC
          N7NDHSJDqeFJm4NFxBUYfVwYzxU2uD6m8r1B3FZrz/YGmMsMQFV5gWqTdiAmtosu
          uSxUJ1891V9Qd4URX4TGbkGGAE+aSSNF1WTykdECOSZmrspbu5C48489D94iaDyU
          4y+NlouCIV6/DGoJvd6VSp3SwZTTNShPQ2YKhnvRN75g7Sm++9RYeipo7xmrOBIZ
          bbyjuSC9Nd6Vy99R40e38UMAFzDUXKq5GjCBNMdA3VxrMSvs+LFeKQ77rB6h7EkX
          xVHeZPvwwV6lYUQ1i7DnLRLlz4mVqVGVa2hifx9VY2PM/M2c5/iA0uHEWQkxZ9F1
          YSb2e96Ws1+dS0tHu4hzArM8lZQEaHveFLsIu67isD0/AgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'Service discovery complete; only encrypted result uploaded.'
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-auth3-result-encrypted
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
