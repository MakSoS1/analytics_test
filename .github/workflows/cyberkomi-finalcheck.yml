name: cyberkomi-platform-map

on:
  push:
    branches: [ctf-cyberkomi-probe-20260808]
    paths:
      - '.github/workflows/cyberkomi-finalcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate one-time token handoff key
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p handoff out
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out handoff/private.pem >/dev/null 2>&1
          openssl pkey -in handoff/private.pem -pubout -out handoff/public.pem >/dev/null 2>&1
      - name: Publish one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-platformmap-handoff-key
          path: handoff/public.pem
          retention-days: 1
      - name: Map authenticated CTFd challenges
        shell: bash
        env:
          RAW_HANDOFF: https://raw.githubusercontent.com/MakSoS1/analytics_test/ctf-cyberkomi-probe-20260808/handoff/platformmap.enc.b64
        run: |
          set -euo pipefail; umask 077
          got=0
          for i in $(seq 1 240); do
            if curl -fsSL --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' "${RAW_HANDOFF}?n=${GITHUB_RUN_ID}-${i}" -o handoff/token.b64 2>/dev/null; then got=1; break; fi
            sleep 2
          done
          [ "$got" -eq 1 ] || exit 2
          base64 -d handoff/token.b64 > handoff/token.enc
          openssl pkeyutl -decrypt -inkey handoff/private.pem -in handoff/token.enc -out handoff/token.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          TOKEN=$(cat handoff/token.txt); echo "::add-mask::$TOKEN"; test -n "$TOKEN"
          python3 - "$TOKEN" <<'PY'
          import json,pathlib,sys
          t=sys.argv[1]
          pathlib.Path('handoff/login_token.json').write_text(json.dumps({'token':t},separators=(',',':')))
          pathlib.Path('handoff/login_ctfd.json').write_text(json.dumps({'ctfd_token':t},separators=(',',':')))
          PY
          for variant in token ctfd; do
            jar="handoff/${variant}.cookies"
            body="handoff/login_${variant}.json"
            curl -sS --connect-timeout 8 --max-time 30 -c "$jar" -b "$jar" \
              -H 'Content-Type: application/json' -H 'Origin: https://platform.caplag.ru' -H 'Referer: https://platform.caplag.ru/' \
              --data-binary @"$body" -D "out/login_${variant}.headers" -o "out/login_${variant}.body" \
              -w '%{http_code}' 'https://platform.caplag.ru/microserv/auth/emergency/login' > "out/login_${variant}.status" || true
            for path in '/api/v1/challenges' '/api/v1/teams/me' '/api/v1/teams/me/solves' '/challenges'; do
              safe=$(printf '%s' "$path" | sed 's#[^A-Za-z0-9]#_#g')
              curl -sS -L --connect-timeout 8 --max-time 30 -c "$jar" -b "$jar" \
                -H 'Accept: application/json,text/html' -D "out/${variant}_${safe}.headers" -o "out/${variant}_${safe}.body" \
                -w '%{http_code}' "https://platform.caplag.ru${path}" > "out/${variant}_${safe}.status" || true
            done
          done
          python3 - "$TOKEN" <<'PY'
          import json,pathlib,subprocess,sys
          token=sys.argv[1]
          req={'step':'ch10.core.final','code':'SYSOLA-10-REMEMBERS','ctfd_token':token}
          p=pathlib.Path('handoff/final.json'); p.write_text(json.dumps(req,separators=(',',':')))
          cp=subprocess.run(['curl','-sS','--connect-timeout','8','--max-time','30','-H','Content-Type: application/json','-H','X-API-Key: caplag-local-dev-keyjdi2odk2j1ljkd12od1jdia','--data-binary',f'@{p}','-D','out/game_final.headers','-o','out/game_final.body','-w','%{http_code}','https://game-check.caplag.ru/check'],capture_output=True,text=True)
          pathlib.Path('out/game_final.status').write_text(cp.stdout)
          PY
          rm -f handoff/token.txt handoff/token.enc handoff/token.b64 handoff/login_*.json handoff/*.cookies handoff/final.json handoff/private.pem
          cat > handoff/output_public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAz5AYuQkFbMs5/eUEJA0m
          CsSOaVZF1JE76TRn8js2iN/LLAFu2BIKvbKQY+PQDxyJQqr71keg4cQiMWO5ZCbw
          FmTjq808affSZGx+P49GqYR513e6GDpCHho8cc9TYeOfgeW29tlTb/Qd9lhu6SrI
          ZruTi0jSGuWQXqo24HnWkc9fEA1jRaUPITIZGyemcvH4Qri0WBpN9RO1iWDuuDru
          8nafRMpzEEax/RYuNoJBlrsjjOBBH1kgaf6kPix+ntNBLy59X0D3q3YBTX6b0l5G
          glYE4Y4Gh721x9VT59sdyugL+MkjtOLAHisbDDa3YTjFnmVTBTQ87uJJwMKhlE0f
          e9l8gTS1ZsRixTL9WLV2xD9zy8LpJv95DQ1wTOgRDQr2YFqndrcZjUV8C3V45uxz
          lpnwwR4L19d2ntfGfDpTnvtZBAu7JOWiTwfM09o9i5OIGhXqu3Tq5MEAwMmKiYnz
          jZ/R5nq2EmPQurostLLPctCT570QjSW95e40ZyvI9idpAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          tar -C out -czf handoff/results.tar.gz .
          openssl rand 32 > handoff/key; openssl rand 16 > handoff/iv
          openssl enc -aes-256-ctr -K "$(xxd -p -c256 handoff/key)" -iv "$(xxd -p -c256 handoff/iv)" -in handoff/results.tar.gz -out handoff/results.enc
          cat handoff/key handoff/iv > handoff/keyblob
          openssl pkeyutl -encrypt -pubin -inkey handoff/output_public.pem -in handoff/keyblob -out handoff/keyblob.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          rm -rf out handoff/key handoff/iv handoff/keyblob handoff/results.tar.gz handoff/output_public.pem
          echo 'Platform mapping completed; encrypted output only.'
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: cyberkomi-platformmap-result
          path: |
            handoff/results.enc
            handoff/keyblob.enc
          retention-days: 1
