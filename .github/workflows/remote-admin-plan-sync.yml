name: Remote Admin Anomaly V1 Plan Sync

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-plan-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  sync-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
          fetch-depth: 0
      - name: Wait for verified results commit and refresh branch
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            git fetch origin remote-admin-anomaly-lab-v1
            git reset --hard origin/remote-admin-anomaly-lab-v1
            if [[ -s remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Verified RESULTS_AUTOGENERATED.json did not appear.' >&2
          exit 1
      - name: Update living PLAN status block
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          plan=Path('remote-admin-anomaly-lab/PLAN.md')
          result_path=Path('remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json')
          data=json.loads(result_path.read_text())
          decision=data['research_decision']
          quality=data['production_gold']
          curve=data['learning_curve']
          hf=data['hf_persistence']
          ref=data['reference_validation']
          run=data['research_run_id']
          artifact=data['artifact_name']
          manual=decision.get('manual_review_flags',[])
          block=f'''<!-- AUTOGENERATED-RESULTS-START -->
## Latest verified research status

Generated from `RESULTS_AUTOGENERATED.json`; do not edit this block manually.

- [x] Final contract suite — PASS on the final feature contract / campaign / implementation code.
- [x] V4 Final — real SSH/SMB/RDP/VNC → immutable Bronze → Suricata/Zeek → deterministic rules → Suricata production Gold.
- [x] Implementation Final — actual OpenSSH/Paramiko and smbclient/smbprotocol variants; unseen-client implementation is challenge-only.
- [x] Digital Twin — 58 personas, task/calendar model, 45-day simulated timeline, hard-benign/hard-suspicious overlap and strict counterfactual pairs.
- [x] Long-term state — 1m/5m/15m/1h/24h/7d/30d; split-isolated state and exact offline/online `EveFeatureState` parity.
- [x] Campaign evaluation — multi-session campaign grouping, campaign recall and time-to-detection.
- [x] Research Gate V2 — 1,000 real-wire sessions, run `{run}`, automatic quality gate PASS.
- [x] Leakage/shortcut gates — PASS; production source `{quality['production_source']}`, UID alignment `{quality['uid_alignment_coverage']}`.
- [x] Recoverability — full Bronze PCAP + raw Silver logs retained in artifact `{artifact}` before any HF upload attempt.
- [ ] Native Windows semantic-fidelity corpus — harness implemented, but requires the isolated self-hosted Windows client/target pair before SMB ADMIN$/DCOM/WinRM/full RDP can be marked native-validated.
- [ ] External reference-distribution validation — code implemented; current status `{ref.get('status')}`, reference_available={ref.get('reference_available')} because no reference dataset was supplied.
- [ ] Permanent Hugging Face persistence — current run status `{hf.get('status')}`; requires `HF_TOKEN` with dataset write permission in `analytics_test` if not already configured.
- [ ] Large 20k/40k fan-out — intentionally gated. Grouped learning curve recommendation: `{curve.get('scale_recommendation')}`; last ΔPR-AUC={curve.get('last_delta_pr_auc')}.
- [ ] Sliver/RMM/C2 challenge — intentionally deferred to V2 unseen-tool holdout after native/fidelity/generalization gates.
- Manual review flags from the 1k gate: `{manual}`.

Exact metrics and per-slice results: `remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.md`.
<!-- AUTOGENERATED-RESULTS-END -->'''
          text=plan.read_text()
          pattern=r'<!-- AUTOGENERATED-RESULTS-START -->.*?<!-- AUTOGENERATED-RESULTS-END -->'
          if re.search(pattern,text,flags=re.S):
            text=re.sub(pattern,block,text,flags=re.S)
          else:
            text=text.rstrip()+'\n\n'+block+'\n'
          plan.write_text(text)
          PY
      - name: Commit plan synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/PLAN.md
          if git diff --cached --quiet; then
            echo 'PLAN already synchronized.'
          else
            git commit -m 'docs(remote-admin): sync living plan with verified research gate'
            git push origin HEAD:remote-admin-anomaly-lab-v1
          fi
