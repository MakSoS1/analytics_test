name: Remote Admin Anomaly V1 Plan Sync

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json'
      - 'remote-admin-anomaly-lab/SCALE_DECISION.json'
      - 'remote-admin-anomaly-lab/SCALE4K_AUTOGENERATED.json'
      - 'remote-admin-anomaly-lab/SCALE10K_AUTOGENERATED.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-admin-plan-sync
  cancel-in-progress: false

jobs:
  sync-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
          fetch-depth: 0
      - name: Validate committed evidence before changing PLAN
        working-directory: remote-admin-anomaly-lab
        run: |
          set -euo pipefail
          test -s RESULTS_AUTOGENERATED.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('RESULTS_AUTOGENERATED.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          required=['research_run_id','artifact_id','artifact_name','sessions','production_gold','leakage','shortcut_audit','research_decision']
          missing=[key for key in required if key not in d]
          assert not missing, f'missing evidence fields: {missing}'
          assert int(d['research_run_id']) > 0
          assert int(d['artifact_id']) > 0
          assert str(d['artifact_name']).startswith('remote-admin-research-gate-v2-')
          assert int(d['sessions']) >= 1000
          assert d['research_decision'].get('automatic_gate_pass') is True
          assert not d['research_decision'].get('automatic_failures', [])
          assert d['leakage'].get('ok') is True
          assert d['shortcut_audit'].get('shortcut_risk') is False
          gold=d['production_gold']
          assert gold.get('production_source') == 'suricata_eve_flow'
          assert gold.get('train_serve_feature_code') == 'adminlab.online_features.EveFeatureState'
          assert float(gold.get('uid_alignment_coverage', 0)) == 1.0
          print(f"verified research evidence run={d['research_run_id']} artifact={d['artifact_id']}")
          PY
      - name: Update living PLAN from verified evidence only
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          root=Path('.')
          data=json.loads((root/'RESULTS_AUTOGENERATED.json').read_text(encoding='utf-8'))
          decision=data['research_decision']
          gold=data['production_gold']
          leak=data['leakage']
          shortcut=data['shortcut_audit']
          curve=data['learning_curve']
          hf=data['hf_persistence']
          ref=data['reference_validation']
          run=int(data['research_run_id'])
          artifact_id=int(data['artifact_id'])
          artifact=str(data['artifact_name'])
          sessions=int(data['sessions'])
          manual=decision.get('manual_review_flags',[])

          scale_path=root/'SCALE_DECISION.json'
          scale=json.loads(scale_path.read_text(encoding='utf-8')) if scale_path.exists() else None
          s4_path=root/'SCALE4K_AUTOGENERATED.json'
          s4=json.loads(s4_path.read_text(encoding='utf-8')) if s4_path.exists() else None
          s10_path=root/'SCALE10K_AUTOGENERATED.json'
          s10=json.loads(s10_path.read_text(encoding='utf-8')) if s10_path.exists() else None

          scale_lines=[]
          if scale is None:
              scale_lines.append('- [ ] 4k promotion — no committed evidence-derived scale decision yet.')
          else:
              allowed=bool(scale.get('allow_scale'))
              mark='x' if allowed else ' '
              scale_lines.append(f"- [{mark}] 4k promotion decision — allow={allowed}, reason=`{scale.get('reason')}`, last ΔPR-AUC={scale.get('last_delta_pr_auc')}.")
          if s4:
              scale_lines.append(f"- [x] 4k evaluation evidence committed — validation PR-AUC={s4.get('validation_pr_auc')}, allow next={s4.get('allow_next_scale')}, flags=`{s4.get('review_flags')}`.")
          if s10:
              scale_lines.append(f"- [x] 10k evaluation evidence committed — validation PR-AUC={s10.get('validation_pr_auc')}, allow next={s10.get('allow_next_scale')}, flags=`{s10.get('review_flags')}`.")

          block=f'''<!-- AUTOGENERATED-RESULTS-START -->
## Latest evidence-verified research status

This block is generated only from `RESULTS_AUTOGENERATED.json` produced by the release verifier from a **successful Research Gate V2 run and a retained artifact**. File existence alone is not sufficient.

### Validated by the retained research artifact

- [x] Research Gate V2 — run `{run}`, artifact `{artifact}` (ID `{artifact_id}`), sessions={sessions}.
- [x] Recoverable dataset path — immutable Bronze PCAP/manifests plus raw Suricata/Zeek Silver retained before optional HF persistence.
- [x] Production Gold source — `{gold['production_source']}` with exact `{gold['train_serve_feature_code']}` replay and UID alignment `{gold['uid_alignment_coverage']}`.
- [x] Leakage gate — PASS (`ok={leak.get('ok')}`).
- [x] Shortcut gate — PASS (`shortcut_risk={shortcut.get('shortcut_risk')}`).
- [x] Research automatic quality gate — PASS; automatic failures=`{decision.get('automatic_failures',[])}`.
- [x] M0/M1/M2 + low-FPR, challenge slices, hard-benign, campaign TTD and grouped learning-curve evidence retained in `RESULTS_AUTOGENERATED.md`.

### Scale state

{chr(10).join(scale_lines)}

### Not automatically promoted to validated

- [ ] Native Windows semantic-fidelity challenge — requires actual isolated Windows client/target evidence for ADMIN$/C$/IPC$, WinRM/PowerShell Remoting, DCOM and full native RDP semantics.
- [ ] External/reference distribution validation — current status `{ref.get('status')}`, reference_available={ref.get('reference_available')}.
- [ ] Permanent Hugging Face persistence — current research-run status `{hf.get('status')}`; absence of a write-capable `HF_TOKEN` does not invalidate the retained Actions artifact.
- [ ] 20k/40k/201k fan-out — never authorized by row count alone; requires committed scale evidence and learning-curve benefit.
- [ ] Sliver/RMM/C2 — deferred to an unseen-tool challenge after the network-behavior detector is validated.

Manual review flags from the research artifact: `{manual}`.
<!-- AUTOGENERATED-RESULTS-END -->'''

          plan=root/'PLAN.md'
          text=plan.read_text(encoding='utf-8')
          pattern=r'<!-- AUTOGENERATED-RESULTS-START -->.*?<!-- AUTOGENERATED-RESULTS-END -->'
          if re.search(pattern,text,flags=re.S):
              text=re.sub(pattern,block,text,flags=re.S)
          else:
              text=text.rstrip()+'\n\n'+block+'\n'
          plan.write_text(text,encoding='utf-8')
          PY
      - name: Commit evidence-gated PLAN synchronization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/PLAN.md
          if git diff --cached --quiet; then
            echo 'PLAN already synchronized to current verified evidence.'
          else
            git commit -m 'docs(remote-admin): sync PLAN from verified research evidence'
            git push origin HEAD:remote-admin-anomaly-lab-v1
          fi
