name: Remote Admin Anomaly V1 Negative Research Finalizer

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-negative-research-finalizer.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: remote-admin-negative-research-finalizer
  cancel-in-progress: false

jobs:
  finalize-negative-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '31818445960'
      SOURCE_ARTIFACT_ID: '9226887886'
      SOURCE_ARTIFACT_NAME: 'remote-admin-research-gate-v2-31818445960'
      SOURCE_ARTIFACT_DIGEST: 'sha256:40a463b9f16d4251d3b40b8915ef7a7425a883edd2916484acab660328fbbf72'
      HF_DATASET_REPO: 'Maksim123321/remote-admin-anomaly-v1'
      HF_QUARANTINE_PATH: 'quarantine/rejected/gh-31818445960'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install finalizer runtime
        run: python -m pip install 'huggingface_hub>=0.25,<2'
      - name: Verify source run and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.status')" = 'completed'
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.conclusion')" = 'failure'
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.head_branch')" = 'remote-admin-anomaly-lab-v1'
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.name')" = "$SOURCE_ARTIFACT_NAME"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.expired')" = 'false'
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.digest')" = "$SOURCE_ARTIFACT_DIGEST"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.workflow_run.id')" = "$SOURCE_RUN_ID"
          size="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" --jq '.size_in_bytes')"
          test "$size" -gt 500000000
          echo "source_evidence_verified run=$SOURCE_RUN_ID artifact=$SOURCE_ARTIFACT_ID bytes=$size digest=$SOURCE_ARTIFACT_DIGEST"
      - name: Download retained research artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/negative-research
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/negative-research.zip
          unzip -q /tmp/negative-research.zip -d /tmp/negative-research
          test -s /tmp/negative-research/RESEARCH_GATE.json
          test -s /tmp/negative-research/release/bronze/H-research-1k/captures/H-research-1k.pcap.zst
      - name: Reverify rejection persist quarantine and generate final evidence
        working-directory: remote-admin-anomaly-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/finalize_negative_research.py \
            --artifact-root /tmp/negative-research \
            --repo-output . \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-artifact-id "$SOURCE_ARTIFACT_ID" \
            --source-artifact-name "$SOURCE_ARTIFACT_NAME" \
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST" \
            --hf-repo "$HF_DATASET_REPO" \
            --hf-path "$HF_QUARANTINE_PATH"
      - name: Commit evidence-verified STOP_AT_1K conclusion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            remote-admin-anomaly-lab/RESULTS_NEGATIVE_AUTOGENERATED.json \
            remote-admin-anomaly-lab/RESULTS_NEGATIVE_AUTOGENERATED.md \
            remote-admin-anomaly-lab/SCALE_DECISION_NEGATIVE.json \
            remote-admin-anomaly-lab/SCALE_DECISION_NEGATIVE.md \
            remote-admin-anomaly-lab/HF_NEGATIVE_PERSISTENCE.json
          git commit -m 'docs(remote-admin): finalize evidence-verified STOP_AT_1K result'
          git push origin HEAD:remote-admin-anomaly-lab-v1
