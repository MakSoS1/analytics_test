name: launchlet-part3-refscan2
on:
  push:
    branches: [agent/launchlet-part3-refscan2-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe compact dynamic ref route grammar and encrypt hits
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse,concurrent.futures,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out');ref='preview-8b11c';short='8b11c'
          nouns=['inspect','inspector','inspectors','deploy-inspector','deploy_inspector','preview-inspector','preview_inspector','render','renders','output','outputs','published','publication','runtime','runtimes','instance','instances','site','sites','app','apps','preview-app','preview_app','sandbox','sandboxes','session','sessions','context','contexts','reference','references','ref','refs','link','links','view','views']
          verbs=['inspect','open','view','show','resolve','lookup','get','read','export','download','render','preview','publish','promote','release','status','metadata','manifest','output','artifact']
          paths=set()
          for n in nouns:
            for r in [ref,short]:
              paths |= {f'/api/{n}/{r}',f'/{n}/{r}',f'/api/{n}?ref={r}',f'/api/{n}?deployRef={r}',f'/{n}?ref={r}',f'/{n}?deployRef={r}'}
              for v in verbs:
                paths |= {f'/api/{n}/{r}/{v}',f'/api/{n}/{v}/{r}',f'/{n}/{r}/{v}',f'/{n}/{v}/{r}'}
          # compact special forms often used by preview routers
          for p in [f'/{ref}',f'/{short}',f'/api/{ref}',f'/api/{short}',f'/_preview/{ref}',f'/__preview/{ref}',f'/.preview/{ref}',f'/.launchlet/{ref}',f'/_launchlet/{ref}',f'/p/{ref}',f'/d/{ref}',f'/r/{ref}',f'/preview/{ref}/',f'/deploy/{ref}/',f'/api/preview/{ref}/',f'/api/deployments/{ref}/']:
            paths.add(p)
          h={'Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          def one(p):
            try:
              r=requests.get(base+p,headers=h,timeout=5,allow_redirects=False)
              if r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n'): return None
              return {'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            except Exception as e:return None
          hits=[]
          plist=list(paths)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for x in ex.map(one,plist):
              if x:
                hits.append(x)
                flags=[f for f in re.findall(r'caplag\{[^}]+\}',x.get('body','')) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
                if flags:
                  (out/'FOUND.txt').write_text(json.dumps(x,indent=2));break
          (out/'summary.json').write_text(json.dumps({'count':len(plist),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-refscan2-encrypted
          path: artifact/
          retention-days: 1
