name: MBI admissions list diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mbi-list-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_HTTPS: https://inet.ibi.spb.ru/raspisan/ks/cb2026.php?c=bak-o-b
      TARGET_HTTP: http://inet.ibi.spb.ru/raspisan/ks/cb2026.php?c=bak-o-b
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose and download
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          REPORT=artifacts/mbi-diagnostic.txt
          BODY=artifacts/mbi-list.html
          : > "$REPORT"

          log() { printf '\n===== %s =====\n' "$1" | tee -a "$REPORT"; }

          log "Runner and time"
          date -u | tee -a "$REPORT"
          uname -a | tee -a "$REPORT"
          curl --version | head -n 2 | tee -a "$REPORT"

          log "DNS resolution"
          getent ahosts inet.ibi.spb.ru 2>&1 | tee -a "$REPORT"
          command -v dig >/dev/null && dig +time=5 +tries=1 inet.ibi.spb.ru A 2>&1 | tee -a "$REPORT"
          command -v dig >/dev/null && dig +time=5 +tries=1 inet.ibi.spb.ru AAAA 2>&1 | tee -a "$REPORT"

          log "TLS handshake"
          timeout 25 openssl s_client -connect inet.ibi.spb.ru:443 -servername inet.ibi.spb.ru -brief </dev/null 2>&1 | tee -a "$REPORT"

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          REFERER='https://ibispb.ru/abitur/bachelor/terms-and-conditions-of-admission/'

          for mode in https-default https-ipv4 http-default http-ipv4; do
            case "$mode" in
              https-default) URL="$TARGET_HTTPS"; EXTRA=() ;;
              https-ipv4) URL="$TARGET_HTTPS"; EXTRA=(-4) ;;
              http-default) URL="$TARGET_HTTP"; EXTRA=() ;;
              http-ipv4) URL="$TARGET_HTTP"; EXTRA=(-4) ;;
            esac
            log "curl $mode"
            curl "${EXTRA[@]}" -k -L --compressed \
              --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 2 \
              -A "$UA" -e "$REFERER" \
              -D "artifacts/headers-$mode.txt" \
              -o "artifacts/body-$mode.bin" \
              -w 'url_effective=%{url_effective}\nhttp_code=%{http_code}\nremote_ip=%{remote_ip}\nremote_port=%{remote_port}\ncontent_type=%{content_type}\nsize_download=%{size_download}\ntime_namelookup=%{time_namelookup}\ntime_connect=%{time_connect}\ntime_appconnect=%{time_appconnect}\ntime_starttransfer=%{time_starttransfer}\ntime_total=%{time_total}\nexit=%{exitcode}\n' \
              "$URL" 2>&1 | tee -a "$REPORT"
            {
              echo '--- response headers ---'
              cat "artifacts/headers-$mode.txt" 2>/dev/null
              echo '--- first 300 body bytes ---'
              head -c 300 "artifacts/body-$mode.bin" 2>/dev/null
              echo
            } >> "$REPORT"
          done

          log "Python requests"
          python - <<'PY' 2>&1 | tee -a "$REPORT"
          import requests, time
          url = 'https://inet.ibi.spb.ru/raspisan/ks/cb2026.php?c=bak-o-b'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0.0.0 Safari/537.36',
              'Referer': 'https://ibispb.ru/abitur/bachelor/terms-and-conditions-of-admission/',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'ru-RU,ru;q=0.9,en;q=0.8',
          }
          try:
              t = time.time()
              r = requests.get(url, headers=headers, timeout=(15, 90), verify=False, allow_redirects=True)
              print('status=', r.status_code)
              print('elapsed=', time.time()-t)
              print('url=', r.url)
              print('headers=', dict(r.headers))
              print('bytes=', len(r.content))
              open('artifacts/mbi-list.html','wb').write(r.content)
              print('contains_1609688=', b'1609688' in r.content)
          except Exception as e:
              print(type(e).__name__, repr(e))
          PY

          if [ ! -s "$BODY" ]; then
            for f in artifacts/body-https-default.bin artifacts/body-https-ipv4.bin artifacts/body-http-default.bin artifacts/body-http-ipv4.bin; do
              if [ -s "$f" ]; then cp "$f" "$BODY"; break; fi
            done
          fi

          log "Downloaded body summary"
          file "$BODY" 2>&1 | tee -a "$REPORT"
          wc -c "$BODY" 2>&1 | tee -a "$REPORT"
          grep -a -n -m 5 '1609688\|Экономическая безопасность\|Получено согласие' "$BODY" 2>&1 | tee -a "$REPORT"

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mbi-diagnostic.txt artifacts/mbi-list.html artifacts/headers-*.txt artifacts/body-*.bin || true
          if git diff --cached --quiet; then
            echo 'No diagnostic files to commit'
          else
            git commit -m 'Store MBI list diagnostics [skip ci]'
            git push
          fi
