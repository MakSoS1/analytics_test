name: launchlet-part3-assets

on:
  push:
    branches: [agent/launchlet-part3-assets-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe deployRef static asset manifests and encrypt hits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          ref='preview-8b11c'; out=pathlib.Path('package/out')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          prefixes=['assets','static','preview','previews','deploy','deploys','deployment','deployments','artifacts','release','releases']
          names=[ref,ref+'.json','manifest.json','deploy-manifest.json','deployment-manifest.json','preview-manifest.json','artifact-manifest.json','build-manifest.json','release-manifest.json','metadata.json','meta.json','index.json']
          paths=set()
          paths.add('/assets/'+ref+'.json')
          paths.add('/assets/deploy-'+ref+'.json')
          paths.add('/assets/preview-'+ref+'.json')
          for pref in prefixes:
            paths.add(f'/{pref}/{ref}')
            paths.add(f'/{pref}/{ref}.json')
            for nm in names[2:]: paths.add(f'/{pref}/{ref}/{nm}')
          hits=[]
          for p in sorted(paths):
            try:r=s.get(base.rstrip('/')+p,headers={'X-Launchlet-Preview':'launchlet-demo-board'},timeout=8,allow_redirects=False)
            except Exception as e: hits.append({'path':p,'error':repr(e)}); continue
            if not (r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n')):
              hits.append({'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
              if re.search(r'caplag\{[^}]+\}',r.text):(out/'FOUND.txt').write_text(r.text)
          (out/'summary.json').write_text(json.dumps(hits,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-assets-encrypted
          path: artifact/
          retention-days: 1
