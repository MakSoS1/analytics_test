name: Temporary fast Pearce and Torrens matcher

on:
  pull_request:
    branches: [ctf-geolocate-20260731]
    paths:
      - 'ctf/pearce-fast/**'
      - '.github/workflows/ctf-pearce-fast.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ctf-geolocate-20260731

      - name: Install dependencies
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet streetview pillow py360convert numpy requests torch torchvision 'transformers==4.44.2'

      - name: Match early Pearce and Torrens panoramas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/contact
          python3 - <<'PY'
          import io, json, math, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import numpy as np
          import py360convert
          import requests
          import torch
          from PIL import Image, ImageDraw, ImageFont
          from streetview import search_panoramas
          from transformers import CLIPModel, CLIPProcessor

          # Compact box centred just west/south of Sacred Heart Primary School.
          lats=np.arange(-35.391,-35.346+0.0001,0.0028)
          lons=np.arange(149.057,149.113+0.0001,0.0030)

          def distance(a,b,c,d):
              p1,p2=map(math.radians,(a,c)); dp=math.radians(c-a); dl=math.radians(d-b)
              x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 12742000*math.asin(math.sqrt(x))

          raw={}; errors=[]
          for index,(lat,lon) in enumerate((float(a),float(b)) for a in lats for b in lons):
              try:
                  found=search_panoramas(lat=lat,lon=lon)
              except Exception as exc:
                  errors.append({'lat':lat,'lon':lon,'error':repr(exc)})
                  continue
              for pano in found:
                  d=distance(lat,lon,float(pano.lat),float(pano.lon))
                  if d>430: continue
                  row={'pano_id':pano.pano_id,'lat':float(pano.lat),'lon':float(pano.lon),
                       'date':pano.date,'road_heading':float(pano.heading),'distance_m':d}
                  old=raw.get(pano.pano_id)
                  if old is None or d<old['distance_m']: raw[pano.pano_id]=row
              if index%40==0: print('search',index,'unique',len(raw),flush=True)
              time.sleep(.04)

          # Earliest panorama per physical capture point; add earliest winter alternative where distinct.
          groups={}
          for row in raw.values(): groups.setdefault((round(row['lat'],5),round(row['lon'],5)),[]).append(row)
          selected=[]
          for rows in groups.values():
              rows.sort(key=lambda r:((int(r['date'][:4]) if r['date'] else 9999),r['date'] or ''))
              picks=[rows[0]]
              winter=[r for r in rows if r['date'] and len(r['date'].split('-'))>1 and int(r['date'].split('-')[1]) in (5,6,7,8)]
              if winter and winter[0]['pano_id']!=rows[0]['pano_id']: picks.append(winter[0])
              selected.extend(picks)
          selected.sort(key=lambda r:((int(r['date'][:4]) if r['date'] else 9999),r['lat'],r['lon']))
          selected=selected[:420]
          Path('results/search_errors.json').write_text(json.dumps(errors,indent=2))
          Path('results/candidates.json').write_text(json.dumps(selected,indent=2))
          print('raw',len(raw),'groups',len(groups),'selected',len(selected),flush=True)

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Referer':'https://www.google.com/maps/'})
          def fetch(row):
              panorama=Image.new('RGB',(1024,512)); pano_id=row['pano_id']
              for x in range(2):
                  response=session.get('https://streetviewpixels-pa.googleapis.com/v1/tile',params={
                      'cb_client':'maps_sv.tactile','panoid':pano_id,'x':x,'y':0,'zoom':1,'nbt':1,'fover':2,
                  },timeout=20)
                  if response.status_code!=200 or not response.content.startswith(b'\xff\xd8'):
                      raise RuntimeError(f'tile status={response.status_code}')
                  panorama.paste(Image.open(io.BytesIO(response.content)).convert('RGB'),(x*512,0))
              return row,panorama

          downloaded=[]; failures=[]
          with ThreadPoolExecutor(max_workers=8) as executor:
              futures={executor.submit(fetch,row):row for row in selected}
              for future in as_completed(futures):
                  try: downloaded.append(future.result())
                  except Exception as exc: failures.append({**futures[future],'error':repr(exc)})
          Path('results/failures.json').write_text(json.dumps(failures,indent=2))
          print('downloaded',len(downloaded),'failed',len(failures),flush=True)

          # Road-facing views: metadata heading, reverse, and small offsets to accommodate camera bearing.
          images=[]; metadata=[]
          for meta,panorama in downloaded:
              equi=np.asarray(panorama)
              for offset in (0,25,-25,180,205,155):
                  heading=(meta['road_heading']+offset)%360
                  projected=py360convert.e2p(equi,fov_deg=(82,62),u_deg=heading,v_deg=-3,out_hw=(252,336),mode='bilinear')
                  images.append(Image.fromarray(np.uint8(np.clip(projected,0,255))))
                  metadata.append({**meta,'view_heading':heading,'heading_offset':offset})

          target=Image.open('ctf/geolocate/input-small.jpg').convert('RGB')
          model=CLIPModel.from_pretrained('openai/clip-vit-base-patch32'); model.eval()
          processor=CLIPProcessor.from_pretrained('openai/clip-vit-base-patch32')
          with torch.no_grad():
              target_feature=model.get_image_features(**processor(images=[target],return_tensors='pt'))
              target_feature=target_feature/target_feature.norm(dim=-1,keepdim=True)
          scores=[]
          for start in range(0,len(images),64):
              with torch.no_grad():
                  features=model.get_image_features(**processor(images=images[start:start+64],return_tensors='pt'))
                  features=features/features.norm(dim=-1,keepdim=True)
              scores.extend((features@target_feature.T).squeeze(1).tolist())
          rows=[{**metadata[i],'clip_score':float(scores[i]),'image_index':i} for i in range(len(images))]
          rows.sort(key=lambda row:row['clip_score'],reverse=True)
          diverse=[]; seen=set()
          for row in rows:
              if row['pano_id'] in seen: continue
              seen.add(row['pano_id']); diverse.append(row)
          Path('results/ranking.json').write_text(json.dumps(rows,indent=2))
          Path('results/diverse_ranking.json').write_text(json.dumps(diverse,indent=2))

          font=ImageFont.load_default()
          for page in range((min(300,len(diverse))+19)//20):
              sheet=Image.new('RGB',(1800,1200),'white'); draw=ImageDraw.Draw(sheet)
              for j,row in enumerate(diverse[page*20:(page+1)*20]):
                  image=images[row['image_index']].copy(); image.thumbnail((350,245))
                  x=(j%5)*360; y=(j//5)*300; sheet.paste(image,(x,y))
                  label=(f"#{page*20+j+1} {row['date'] or '?'} score={row['clip_score']:.4f}\n"
                         f"{row['lat']:.5f},{row['lon']:.5f} h={row['view_heading']:.0f} off={row['heading_offset']}")
                  draw.multiline_text((x+2,y+248),label,fill='black',font=font,spacing=2)
              sheet.save(f'results/contact/top_{page+1:02d}.jpg',quality=92)
          print('TOP',json.dumps(diverse[:50]),flush=True)
          PY

      - name: Upload shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearce-fast-matches
          path: results/
          retention-days: 1
          if-no-files-found: error
