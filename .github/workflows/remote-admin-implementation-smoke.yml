name: Remote Admin Anomaly V1 Implementation Smoke

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.implementation-smoke-trigger'
      - '.github/workflows/remote-admin-implementation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-implementation-smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  implementation-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install Python and real wire dependencies
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests/test_implementation_holdout.py tests/test_smb_semantics.py tests/test_ssh_forwarding.py tests/test_train_serve_parity.py
      - name: Capture Stage-G real client implementations
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env \
            ADMINLAB_PYTHON="$py" \
            ADMINLAB_OUTPUT_UID="$(id -u)" \
            ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard_extended_v4.sh \
              G G-implementation-smoke 80 2026082401 /tmp/adminlab-implementation
      - name: Assert actual implementation coverage
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('/tmp/adminlab-implementation/release')
          sessions=pd.read_parquet(root/'bronze/G-implementation-smoke/manifests/sessions.parquet')
          assert len(sessions)==80, len(sessions)
          assert sessions['status'].eq('success').all(), sessions['status'].value_counts().to_dict()
          impl=set(sessions['implementation_id'].astype(str))
          required={
              'ssh:openssh->openssh-server',
              'ssh:paramiko->openssh-server',
              'smb:smbclient->samba',
              'smb:smbprotocol->samba',
              'rdp:freerdp->xrdp',
              'vnc:rfb-python->tigervnc',
          }
          assert required <= impl, {'missing':sorted(required-impl),'observed':sorted(impl)}
          counts=sessions['implementation_id'].value_counts().to_dict()
          print(json.dumps({'implementations':counts},sort_keys=True))
          PY
      - name: Build Silver M0 and Suricata production Gold
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh /tmp/adminlab-implementation/release G-implementation-smoke
          bash scripts/build_rule_baseline.sh /tmp/adminlab-implementation/release G-implementation-smoke
          python scripts/build_flow_gold_v2.py \
            --release /tmp/adminlab-implementation/release \
            --shard G-implementation-smoke \
            --feature-contract configs/feature_contract.yaml \
            --split-seed 20260824
      - name: Assert unseen-client holdout and no leakage
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('/tmp/adminlab-implementation/release')
          q=root/'quality/G-implementation-smoke'
          prod=json.loads((q/'production_flow_gold.json').read_text())
          leak=json.loads((q/'production_leakage.json').read_text())
          held=set(prod['heldout_client_implementations'])
          assert held, prod
          assert any('paramiko' in x or 'smbprotocol' in x for x in held), held
          assert leak['ok'] is True, leak
          assert not leak['heldout_implementations_in_train'], leak
          labels=pd.read_parquet(root/'gold/G-implementation-smoke/production_flow_labels.parquet')
          challenge=labels[labels['challenge_reason'].fillna('').str.contains('unseen_client_implementation')]
          assert not challenge.empty
          assert set(challenge['implementation_id'].astype(str)) & held
          report={
              'production':prod,
              'leakage':leak,
              'unseen_client_flow_rows':int(len(challenge)),
              'heldout_client_implementations':sorted(held),
          }
          Path('/tmp/adminlab-implementation/IMPLEMENTATION_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-admin-implementation-smoke-${{ github.run_id }}
          path: /tmp/adminlab-implementation
          retention-days: 90
          compression-level: 0
