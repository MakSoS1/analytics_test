name: launchlet-part3-vhostsuffix
on:
  push:
    branches: [agent/launchlet-part3-vhostsuffix-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe ref/instance virtual hosts and encrypt responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import socket,ssl,json,pathlib,re
          origin='task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; suffix='18cf6be4db586bb6'; out=pathlib.Path('package/out')
          hosts=[
            f'preview-8b11c-{suffix}.caplag-task.ru', f'8b11c-{suffix}.caplag-task.ru',
            f'launchlet-demo-board-{suffix}.caplag-task.ru', f'launchlet-demo-board-preview-8b11c-{suffix}.caplag-task.ru',
            f'preview-8b11c-launchlet-demo-board-{suffix}.caplag-task.ru', f'deploy-preview-8b11c-{suffix}.caplag-task.ru',
            f'preview-{suffix}.caplag-task.ru', f'deploy-{suffix}.caplag-task.ru',
            f'launchlet-preview-8b11c-{suffix}.caplag-task.ru', f'launchlet-web-medium-preview-8b11c-{suffix}.caplag-task.ru'
          ]
          ctx=ssl.create_default_context();res=[]
          for h in hosts:
            for path in ['/','/assets/build-manifest.json','/assets/server-reference-manifest.json']:
              try:
                raw=socket.create_connection((origin,443),timeout=6); ss=ctx.wrap_socket(raw,server_hostname=origin); ss.settimeout(6)
                req=f'GET {path} HTTP/1.1\r\nHost: {h}\r\nUser-Agent: Mozilla/5.0\r\nConnection: close\r\n\r\n'.encode(); ss.sendall(req); chunks=[]
                while True:
                  try:c=ss.recv(65536)
                  except socket.timeout:break
                  if not c:break
                  chunks.append(c)
                ss.close(); text=b''.join(chunks).decode('utf-8','replace')
              except Exception as e:text='ERROR '+repr(e)
              item={'host':h,'path':path,'response':text};res.append(item)
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags:(out/'FOUND.txt').write_text(h+'\n'+text);break
            if (out/'FOUND.txt').exists():break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-vhostsuffix-encrypted
          path: artifact/
          retention-days: 1
