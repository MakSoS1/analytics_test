name: Remote Admin Anomaly V1 Phase 1 Corpus

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.phase1-trigger'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  HF_DATASET_REPO: Maksim123321/remote-admin-anomaly-v1
  RELEASE_ID: gh-${{ github.run_id }}-a${{ github.run_attempt }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install extended runtime and run contracts
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests
      - name: Stage A 1000-session real-wire gate
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" bash scripts/capture_shard_extended.sh A A-phase1-gate 1000 2026081440 /tmp/adminlab
          ADMINLAB_PYTHON="$py" bash scripts/build_silver.sh /tmp/adminlab/release A-phase1-gate
          bash scripts/build_rule_baseline.sh /tmp/adminlab/release A-phase1-gate
          python scripts/build_gold.py --release /tmp/adminlab/release --shard A-phase1-gate --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Stage A quality check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path('/tmp/adminlab/release/quality/A-phase1-gate')
          mapping=json.loads((q/'mapping_health.json').read_text()); leakage=json.loads((q/'leakage_checks.json').read_text()); capture=json.loads((q/'capture_health.json').read_text())
          assert mapping['session_mapping_coverage']>=.95,mapping
          assert leakage['ok'] is True,leakage
          assert all(capture['protocol_counts'].get(p,0)>0 for p in ('ssh','smb','rdp','vnc')),capture
          assert capture['dcerpc_train_included'] is False
          print(json.dumps({'mapping':mapping,'leakage':leakage,'capture':capture},sort_keys=True))
          PY
      - name: Retain complete Stage A before HF
        uses: actions/upload-artifact@v4
        with: {name: 'remote-admin-phase1-full-A-phase1-gate-${{ github.run_id }}', path: '/tmp/adminlab/release', retention-days: 90, compression-level: 0}
      - name: Retain Stage A lightweight Gold bundle
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-phase1-gold-A-phase1-gate-${{ github.run_id }}
          path: |
            /tmp/adminlab/release/gold/A-phase1-gate
            /tmp/adminlab/release/bronze/A-phase1-gate/manifests/sessions.parquet
            /tmp/adminlab/release/quality/A-phase1-gate
          retention-days: 90
          compression-level: 0
      - name: Persist Stage A complete dataset layers to HF
        working-directory: remote-admin-anomaly-lab
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: python scripts/upload_hf.py --repo "$HF_DATASET_REPO" --release /tmp/adminlab/release --shard A-phase1-gate --remote-path "releases/$RELEASE_ID" --status /tmp/adminlab/hf.json

  corpus:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {stage: B, shard: B-benign-00, seed: 2026081450}
          - {stage: B, shard: B-benign-01, seed: 2026081451}
          - {stage: C, shard: C-hard-benign-00, seed: 2026081452}
          - {stage: D, shard: D-suspicious-00, seed: 2026081453}
          - {stage: E, shard: E-hard-suspicious-00, seed: 2026081454}
          - {stage: F, shard: F-counterfactual-00, seed: 2026081455}
          - {stage: G, shard: G-sequence-00, seed: 2026081456}
          - {stage: H, shard: H-challenge-00, seed: 2026081457}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install runtime
        working-directory: remote-admin-anomaly-lab
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
      - name: Generate 5000-session real-wire shard
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" bash scripts/capture_shard_extended.sh "${{ matrix.stage }}" "${{ matrix.shard }}" 5000 "${{ matrix.seed }}" /tmp/adminlab
          ADMINLAB_PYTHON="$py" bash scripts/build_silver.sh /tmp/adminlab/release "${{ matrix.shard }}"
          bash scripts/build_rule_baseline.sh /tmp/adminlab/release "${{ matrix.shard }}"
          python scripts/build_gold.py --release /tmp/adminlab/release --shard "${{ matrix.shard }}" --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Retain complete rollback-capable shard before HF
        uses: actions/upload-artifact@v4
        with: {name: 'remote-admin-phase1-full-${{ matrix.shard }}-${{ github.run_id }}', path: '/tmp/adminlab/release', retention-days: 90, compression-level: 0}
      - name: Retain lightweight Gold bundle for global merge
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-phase1-gold-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            /tmp/adminlab/release/gold/${{ matrix.shard }}
            /tmp/adminlab/release/bronze/${{ matrix.shard }}/manifests/sessions.parquet
            /tmp/adminlab/release/quality/${{ matrix.shard }}
          retention-days: 90
          compression-level: 0
      - name: Persist complete shard to private HF when configured
        working-directory: remote-admin-anomaly-lab
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: python scripts/upload_hf.py --repo "$HF_DATASET_REPO" --release /tmp/adminlab/release --shard "${{ matrix.shard }}" --remote-path "releases/$RELEASE_ID" --status /tmp/adminlab/hf.json

  merge-train:
    needs: [gate, corpus]
    if: needs.gate.result == 'success' && needs.corpus.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install model runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-admin-phase1-gold-*-${{ github.run_id }}
          path: /tmp/adminlab-gold-bundles
          merge-multiple: true
      - name: Global merge, split and leakage audit
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: python scripts/merge_gold.py --root /tmp/adminlab-gold-bundles --out /tmp/adminlab-merged --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: Train global M0 M1 M2 and learning curve
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          mkdir -p /tmp/adminlab-merged/models
          python scripts/train_models.py --model-matrix /tmp/adminlab-merged/gold/model_matrix.parquet --out /tmp/adminlab-merged/models --seed 20260814
          python scripts/learning_curve.py --model-matrix /tmp/adminlab-merged/gold/model_matrix.parquet --out /tmp/adminlab-merged/models/learning_curve.json --seed 20260814
      - name: Final Phase 1 quality report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/adminlab-merged'); merge=json.loads((root/'quality/merge_summary.json').read_text()); leakage=json.loads((root/'quality/global_leakage_checks.json').read_text()); models=json.loads((root/'models/summary.json').read_text()); curve=json.loads((root/'models/learning_curve.json').read_text())
          report={'merge':merge,'leakage':leakage,'models':models['models'],'learning_curve':curve}
          assert merge['coverage']>=.95,merge
          assert leakage['ok'] is True,leakage
          (root/'PHASE1_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Retain global Gold/models analysis
        uses: actions/upload-artifact@v4
        with: {name: 'remote-admin-phase1-merged-${{ github.run_id }}', path: '/tmp/adminlab-merged', retention-days: 90, compression-level: 0}
      - name: Upload merged Gold/models to private HF when configured
        working-directory: remote-admin-anomaly-lab
        env: {HF_TOKEN: '${{ secrets.HF_TOKEN }}'}
        run: python scripts/upload_analysis_hf.py --repo "$HF_DATASET_REPO" --folder /tmp/adminlab-merged --remote-path "releases/$RELEASE_ID/merged" --status /tmp/adminlab-merged/hf-status.json
