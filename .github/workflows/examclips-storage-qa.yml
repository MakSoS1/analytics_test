name: ExamClips Storage Regression
on:
  pull_request:
    paths:
      - 'examclips-local/**'
      - '.github/workflows/examclips-storage-qa.yml'
  workflow_dispatch:
jobs:
  browser-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: examclips-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=10 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac test-fixture.mp4
          printf '%s\n' '1' '00:00:00,000 --> 00:00:02,000' 'Docker example' '' '2' '00:00:02,000 --> 00:00:04,000' 'Next step' > test-fixture.srt
          npm run dev -- --host 127.0.0.1 > /tmp/examclips-storage-vite.log 2>&1 &
          sleep 4
          node scripts/library-zoom-resume-smoke.mjs
