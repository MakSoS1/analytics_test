name: Goliath encrypted CTF solver

on:
  pull_request:
    branches: [main]
    paths:
      - ctf/goliath_public/**
      - .github/workflows/goliath-public-encrypted.yml

permissions:
  contents: read

concurrency:
  group: goliath-public-encrypted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Restore and audit exact inputs
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ctf/goliath_public/solver.py.gz.b64 | gzip -d > "$RUNNER_TEMP/solve.py"
          base64 -d ctf/goliath_public/runner.py.gz.b64 | gzip -d > "$RUNNER_TEMP/runner.py"

          test "$(sha256sum ctf/goliath_public/solver.py.gz.b64 | awk '{print $1}')" = \
            "bd2c9896efb40ea2c2a483ecf29cc7d7b8c50b18e7e97177eaa54b444df980e5"
          test "$(sha256sum ctf/goliath_public/runner.py.gz.b64 | awk '{print $1}')" = \
            "48ef5f4a0dfb28e8ef8cdbf97c3b287f254b30334fa6e6ae779b3faed0e28690"
          test "$(sha256sum ctf/goliath_public/result_public.pem | awk '{print $1}')" = \
            "6b211a8d72361a169d7b1349357586fe7e2fb3dd76b50091fcc25f616318ab63"
          test "$(sha256sum "$RUNNER_TEMP/solve.py" | awk '{print $1}')" = \
            "43d4fe52e9695fd0e1ba3fa4a195b4dd8679d9d4dd25d07a73c16d1443175152"
          test "$(sha256sum "$RUNNER_TEMP/runner.py" | awk '{print $1}')" = \
            "7bad33849c22c8b9ce0680ac05fb7160bc3eecfa4d9f97b442b36e82255d046c"

          python3 -m py_compile "$RUNNER_TEMP/solve.py" "$RUNNER_TEMP/runner.py"
          openssl pkey -pubin -in ctf/goliath_public/result_public.pem -noout

          python3 - "$RUNNER_TEMP/solve.py" "$RUNNER_TEMP/runner.py" <<'PY'
          import ast
          import pathlib
          import re
          import sys

          solver_path = pathlib.Path(sys.argv[1])
          runner_path = pathlib.Path(sys.argv[2])
          solver = solver_path.read_text(encoding="utf-8")
          runner = runner_path.read_text(encoding="utf-8")
          old_url = "https://goliath-htjehaaf.avitoctf.ru"
          new_url = "https://goliath-srv-htjehaaf.avitoctf.ru"

          def urls(text: str) -> set[str]:
              return set(re.findall(r"https?://[^\s\"']+", text))

          if urls(solver) != {old_url}:
              raise SystemExit("unexpected URL in supplied solver")
          if urls(runner) != {new_url}:
              raise SystemExit("unexpected URL in active runner")
          if old_url in runner:
              raise SystemExit("launcher domain remains active")

          for path, text in ((solver_path, solver), (runner_path, runner)):
              imported = set()
              for node in ast.walk(ast.parse(text)):
                  if isinstance(node, ast.Import):
                      imported.update(alias.name.split(".")[0] for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imported.add(node.module.split(".")[0])
              forbidden = {"subprocess", "os"} & imported
              if forbidden:
                  raise SystemExit(f"{path.name}: forbidden imports: {sorted(forbidden)}")

          solver_markers = [
              "cp /flag /app/web/dist/{artifact}\\0",
              "def validate_vmfuncref",
              "WASMTIME_DLSYM_GOT",
          ]
          runner_markers = [
              "THREAD_LAYOUT_DELTA = 0x10C000000",
              "MOVE_RE.fullmatch",
              "allow_redirects=False",
              "solver.validate_vmfuncref",
              "reply.get(\"status\") == \"ok\"",
              "solver.Goliath.upload = upload",
              "wake.close()  # body intentionally never read",
          ]
          if any(marker not in solver for marker in solver_markers):
              raise SystemExit("supplied solver safety marker missing")
          if any(marker not in runner for marker in runner_markers):
              raise SystemExit("active runner safety marker missing")
          PY

      - name: Install isolated dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet requests

      - name: Run solver and encrypt result
        id: solve
        shell: bash
        run: |
          set -euo pipefail
          out="ctf/goliath_public/out"
          raw="$RUNNER_TEMP/goliath.raw.log"
          plain="$RUNNER_TEMP/flag.txt"
          rm -rf "$out"
          mkdir -p "$out"

          set +e
          timeout 1900s python3 -u "$RUNNER_TEMP/runner.py" "$RUNNER_TEMP/solve.py" \
            > "$raw" 2>&1
          solver_rc=$?
          set -e

          python3 - "$raw" "$out/diagnostic-sanitized.txt" "$solver_rc" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"avito\{[^}\r\n]{0,500}\}", "avito{REDACTED}", text)
          text = re.sub(r"https?://[^\s]+", "[URL_REDACTED]", text)
          pathlib.Path(sys.argv[2]).write_text(
              f"solver_rc={sys.argv[3]}\n" + text[-70000:] + "\n",
              encoding="utf-8",
          )
          PY

          python3 - "$raw" "$plain" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          flags = re.findall(r"(?m)^avito\{[^}\r\n]{1,300}\}$", text)
          if flags:
              pathlib.Path(sys.argv[2]).write_text(flags[-1] + "\n", encoding="utf-8")
          PY

          if [[ -s "$plain" ]]; then
            openssl pkeyutl -encrypt -pubin \
              -inkey ctf/goliath_public/result_public.pem \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -in "$plain" \
              -out "$out/flag.enc"
            echo "encrypted flag recovered" > "$out/status.txt"
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "flag not recovered" > "$out/status.txt"
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

          rm -f "$plain" "$raw"

      - name: Upload encrypted one-day result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goliath-encrypted-result-${{ github.run_id }}
          path: ctf/goliath_public/out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Mark unsuccessful run
        if: steps.solve.outputs.result != 'success'
        shell: bash
        run: exit 1
