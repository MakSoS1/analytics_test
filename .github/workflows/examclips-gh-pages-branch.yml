name: ExamClips Ready-to-Publish Branch
on:
  push:
    branches: [feat/examclips-library-zoom-storyboard-20261017]
    paths:
      - 'apps/examclips/**'
      - '.github/workflows/examclips-gh-pages-branch.yml'
  workflow_dispatch:
concurrency:
  group: examclips-gh-pages-publish
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prepare-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build tested frontend as static site
        working-directory: apps/examclips
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          EXAMCLIPS_BASE=./ npm run build
          test -f dist/index.html
          test "$(cat dist/CNAME)" = "examclips.dpdns.org"
          touch dist/.nojekyll
          printf '{"source_commit":"%s","source_branch":"%s","build_time":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/site-build.json
      - name: Push prebuilt site to isolated gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apps/examclips/dist
          force_orphan: true
          enable_jekyll: false
