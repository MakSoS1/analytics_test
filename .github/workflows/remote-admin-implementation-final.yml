name: Remote Admin Anomaly V1 Implementation Final

# Evidence rerun: alternate clients + full-timeline selection + causal Gold state.
on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-implementation-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-implementation-final
  cancel-in-progress: true

jobs:
  implementation-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install runtime and implementation contracts
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests/test_implementation_holdout.py tests/test_scenario_quality.py tests/test_persona_holdout.py tests/test_train_serve_parity.py tests/test_capture_v4_winrm_policy.py tests/test_research_split_viability.py tests/test_suricata_gold_nan.py tests/test_online_features_nullable.py tests/test_extended_selection_timeline.py tests/test_reference_context_features.py tests/test_holdout_budget.py
      - name: Capture Stage-G alternative-client wire corpus
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard_extended_v4.sh G G-implementation-final 160 2026082702 /tmp/adminlab-implementation-final
      - name: Assert real client/server implementation coverage
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/adminlab-implementation-final/release'); shard='G-implementation-final'
          sessions=pd.read_parquet(root/'bronze'/shard/'manifests/sessions.parquet')
          assert len(sessions)==160 and sessions['status'].eq('success').all(),sessions['status'].value_counts().to_dict()
          assert max(sessions['protocol'].value_counts())-min(sessions['protocol'].value_counts())<=1
          counts=sessions['implementation_id'].value_counts().to_dict()
          required={'ssh:openssh->openssh-server','ssh:paramiko->openssh-server','smb:smbclient->samba','smb:smbprotocol->samba','rdp:freerdp->xrdp','vnc:rfb-python->tigervnc'}
          assert required<=set(counts),{'missing':sorted(required-set(counts)),'observed':counts}
          assert counts['ssh:paramiko->openssh-server']>=3,counts
          assert counts['smb:smbprotocol->samba']>=3,counts
          Path('/tmp/adminlab-implementation-final/IMPLEMENTATION_WIRE.json').write_text(json.dumps({'counts':counts},indent=2,sort_keys=True)+'\n')
          print(json.dumps(counts,sort_keys=True))
          PY
      - name: Build Silver rules and Suricata production Gold
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh /tmp/adminlab-implementation-final/release G-implementation-final
          bash scripts/build_rule_baseline.sh /tmp/adminlab-implementation-final/release G-implementation-final
          python scripts/build_flow_gold_v2.py --release /tmp/adminlab-implementation-final/release --shard G-implementation-final --feature-contract configs/feature_contract.yaml --split-seed 20260827
      - name: Assert unseen implementation and persona holdouts
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('/tmp/adminlab-implementation-final/release'); shard='G-implementation-final'; q=root/'quality'/shard
          prod=json.loads((q/'production_flow_gold.json').read_text()); leak=json.loads((q/'production_leakage.json').read_text())
          held=set(prod['heldout_client_implementations']); assert held,prod
          assert any('paramiko' in x for x in held),held
          assert any('smbprotocol' in x for x in held),held
          assert leak['ok'] is True,leak
          assert not leak['heldout_client_implementations_in_train'],leak
          assert not leak['heldout_personas_in_train'],leak
          assert all(float(v)>=.90 for v in prod['session_mapping_coverage_by_protocol'].values()),prod
          labels=pd.read_parquet(root/'gold'/shard/'production_flow_labels.parquet')
          unseen=labels[labels['challenge_reason'].fillna('').str.contains('unseen_client_implementation')]; assert not unseen.empty
          assert set(unseen['implementation_id'].astype(str))&held
          persona=labels[labels['challenge_reason'].fillna('').str.contains('unseen_persona')]
          availability=prod.get('holdout_availability',{})
          if availability.get('unseen_persona') == 'selected_within_impact_budget':
              assert not persona.empty
          report={'heldout_client_implementations':sorted(held),'unseen_client_flow_rows':len(unseen),'unseen_persona_flow_rows':len(persona),'production':prod,'leakage':leak}
          Path('/tmp/adminlab-implementation-final/IMPLEMENTATION_FINAL_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n'); print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-admin-implementation-final-${{ github.run_id }}
          path: /tmp/adminlab-implementation-final
          retention-days: 90
          compression-level: 0
