name: Remote Admin Anomaly V1 Planner Audit

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-planner-audit.yml'
      - 'remote-admin-anomaly-lab/src/adminlab/splits.py'
      - 'remote-admin-anomaly-lab/scripts/run_scenarios_extended_v2.py'
      - 'remote-admin-anomaly-lab/src/adminlab/digital_twin.py'
      - 'remote-admin-anomaly-lab/src/adminlab/campaign_sequences.py'
      - 'remote-admin-anomaly-lab/src/adminlab/implementation_variants.py'
      - 'remote-admin-anomaly-lab/src/adminlab/wire_controls.py'
      - 'remote-admin-anomaly-lab/configs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-planner-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install planner runtime
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install -r requirements.txt
      - name: Audit exact Stage-H 1k selection and split composition
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import pandas as pd

          from adminlab.campaign_sequences import organize_campaign_sequences
          from adminlab.config import load_yaml
          from adminlab.digital_twin import load_digital_twin_bundle, plan_digital_twin_sessions
          from adminlab.implementation_variants import materialize_implementation_variants
          from adminlab.splits import assign_grouped_splits
          from adminlab.wire_controls import materialize_wire_controls

          root=Path.cwd()
          spec=importlib.util.spec_from_file_location('extended_runner',root/'scripts/run_scenarios_extended_v2.py')
          assert spec is not None and spec.loader is not None
          runner=importlib.util.module_from_spec(spec); spec.loader.exec_module(runner)

          topology=load_yaml(root/'configs/topology.yaml')
          scenarios=load_yaml(root/'configs/scenarios.yaml')
          netem=load_yaml(root/'configs/netem.yaml')
          bundle=load_digital_twin_bundle(root/'configs')
          seed=2026082602
          planned=plan_digital_twin_sessions(
              topology,scenarios,netem,bundle,seed=seed,count=16000,stage='H'
          )
          selected=runner.balanced_select(planned,1000,runner.TRAIN_PROTOCOLS)
          selected=organize_campaign_sequences(selected,bundle['campaigns'],seed=seed)
          selected=materialize_implementation_variants(selected,stage='H',seed=seed)
          selected=materialize_wire_controls(selected,bundle['behavior'],seed=seed)
          sessions=pd.DataFrame([r.to_dict() for r in selected])
          splits,report=assign_grouped_splits(sessions,seed=20260827)
          merged=sessions.merge(splits,on='session_id',how='left',validate='one_to_one')

          def intdict(series): return {str(k):int(v) for k,v in series.to_dict().items()}
          per_protocol={}
          for protocol,part in merged.groupby('protocol',sort=True):
              per_protocol[str(protocol)]={
                  'n':int(len(part)),
                  'labels':intdict(part['label_binary'].value_counts().sort_index()),
                  'day_min':int(part['simulated_day'].min()),
                  'day_max':int(part['simulated_day'].max()),
                  'unique_days':int(part['simulated_day'].nunique()),
              }
          per_split={}
          for split,part in merged.groupby('split',sort=True):
              per_split[str(split)]={
                  'sessions':int(len(part)),
                  'labels':intdict(part['label_binary'].value_counts().sort_index()),
                  'protocols':intdict(part['protocol'].value_counts().sort_index()),
                  'day_min':int(part['simulated_day'].min()),
                  'day_max':int(part['simulated_day'].max()),
                  'unique_days':int(part['simulated_day'].nunique()),
                  'behaviors':intdict(part['behavior_profile'].value_counts().sort_index()),
                  'netem':intdict(part['netem_profile'].value_counts().sort_index()),
              }

          challenge=merged[merged['split'].astype(str)=='challenge']
          reason_cardinality=challenge['challenge_reason'].fillna('').astype(str).map(
              lambda x:len([r for r in x.split(',') if r])
          ).value_counts().sort_index()
          generic=merged[merged['split'].isin(['train','validation','test'])].copy()
          generic_counts=intdict(generic['split'].value_counts())

          payload={
              'seed':seed,
              'selected_sessions':int(len(merged)),
              'selected_day_min':int(merged['simulated_day'].min()),
              'selected_day_max':int(merged['simulated_day'].max()),
              'selected_unique_days':int(merged['simulated_day'].nunique()),
              'labels':intdict(merged['label_binary'].value_counts().sort_index()),
              'per_protocol':per_protocol,
              'per_split':per_split,
              'generic_split_counts':generic_counts,
              'challenge_fraction':float(len(challenge)/len(merged)),
              'challenge_reason_counts':report.get('challenge_reason_counts',{}),
              'challenge_reason_cardinality':intdict(reason_cardinality),
              'holdout_availability':report.get('holdout_availability',{}),
              'heldout_src_hosts':report.get('heldout_src_hosts',[]),
              'heldout_host_pairs':report.get('heldout_host_pairs',[]),
              'heldout_personas':report.get('heldout_personas',[]),
              'heldout_client_implementations':report.get('heldout_client_implementations',[]),
              'split_report':report,
          }
          out=Path('/tmp/PLANNER_AUDIT.json'); out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))

          assert len(merged)==1000
          assert set(merged['protocol'].astype(str))==set(runner.TRAIN_PROTOCOLS)
          assert merged['protocol'].value_counts().max()-merged['protocol'].value_counts().min()<=1
          assert merged['simulated_day'].nunique()>=30, payload
          assert merged['simulated_day'].max()-merged['simulated_day'].min()>=35, payload
          for protocol,part in merged.groupby('protocol'):
              assert set(part['label_binary'].astype(int))=={0,1}, (protocol,part['label_binary'].value_counts().to_dict())
              assert part['simulated_day'].nunique()>=20, (protocol,part['simulated_day'].nunique())
          for split in ['train','validation','test']:
              part=merged[merged['split'].astype(str)==split]
              assert len(part)>=80, (split,len(part),report)
              assert set(part['label_binary'].astype(int))=={0,1}, (split,part['label_binary'].value_counts().to_dict())
          assert len(challenge)<=450, payload
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-admin-planner-audit-${{ github.run_id }}
          path: /tmp/PLANNER_AUDIT.json
          retention-days: 30
