name: CTF word beta public info

on:
  pull_request:
    branches:
      - ctf-word-beta-info-20260731

permissions:
  contents: read

env:
  TARGET_ORIGIN: https://bushbash.cssa.club

jobs:
  fetch-public-info:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public challenge 25 details as inert data
        shell: bash
        run: |
          set -u
          mkdir -p public-info
          curl --location --compressed --max-time 30 \
            --user-agent 'Mozilla/5.0 (compatible; public-ctf-metadata-check/1.0)' \
            --dump-header public-info/detail.headers \
            --output public-info/detail.json \
            "$TARGET_ORIGIN/api/challenges/25" || true

          python3 - <<'PY'
          import json
          import pathlib
          root = pathlib.Path('public-info')
          raw = (root / 'detail.json').read_text('utf-8', errors='replace') if (root / 'detail.json').exists() else ''
          try:
              payload = json.loads(raw)
              (root / 'pretty.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          except Exception as exc:
              (root / 'parse-error.txt').write_text(repr(exc), encoding='utf-8')
          PY

          {
            echo '=== headers ==='
            cat public-info/detail.headers 2>/dev/null || true
            echo '=== public challenge detail ==='
            cat public-info/pretty.json 2>/dev/null || cat public-info/detail.json 2>/dev/null || true
          } > public-info/summary.txt

      - name: Upload public response data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-word-beta-public-detail
          path: public-info
          if-no-files-found: error
          retention-days: 1
