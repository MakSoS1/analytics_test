name: CTF word beta public info

on:
  pull_request:
    branches:
      - ctf-word-beta-info-20260731

permissions:
  contents: read

env:
  TARGET_ORIGIN: https://bushbash.cssa.club

jobs:
  fetch-public-info:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public challenge metadata as inert data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-info

          curl --location --compressed --max-time 30 \
            --user-agent 'Mozilla/5.0 (compatible; public-ctf-metadata-check/1.0)' \
            --dump-header public-info/challenges.headers \
            --output public-info/challenges.json \
            "$TARGET_ORIGIN/api/challenges"

          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path('public-info')
          payload = json.loads((root / 'challenges.json').read_text('utf-8'))
          data = payload.get('data', payload)
          entries = data.get('entries', data) if isinstance(data, dict) else data
          if not isinstance(entries, list):
              raise SystemExit(f'Unexpected challenge list shape: {type(entries).__name__}')

          matches = []
          for entry in entries:
              title = str(entry.get('title', ''))
              slug = str(entry.get('slug', ''))
              if 'say the word on beta' in title.lower() or 'word' in slug.lower() and 'beta' in slug.lower():
                  matches.append(entry)

          (root / 'matches.json').write_text(json.dumps(matches, indent=2, ensure_ascii=False), encoding='utf-8')
          for index, entry in enumerate(matches):
              challenge_id = entry.get('id')
              if challenge_id is None:
                  continue
              subprocess.run([
                  'curl', '--location', '--compressed', '--max-time', '30',
                  '--user-agent', 'Mozilla/5.0 (compatible; public-ctf-metadata-check/1.0)',
                  '--dump-header', str(root / f'detail-{index}.headers'),
                  '--output', str(root / f'detail-{index}.json'),
                  f'https://bushbash.cssa.club/api/challenges/{challenge_id}',
              ], check=True)
          PY

          {
            echo '=== matching list entry ==='
            cat public-info/matches.json
            echo '=== public challenge details ==='
            for f in public-info/detail-*.json; do
              [ -e "$f" ] || continue
              cat "$f"
              echo
            done
          } > public-info/summary.txt

      - name: Upload public response data
        uses: actions/upload-artifact@v4
        with:
          name: ctf-word-beta-public-challenge
          path: public-info
          if-no-files-found: error
          retention-days: 1
