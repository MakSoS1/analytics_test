name: CTF word beta public info

on:
  pull_request:
    branches:
      - ctf-word-beta-info-20260731

permissions:
  contents: read

env:
  TARGET_ORIGIN: https://bushbash.cssa.club

jobs:
  fetch-public-info:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch targeted public application modules as inert data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-info
          urls=(
            "$TARGET_ORIGIN/_app/immutable/chunks/index.svelte.B3fu_cno.js"
            "$TARGET_ORIGIN/_app/immutable/nodes/30.B2rEhVGm.js"
            "$TARGET_ORIGIN/_app/immutable/chunks/auth.svelte.-AnqlxAT.js"
            "$TARGET_ORIGIN/_app/immutable/chunks/entry.DtQAtgh9.js"
            "$TARGET_ORIGIN/challenges"
          )
          : > public-info/index.tsv
          i=0
          for url in "${urls[@]}"; do
            body="public-info/$(printf '%02d' "$i").body"
            headers="public-info/$(printf '%02d' "$i").headers"
            status=$(curl --location --compressed --max-time 30 \
              --user-agent 'Mozilla/5.0 (compatible; public-ctf-metadata-check/1.0)' \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
              "$url" || true)
            printf '%s\t%s\t%s\n' "$i" "$status" "$url" >> public-info/index.tsv
            i=$((i+1))
          done
          {
            echo '=== requests ==='
            cat public-info/index.tsv
            echo '=== candidate strings ==='
            grep -RaoEi 'https?://[^"'"'"' <>)]*|[^"'"'"']*(api_base|vite_api|/challenges|hint|say the word|beta)[^"'"'"']*' public-info/*.body 2>/dev/null | sort -u | head -n 2000 || true
          } > public-info/summary.txt

      - name: Upload public response data
        uses: actions/upload-artifact@v4
        with:
          name: ctf-word-beta-public-info-targeted
          path: public-info
          if-no-files-found: error
          retention-days: 1
