name: CTF word beta public info

on:
  pull_request:
    branches:
      - ctf-word-beta-info-20260731

permissions:
  contents: read

env:
  TARGET_ORIGIN: https://bushbash.cssa.club

jobs:
  fetch-public-info:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch raw public challenge metadata as inert data
        shell: bash
        run: |
          set -u
          mkdir -p public-info

          curl --location --compressed --max-time 30 \
            --user-agent 'Mozilla/5.0 (compatible; public-ctf-metadata-check/1.0)' \
            --dump-header public-info/challenges.headers \
            --output public-info/challenges.json \
            "$TARGET_ORIGIN/api/challenges" || true

          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path('public-info')
          raw = (root / 'challenges.json').read_text('utf-8', errors='replace') if (root / 'challenges.json').exists() else ''
          try:
              payload = json.loads(raw)
              pretty = json.dumps(payload, indent=2, ensure_ascii=False)
              shape = {'top_type': type(payload).__name__}
              if isinstance(payload, dict):
                  shape['top_keys'] = list(payload.keys())
                  for key, value in payload.items():
                      shape[f'{key}_type'] = type(value).__name__
                      if isinstance(value, dict):
                          shape[f'{key}_keys'] = list(value.keys())
              (root / 'pretty.json').write_text(pretty, encoding='utf-8')
              (root / 'shape.json').write_text(json.dumps(shape, indent=2), encoding='utf-8')
          except Exception as exc:
              (root / 'parse-error.txt').write_text(repr(exc), encoding='utf-8')
          PY

          {
            echo '=== headers ==='
            cat public-info/challenges.headers 2>/dev/null || true
            echo '=== response shape ==='
            cat public-info/shape.json 2>/dev/null || true
            echo '=== raw/pretty public JSON ==='
            cat public-info/pretty.json 2>/dev/null || cat public-info/challenges.json 2>/dev/null || true
          } > public-info/summary.txt

      - name: Upload public response data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf-word-beta-public-challenge-raw
          path: public-info
          if-no-files-found: error
          retention-days: 1
