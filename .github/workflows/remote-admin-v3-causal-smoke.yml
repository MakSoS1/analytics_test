name: Remote Admin Anomaly V3 Causal NGFW Smoke

on:
  workflow_dispatch:
  push:
    branches: [remote-admin-anomaly-lab-v3]
    paths:
      - '.github/workflows/remote-admin-v3-causal-smoke.yml'
      - 'remote-admin-anomaly-lab/configs/topology.yaml'
      - 'remote-admin-anomaly-lab/configs/feature_contract.yaml'
      - 'remote-admin-anomaly-lab/src/adminlab/v3_causal.py'
      - 'remote-admin-anomaly-lab/src/adminlab/v3_signal.py'
      - 'remote-admin-anomaly-lab/src/adminlab/online_features.py'
      - 'remote-admin-anomaly-lab/src/adminlab/v3_modeling.py'
      - 'remote-admin-anomaly-lab/scripts/setup_topology.sh'
      - 'remote-admin-anomaly-lab/scripts/start_services.sh'
      - 'remote-admin-anomaly-lab/scripts/start_extended_services_v2.py'
      - 'remote-admin-anomaly-lab/scripts/run_scenarios_v3_causal.py'
      - 'remote-admin-anomaly-lab/scripts/capture_shard_v3.sh'
      - 'remote-admin-anomaly-lab/scripts/build_flow_gold_v2.py'
      - 'remote-admin-anomaly-lab/scripts/build_hierarchical_gold_v3.py'
      - 'remote-admin-anomaly-lab/scripts/train_v3_models.py'
      - 'remote-admin-anomaly-lab/scripts/score_eve_sidecar.py'

permissions:
  contents: read

concurrency:
  group: remote-admin-v3-causal-smoke
  cancel-in-progress: true

jobs:
  causal-ngfw-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      ROOT_OUT: /tmp/remote-admin-v3-causal-smoke
      RELEASE_ROOT: /tmp/remote-admin-v3-causal-smoke/release
      SHARD: V3-causal-smoke
      SEED: '2026081601'
    defaults:
      run:
        working-directory: remote-admin-anomaly-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install V3 wire parser runtime
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          command -v tcpdump
          command -v suricata
          command -v zeek
      - name: Run corrected V3 causal contracts
        run: |
          pytest -q tests/test_v3_causal_signal.py tests/test_v3_split_state.py tests/test_online_features.py tests/test_v3_flow_modeling.py
      - name: Capture 80 corrected real-wire V3 sessions
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" ADMINLAB_V3_MATCHED_FRACTION=0.40 \
            bash scripts/capture_shard_v3.sh H "$SHARD" 80 "$SEED" "$ROOT_OUT"
      - name: Assert executed causal corpus
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from adminlab.manifest import SessionRecord
          from adminlab.v3_signal import audit_v3_signal_plan
          p=Path('/tmp/remote-admin-v3-causal-smoke/release/bronze/V3-causal-smoke/manifests/sessions.jsonl')
          rows=[SessionRecord.from_dict(json.loads(line)) for line in p.read_text().splitlines() if line.strip()]
          assert len(rows)==80 and all(r.status=='success' for r in rows)
          assert Counter(int(r.label_binary) for r in rows)==Counter({0:40,1:40})
          assert Counter(r.protocol for r in rows)==Counter({'ssh':20,'smb':20,'rdp':20,'vnc':20})
          for protocol in ('ssh','smb','rdp','vnc'):
              assert Counter(int(r.label_binary) for r in rows if r.protocol==protocol)==Counter({0:10,1:10})
          assert len({r.src_host_id for r in rows})>=20
          assert len({r.dst_host_id for r in rows})>=8
          signal=audit_v3_signal_plan(rows)
          assert signal['causal_observability']['valid'] is True, signal
          assert signal['counterfactual_row_fraction']>=0.40, signal
          print(json.dumps({'sources':len({r.src_host_id for r in rows}),'destinations':len({r.dst_host_id for r in rows}),'signal':signal['causal_observability']},sort_keys=True))
          PY
      - name: Build Suricata Zeek and flow Gold
        run: |
          bash scripts/build_silver.sh "$RELEASE_ROOT" "$SHARD"
          python scripts/build_flow_gold_v2.py --release "$RELEASE_ROOT" --shard "$SHARD" --feature-contract configs/feature_contract.yaml --split-seed "$SEED"
          python scripts/build_hierarchical_gold_v3.py --release "$RELEASE_ROOT" --shard "$SHARD" --contract configs/v3_feature_contract.yaml --split-seed "$SEED"
      - name: Train flow-primary model and research views
        run: |
          GOLD="$RELEASE_ROOT/gold/$SHARD"
          python scripts/train_v3_models.py --flow "$GOLD/production_model_matrix.parquet" --session "$GOLD/session_model_matrix.parquet" --campaign "$GOLD/campaign_model_matrix.parquet" --out "$GOLD/models" --seed "$SEED"
      - name: Evaluate flow hard-benign and sidecar parity
        run: |
          GOLD="$RELEASE_ROOT/gold/$SHARD"; QUALITY="$RELEASE_ROOT/quality/$SHARD"
          python scripts/evaluate_hard_benign.py --model "$GOLD/models/flow-primary.joblib" --metrics "$GOLD/models/flow-primary.metrics.json" --model-matrix "$GOLD/production_model_matrix.parquet" --labels "$GOLD/production_flow_labels.parquet" --out "$QUALITY/hard_benign_flow.json"
          zstd -dc "$RELEASE_ROOT/silver/$SHARD/suricata/eve.json.zst" > /tmp/v3-smoke-eve.json
          python scripts/score_eve_sidecar.py --model "$GOLD/models/M1-lightgbm.joblib" --metrics "$GOLD/models/M1-lightgbm.metrics.json" --eve /tmp/v3-smoke-eve.json --emit-all > /tmp/v3-sidecar.jsonl
          test -s /tmp/v3-sidecar.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/v3-sidecar.jsonl').read_text().splitlines() if x.strip()]
          assert rows and all(r['event_type']=='remote_admin_ml' and r['candidate_stream']=='remote-admin' for r in rows)
          print(json.dumps({'sidecar_scored_flows':len(rows),'alerts':sum(bool(r['alert']) for r in rows)},sort_keys=True))
          PY
      - name: Write smoke evidence
        if: always()
        run: |
          mkdir -p /tmp/v3-smoke-evidence
          cp -a "$RELEASE_ROOT/quality/$SHARD" /tmp/v3-smoke-evidence/quality 2>/dev/null || true
          cp -a "$RELEASE_ROOT/gold/$SHARD/models" /tmp/v3-smoke-evidence/models 2>/dev/null || true
          cp "$ROOT_OUT/work/$SHARD/scenarios/summary.json" /tmp/v3-smoke-evidence/scenario-summary.json 2>/dev/null || true
          cp /tmp/v3-sidecar.jsonl /tmp/v3-smoke-evidence/sidecar.jsonl 2>/dev/null || true
      - name: Upload corrected V3 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-v3-causal-smoke-${{ github.run_id }}
          path: /tmp/v3-smoke-evidence
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
