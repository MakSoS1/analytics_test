name: Remote Admin Anomaly V1 V4 Integration Smoke

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths: ['remote-admin-anomaly-lab/.v4-smoke-trigger']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: remote-admin-anomaly-lab/requirements.txt}
      - name: Install and contract gate
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests
      - name: Balanced real-wire capture
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env ADMINLAB_PYTHON="$py" ADMINLAB_OUTPUT_UID="$(id -u)" ADMINLAB_OUTPUT_GID="$(id -g)" bash scripts/capture_shard_extended_v4.sh A A-v4-smoke 40 2026081470 /tmp/adminlab-v4
      - name: Silver and both Gold representations
        working-directory: remote-admin-anomaly-lab
        env: {PYTHONPATH: src}
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh /tmp/adminlab-v4/release A-v4-smoke
          bash scripts/build_rule_baseline.sh /tmp/adminlab-v4/release A-v4-smoke
          python scripts/build_gold.py --release /tmp/adminlab-v4/release --shard A-v4-smoke --feature-contract configs/feature_contract.yaml --split-seed 20260814
          python scripts/build_flow_gold_v2.py --release /tmp/adminlab-v4/release --shard A-v4-smoke --feature-contract configs/feature_contract.yaml --split-seed 20260814
      - name: V4 quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=Path('/tmp/adminlab-v4/release/quality/A-v4-smoke')
          cap=json.loads((q/'capture_health.json').read_text()); parser=json.loads((q/'parser_health.json').read_text()); prod=json.loads((q/'production_flow_gold.json').read_text()); leak=json.loads((q/'leakage_checks.json').read_text())
          assert cap['sessions']==40,cap
          assert cap['protocol_counts']=={'rdp':10,'smb':10,'ssh':10,'vnc':10},cap
          assert cap['dcerpc_train_included'] is False and cap['partial_winrm_included'] is False
          assert parser['suricata_flow_events']>0 and parser['zeek_conn_lines']>0,parser
          assert prod['session_mapping_coverage']>=.95 and prod['conn_mapping_coverage']>=.90 and prod['uid_alignment_coverage']==1.0,prod
          assert leak['ok'] is True,leak
          report={'capture':cap,'parser':parser,'production':prod,'leakage':leak}
          Path('/tmp/adminlab-v4/V4_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n'); print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'remote-admin-v4-smoke-${{ github.run_id }}', path: '/tmp/adminlab-v4', retention-days: 90, compression-level: 0}
