name: proxyport-solver-a

on:
  push:
    paths:
      - ".github/workflows/proxyport_solver_a.yml"

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev

      - name: Build PoW solver
        shell: bash
        run: |
          cat > /tmp/pow_solver.c <<'EOF'
          #include <openssl/sha.h>
          #include <pthread.h>
          #include <stdatomic.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          static const char *prefix;
          static int nthreads;
          static atomic_int found = 0;
          static unsigned long long answer = 0;

          static void *worker(void *arg) {
              unsigned long long i = (unsigned long long)(uintptr_t)arg;
              SHA256_CTX base;
              SHA256_Init(&base);
              SHA256_Update(&base, prefix, strlen(prefix));
              char suffix[32];
              unsigned char digest[SHA256_DIGEST_LENGTH];
              while (!atomic_load_explicit(&found, memory_order_relaxed)) {
                  int n = snprintf(suffix, sizeof(suffix), "%llu", i);
                  SHA256_CTX ctx = base;
                  SHA256_Update(&ctx, suffix, (size_t)n);
                  SHA256_Final(digest, &ctx);
                  if (digest[0] == 0 && digest[1] == 0 && digest[2] == 0 && (digest[3] & 0xC0) == 0) {
                      int expected = 0;
                      if (atomic_compare_exchange_strong(&found, &expected, 1)) answer = i;
                      break;
                  }
                  i += (unsigned long long)nthreads;
              }
              return NULL;
          }

          int main(int argc, char **argv) {
              if (argc != 2) return 2;
              prefix = argv[1];
              nthreads = (int)sysconf(_SC_NPROCESSORS_ONLN);
              if (nthreads < 1) nthreads = 1;
              pthread_t *threads = calloc((size_t)nthreads, sizeof(*threads));
              for (int i = 0; i < nthreads; i++) pthread_create(&threads[i], NULL, worker, (void *)(uintptr_t)i);
              for (int i = 0; i < nthreads; i++) pthread_join(threads[i], NULL);
              free(threads);
              printf("%llu\n", answer);
              return 0;
          }
          EOF
          gcc -O3 -pthread /tmp/pow_solver.c -lcrypto -o /tmp/pow_solver

      - name: Solve challenge with mapping A
        shell: bash
        run: |
          rm -rf proxyport_solution_a
          mkdir -p proxyport_solution_a/raw
          cat > /tmp/solve.py <<'PY'
          import re
          import select
          import socket
          import ssl
          import subprocess
          import time
          import traceback

          INTERACTIVE = "rsgnw4zbmevuj3ax3yti2es6o4m.cloud.d3c.tf"
          FORWARD = "r7htyblntpq7lws4trd4zngje2a.cloud.d3c.tf"
          PORT = 443
          PROMPT = b"submit `answer gost` or `answer frp`"
          logs = []

          def log(msg):
              line = f"[{time.monotonic():.6f}] {msg}"
              print(line, flush=True)
              logs.append(line)

          def tls_connect(host, timeout=4.0):
              t0 = time.monotonic()
              raw = socket.create_connection((host, PORT), timeout=timeout)
              raw.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
              ctx = ssl.create_default_context()
              s = ctx.wrap_socket(raw, server_hostname=host)
              s.setblocking(False)
              return s, time.monotonic() - t0

          class BufferedTLS:
              def __init__(self, sock):
                  self.sock = sock
                  self.buf = bytearray()
                  self.eof = False

              def send(self, data):
                  self.sock.setblocking(True)
                  self.sock.sendall(data)
                  self.sock.setblocking(False)

              def read_until(self, markers, timeout):
                  if isinstance(markers, (bytes, bytearray)):
                      markers = [bytes(markers)]
                  end = time.monotonic() + timeout
                  while True:
                      hits = [(self.buf.find(m), m) for m in markers]
                      hits = [(i, m) for i, m in hits if i >= 0]
                      if hits:
                          i, m = min(hits, key=lambda x: x[0])
                          cut = i + len(m)
                          out = bytes(self.buf[:cut])
                          del self.buf[:cut]
                          return out, m, self.eof
                      if self.eof or time.monotonic() >= end:
                          out = bytes(self.buf)
                          self.buf.clear()
                          return out, None, self.eof
                      r, _, _ = select.select([self.sock], [], [], min(0.1, max(0.0, end-time.monotonic())))
                      if not r:
                          continue
                      try:
                          chunk = self.sock.recv(8192)
                          if not chunk:
                              self.eof = True
                          else:
                              self.buf.extend(chunk)
                      except (ssl.SSLWantReadError, BlockingIOError):
                          pass

              def drain(self, timeout=0.15):
                  end = time.monotonic() + timeout
                  while time.monotonic() < end and not self.eof:
                      r, _, _ = select.select([self.sock], [], [], min(0.05, end-time.monotonic()))
                      if not r:
                          continue
                      try:
                          chunk = self.sock.recv(8192)
                          if not chunk:
                              self.eof = True
                              break
                          self.buf.extend(chunk)
                      except (ssl.SSLWantReadError, BlockingIOError):
                          pass
                  out = bytes(self.buf)
                  self.buf.clear()
                  return out

          def forward_probe(round_no):
              s = None
              try:
                  s, ct = tls_connect(FORWARD)
                  req = b"GET / HTTP/1.1\r\nHost: probe\r\nConnection: close\r\n\r\n"
                  s.setblocking(True)
                  s.sendall(req)
                  s.setblocking(False)
                  end = time.monotonic() + 0.9
                  data = bytearray()
                  eof = False
                  while time.monotonic() < end and len(data) < 16384:
                      r, _, _ = select.select([s], [], [], min(0.1, end-time.monotonic()))
                      if not r:
                          continue
                      try:
                          chunk = s.recv(8192)
                          if not chunk:
                              eof = True
                              break
                          data.extend(chunk)
                      except (ssl.SSLWantReadError, BlockingIOError):
                          pass
                  payload = bytes(data)
                  log(f"PROBE round={round_no} connect={ct:.6f} eof={eof} len={len(payload)} repr={payload!r}")
                  return payload
              finally:
                  if s is not None:
                      try: s.close()
                      except Exception: pass

          try:
              sock, ct = tls_connect(INTERACTIVE)
              io = BufferedTLS(sock)
              log(f"INTERACTIVE connect={ct:.6f}")
              banner, marker, eof = io.read_until(b"submit: pow <suffix>", 5.0)
              log(f"BANNER {banner!r} marker={marker!r} eof={eof}")
              m = re.search(rb"prefix:\s*([0-9a-fA-F]+)", banner)
              if not m:
                  raise RuntimeError("PoW prefix not found")
              prefix = m.group(1).decode()
              t0 = time.monotonic()
              suffix = subprocess.check_output(["/tmp/pow_solver", prefix], text=True, timeout=300).strip()
              log(f"POW prefix={prefix} suffix={suffix} solve={time.monotonic()-t0:.3f}")
              io.send(f"pow {suffix}\n".encode())

              pre, marker, eof = io.read_until(PROMPT, 6.0)
              log(f"FIRST_PROMPT {pre!r} marker={marker!r} eof={eof}")
              if marker is None:
                  raise RuntimeError("First round prompt not received")

              for rnd in range(1, 21):
                  data = forward_probe(rnd)
                  answer = "gost" if b"caddy" in data.lower() else "frp"
                  log(f"CLASSIFY round={rnd} answer={answer}")
                  io.send(f"answer {answer}\n".encode())

                  ack, ack_marker, eof = io.read_until([b"recorded\n", b"round timed out", b"incorrect", b"wrong", b"flag", b"CTF{"], 2.5)
                  tail = io.drain(0.12)
                  combined = ack + tail
                  log(f"ACK round={rnd} data={combined!r} marker={ack_marker!r} eof={eof}")
                  if eof or b"round timed out" in combined.lower() or b"incorrect" in combined.lower() or b"wrong" in combined.lower():
                      break
                  if rnd < 20:
                      prompt, pm, eof = io.read_until(PROMPT, 3.0)
                      log(f"PROMPT round={rnd+1} data={prompt!r} marker={pm!r} eof={eof}")
                      if pm is None or eof:
                          break

              final = io.drain(2.0)
              log(f"FINAL {final!r} eof={io.eof}")
              try: sock.close()
              except Exception: pass
          except Exception:
              log("FATAL " + traceback.format_exc())

          with open("proxyport_solution_a/raw/session.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(logs) + "\n")
          PY
          timeout 540s python3 /tmp/solve.py

      - name: Encrypt result before commit
        shell: bash
        run: |
          cat > proxyport_solution_a/public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1EcNw1wCF/68hhizkEAW
          8CLSMGdggdbKip//N49VWh99dlz49+tPSQuyoKGSV3+982Mi3zcFV0i0ARYXDVjR
          2djQfHhRI8IyXksbGmUqofqmt5bpNeztW4wKZCPP9VmiNgw0DTWwHWVmohBt25fP
          MvB3NfXyp5PRtBg0txVnxciVAIkiSvF76ZewhZ/Qe7rZ9X0ZCryjd3sOarErqJMg
          dIcCLIziooDkCmqG0KWxIJmEVqiSyQ7ZAvFNFDYahygZzHIpBc+zkFgM7gzeoLeY
          CAh9VAVM1GVqLm0fs/Wi8gWruVzlYy4b2dBmeSDVOuLgi0q+lrqezuf0uTCaKRC8
          ewIDAQAB
          -----END PUBLIC KEY-----
          EOF
          tar -C proxyport_solution_a/raw -czf proxyport_solution_a/result.tar.gz .
          openssl rand -out proxyport_solution_a/key.bin 32
          openssl rand -out proxyport_solution_a/iv.bin 16
          KEY_HEX="$(xxd -p -c 256 proxyport_solution_a/key.bin)"
          IV_HEX="$(xxd -p -c 256 proxyport_solution_a/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in proxyport_solution_a/result.tar.gz -out proxyport_solution_a/result.enc
          cat proxyport_solution_a/key.bin proxyport_solution_a/iv.bin > proxyport_solution_a/keyiv.bin
          openssl pkeyutl -encrypt -pubin -inkey proxyport_solution_a/public.pem -pkeyopt rsa_padding_mode:oaep -in proxyport_solution_a/keyiv.bin -out proxyport_solution_a/keyiv.enc
          base64 -w0 proxyport_solution_a/result.enc > proxyport_solution_a/result.enc.b64
          base64 -w0 proxyport_solution_a/keyiv.enc > proxyport_solution_a/keyiv.enc.b64
          rm -rf proxyport_solution_a/raw proxyport_solution_a/public.pem proxyport_solution_a/result.tar.gz proxyport_solution_a/result.enc proxyport_solution_a/key.bin proxyport_solution_a/iv.bin proxyport_solution_a/keyiv.bin proxyport_solution_a/keyiv.enc

      - name: Commit encrypted result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxyport_solution_a/result.enc.b64 proxyport_solution_a/keyiv.enc.b64
          git commit -m "Add encrypted proxyport solver result A" || exit 0
          git push
