name: MBI hourly email monitor

on:
  schedule:
    - cron: '10 * * * *'
    - cron: '40 8 5 8 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbi-hourly-email-monitor
  cancel-in-progress: false

jobs:
  monitor-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Check monitoring window
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date -u +%s)
          DEADLINE=$(date -u -d '2026-08-05 09:00:00' +%s)
          if [ "$NOW" -le "$DEADLINE" ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download official MBI list
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fsS -4 \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 3 \
            --resolve inet.ibi.spb.ru:80:195.5.154.130 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0.0.0 Safari/537.36' \
            -e 'https://ibispb.ru/abitur/bachelor/terms-and-conditions-of-admission/' \
            'http://inet.ibi.spb.ru/raspisan/ks/cb2026.php?c=bak-o-b' \
            -o output/MBI_очная_бюджет.html

          test -s output/MBI_очная_бюджет.html
          grep -q '1609688' output/MBI_очная_бюджет.html

      - name: Parse position and prepare email
        if: steps.gate.outputs.active == 'true'
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          APPLICANT_ID = '1609688'
          CONFIRMED_GENERAL_PLACES = 9
          SOURCE = Path('output/MBI_очная_бюджет.html')

          raw = SOURCE.read_text(encoding='utf-8', errors='replace')
          marker = '38.05.01 «Экономическая безопасность»'
          start = raw.find(marker)
          if start < 0:
              raise SystemExit('Не найдена программа 38.05.01 «Экономическая безопасность»')

          next_list = raw.find('Конкурсный список лиц, подавших документы', start + len(marker))
          block = raw[start:next_list if next_list >= 0 else len(raw)]

          source_date_match = re.search(
              r'на\s+(\d{2}\s+[^<]+?\s+\d{4}\s+года)',
              block,
              flags=re.I,
          )
          source_date = (
              html.unescape(source_date_match.group(1)).strip()
              if source_date_match
              else 'дата в заголовке не распознана'
          )

          main_heading_patterns = [
              r'<h3[^>]*>\s*Основные места\s*</h3>',
              r'>\s*Основные места\s*<',
          ]
          main_start = -1
          for pattern in main_heading_patterns:
              match = re.search(pattern, block, flags=re.I | re.S)
              if match:
                  main_start = match.end()
                  break
          if main_start < 0:
              raise SystemExit('Не найдена таблица основных мест')

          table_start = block.find('<table', main_start)
          table_end = block.find('</table>', table_start)
          if table_start < 0 or table_end < 0:
              raise SystemExit('Таблица основных мест повреждена или отсутствует')
          table = block[table_start:table_end + len('</table>')]

          def clean(value: str) -> str:
              value = re.sub(r'<[^>]+>', '', value, flags=re.S)
              value = html.unescape(value)
              return re.sub(r'\s+', ' ', value).strip()

          rows: list[dict[str, object]] = []
          for tr in re.findall(r'<tr[^>]*>(.*?)</tr>', table, flags=re.I | re.S):
              cells = [
                  clean(cell)
                  for cell in re.findall(r'<td[^>]*>(.*?)</td>', tr, flags=re.I | re.S)
              ]
              if len(cells) < 2 or not cells[0].isdigit():
                  continue

              note = cells[-1] if cells else ''
              total_score = None
              for candidate in reversed(cells[:-1]):
                  if candidate.isdigit() and 100 <= int(candidate) <= 400:
                      total_score = int(candidate)
                      break

              rows.append({
                  'position': int(cells[0]),
                  'id': cells[1],
                  'score': total_score,
                  'note': note,
                  'consent': 'получено согласие на зачисление' in note.lower(),
              })

          own_index = next((i for i, row in enumerate(rows) if row['id'] == APPLICANT_ID), None)
          if own_index is None:
              raise SystemExit(f'Абитуриент {APPLICANT_ID} не найден в основных местах')

          own = rows[own_index]
          above = rows[:own_index]
          consents_above = [row for row in above if row['consent']]
          own_consent = bool(own['consent'])
          consent_rank = len(consents_above) + 1 if own_consent else None

          if not own_consent:
              verdict = 'ВНИМАНИЕ: согласие в МБИ не отображается'
          elif consent_rank is not None and consent_rank > CONFIRMED_GENERAL_PLACES:
              verdict = 'НЕ ПРОХОДИТ в пределах 9 официально подтверждённых мест'
          elif consent_rank == CONFIRMED_GENERAL_PLACES:
              verdict = 'ПРОХОДИТ, но занимает последнее подтверждённое место без запаса'
          else:
              margin = CONFIRMED_GENERAL_PLACES - int(consent_rank)
              verdict = f'ПРОХОДИТ; запас по подтверждённым местам: {margin}'

          msk = timezone(timedelta(hours=3))
          checked_at = datetime.now(msk).strftime('%d.%m.%Y %H:%M:%S МСК')

          consent_lines = '\n'.join(
              f"{index}. ID {row['id']} — место {row['position']}, баллы {row['score'] or 'не распознаны'}"
              for index, row in enumerate(consents_above, start=1)
          ) or 'Нет согласий выше.'

          subject = (
              f"МБИ: место {own['position']}, среди согласившихся "
              f"{consent_rank if consent_rank is not None else 'нет согласия'} — {checked_at}"
          )

          body = f"""Почасовая проверка официального конкурсного списка МБИ

Абитуриент: {APPLICANT_ID}
Программа: 38.05.01 «Экономическая безопасность», очная форма, бюджет
Проверено: {checked_at}
Дата списка на странице: {source_date}

Место в общем конкурсе: {own['position']}
Конкурсный балл: {own['score'] or 'не распознан'}
Согласие в МБИ: {'ЕСТЬ' if own_consent else 'НЕТ'}
Количество согласий выше: {len(consents_above)}
Место среди абитуриентов с согласием: {consent_rank if consent_rank is not None else 'не определяется'}
Официально подтверждённых мест общего конкурса: {CONFIRMED_GENERAL_PLACES}

Оценка: {verdict}

Согласия выше:
{consent_lines}

Важно: 10 или 11 мест не считаются подтверждёнными, пока МБИ официально не отобразит перераспределение.
Во вложении — HTML-файл страницы официального списка, полученный в момент проверки.
"""

          Path('output/email_subject.txt').write_text(subject, encoding='utf-8')
          Path('output/email_body.txt').write_text(body, encoding='utf-8')
          Path('output/status.json').write_text(
              json.dumps(
                  {
                      'checked_at_msk': checked_at,
                      'source_date': source_date,
                      'applicant_id': APPLICANT_ID,
                      'general_position': own['position'],
                      'score': own['score'],
                      'own_consent': own_consent,
                      'consents_above_count': len(consents_above),
                      'consent_rank': consent_rank,
                      'confirmed_general_places': CONFIRMED_GENERAL_PLACES,
                      'verdict': verdict,
                      'consents_above': consents_above,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )

          with Path('/tmp/github_output').open('w', encoding='utf-8') as output:
              output.write('subject<<EOF\n')
              output.write(subject + '\n')
              output.write('EOF\n')
          PY
          cat /tmp/github_output >> "$GITHUB_OUTPUT"

      - name: Send hourly email with official page attached
        if: steps.gate.outputs.active == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: maks.kostromitin.80@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.parse.outputs.subject }}
          to: maks.kostromitin.80@gmail.com
          from: MBI Monitor <maks.kostromitin.80@gmail.com>
          body: file://output/email_body.txt
          attachments: output/MBI_очная_бюджет.html,output/status.json
          priority: high

      - name: Upload a backup artifact
        if: steps.gate.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mbi-check-${{ github.run_number }}
          path: output
          retention-days: 3
