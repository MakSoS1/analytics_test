name: launchlet-part2-auth-probe

on:
  push:
    branches: [agent/launchlet-part2-auth-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe representation/profile negotiation after preview gate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']; url=urllib.parse.urljoin(base,act['endpoint']); body={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}}
          fixed={'Content-Type':'application/json','X-Launchlet-Preview':boot['project']}
          tests=[]
          accepts=['*/*','application/json','text/plain','text/html','text/x-component','application/x-ndjson','application/problem+json','application/vnd.api+json','application/vnd.launchlet+json','application/vnd.launchlet.preview+json','application/vnd.launchlet.deploy+json','application/vnd.launchlet.deployment+json','application/vnd.launchlet.release+json','application/vnd.launchlet.inspector+json','application/vnd.launchlet.internal+json','application/vnd.launchlet.export+json','application/vnd.launchlet.v1+json','application/vnd.launchlet.actions+json']
          for a in accepts: tests.append(('accept_'+a,{'Accept':a}))
          for p in ['return=representation','return=minimal','count=exact','resolution=merge-duplicates','profile=deploy','profile=release','profile=internal','scope=deploy','scope=release','include=internal','include=secrets','respond-async','handling=lenient']:
              tests.append(('prefer_'+p,{'Prefer':p}))
          for hn in ['Accept-Profile','Content-Profile','Profile','X-Profile','X-Launchlet-Profile']:
              for v in ['preview','deploy','deployment','release','production','enterprise','internal','inspector','export','full']:
                  tests.append((hn+'_'+v,{hn:v}))
          for hn in ['X-Requested-With','X-Client','X-Client-Type','X-Launchlet-Client']:
              for v in ['XMLHttpRequest','Launchlet','launchlet-actions/0.9.4','preview','deploy','inspector','internal']:
                  tests.append((hn+'_'+v,{hn:v}))
          baseline=s.post(url,headers={**fixed,'Accept':'application/json'},json=body,timeout=15,allow_redirects=False)
          res=[]
          for name,eh in tests:
              r=s.post(url,headers={**fixed,**eh},json=body,timeout=10,allow_redirects=False)
              if r.status_code!=baseline.status_code or r.text!=baseline.text:
                  res.append({'name':name,'sent':eh,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
          (out/'summary.json').write_text(json.dumps({'baseline':{'status':baseline.status_code,'body':baseline.text},'diffs':res},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-negotiation-encrypted
          path: artifact/
          retention-days: 1
