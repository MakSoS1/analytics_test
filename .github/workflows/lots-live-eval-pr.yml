name: LOTS Live Detector Evaluation PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'lots-eval/**'
      - '.github/workflows/lots-live-eval-pr.yml'

permissions:
  contents: read

concurrency:
  group: lots-live-eval-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture-and-suricata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install capture and Suricata tooling
        run: |
          set -euo pipefail
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq suricata tcpdump tshark
          sudo mkdir -p /var/lib/suricata/rules
          sudo touch /var/lib/suricata/rules/suricata.rules
          suricata --build-info | head -40
          tcpdump --version | head -2
          editcap --version | head -2
          mergecap --version | head -2

      - name: Validate Suricata configuration
        run: |
          set -euo pipefail
          sudo suricata -T -c /etc/suricata/suricata.yaml

      - name: Capture real HTTPS LOTS-like traffic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lots-eval/out/segments/{github_c2,github_download,rentry_c2}

          IFACE="$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="dev"){print $(i+1); exit}}')"
          test -n "$IFACE"
          echo "capture_interface=$IFACE"
          echo "source_sha=$SOURCE_SHA"

          capture_segment() {
            local scenario="$1"
            local idx="$2"
            local url="$3"
            local pcap="lots-eval/out/segments/${scenario}/$(printf '%02d' "$idx").pcap"
            local log="/tmp/tcpdump-${scenario}-${idx}.log"

            sudo timeout 5s tcpdump -i "$IFACE" -nn -s0 -U -w "$pcap" 'tcp port 443' >"$log" 2>&1 &
            local cap_pid=$!
            sleep 1

            local code
            code="$(curl --http1.1 -sS -L \
              --connect-timeout 10 --max-time 20 \
              -A 'LOTS-Detector-Eval/1.0' \
              -H 'Connection: close' \
              -o /dev/null -w '%{http_code}' "$url" || true)"
            echo "$scenario request=$idx http_status=$code url=$url"

            wait "$cap_pid" || true
            sudo chown "$USER:$USER" "$pcap" || true
            test -s "$pcap"
          }

          for i in $(seq 0 11); do
            capture_segment github_c2 "$i" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/lots-eval/marker.json?poll=${GITHUB_RUN_ID}-${i}"
          done

          for i in $(seq 0 2); do
            capture_segment github_download "$i" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/3.ipynb?download=${GITHUB_RUN_ID}-${i}"
          done

          for i in $(seq 0 11); do
            capture_segment rentry_c2 "$i" \
              "https://rentry.co/?lots_eval=${GITHUB_RUN_ID}-${i}"
          done

      - name: Build event-time stretched PCAPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lots-eval/out/pcap

          stretch_and_merge() {
            local scenario="$1"
            local spacing="$2"
            local input="lots-eval/out/segments/${scenario}"
            local shifted="lots-eval/out/segments/${scenario}_shifted"
            mkdir -p "$shifted"

            local n=0
            for pcap in "$input"/*.pcap; do
              local shift=$((n * spacing))
              editcap -t "$shift" "$pcap" "$shifted/$(basename "$pcap")"
              n=$((n + 1))
            done
            test "$n" -gt 0
            mergecap -w "lots-eval/out/pcap/${scenario}.pcap" "$shifted"/*.pcap
            capinfos "lots-eval/out/pcap/${scenario}.pcap" | sed -n '1,30p'
          }

          stretch_and_merge github_c2 120
          stretch_and_merge github_download 300
          stretch_and_merge rentry_c2 120

      - name: Generate native Suricata EVE JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lots-eval/out/eve

          run_suricata() {
            local scenario="$1"
            local sni="$2"
            local pcap="lots-eval/out/pcap/${scenario}.pcap"
            local outdir="lots-eval/out/suricata/${scenario}"
            mkdir -p "$outdir"

            # Locally captured outbound packets have checksum-offload placeholders.
            # -k none is required for offline app-layer parsing of these PCAPs.
            sudo suricata -k none -r "$pcap" -c /etc/suricata/suricata.yaml -l "$outdir" --runmode=single
            sudo chown -R "$USER:$USER" "$outdir"
            test -s "$outdir/eve.json"

            python3 - "$outdir/eve.json" "lots-eval/out/eve/${scenario}.json" "$sni" "$scenario" <<'PY'
          import json
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          target_sni = sys.argv[3].lower()
          scenario = sys.argv[4]

          records = []
          for line in src.read_text(encoding='utf-8').splitlines():
              if line.strip():
                  records.append(json.loads(line))

          flow_ids = {
              e.get('flow_id')
              for e in records
              if e.get('event_type') == 'tls'
              and str((e.get('tls') or {}).get('sni') or '').lower() == target_sni
              and e.get('flow_id') is not None
          }
          selected = [
              e for e in records
              if e.get('flow_id') in flow_ids
              and e.get('event_type') in {'tls', 'flow', 'alert'}
          ]
          dst.write_text(''.join(json.dumps(e, separators=(',', ':')) + '\n' for e in selected), encoding='utf-8')

          counts = {}
          for e in selected:
              counts[e.get('event_type', 'unknown')] = counts.get(e.get('event_type', 'unknown'), 0) + 1

          summary = {
              'scenario': scenario,
              'target_sni': target_sni,
              'matched_flow_ids': len(flow_ids),
              'event_counts': counts,
              'eve_path': str(dst),
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          Path(str(dst) + '.summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          if len(flow_ids) < 1:
              raise SystemExit(f'no TLS flows with SNI={target_sni!r}')
          if counts.get('tls', 0) < 1 or counts.get('flow', 0) < 1:
              raise SystemExit(f'incomplete EVE contract: {counts}')
          PY
          }

          run_suricata github_c2 raw.githubusercontent.com
          run_suricata github_download raw.githubusercontent.com
          run_suricata rentry_c2 rentry.co

      - name: Write evaluation manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('lots-eval/out')
          scenarios = []
          for name in ('github_c2', 'github_download', 'rentry_c2'):
              p = root / 'eve' / f'{name}.json.summary.json'
              scenarios.append(json.loads(p.read_text()))

          manifest = {
              'purpose': 'defensive LOTS detector evaluation only',
              'packet_origin': 'real outbound HTTPS generated on GitHub Actions ubuntu-24.04',
              'time_transform': 'packet contents and per-flow duration retained; inter-flow timestamps shifted with editcap',
              'github_c2': '12 harmless periodic GETs to raw.githubusercontent.com marker.json',
              'github_download': '3 harmless downloads of repository 3.ipynb through raw.githubusercontent.com',
              'rentry_c2': '12 harmless periodic GETs to rentry.co; no uploads or sensitive data',
              'scenarios': scenarios,
          }
          (root / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload PCAP and EVE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lots-live-eval-pr-${{ github.run_id }}
          path: |
            lots-eval/out/pcap
            lots-eval/out/eve
            lots-eval/out/suricata
            lots-eval/out/MANIFEST.json
          retention-days: 14
          compression-level: 6
