name: Export Sage algebra toolchain

on:
  push:
    branches:
      - agent/d3hferp-solver-20260725
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Export Singular and msolve bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain-out
          docker pull sagemath/sagemath:latest > /dev/null
          docker run --rm \
            -v "$PWD/toolchain-out:/out" \
            sagemath/sagemath:latest \
            bash -lc '
              set -euo pipefail
              root=/tmp/algebra-root
              mkdir -p "$root"
              copy_binary() {
                local name="$1"
                local bin
                bin=$(command -v "$name" || true)
                if [ -z "$bin" ]; then
                  echo "$name=missing" >> /out/inventory.txt
                  return 0
                fi
                echo "$name=$bin" >> /out/inventory.txt
                cp --parents -L "$bin" "$root"
                ldd "$bin" | awk '\''/=> \// {print $3} /^\// {print $1}'\'' | sort -u | while read -r lib; do
                  [ -f "$lib" ] && cp --parents -L "$lib" "$root"
                done
              }
              copy_binary Singular
              copy_binary msolve
              copy_binary sage
              for path in \
                /usr/local/share/singular \
                /usr/share/singular \
                /usr/local/lib/singular \
                /usr/lib/singular \
                /usr/local/lib/libSingular* \
                /usr/lib/*/libSingular*; do
                for item in $path; do
                  [ -e "$item" ] && cp -a --parents "$item" "$root"
                done
              done
              tar -C "$root" -czf /out/algebra-toolchain.tar.gz .
              du -h /out/algebra-toolchain.tar.gz >> /out/inventory.txt
            '

      - name: Upload algebra toolchain
        uses: actions/upload-artifact@v4
        with:
          name: d3hferp-algebra-toolchain
          path: |
            toolchain-out/algebra-toolchain.tar.gz
            toolchain-out/inventory.txt
          if-no-files-found: error
          retention-days: 1
