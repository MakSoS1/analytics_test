name: launchlet-platform-inspect
on:
  push:
    branches: [agent/launchlet-platform-inspect-20260808]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch orchestrator page and referenced scripts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAh+NPVwIluBBnJJhWhvo9
          ty90KCtkpNMzsxYJe+BR2VH3yh/hJ4jNcG/Y3bNYJHoKGsTw07WCYieEzw7PcjRE
          gRSBsBYWZyrqS/Dej9I5WJY2tThdZxosZQDJ7hrbglu3TUcy8EDoNoDYuFrAu6gh
          RQspWb6qOiuSTxTSkuxmp2gcHQWYf9tpKNYjrOW8ybmI+kFKDa++Iv/SSUfQ26cv
          /QIKK1k22l+qxrTklx5FBq1uJYlJxBfbSOQS5AVI1kim/JlEo6ckjbnp2TNK2G43
          u62F6lUIVwvcSBd47cRlHHlnprEhAdR+17ZEvs6ecGDY42kTT3GrT1Z8nE+KAjNa
          sQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,re,urllib.parse,pathlib,json
          url='https://platform.caplag.ru/microserv/task/web/launchlet-web-medium/1'
          out=pathlib.Path('package/out')
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          r=s.get(url,timeout=15,allow_redirects=True)
          (out/'page.html').write_text(r.text)
          meta={'url':r.url,'status':r.status_code,'headers':dict(r.headers),'scripts':[],'links':[]}
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text,re.I)
          hrefs=re.findall(r'<link[^>]+href=["\']([^"\']+)',r.text,re.I)
          for src in srcs:
            u=urllib.parse.urljoin(r.url,src)
            try:
              q=s.get(u,timeout=15); name='script_'+str(len(meta['scripts']))+'.js'; (out/name).write_text(q.text)
              meta['scripts'].append({'src':src,'url':u,'status':q.status_code,'name':name,'length':len(q.text)})
            except Exception as e:meta['scripts'].append({'src':src,'error':repr(e)})
          for href in hrefs:
            meta['links'].append({'href':href,'url':urllib.parse.urljoin(r.url,href)})
          (out/'meta.json').write_text(json.dumps(meta,indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-platform-inspect-encrypted
          path: artifact/
          retention-days: 1
