name: launchlet-part3-apporacle
on:
  push:
    branches: [agent/launchlet-part3-apporacle-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe app/builder publish handlers via invalid JSON oracle
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          ns=['app','apps','builder','builders','prototype','prototypes','studio','preview-studio','launchlet','publish','publisher','publishing','launch','launches','rollout','rollouts','handoff','handoffs','dispatcher','dispatch','delivery','ship','shipping','predeploy','pre-deploy','predeployment','pre-deployment','preliminary','staging','stage','board','boards','release-pulse','pulse']
          verbs=['bootstrap','build','generate','preview','deploy','deployment','publish','release','promote','finalize','approve','inspect','export','open','resolve','create','run','invoke','dispatch','handoff','submit','share','link','status','artifact','artifacts','manifest','metadata','claim','redeem','access','unlock','review']
          paths=set()
          for n in ns:
            paths.add('/api/'+n)
            for v in verbs:
              paths.add(f'/api/{n}/{v}'); paths.add(f'/api/{v}/{n}')
          # nested beneath public app namespace
          for n in ['preview','deploy','release','publish','build','prototype','rollout','handoff','artifact','inspector']:
            for v in verbs:
              paths.add(f'/api/app/{n}/{v}');paths.add(f'/api/app/{v}/{n}')
          paths=list(paths)
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board'}
          def one(p):
            try:r=requests.post(base+p,headers=h,data=b'{',timeout=5,allow_redirects=False)
            except Exception:return None
            if r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n'):return None
            return {'path':p,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for x in ex.map(one,paths):
              if x:hits.append(x)
          (out/'summary.json').write_text(json.dumps({'tested':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-apporacle-encrypted
          path: artifact/
          retention-days: 1
