name: temporary-moss-vault-runner

on:
  pull_request:
    branches:
      - main
    paths:
      - vault_exploit.py

permissions:
  contents: read

jobs:
  exploit:
    if: github.head_ref == 'moss-vault-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded vault exploit
        run: python3 vault_exploit.py

      - name: Upload extracted flag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moss-vault-result
          path: vault-result/
          retention-days: 1
          if-no-files-found: error
