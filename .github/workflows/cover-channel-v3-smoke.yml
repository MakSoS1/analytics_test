name: Cover Channel V3 Smoke

on:
  push:
    branches: [coverlab-nine-point-hardening]
    paths:
      - 'cover-channel-lab/**'
      - '.github/workflows/cover-channel-v3-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cover-channel-v3-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cover-channel-lab/requirements.txt
            cover-channel-lab/requirements-model.txt
      - name: Install wire fixtures
        working-directory: cover-channel-lab
        run: ./scripts/install_runner.sh
      - name: Install advanced model dependencies
        working-directory: cover-channel-lab
        run: |
          python -m pip install -r requirements-model.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.0'
          python - <<'PY'
          import torch
          assert not torch.cuda.is_available()
          print('torch', torch.__version__, 'cpu-only')
          PY
      - name: Compile and unit contracts
        working-directory: cover-channel-lab
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests scripts/model_v3_smoke_fixture.py
          pytest -q
      - name: Existing comprehensive wire smoke
        working-directory: cover-channel-lab
        run: bash ./scripts/transport_smoke_ci.sh
      - name: Nine-point research smoke
        working-directory: cover-channel-lab
        run: bash ./scripts/research_smoke_v3.sh
      - name: Retain all smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverlab-v3-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/coverlab-smoke-gate
            ${{ runner.temp }}/coverlab-research-v3-smoke
            ${{ runner.temp }}/coverlab-services
          retention-days: 30
          compression-level: 0
