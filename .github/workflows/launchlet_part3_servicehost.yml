name: launchlet-part3-servicehost
on:
  push:
    branches: [agent/launchlet-part3-servicehost-20260808b]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe preview service host grammar and encrypt responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAh+NPVwIluBBnJJhWhvo9
          ty90KCtkpNMzsxYJe+BR2VH3yh/hJ4jNcG/Y3bNYJHoKGsTw07WCYieEzw7PcjRE
          gRSBsBYWZyrqS/Dej9I5WJY2tThdZxosZQDJ7hrbglu3TUcy8EDoNoDYuFrAu6gh
          RQspWb6qOiuSTxTSkuxmp2gcHQWYf9tpKNYjrOW8ybmI+kFKDa++Iv/SSUfQ26cv
          /QIKK1k22l+qxrTklx5FBq1uJYlJxBfbSOQS5AVI1kim/JlEo6ckjbnp2TNK2G43
          u62F6lUIVwvcSBd47cRlHHlnprEhAdR+17ZEvs6ecGDY42kTT3GrT1Z8nE+KAjNa
          sQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,socket,json,pathlib,re,concurrent.futures
          suffix='18cf6be4db586bb6'
          root='caplag-task.ru'
          candidates=[
            f'task-preview-8b11c-web-medium-{suffix}.{root}',
            f'task-launchlet-preview-8b11c-web-medium-{suffix}.{root}',
            f'task-launchlet-web-preview-8b11c-medium-{suffix}.{root}',
            f'task-launchlet-web-medium-preview-8b11c-{suffix}.{root}',
            f'task-launchlet-web-medium-8b11c-{suffix}.{root}',
            f'task-deploy-preview-8b11c-web-medium-{suffix}.{root}',
            f'task-launchlet-deploy-preview-8b11c-web-medium-{suffix}.{root}',
            f'preview-8b11c-task-launchlet-web-medium-{suffix}.{root}',
            f'task-preview-launchlet-web-medium-{suffix}.{root}',
            f'task-deploy-launchlet-web-medium-{suffix}.{root}',
            f'task-launchlet-deploy-web-medium-{suffix}.{root}',
            f'task-launchlet-web-deploy-medium-{suffix}.{root}',
            f'task-launchlet-preview-web-medium-{suffix}.{root}',
            f'task-launchlet-web-preview-medium-{suffix}.{root}',
            f'task-launchlet-web-medium-preview-{suffix}.{root}',
            f'task-launchlet-web-medium-deploy-{suffix}.{root}',
          ]
          origin=f'task-launchlet-web-medium-{suffix}.{root}'
          out=pathlib.Path('package/out')
          def canonical_404(r):
            t=r.text.strip()
            return r.status_code==404 and (t in ('404 page not found','{"error":"not_found"}') or '404 page not found' in t[:80])
          def probe(host):
            item={'host':host}
            try:
              item['dns']=sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
            except Exception as e:
              item['dns_error']=repr(e); return item
            try:
              r=requests.get('https://'+host+'/',headers={'User-Agent':'Mozilla/5.0'},timeout=7,allow_redirects=False)
              item['root']={'status':r.status_code,'headers':dict(r.headers),'body':r.text[:10000]}
            except Exception as e:
              item['https_error']=repr(e); return item
            if not canonical_404(r):
              item['interesting']=True
              for p in ['/api/app/bootstrap','/assets/build-manifest.json','/assets/server-reference-manifest.json','/static/app.js']:
                try:
                  q=requests.get('https://'+host+p,headers={'User-Agent':'Mozilla/5.0'},timeout=7,allow_redirects=False)
                  item[p]={'status':q.status_code,'headers':dict(q.headers),'body':q.text[:20000]}
                except Exception as e:item[p]={'error':repr(e)}
            return item
          res=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for x in ex.map(probe,candidates):res.append(x)
          # control origin
          try:
            r=requests.get('https://'+origin+'/',timeout=7,allow_redirects=False)
            control={'host':origin,'status':r.status_code,'body':r.text[:2000]}
          except Exception as e:control={'host':origin,'error':repr(e)}
          blob=json.dumps({'control':control,'results':res},indent=2)
          (out/'summary.json').write_text(blob)
          flags=[f for f in re.findall(r'caplag\{[^}]+\}',blob) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
          if flags:(out/'FOUND.txt').write_text('\n'.join(flags))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"
          IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-servicehost-encrypted
          path: artifact/
          retention-days: 1
