name: ExamClips Local MVP CI
on:
  push:
    branches: [feat/examclips-local-mvp-20261015, feat/examclips-hybrid-composer-20261015, feat/examclips-microtopics-live-presenter-20261016, feat/examclips-completion-20261016, feat/examclips-ocr-context-20261016, feat/examclips-mvp-ui-deploy-20261016, feat/examclips-workflow-timeline-captions-20261016, feat/examclips-timeline-primary-20261016, feat/examclips-selective-story-edl-20261016, feat/examclips-complete-topics-longform-20261017]
    paths: ['examclips-local/**', 'docs/superpowers/**', '.github/workflows/examclips-local-mvp.yml']
  pull_request:
    paths: ['examclips-local/**', 'docs/superpowers/**', '.github/workflows/examclips-local-mvp.yml']
  workflow_dispatch:
jobs:
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examclips-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install test codecs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate deterministic AV fixture
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=15 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac test-fixture.mp4
          printf '%s\n' '1' '00:00:00,000 --> 00:00:02,000' 'Docker example' '' '2' '00:00:02,000 --> 00:00:04,000' 'Next step' > test-fixture.srt
      - name: Generate video with a moving teacher window on a static board
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=640x360:r=15 -f lavfi -i testsrc2=s=128x72:r=15 -f lavfi -i sine=frequency=442:sample_rate=48000 -filter_complex '[0:v][1:v]overlay=x=510:y=278:shortest=1:format=auto,format=yuv420p[v]' -map '[v]' -map 2:a -t 4 -c:v libx264 -preset ultrafast -c:a aac presenter-motion-fixture.mp4
      - name: Local Ollama bridge safety and completion-review E2E
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/examclips-local-review-vite.log 2>&1 &
          sleep 4
          node scripts/local-review-smoke.mjs
      - name: Browser persistent ASR checkpoint save resume and purge
        run: |
          node scripts/asr-checkpoint-smoke.mjs
      - name: MVP visual UX and local quiz end-to-end browser test
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/examclips-mvp-vite.log 2>&1 &
          sleep 4
          node scripts/mvp-ui-smoke.mjs
      - name: Private project autosave and timeline zoom survive browser reload
        run: |
          node scripts/library-zoom-resume-smoke.mjs
      - name: Long quiet lecture with only sparse useful teaching segments
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=320x180:r=2 -f lavfi -i sine=frequency=441:sample_rate=16000 -t 180 -c:v libx264 -preset ultrafast -c:a aac -shortest selective-lecture-fixture.mp4
          node scripts/sparse-lecture-smoke.mjs
      - name: Microtopics table, full original transcript, and portrait playback
        run: |
          node scripts/microtopics-table-smoke.mjs
      - name: 20-minute practice problem is one complete microtopic in the browser
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=320x180:r=1 -f lavfi -i sine=frequency=440:sample_rate=8000 -t 1250 -c:v libx264 -preset ultrafast -c:a aac -shortest long-exercise-fixture.mp4
          node scripts/long-worked-example-smoke.mjs
      - name: Browser integration test
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/examclips-vite.log 2>&1 &
          sleep 4
          npm run smoke
      - name: Stitch noncontiguous original source clips with uninterrupted audio
        run: |
          node scripts/noncontiguous-edl-smoke.mjs
      - name: Verify streamed file-system MP4 export for long lesson mode
        run: |
          mkdir -p public
          cp test-fixture.mp4 public/test-fixture.mp4
          node scripts/stream-edl-smoke.mjs
      - name: Batch export whole series to local folder
        run: |
          node scripts/batch-export-smoke.mjs
      - name: TikTok-style floating karaoke captions in real Chrome Canvas
        run: |
          node scripts/karaoke-overlay-smoke.mjs
      - name: Presenter must move in exported MP4
        run: |
          node scripts/presenter-motion-smoke.mjs
      - name: Browser-only Tesseract.js fallback with no Python OCR installed
        run: |
          node scripts/ocr-browser-smoke.mjs
      - name: Editorial visual QA — three real rendered scenes
        run: |
          node scripts/editorial-visual-smoke.mjs
      - name: Production preview and optional local Ollama bridge
        run: |
          npm run preview -- --host 127.0.0.1 --port 5182 > /tmp/examclips-preview.log 2>&1 &
          sleep 3
          EXAMCLIPS_ORIGIN=http://127.0.0.1:5182 node scripts/local-review-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: examclips-local-dist
          path: |
            examclips-local/dist/
            examclips-local/smoke-ui.png
            examclips-local/smoke-output.mp4
            examclips-local/smoke-output-high.mp4
            examclips-local/editorial-*.png
            examclips-local/mvp-*.png
            examclips-local/presenter-motion-export.mp4
          if-no-files-found: error
