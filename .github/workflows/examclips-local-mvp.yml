name: ExamClips Local MVP CI
on:
  push:
    branches: [feat/examclips-local-mvp-20261015, feat/examclips-hybrid-composer-20261015, feat/examclips-microtopics-live-presenter-20261016, feat/examclips-completion-20261016]
    paths: ['examclips-local/**', 'docs/superpowers/**', '.github/workflows/examclips-local-mvp.yml']
  pull_request:
    paths: ['examclips-local/**', 'docs/superpowers/**', '.github/workflows/examclips-local-mvp.yml']
  workflow_dispatch:
jobs:
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examclips-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install test codecs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate deterministic AV fixture
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=15 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac test-fixture.mp4
          printf '%s\n' '1' '00:00:00,000 --> 00:00:02,000' 'Docker example' '' '2' '00:00:02,000 --> 00:00:04,000' 'Next step' > test-fixture.srt
      - name: Generate video with a moving teacher window on a static board
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=white:s=640x360:r=15 -f lavfi -i testsrc2=s=128x72:r=15 -f lavfi -i sine=frequency=442:sample_rate=48000 -filter_complex '[0:v][1:v]overlay=x=510:y=278:shortest=1:format=auto,format=yuv420p[v]' -map '[v]' -map 2:a -t 4 -c:v libx264 -preset ultrafast -c:a aac presenter-motion-fixture.mp4
      - name: Local Ollama bridge safety and completion-review E2E
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/examclips-local-review-vite.log 2>&1 &
          sleep 4
          node scripts/local-review-smoke.mjs
      - name: Browser persistent ASR checkpoint save resume and purge
        run: |
          node scripts/asr-checkpoint-smoke.mjs
      - name: Browser integration test
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/examclips-vite.log 2>&1 &
          sleep 4
          npm run smoke
      - name: Presenter must move in exported MP4
        run: |
          node scripts/presenter-motion-smoke.mjs
      - name: Editorial visual QA — three real rendered scenes
        run: |
          node scripts/editorial-visual-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: examclips-local-dist
          path: |
            examclips-local/dist/
            examclips-local/smoke-ui.png
            examclips-local/smoke-output.mp4
            examclips-local/smoke-output-high.mp4
            examclips-local/editorial-*.png
            examclips-local/presenter-motion-export.mp4
          if-no-files-found: error
