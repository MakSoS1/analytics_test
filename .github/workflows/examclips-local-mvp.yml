name: ExamClips Local MVP CI
on:
  push:
    branches: [feat/examclips-local-mvp-20261015]
    paths: ['examclips-local/**', 'docs/superpowers/**', '.github/workflows/examclips-local-mvp.yml']
  pull_request:
    paths: ['examclips-local/**', 'docs/superpowers/**', '.github/workflows/examclips-local-mvp.yml']
  workflow_dispatch:
jobs:
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examclips-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examclips-local/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: examclips-local-dist
          path: examclips-local/dist/
          if-no-files-found: error
