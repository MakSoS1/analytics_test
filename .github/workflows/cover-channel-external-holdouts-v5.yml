name: Cover Channel External Holdouts V5

on:
  workflow_dispatch:
    inputs:
      model_run_id:
        description: "Completed Cover Channel Complete V5 run id containing models-v5-<run_id>"
        required: true
        type: string
      evidence_root:
        description: "Absolute path on the isolated self-hosted runner"
        required: true
        default: "/opt/coverlab/evidence"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, linux, coverlab]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate isolated evidence root
        shell: bash
        run: |
          set -euo pipefail
          root="${{ inputs.evidence_root }}"
          [[ "$root" = /* ]] || { echo "evidence_root must be absolute" >&2; exit 2; }
          [[ -d "$root" ]] || { echo "evidence_root does not exist: $root" >&2; exit 2; }
          realpath "$root"

      - name: Download frozen V5 models
        uses: actions/download-artifact@v4
        with:
          name: models-v5-${{ inputs.model_run_id }}
          path: ${{ runner.temp }}/model-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.model_run_id }}

      - name: Install parser/model dependencies
        working-directory: cover-channel-lab
        run: |
          ./scripts/install_runner.sh
          python -m pip install -r requirements-model.txt

      - name: Copy evidence into immutable run workspace
        shell: bash
        run: |
          set -euo pipefail
          src="${{ inputs.evidence_root }}"
          dst="$RUNNER_TEMP/external-evidence"
          mkdir -p "$dst/framework" "$dst/ech" "$dst/environment" "$dst/long-timing" "$dst/office"
          [[ -d "$src/framework" ]] && cp -a "$src/framework/." "$dst/framework/" || true
          [[ -d "$src/ech" ]] && cp -a "$src/ech/." "$dst/ech/" || true
          [[ -d "$src/environment" ]] && cp -a "$src/environment/." "$dst/environment/" || true
          [[ -d "$src/long-timing" ]] && cp -a "$src/long-timing/." "$dst/long-timing/" || true
          [[ -d "$src/office" ]] && cp -a "$src/office/." "$dst/office/" || true

      - name: Process and score framework holdouts
        if: ${{ hashFiles(format('{0}/framework/framework_holdout.jsonl', inputs.evidence_root)) != '' }}
        working-directory: cover-channel-lab
        env:
          PYTHONPATH: src
        run: |
          bash ./scripts/process_external_framework_v5.sh "$RUNNER_TEMP/external-evidence/framework" "$RUNNER_TEMP/framework-features"
          python -m coverlab.score_framework_holdout_v5             --evidence-root "$RUNNER_TEMP/external-evidence/framework"             --features-root "$RUNNER_TEMP/framework-features"             --model "$RUNNER_TEMP/model-bundle/models/B3-opaque.joblib"             --out "$RUNNER_TEMP/external-evidence/framework/framework_model_metrics.json"

      - name: Process and score ECH holdouts
        if: ${{ hashFiles(format('{0}/ech/ech_holdout.jsonl', inputs.evidence_root)) != '' }}
        working-directory: cover-channel-lab
        env:
          PYTHONPATH: src
        run: |
          bash ./scripts/process_external_ech_v5.sh "$RUNNER_TEMP/external-evidence/ech" "$RUNNER_TEMP/ech-features"
          python -m coverlab.score_ech_holdout_v5             --evidence-root "$RUNNER_TEMP/external-evidence/ech"             --features-root "$RUNNER_TEMP/ech-features"             --model "$RUNNER_TEMP/model-bundle/models/B3-opaque.joblib"             --out-manifest "$RUNNER_TEMP/external-evidence/ech/ech_holdout.jsonl"

      - name: Score labeled environment-domain features
        shell: bash
        working-directory: cover-channel-lab
        env:
          PYTHONPATH: src
        run: |
          f="$RUNNER_TEMP/external-evidence/environment/session_features.parquet"
          if [[ -s "$f" ]]; then
            python -m coverlab.score_environment_holdout_v5 \
              --evidence-root "$RUNNER_TEMP/external-evidence/environment" \
              --features "$f" \
              --model "$RUNNER_TEMP/model-bundle/models/B3-opaque.joblib" \
              --out "$RUNNER_TEMP/external-evidence/environment/environment_model_metrics.json"
          fi

      - name: Score office benign features
        shell: bash
        working-directory: cover-channel-lab
        env:
          PYTHONPATH: src
        run: |
          f="$RUNNER_TEMP/external-evidence/office/session_features.parquet"
          if [[ -s "$f" ]]; then
            python -m coverlab.score_office_background_v5               --features "$f"               --model "$RUNNER_TEMP/model-bundle/models/B3-opaque.joblib"               --out "$RUNNER_TEMP/external-evidence/office/office_b3_report.json"
          fi

      - name: Build strict evidence status
        working-directory: cover-channel-lab
        env:
          PYTHONPATH: src
        run: |
          python -m coverlab.external_evidence_status_v3             --framework-root "$RUNNER_TEMP/external-evidence/framework"             --ech-root "$RUNNER_TEMP/external-evidence/ech"             --environment-root "$RUNNER_TEMP/external-evidence/environment"             --long-timing-root "$RUNNER_TEMP/external-evidence/long-timing"             --office-root "$RUNNER_TEMP/external-evidence/office"             --out-dir "$RUNNER_TEMP/external-evidence/status"

      - uses: actions/upload-artifact@v4
        with:
          name: external-evidence-v5-modelrun-${{ inputs.model_run_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/external-evidence
            ${{ runner.temp }}/framework-features
            ${{ runner.temp }}/ech-features
          retention-days: 90
          compression-level: 0
