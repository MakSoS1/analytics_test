name: Remote Admin Anomaly V1 Smoke

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/configs/**'
      - 'remote-admin-anomaly-lab/src/**'
      - 'remote-admin-anomaly-lab/scripts/**'
      - 'remote-admin-anomaly-lab/tests/**'
      - 'remote-admin-anomaly-lab/requirements.txt'
      - '.github/workflows/remote-admin-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install test dependencies
        working-directory: remote-admin-anomaly-lab
        run: python -m pip install 'PyYAML>=6,<7' 'pytest>=8,<9'
      - name: Run unit and contract tests
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: pytest -q tests

  topology-smoke:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install topology dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Bring up isolated namespace lab
        working-directory: remote-admin-anomaly-lab
        run: sudo -E bash scripts/setup_topology.sh up configs/topology.yaml
      - name: Verify isolation and namespace count
        working-directory: remote-admin-anomaly-lab
        run: |
          sudo -E bash scripts/setup_topology.sh verify configs/topology.yaml
          count="$(sudo ip netns list | awk '{print $1}' | grep -c '^ra-' || true)"
          test "$count" -eq 15
          for ns in $(sudo ip netns list | awk '{print $1}' | grep '^ra-'); do
            test -z "$(sudo ip netns exec "$ns" ip route show default)"
          done
      - name: Verify in-lab connectivity only
        run: |
          sudo ip netns exec ra-paw01 ping -c 1 -W 2 10.77.0.21
          if sudo ip netns exec ra-paw01 ping -c 1 -W 1 1.1.1.1; then
            echo 'external connectivity unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Tear down namespace lab
        if: always()
        working-directory: remote-admin-anomaly-lab
        run: sudo -E bash scripts/setup_topology.sh down configs/topology.yaml

  dataset-smoke:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime
        run: python -m pip install 'PyYAML>=6,<7' 'pandas>=2.2,<3' 'pyarrow>=17,<23'
      - name: Install real wire services, capture tools and pinned parsers
        working-directory: remote-admin-anomaly-lab
        run: bash scripts/install_runner.sh
      - name: Capture 40-session real-wire Bronze shard
        working-directory: remote-admin-anomaly-lab
        run: |
          python_bin="$(command -v python)"
          test -x "$python_bin"
          sudo -E env ADMINLAB_PYTHON="$python_bin" bash scripts/capture_shard.sh A A-smoke-00 40 20260814 /tmp/adminlab-dataset
      - name: Assert immutable Bronze contract
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from adminlab.quality import validate_bronze_tree
          root = Path('/tmp/adminlab-dataset/release')
          bronze = root / 'bronze/A-smoke-00'
          report = validate_bronze_tree(bronze, verify_checksums=True)
          assert report['ok'], report
          assert report['pcap_bytes'] > 0, report
          health = json.loads((root / 'quality/A-smoke-00/capture_health.json').read_text())
          assert health['full_capture_retained'] is True
          assert health['sessions'] == 40, health
          assert (bronze / 'manifests/sessions.parquet').stat().st_size > 0
          assert (bronze / 'manifests/ground_truth.parquet').stat().st_size > 0
          assert (bronze / 'manifests/hosts.parquet').stat().st_size > 0
          assert (bronze / 'manifests/campaigns.parquet').stat().st_size > 0
          print(json.dumps({'bronze': report, 'capture_health': health}, sort_keys=True))
          PY
      - name: Build Silver from the retained Bronze PCAP
        working-directory: remote-admin-anomaly-lab
        run: bash scripts/build_silver.sh /tmp/adminlab-dataset/release A-smoke-00
      - name: Assert Suricata and Zeek Silver contract
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from adminlab.quality import validate_silver_tree
          root = Path('/tmp/adminlab-dataset/release')
          silver = root / 'silver/A-smoke-00'
          report = validate_silver_tree(silver)
          assert report['ok'], report
          health = json.loads((root / 'quality/A-smoke-00/parser_health.json').read_text())
          assert health['suricata_eve_lines'] > 0, health
          assert health['suricata_flow_events'] > 0, health
          assert health['zeek_conn_lines'] > 0, health
          versions = json.loads((silver / 'parser_versions.json').read_text())
          assert '8.2.1' in versions['zeek'], versions
          print(json.dumps({'silver': report, 'parser_health': health, 'versions': versions}, sort_keys=True))
          PY
      - name: Retain complete Bronze and Silver release tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-dataset-smoke-${{ github.run_id }}
          path: /tmp/adminlab-dataset/release
          retention-days: 90
          compression-level: 0
