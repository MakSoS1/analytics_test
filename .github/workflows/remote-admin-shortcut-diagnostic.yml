name: Remote Admin Anomaly V1 Shortcut Diagnostic

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-shortcut-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: '9223932257'
      SOURCE_RUN_ID: '31810899680'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic runtime
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=17,<23' 'scikit-learn>=1.5,<2' 'numpy>=1.26,<3'
      - name: Download only retained 1k research evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/adminlab-diag
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/research.zip
          unzip -q /tmp/research.zip \
            'release/gold/H-research-1k/production_model_matrix.parquet' \
            'release/gold/H-research-1k/production_flow_labels.parquet' \
            'release/bronze/H-research-1k/manifests/sessions.parquet' \
            'models/shortcut-audit.json' \
            'models/M1-lightgbm.metrics.json' \
            'evaluation/M1-learning-curve.json' \
            -d /tmp/adminlab-diag
      - name: Analyze shortcut source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.metrics import average_precision_score, roc_auc_score

          root=Path('/tmp/adminlab-diag')
          matrix=pd.read_parquet(root/'release/gold/H-research-1k/production_model_matrix.parquet').reset_index(drop=True)
          labels=pd.read_parquet(root/'release/gold/H-research-1k/production_flow_labels.parquet').reset_index(drop=True)
          sessions=pd.read_parquet(root/'release/bronze/H-research-1k/manifests/sessions.parquet')
          assert len(matrix)==len(labels)
          assert matrix['label_binary'].astype(int).equals(labels['label_binary'].astype(int))
          assert matrix['split'].astype(str).equals(labels['split'].astype(str))

          y=matrix['label_binary'].astype(int)
          feature_cols=[c for c in matrix.columns if c not in {'label_binary','split'}]
          numeric=[c for c in feature_cols if pd.api.types.is_numeric_dtype(matrix[c])]

          def finite_series(s):
              x=pd.to_numeric(s,errors='coerce').replace([np.inf,-np.inf],np.nan)
              return x.fillna(x.median() if x.notna().any() else 0.0)

          def univariate(df, split_labels):
              yy=df['label_binary'].astype(int).to_numpy()
              out=[]
              if len(np.unique(yy))<2:
                  return out
              for c in numeric:
                  if c not in df: continue
                  x=finite_series(df[c]).to_numpy(dtype=float)
                  if np.nanstd(x)==0: continue
                  try:
                      ap_pos=float(average_precision_score(yy,x)); ap_neg=float(average_precision_score(yy,-x))
                      roc_pos=float(roc_auc_score(yy,x)); roc_neg=float(roc_auc_score(yy,-x))
                  except ValueError:
                      continue
                  out.append({'feature':c,'pr_auc_best_direction':max(ap_pos,ap_neg),'direction':'high=>suspicious' if ap_pos>=ap_neg else 'low=>suspicious','roc_auc_best_direction':max(roc_pos,roc_neg)})
              return sorted(out,key=lambda z:z['pr_auc_best_direction'],reverse=True)

          split_reports={}
          for split in ['train','validation','test','challenge']:
              df=matrix[matrix['split'].astype(str)==split].copy()
              if df.empty: continue
              split_reports[split]={
                  'rows':int(len(df)),
                  'label_counts':{str(k):int(v) for k,v in df['label_binary'].astype(int).value_counts().sort_index().items()},
                  'top_univariate':univariate(df,labels)[:20],
              }

          # Session-level metadata diagnosis. A production model never receives these
          # fields; they are used only to locate generator-induced observable bias.
          meta_cols=['session_id','label_binary','protocol','behavior_profile','task_id','scenario_id','campaign_type','src_role','historical_relation','wire_attempts','wire_transfer_bytes','netem_profile','start_ts']
          session_meta=sessions[[c for c in meta_cols if c in sessions.columns]].copy()
          sess_split=labels[['session_id','split']].drop_duplicates('session_id')
          session_meta=session_meta.merge(sess_split,on='session_id',how='left')

          def categorical_bias(df, col):
              if col not in df: return []
              g=df.groupby(col,dropna=False)['label_binary'].agg(['count','mean','sum']).reset_index()
              g=g[g['count']>=3].copy()
              g['distance_from_global']=abs(g['mean']-df['label_binary'].mean())
              g=g.sort_values(['distance_from_global','count'],ascending=[False,False])
              return [{
                  'value':str(r[col]),'n':int(r['count']),'suspicious_fraction':float(r['mean']),
                  'suspicious':int(r['sum']),'distance_from_global':float(r['distance_from_global'])
              } for _,r in g.head(30).iterrows()]

          session_reports={}
          for split in ['validation','test','challenge','train']:
              df=session_meta[session_meta['split'].astype(str)==split].copy()
              if df.empty: continue
              entry={'rows':int(len(df)),'suspicious_fraction':float(df['label_binary'].mean())}
              for col in ['protocol','behavior_profile','task_id','scenario_id','campaign_type','src_role','historical_relation','netem_profile']:
                  entry[col]=categorical_bias(df,col)
              for col in ['wire_attempts','wire_transfer_bytes']:
                  if col in df:
                      entry[col]={}
                      for label in [0,1]:
                          s=finite_series(df[df['label_binary']==label][col])
                          entry[col][str(label)]={
                              'n':int(len(s)), 'mean':float(s.mean()) if len(s) else None,
                              'median':float(s.median()) if len(s) else None,
                              'p90':float(s.quantile(.9)) if len(s) else None,
                          }
              session_reports[split]=entry

          # Flow-level label-conditioned distributions for the two shortcut groups.
          dist_features=['bytes_total','src_bytes','dst_bytes','connections_1m','connections_5m','connections_15m','connections_1h','connections_24h','duration','flow_count','packets_total','pair_seen_count','new_dst_for_src','new_src_dst_pair']
          flow_distributions={}
          for split in ['validation','test','challenge','train']:
              df=matrix[matrix['split'].astype(str)==split]
              if df.empty: continue
              flow_distributions[split]={}
              for c in dist_features:
                  if c not in df: continue
                  flow_distributions[split][c]={}
                  for label in [0,1]:
                      s=finite_series(df[df['label_binary']==label][c])
                      flow_distributions[split][c][str(label)]={
                          'n':int(len(s)), 'mean':float(s.mean()) if len(s) else None,
                          'median':float(s.median()) if len(s) else None,
                          'p10':float(s.quantile(.1)) if len(s) else None,
                          'p90':float(s.quantile(.9)) if len(s) else None,
                      }

          payload={
              'source_run_id':int(__import__('os').environ['SOURCE_RUN_ID']),
              'matrix_rows':int(len(matrix)),
              'flow_split_reports':split_reports,
              'session_metadata_bias':session_reports,
              'flow_distributions':flow_distributions,
              'existing_shortcut_audit':json.loads((root/'models/shortcut-audit.json').read_text()),
              'm1_metrics':json.loads((root/'models/M1-lightgbm.metrics.json').read_text()),
              'learning_curve':json.loads((root/'evaluation/M1-learning-curve.json').read_text()),
          }
          out=Path('/tmp/adminlab-diag/SHORTCUT_DIAGNOSTIC.json')
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          concise={
              'source_run_id':payload['source_run_id'],
              'validation_top_univariate':split_reports.get('validation',{}).get('top_univariate',[])[:12],
              'test_top_univariate':split_reports.get('test',{}).get('top_univariate',[])[:12],
              'validation_session_bias':{k:v for k,v in session_reports.get('validation',{}).items() if k in {'behavior_profile','task_id','protocol','netem_profile','wire_attempts','wire_transfer_bytes'}},
              'test_session_bias':{k:v for k,v in session_reports.get('test',{}).items() if k in {'behavior_profile','task_id','protocol','netem_profile','wire_attempts','wire_transfer_bytes'}},
          }
          print(json.dumps(concise,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: remote-admin-shortcut-diagnostic-${{ github.run_id }}
          path: /tmp/adminlab-diag/SHORTCUT_DIAGNOSTIC.json
          retention-days: 30
