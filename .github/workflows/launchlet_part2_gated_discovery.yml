name: launchlet-part2-gated-discovery

on:
  push:
    branches: [agent/launchlet-part2-gated-discovery-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover same-origin routes behind valid preview header
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests, pathlib, urllib.parse, concurrent.futures, json, itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out')
          seed=requests.Session(); seed.headers['User-Agent']='Mozilla/5.0'
          boot=seed.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json()
          h={'Accept':'application/json','Content-Type':'application/json','X-Launchlet-Preview':boot['project'],'User-Agent':'Mozilla/5.0'}
          words=['deploy','deployment','deployments','deploys','release','releases','export','exports','inspector','inspect','inspection','actions','action','invoke','artifact','artifacts','publish','publisher','publishes','preview','previews','internal','admin','operator','control','runtime','server','reference','references','build','builds','project','projects','workspace','workspaces','flag','flags','secret','secrets','config','metadata','manifest','status','review','approval','final','production','enterprise','rollout','queue','jobs','job','target','targets','environment','environments','capability','capabilities','grant','scope','token','session']
          tails=['','inspect','export','status','get','read','show','details','metadata','manifest','config','preview','release','production','internal','admin','final','review','approve','approval','publish','deploy','artifact','artifacts','flag','secret','secrets','action','invoke','open','current','latest','ref','reference','refs','references','target','targets','context','token','session','capability','grant','scope']
          paths=set(['/api/actions/invoke','/api/receipts/redeem'])
          for w in words:
              paths.add('/api/'+w)
              for t in tails:
                  if t: paths.add('/api/'+w+'/'+t)
          for a,b in itertools.product(['deploy','deployment','release','preview','export','inspect','inspector','publish','artifact','internal','admin','production','enterprise'],['export','inspect','status','details','metadata','manifest','config','flag','secrets','release','production','preview','current','latest','context','token','capability','grant','scope','review','approval']):
              for sep in ['-','_']:
                  paths.add('/api/'+a+sep+b)
          paths=sorted(paths)
          def probe(path):
              u=urllib.parse.urljoin(base,path); results=[]
              try:
                  r=requests.get(u,headers=h,timeout=6,allow_redirects=False)
                  if r.status_code!=404: results.append({'path':path,'method':'GET','status':r.status_code,'body':r.text[:12000],'headers':dict(r.headers)})
              except Exception: pass
              try:
                  r=requests.post(u,headers=h,json={},timeout=6,allow_redirects=False)
                  if r.status_code!=404: results.append({'path':path,'method':'POST','status':r.status_code,'body':r.text[:12000],'headers':dict(r.headers)})
              except Exception: pass
              return results
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for rs in ex.map(probe,paths): hits.extend(rs)
          (out/'summary.json').write_text(json.dumps({'count':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-gated-discovery-encrypted
          path: artifact/
          retention-days: 1
