name: launchlet-part2-gated-discovery

on:
  push:
    branches: [agent/launchlet-part2-gated-discovery-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe known manifest backup/full variants and encrypt hits
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          boot=s.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); project=boot['project']
          roots=['/assets/server-reference-manifest','/assets/build-manifest']
          paths=set()
          for root in roots:
            paths.add(root+'.json')
            for suffix in ['.json.bak','.json.old','.json.orig','.json.backup','.json.save','.json~','.json.tmp','.bak','.old','.orig','.backup','~','.tmp']:
              paths.add(root+suffix)
            for mid in ['full','internal','private','debug','dev','development','release','prod','production','enterprise','all','source','server','complete','raw','unfiltered','preview']:
              paths.add(root+'.'+mid+'.json'); paths.add(root+'-'+mid+'.json'); paths.add(root+'_'+mid+'.json')
            for ext in ['.map','.json.map','.txt','.yaml','.yml','.js']:
              paths.add(root+ext)
          # dotfile and directory-nearby variants
          paths.update(['/assets/.server-reference-manifest.json','/assets/.build-manifest.json','/assets/server-references.json','/assets/server-actions.json','/assets/server-action-manifest.json','/assets/server-reference-manifest-full.json','/assets/server-reference-manifest-internal.json','/assets/build-manifest-full.json','/assets/build-manifest-internal.json'])
          hsets=[{}, {'X-Launchlet-Preview':project}]
          hits=[]
          for path in sorted(paths):
            for hi,h in enumerate(hsets):
              try:
                r=s.get(urllib.parse.urljoin(base,path),headers=h,timeout=8,allow_redirects=False)
                if r.status_code!=404:
                  hits.append({'path':path,'with_preview_header':bool(hi),'status':r.status_code,'headers':dict(r.headers),'body':r.text[:50000]})
              except Exception: pass
          (out/'summary.json').write_text(json.dumps({'count':len(paths),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-manifest-backups-encrypted
          path: artifact/
          retention-days: 1
