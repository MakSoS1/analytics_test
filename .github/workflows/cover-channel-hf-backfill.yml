name: Cover Channel HF Backfill

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'GitHub Actions run ID containing dataset-* artifacts'
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  HF_DATASET_REPO: Maksim123321/cover-channel-web-protocols
  PYTHONUNBUFFERED: '1'

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Hugging Face write token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo 'HF_TOKEN repository secret is required for backfill.' >&2
            exit 1
          fi
      - name: Install Hugging Face client
        run: python -m pip install 'huggingface_hub[hf_xet]>=1.0.0'
      - name: Download every artifact from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          mkdir -p /tmp/coverlab-backfill
          cd /tmp/coverlab-backfill
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY"
          find . -maxdepth 2 -type f | sort | head -100
      - name: Upload dataset artifacts to private Hugging Face Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        working-directory: cover-channel-lab
        shell: bash
        run: |
          export HF_XET_HIGH_PERFORMANCE=1
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ['HF_TOKEN']).create_repo(
              repo_id=os.environ['HF_DATASET_REPO'],
              repo_type='dataset',
              exist_ok=True,
              private=True,
          )
          PY
          shopt -s nullglob
          uploaded=0
          for artifact_dir in /tmp/coverlab-backfill/dataset-*; do
            [[ -d "$artifact_dir" ]] || continue
            artifact_name="$(basename "$artifact_dir")"
            ./scripts/upload_hf.sh \
              "$artifact_dir" \
              "backfills/gh-${SOURCE_RUN_ID}/${artifact_name}" \
              "Backfill ${artifact_name} from GitHub Actions run ${SOURCE_RUN_ID}"
            uploaded=$((uploaded+1))
          done
          if [[ "$uploaded" -eq 0 ]]; then
            echo 'No dataset-* artifacts were found in the source run.' >&2
            exit 1
          fi
          echo "Uploaded $uploaded dataset artifacts."
