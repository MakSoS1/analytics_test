name: D3HFERP encrypted offline solve

on:
  push:
    branches:
      - agent/d3hferp-solver-20260725
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-block-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Restore challenge archive
        shell: bash
        run: |
          set -euo pipefail
          cd ctf/d3hferp
          base64 -d archive.b64 > archive.zip
          unzip -q -o archive.zip
          test -f D3HFERP/pubkey.txt
          test -f D3HFERP/ciphertext.txt

      - name: Solve and verify block 0 with Sage
        shell: bash
        run: |
          set -euo pipefail
          docker pull sagemath/sagemath:latest
          docker run --rm \
            -e BLOCK=0 \
            -e RESULT_PATH=/work/result.txt \
            -v "$PWD/ctf/d3hferp:/work" \
            -w /work \
            sagemath/sagemath:latest \
            sage solve_direct.sage

      - name: Encrypt result before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          cd ctf/d3hferp
          openssl pkeyutl -encrypt \
            -pubin -inkey result_public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in result.txt -out result.enc
          rm -f result.txt

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: d3hferp-block-0-encrypted
          path: ctf/d3hferp/result.enc
          if-no-files-found: error
          retention-days: 1
