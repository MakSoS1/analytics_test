name: Temporary GeoCLIP geolocation inference

on:
  pull_request:
    branches: [ctf-geolocate-20260731]
    paths:
      - 'ctf/geoclip/**'
      - '.github/workflows/ctf-geoclip.yml'

permissions:
  contents: read

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted temporary base branch
        uses: actions/checkout@v4
        with:
          ref: ctf-geolocate-20260731

      - name: Prepare image variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs results
          cat ctf/geolocate/bin/00 ctf/geolocate/bin/01 ctf/geolocate/bin/02 ctf/geolocate/bin/03 ctf/geolocate/bin/04 > inputs/full.jpg
          cp ctf/geolocate/input-small.jpg inputs/small.jpg
          python3 - <<'PY'
          from PIL import Image, ImageEnhance, ImageOps
          from pathlib import Path
          for source in (Path('inputs/full.jpg'), Path('inputs/small.jpg')):
              img=Image.open(source).convert('RGB')
              stem=source.stem
              img.save(f'inputs/{stem}_rgb.jpg',quality=95)
              ImageOps.autocontrast(img).save(f'inputs/{stem}_autocontrast.jpg',quality=95)
              ImageEnhance.Brightness(img).enhance(1.15).save(f'inputs/{stem}_bright.jpg',quality=95)
              w,h=img.size
              crop=img.crop((int(w*0.04),int(h*0.04),int(w*0.96),int(h*0.96)))
              crop.save(f'inputs/{stem}_crop.jpg',quality=95)
              print(source, img.size)
          PY

      - name: Install GeoCLIP
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet geoclip pillow

      - name: Run independent coordinate predictions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import torch
          from geoclip import GeoCLIP

          torch.manual_seed(0)
          model=GeoCLIP()
          rows={}
          for path in sorted(Path('inputs').glob('*.jpg')):
              try:
                  gps,probs=model.predict(str(path),top_k=20)
                  items=[]
                  for (lat,lon),prob in zip(gps,probs):
                      items.append({'lat':float(lat),'lon':float(lon),'probability':float(prob)})
                  rows[path.name]=items
                  print(path.name, items[:5])
              except Exception as exc:
                  rows[path.name]={'error':repr(exc)}
          Path('results/geoclip_predictions.json').write_text(json.dumps(rows,indent=2))

          # Cluster repeated predictions after rounding to one degree, making ensemble consensus visible.
          counts={}
          weighted={}
          for values in rows.values():
              if not isinstance(values,list): continue
              for rank,item in enumerate(values):
                  key=(round(item['lat']),round(item['lon']))
                  counts[key]=counts.get(key,0)+1
                  weighted[key]=weighted.get(key,0.0)+item['probability']/(rank+1)
          consensus=[{'lat_bin':k[0],'lon_bin':k[1],'count':counts[k],'weighted_score':weighted[k]} for k in counts]
          consensus.sort(key=lambda x:(x['count'],x['weighted_score']),reverse=True)
          Path('results/geoclip_consensus.json').write_text(json.dumps(consensus,indent=2))
          print('CONSENSUS',consensus[:30])
          PY

      - name: Upload predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoclip-predictions
          path: results/
          retention-days: 1
          if-no-files-found: error
