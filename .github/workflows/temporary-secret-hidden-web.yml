name: temporary-secret-hidden-web

on:
  pull_request:
    branches:
      - main
    paths:
      - secret_hidden_web_probe.py

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'secret-hidden-web-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install passive probe dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet dnspython requests

      - name: Run passive DNS TLS HTTP probe
        run: python3 secret_hidden_web_probe.py

      - name: Encrypt result
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f secret-web-raw/result.json
          rm -rf secret-web-package secret-web-result
          mkdir -p secret-web-package secret-web-result
          tar -C secret-web-raw -czf secret-web-package/result.tar.gz .
          openssl rand 32 > secret-web-package/aes.key
          openssl rand 16 > secret-web-package/iv.bin
          KEY_HEX="$(xxd -p -c 256 secret-web-package/aes.key)"
          IV_HEX="$(xxd -p -c 256 secret-web-package/iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in secret-web-package/result.tar.gz -out secret-web-package/result.enc
          cat > secret-web-package/public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAw+4tYc4S21yFY6AwyffK
          /NMVF8FSHoRRbjgbPf0GLXmt+/ROFtfDIdW/t1ouhSlbovcJKAHamia+pAxxEoJb
          396nof1BExUy/rdxWFQUC4n33pQUry2q1teKJWu2PLTcrUJOwsVIT0oqgdNIrQOb
          wKfWrY+xjLVPJsw8WSipRkvVzr5gSd4FJ7+bW8uv+lkoKmjuu0Tf6ivhpuLmXOjn
          RQPBgplCGbrGC+hoosKfV2ZjlK+YGR1pM7a344kGq9MCDBcPd6tsKDDMbN3MhepJ
          o+lHsd6Hxj0CO8ouoa6gPOHEC/lkkGc+aC3yToxvJrplHDwB7rv3pxnRwncSMmKs
          EWRyXB3b143oy96DTiFkDHMPo7aPWVqyLCw6AR2DZeFp6pkXF5hgeh64ieRKgBsB
          lk32y9mM3+7BxfUuBsI6DJ2ZAvjeZdfsMzMD8FnDAzvYJTLVmUkfflBk4V2I0+Tg
          qKkxdvDuGdiv2p1u0B6wiBQDaqlfXccr/IyBkDJoRt8FAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey secret-web-package/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in secret-web-package/aes.key -out secret-web-package/key.enc
          base64 -w0 secret-web-package/result.enc > secret-web-result/result.enc.b64
          base64 -w0 secret-web-package/key.enc > secret-web-result/key.enc.b64
          base64 -w0 secret-web-package/iv.bin > secret-web-result/iv.bin.b64
          sha256sum secret-web-package/result.enc secret-web-package/key.enc secret-web-package/iv.bin > secret-web-result/SHA256SUMS
          rm -rf secret-web-raw secret-web-package

      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: secret-hidden-web-encrypted-result
          path: secret-web-result/
          retention-days: 1
          if-no-files-found: error
