name: Cover Channel Reuse Probe

on:
  push:
    branches: [coverlab-resume-correctness]
    paths:
      - '.github/workflows/cover-channel-reuse-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_DATASET_REPO: Maksim123321/cover-channel-web-protocols
  SOURCE_RELEASE: gh-31309279116-a1
  PYTHONUNBUFFERED: '1'

jobs:
  reuse-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only reuse-validation dependencies
        run: python -m pip install -q 'huggingface_hub[hf_xet]>=1.0.0' 'zstandard>=0.23.0'
      - name: Validate and reuse representative isolated shard
        working-directory: cover-channel-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: src
        run: |
          python scripts/reuse_hf_shard.py \
            --repo "$HF_DATASET_REPO" --source-release "$SOURCE_RELEASE" \
            --shard isolated-00 --dest-release "$RUNNER_TEMP/isolated-release" \
            --cache-dir "$RUNNER_TEMP/isolated-cache" | tee "$RUNNER_TEMP/isolated.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads(Path(os.environ['RUNNER_TEMP']+'/isolated.json').read_text().splitlines()[-1])
          assert row['reused'] is True
          assert row['capture_tail_passed'] is True
          assert row['verified_checksums'] >= 4
          PY
      - name: Validate and reuse representative mixed capture
        working-directory: cover-channel-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: src
        run: |
          python scripts/reuse_hf_shard.py \
            --repo "$HF_DATASET_REPO" --source-release "$SOURCE_RELEASE" \
            --shard D-mixed-00 --dest-release "$RUNNER_TEMP/mixed-release" \
            --cache-dir "$RUNNER_TEMP/mixed-cache" | tee "$RUNNER_TEMP/mixed.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads(Path(os.environ['RUNNER_TEMP']+'/mixed.json').read_text().splitlines()[-1])
          assert row['reused'] is True
          assert row['capture_tail_passed'] is True
          assert row['verified_checksums'] >= 4
          PY
      - name: Confirm legacy trusted background is invalidated
        working-directory: cover-channel-lab
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: src
        shell: bash
        run: |
          set +e
          python scripts/reuse_hf_shard.py \
            --repo "$HF_DATASET_REPO" --source-release "$SOURCE_RELEASE" \
            --shard trusted-bg-00 --dest-release "$RUNNER_TEMP/trusted-release" \
            --cache-dir "$RUNNER_TEMP/trusted-cache" > "$RUNNER_TEMP/trusted.json" 2>&1
          rc=$?
          set -e
          [[ "$rc" -eq 3 ]]
          grep -q 'trusted_background_policy_changed' "$RUNNER_TEMP/trusted.json"
      - name: Retain validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reuse-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/isolated.json
            ${{ runner.temp }}/mixed.json
            ${{ runner.temp }}/trusted.json
            ${{ runner.temp }}/isolated-release/quality
            ${{ runner.temp }}/mixed-release/quality
          retention-days: 30
