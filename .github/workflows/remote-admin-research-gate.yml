name: Remote Admin Anomaly V1 Research Gate

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - 'remote-admin-anomaly-lab/.research-gate-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-admin-research-gate
  cancel-in-progress: false

jobs:
  research-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RELEASE_ROOT: /tmp/adminlab-research/release
      SHARD: H-research-1k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remote-admin-anomaly-lab/requirements.txt
      - name: Install runtime and validate code contracts
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python -m pip install -r requirements.txt
          bash scripts/install_extended_runner_v2.sh
          pytest -q tests
      - name: Semantic diversity gate before expensive wire replay
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          mkdir -p /tmp/adminlab-research/quality
          python scripts/check_scenario_quality.py \
            --stage H --count 12000 --seed 2026082601 \
            --out /tmp/adminlab-research/quality/scenario_quality.json
      - name: Capture 1000 real-wire sessions with immutable Bronze
        working-directory: remote-admin-anomaly-lab
        run: |
          py="$(command -v python)"
          sudo -E env \
            ADMINLAB_PYTHON="$py" \
            ADMINLAB_OUTPUT_UID="$(id -u)" \
            ADMINLAB_OUTPUT_GID="$(id -g)" \
            bash scripts/capture_shard_extended_v4.sh \
              H "$SHARD" 1000 2026082602 /tmp/adminlab-research
      - name: Validate Bronze and implementation diversity
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from adminlab.quality import validate_bronze_tree

          root=Path('/tmp/adminlab-research/release')
          shard='H-research-1k'
          bronze=root/'bronze'/shard
          report=validate_bronze_tree(bronze,verify_checksums=True)
          assert report['ok'],report
          sessions=pd.read_parquet(bronze/'manifests/sessions.parquet')
          assert len(sessions)==1000
          assert sessions['status'].eq('success').all(),sessions['status'].value_counts().to_dict()
          protocols=sessions['protocol'].value_counts().to_dict()
          assert set(protocols)=={'ssh','smb','rdp','vnc'},protocols
          assert max(protocols.values())-min(protocols.values())<=1,protocols
          impl=set(sessions['implementation_id'].astype(str))
          required={
            'ssh:openssh->openssh-server','ssh:paramiko->openssh-server',
            'smb:smbclient->samba','smb:smbprotocol->samba',
            'rdp:freerdp->xrdp','vnc:rfb-python->tigervnc'
          }
          assert required<=impl,{'missing':sorted(required-impl),'observed':sorted(impl)}
          evidence={'bronze':report,'protocol_counts':protocols,'implementation_counts':sessions['implementation_id'].value_counts().to_dict(),'rows':len(sessions)}
          Path('/tmp/adminlab-research/quality/bronze_gate.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY
      - name: Build Silver deterministic baseline and production Gold
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          ADMINLAB_PYTHON="$(command -v python)" bash scripts/build_silver.sh "$RELEASE_ROOT" "$SHARD"
          bash scripts/build_rule_baseline.sh "$RELEASE_ROOT" "$SHARD"
          python scripts/build_gold.py --release "$RELEASE_ROOT" --shard "$SHARD" --feature-contract configs/feature_contract.yaml --split-seed 20260826
          python scripts/build_flow_gold_v2.py --release "$RELEASE_ROOT" --shard "$SHARD" --feature-contract configs/feature_contract.yaml --split-seed 20260826
      - name: Train M0 M1 M2 and shortcut baselines
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          mkdir -p /tmp/adminlab-research/models /tmp/adminlab-research/evaluation
          python scripts/train_models.py \
            --model-matrix "$RELEASE_ROOT/gold/$SHARD/production_model_matrix.parquet" \
            --out /tmp/adminlab-research/models \
            --seed 20260826
      - name: Evaluate slices campaign TTD hard benign and learning curve
        working-directory: remote-admin-anomaly-lab
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate_model_slices.py \
            --model /tmp/adminlab-research/models/M1-lightgbm.joblib \
            --metrics /tmp/adminlab-research/models/M1-lightgbm.metrics.json \
            --model-matrix "$RELEASE_ROOT/gold/$SHARD/production_model_matrix.parquet" \
            --labels "$RELEASE_ROOT/gold/$SHARD/production_flow_labels.parquet" \
            --out /tmp/adminlab-research/evaluation/M1-slices.json \
            --bootstrap 1000 --seed 20260826
          python scripts/evaluate_hard_benign.py \
            --model /tmp/adminlab-research/models/M1-lightgbm.joblib \
            --metrics /tmp/adminlab-research/models/M1-lightgbm.metrics.json \
            --model-matrix "$RELEASE_ROOT/gold/$SHARD/production_model_matrix.parquet" \
            --labels "$RELEASE_ROOT/gold/$SHARD/production_flow_labels.parquet" \
            --out /tmp/adminlab-research/evaluation/M1-hard-benign.json
          python scripts/learning_curve_grouped.py \
            --model-matrix "$RELEASE_ROOT/gold/$SHARD/production_model_matrix.parquet" \
            --labels "$RELEASE_ROOT/gold/$SHARD/production_flow_labels.parquet" \
            --out /tmp/adminlab-research/evaluation/M1-learning-curve.json \
            --seed 20260826
          python scripts/validate_reference.py \
            --generated "$RELEASE_ROOT/gold/$SHARD/production_flow_features.parquet" \
            --out /tmp/adminlab-research/evaluation/reference-validation.json \
            --bootstrap 1000 --seed 20260826
      - name: Research quality decision
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('/tmp/adminlab-research')
          m1=json.loads((base/'models/M1-lightgbm.metrics.json').read_text())
          shortcut=json.loads((base/'models/shortcut-audit.json').read_text())
          slices=json.loads((base/'evaluation/M1-slices.json').read_text())
          hard=json.loads((base/'evaluation/M1-hard-benign.json').read_text())
          curve=json.loads((base/'evaluation/M1-learning-curve.json').read_text())
          ref=json.loads((base/'evaluation/reference-validation.json').read_text())
          val=m1['splits']['validation']
          strict=val['strict_operating_points']['operating_points']
          reasons=slices.get('splits',{}).get('challenge',{}).get('per_challenge_reason',{})
          manual=[]
          failures=[]
          if shortcut['shortcut_risk']:
            failures.append('shortcut_risk')
          if float(val['fpr'])>0.0100001:
            failures.append('primary_validation_fpr_above_1pct')
          if 'fpr_0_1pct' not in strict or 'fpr_1pct' not in strict:
            failures.append('low_fpr_operating_points_missing')
          if float(val.get('pr_auc',0))>=0.98:
            manual.append('suspiciously_high_validation_pr_auc_review_shortcuts_and_holdouts')
          if hard.get('status')=='ok' and float(hard.get('fpr',0))>0.10:
            manual.append('hard_benign_fpr_above_10pct')
          for required in ('unseen_persona','unseen_host_pair','temporal_future','unseen_client_implementation'):
            if required not in reasons:
              manual.append(f'challenge_slice_missing:{required}')
          decision={
            'automatic_gate_pass':not failures,
            'automatic_failures':failures,
            'manual_review_flags':manual,
            'validation_pr_auc':val.get('pr_auc'),
            'validation_roc_auc':val.get('roc_auc'),
            'validation_primary_fpr':val.get('fpr'),
            'recall_at_fpr_1pct':strict.get('fpr_1pct',{}).get('recall'),
            'recall_at_fpr_0_1pct':strict.get('fpr_0_1pct',{}).get('recall'),
            'hard_benign':hard,
            'shortcut_risk':shortcut['shortcut_risk'],
            'learning_curve':curve,
            'reference_validation_status':ref.get('status'),
            'reference_available':ref.get('reference_available'),
            'challenge_reasons':sorted(reasons),
            'scale_policy':'do not scale merely by row target; inspect learning curve and manual flags first',
          }
          (base/'RESEARCH_GATE.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          print(json.dumps(decision,indent=2,sort_keys=True))
          if failures:
            raise SystemExit('research automatic quality gate failed: '+','.join(failures))
          PY
      - name: Record HF persistence intent before artifact retention
        if: always()
        env:
          HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/adminlab-research/HF_PERSISTENCE.json')
          p.write_text(json.dumps({
            'repo_id':'Maksim123321/remote-admin-anomaly-v1',
            'enabled':os.environ.get('HAS_HF_TOKEN','false').lower()=='true',
            'artifact_first':True,
            'github_release_assets_used':False,
            'status':'pending_after_artifact' if os.environ.get('HAS_HF_TOKEN','false').lower()=='true' else 'skipped_missing_HF_TOKEN_in_analytics_test'
          },indent=2,sort_keys=True)+'\n')
          PY
      - name: Retain complete recoverable research release first
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-admin-research-gate-${{ github.run_id }}
          path: /tmp/adminlab-research
          retention-days: 90
          compression-level: 0
      - name: Persist release tree to private Hugging Face dataset when authorized
        if: ${{ always() && secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        working-directory: remote-admin-anomaly-lab
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ['HF_TOKEN']
          repo='Maksim123321/remote-admin-anomaly-v1'
          api=HfApi(token=token)
          api.create_repo(repo_id=repo,repo_type='dataset',private=True,exist_ok=True)
          api.upload_folder(
            repo_id=repo,
            repo_type='dataset',
            folder_path='/tmp/adminlab-research/release',
            path_in_repo=f"releases/{os.environ['RUN_ID']}",
            commit_message=f"remote-admin research gate {os.environ['RUN_ID']}",
          )
          print(f"HF_UPLOAD_OK repo={repo} path=releases/{os.environ['RUN_ID']}")
          PY
