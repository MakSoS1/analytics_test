name: Hugging Face Token Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-token-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-hf-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_REPO: Maksim123321/cover-channel-web-protocols
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face client
        run: python -m pip install --quiet 'huggingface_hub>=1.0.0'
      - name: Verify authentication and dataset write access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo 'ERROR: HF_TOKEN secret is not available to this workflow.'
            exit 2
          fi
          python - <<'PY'
          import os, tempfile
          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          repo_id = os.environ['HF_REPO']
          api = HfApi(token=token)

          who = api.whoami()
          name = who.get('name') or who.get('fullname') or '<unknown>'
          print(f'Authenticated to Hugging Face as: {name}')

          api.create_repo(repo_id=repo_id, repo_type='dataset', private=True, exist_ok=True)
          print(f'Dataset repository is accessible/creatable: {repo_id}')

          path_in_repo = '.access-check/github-actions-write-probe.txt'
          with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as f:
              f.write('GitHub Actions HF_TOKEN write-access probe. Safe to delete.\n')
              local_path = f.name
          api.upload_file(
              path_or_fileobj=local_path,
              path_in_repo=path_in_repo,
              repo_id=repo_id,
              repo_type='dataset',
              commit_message='Verify GitHub Actions HF_TOKEN write permission',
          )
          print('WRITE_TEST=PASS')

          api.delete_file(
              path_in_repo=path_in_repo,
              repo_id=repo_id,
              repo_type='dataset',
              commit_message='Remove HF token write-access probe',
          )
          print('CLEANUP=PASS')
          PY
