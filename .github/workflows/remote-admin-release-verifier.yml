name: Remote Admin Anomaly V1 Release Verifier

on:
  push:
    branches: [remote-admin-anomaly-lab-v1]
    paths:
      - '.github/workflows/remote-admin-release-verifier.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remote-admin-anomaly-lab-v1
      - name: Locate latest successful Research Gate V2 and artifact
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          run_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$repo/actions/workflows/remote-admin-research-gate-v2.yml/runs?branch=remote-admin-anomaly-lab-v1&per_page=20")"
          run_id="$(python -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d["workflow_runs"] if x["status"]=="completed"]; assert xs,"no completed Research Gate V2 run"; x=xs[0]; print(x["id"]); assert x["conclusion"]=="success",f"latest completed Research Gate V2 is {x[chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110)]}"' <<<"$run_json")"
          run_url="https://github.com/$repo/actions/runs/$run_id"
          artifact_json="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$repo/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(python -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d["artifacts"] if x["name"].startswith("remote-admin-research-gate-v2-") and not x["expired"]]; assert xs,"research artifact missing"; print(xs[0]["id"])' <<<"$artifact_json")"
          artifact_name="$(python -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d["artifacts"] if x["name"].startswith("remote-admin-research-gate-v2-") and not x["expired"]]; print(xs[0]["name"])' <<<"$artifact_json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Download retained artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-artifact
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.locate.outputs.artifact_id }}/zip" > /tmp/research.zip
          unzip -q /tmp/research.zip -d /tmp/research-artifact
          test -s /tmp/research-artifact/RESEARCH_GATE.json
          test -s /tmp/research-artifact/models/M1-lightgbm.metrics.json
          test -s /tmp/research-artifact/models/shortcut-audit.json
          test -s /tmp/research-artifact/evaluation/M1-slices.json
          test -s /tmp/research-artifact/evaluation/M1-hard-benign.json
          test -s /tmp/research-artifact/evaluation/M1-learning-curve.json
      - name: Reverify and generate repository evidence
        id: evidence
        env:
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          ARTIFACT_ID: ${{ steps.locate.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.locate.outputs.artifact_name }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('/tmp/research-artifact')
          decision=json.loads((root/'RESEARCH_GATE.json').read_text())
          m0=json.loads((root/'models/M0-deterministic.metrics.json').read_text())
          m1=json.loads((root/'models/M1-lightgbm.metrics.json').read_text())
          m2=json.loads((root/'models/M2-isolation-forest.metrics.json').read_text())
          shortcut=json.loads((root/'models/shortcut-audit.json').read_text())
          slices=json.loads((root/'evaluation/M1-slices.json').read_text())
          hard=json.loads((root/'evaluation/M1-hard-benign.json').read_text())
          curve=json.loads((root/'evaluation/M1-learning-curve.json').read_text())
          reference=json.loads((root/'evaluation/reference-validation.json').read_text())
          hf=json.loads((root/'HF_PERSISTENCE.json').read_text())
          quality=json.loads((root/'release/quality/H-research-1k/production_flow_gold.json').read_text())
          leakage=json.loads((root/'release/quality/H-research-1k/production_leakage.json').read_text())
          capture=json.loads((root/'release/quality/H-research-1k/capture_health.json').read_text())
          parser=json.loads((root/'release/quality/H-research-1k/parser_health.json').read_text())
          bronze_gate=json.loads((root.parent/'research-artifact/quality/bronze_gate.json').read_text()) if (root/'quality/bronze_gate.json').exists() else {}
          assert decision['automatic_gate_pass'] is True,decision
          assert not decision['automatic_failures'],decision
          assert shortcut['shortcut_risk'] is False,shortcut
          assert leakage['ok'] is True,leakage
          assert quality['production_source']=='suricata_eve_flow',quality
          assert quality['train_serve_feature_code']=='adminlab.online_features.EveFeatureState',quality
          assert quality['uid_alignment_coverage']==1.0,quality
          val=m1['splits']['validation']; strict=val['strict_operating_points']['operating_points']
          challenge=slices.get('splits',{}).get('challenge',{})
          test=slices.get('splits',{}).get('test',{})
          rows=int(capture['sessions'])
          pcap_bytes=int(capture.get('pcap_zst_bytes',capture.get('compressed_pcap_bytes',0)) or 0)
          report={
            'research_run_id':int(os.environ['RUN_ID']),
            'research_run_url':os.environ['RUN_URL'],
            'artifact_id':int(os.environ['ARTIFACT_ID']),
            'artifact_name':os.environ['ARTIFACT_NAME'],
            'sessions':rows,
            'capture_health':capture,
            'parser_health':parser,
            'production_gold':quality,
            'leakage':leakage,
            'M0':m0,
            'M1':m1,
            'M2':m2,
            'shortcut_audit':shortcut,
            'slice_evaluation':slices,
            'hard_benign':hard,
            'learning_curve':curve,
            'reference_validation':reference,
            'hf_persistence':hf,
            'research_decision':decision,
          }
          out=Path('remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json'); out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          def fmt(x):
            return 'n/a' if x is None else (f'{x:.6f}' if isinstance(x,float) else str(x))
          reasons=challenge.get('per_challenge_reason',{})
          camp=challenge.get('campaign_detection',{})
          lines=[
            '# Remote Admin Anomaly V1 — Autogenerated Research Results','',
            '> Generated from the retained GitHub Actions artifact and reverified by `remote-admin-release-verifier.yml`.','',
            f'- Research run: [{os.environ["RUN_ID"]}]({os.environ["RUN_URL"]})',
            f'- Artifact: `{os.environ["ARTIFACT_NAME"]}` (ID `{os.environ["ARTIFACT_ID"]}`), retained 90 days',
            f'- Behavioral sessions: **{rows}**',
            f'- Production source: **{quality["production_source"]}**',
            f'- Train/serve code: `{quality["train_serve_feature_code"]}`',
            f'- Flow→label UID alignment: **{quality["uid_alignment_coverage"]:.3f}**',
            f'- Leakage gate: **PASS**',
            f'- Shortcut gate: **PASS**',
            '', '## M1 LightGBM', '',
            f'- Validation PR-AUC: **{fmt(val.get("pr_auc"))}**',
            f'- Validation ROC-AUC: **{fmt(val.get("roc_auc"))}**',
            f'- Primary threshold: **{fmt(m1.get("threshold"))}**',
            f'- Validation FPR at primary threshold: **{fmt(val.get("fpr"))}**',
            f'- Recall @ FPR ≤1%: **{fmt(strict.get("fpr_1pct",{}).get("recall"))}**',
            f'- Recall @ FPR ≤0.1%: **{fmt(strict.get("fpr_0_1pct",{}).get("recall"))}**',
            f'- Hard-benign FPR: **{fmt(hard.get("fpr"))}**',
            '', '## Challenge slices', '',
          ]
          for name,item in sorted(reasons.items()):
            lines.append(f'- `{name}`: n={item.get("n")}, recall={fmt(item.get("recall"))}, FPR={fmt(item.get("fpr"))}')
          lines += ['', '## Campaign detection', '',
                    f'- Challenge campaign recall: **{fmt(camp.get("campaign_recall"))}**',
                    f'- Median TTD, seconds: **{fmt(camp.get("time_to_detection_seconds",{}).get("median"))}**',
                    '', '## Learning curve', '',
                    f'- Last ΔPR-AUC: **{fmt(curve.get("last_delta_pr_auc"))}**',
                    f'- Scale recommendation: **{curve.get("scale_recommendation")}**',
                    '', '## External evidence / persistence', '',
                    f'- Reference dataset available: **{reference.get("reference_available")}** (`{reference.get("status")}`)',
                    f'- HF upload configured in this run: **{hf.get("enabled")}** (`{hf.get("status")}`)',
                    '- GitHub Release PCAP assets: **never used**',
                    '- Full Bronze PCAP and raw Silver logs remain in the retained release tree.',
                    '', '## Release decision', '',
                    f'- Automatic gate: **PASS**',
                    f'- Manual review flags: `{decision.get("manual_review_flags",[])}`',
                    '- Large 20k/40k fan-out remains gated by learning-curve and challenge analysis.', '']
          Path('remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          print('manual_flags='+json.dumps(decision.get('manual_review_flags',[])))
          PY
          echo "manual_flags=$(python -c 'import json; print(len(json.load(open("remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json"))["research_decision"].get("manual_review_flags",[])))')" >> "$GITHUB_OUTPUT"
      - name: Commit exact results to living branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.md remote-admin-anomaly-lab/RESULTS_AUTOGENERATED.json
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'docs(remote-admin): persist verified research gate results'
            git push origin HEAD:remote-admin-anomaly-lab-v1
          fi
      - name: Require no unresolved manual review flags before scale promotion
        if: ${{ steps.evidence.outputs.manual_flags != '0' }}
        run: |
          echo 'Research artifact is valid but manual review flags remain. Large fan-out is intentionally blocked.' >&2
          exit 1
