          path: ${{ env.AUDIT_ARTIFACT }}/part-0020/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Remove runner-private input and browser material
        if: always()
        run: |
          python3 - <<'PYCLEAN'
          import os, pathlib, shutil
          base = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          case = os.environ['AUDIT_CASE_ID']
          handoff = base / ('examclips-native-private-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-' + case)
          candidates = [handoff] + [pathlib.Path(os.environ[key]) for key in ('AUDIT_ROOT', 'AUDIT_OUT')]
          for path in candidates:
              resolved = path.resolve()
              if resolved.parent != base or not resolved.name.startswith('examclips-native-'):
                  raise SystemExit('Refusing cleanup outside native runner-private paths')
              shutil.rmtree(resolved, ignore_errors=True)
          PYCLEAN
